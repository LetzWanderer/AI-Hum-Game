<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#c8102e" />
  <title>AI in Humanitarian Action</title>
  <meta name="description" content="A branching decision game about AI in humanitarian action." />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Public+Sans:wght@400;500;600;700&display=swap" />
  <style>
/* AI in Humanitarian Action — plain CSS, no framework */
:root {
  --bg: #fbf8f3; --fg: #2a1f1a; --muted: #6b6560; --card: #fff; --line: #e9e4dc; --soft: #f1ede6;
  --brand: #c8102e; --ok: #15803d; --warn: #b45309; --bad: #c8102e; --on: #fff;
  --p-humanity: #e11d48; --p-impartiality: #0891b2; --p-neutrality: #64748b; --p-independence: #7c3aed; --p-doNoHarm: #059669;
  --display: "Fraunces", Georgia, serif; --sans: "Public Sans", system-ui, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.55 var(--sans); }
h1, h2, h3 { font-family: var(--display); font-weight: 600; line-height: 1.2; margin: 0; }
button, select { font: inherit; color: inherit; cursor: pointer; }
a { color: inherit; }
.wrap { max-width: 720px; margin: 0 auto; padding: 0 16px; }
.stack > * + * { margin-top: 20px; }

/* accents */
.accent-flood { --acc: #0369a1; --acc2: #22d3ee; } .accent-sahel { --acc: #b45309; --acc2: #f59e0b; }
.accent-conflict { --acc: #6d28d9; --acc2: #c026d3; } .accent-cloud { --acc: #0f766e; --acc2: #34d399; }
.accent-edge { --acc: #15803d; --acc2: #84cc16; } .accent-signals { --acc: #be185d; --acc2: #fb7185; }
.accent-outbreak { --acc: #be123c; --acc2: #fb7185; } .accent-governance { --acc: #3730a3; --acc2: #818cf8; }
.accent-clinic { --acc: #0a6d9c; --acc2: #3fc1d6; } .accent-invoice { --acc: #3b4a63; --acc2: #d0a33a; }
.accent-roster { --acc: #b4531f; --acc2: #f0b43c; } .accent-heat { --acc: #c0362c; --acc2: #f39a3c; }
.accent-brand { --acc: #c8102e; --acc2: #f97316; }
.grad { position: relative; isolation: isolate; color: var(--on); background: linear-gradient(135deg, var(--acc), var(--acc2)); }
.grad::before { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit;
  background: radial-gradient(circle, rgba(255,255,255,.2) 1.5px, transparent 2px) 0 0 / 18px 18px; }
.acc { color: var(--acc); }
.chip { display: inline-block; border-radius: 99px; padding: 2px 10px; font-size: 13px; font-weight: 500; margin: 0 6px 6px 0;
  background: color-mix(in srgb, var(--acc) 14%, transparent); color: var(--acc); }
.chip.plain { background: var(--soft); color: var(--muted); }
.kicker { font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; opacity: .9; }

/* home */
.hero { padding: 16px 0 40px; }
.hero h1 { font-size: clamp(34px, 8vw, 48px); margin-top: 8px; }
.top { display: flex; justify-content: flex-end; }
select { height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); padding: 0 8px; color: var(--fg); }
.grid { display: grid; gap: 16px; padding: 0; list-style: none; margin: 16px 0 0; }
@media (min-width: 640px) { .grid.two { grid-template-columns: 1fr 1fr; } }
.scard { display: flex; flex-direction: column; height: 100%; text-align: start; width: 100%; padding: 0; border: 1px solid var(--line);
  border-radius: 18px; background: var(--card); overflow: hidden; transition: transform .18s, box-shadow .18s; }
.scard:hover { transform: translateY(-2px); box-shadow: 0 12px 28px -12px rgba(0,0,0,.35); }
.scard .band { min-height: 96px; padding: 16px; display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
.scard .band h3 { font-size: 20px; }
.badge { background: var(--card); color: var(--acc); border-radius: 99px; padding: 3px 10px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.scard .body { padding: 16px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
.scard .go { margin-top: auto; font-weight: 600; font-size: 14px; color: var(--acc); }

/* boxes */
.box { border: 1px solid var(--line); background: var(--card); border-radius: 16px; padding: 16px; }
.label { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--acc); margin: 0 0 6px; }
.banner { border-radius: 18px; padding: 20px; }
.banner h1 { font-size: 30px; margin-top: 6px; }
.btn { display: block; width: 100%; border: 0; border-radius: 12px; padding: 14px; font-weight: 600; background: var(--acc); color: var(--on); text-align: center; text-decoration: none; }
.btn:hover { filter: brightness(1.1); }
.btn.ghost { background: var(--card); color: var(--fg); border: 2px solid var(--line); }
.linkbtn { background: none; border: 0; color: var(--acc); font-weight: 600; text-decoration: underline; width: 100%; padding: 8px; }

/* sticky header */
.bar { position: sticky; top: 0; z-index: 5; background: rgba(251,248,243,.95); border-bottom: 1px solid var(--line); }
.bar .wrap { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 8px; padding-bottom: 8px; }
.back { background: none; border: 0; color: var(--acc); font-weight: 600; font-size: 14px; padding: 0; }
.progress { height: 6px; background: var(--soft); } .progress div { height: 100%; background: var(--acc); transition: width .3s; }
main.wrap { padding-top: 24px; padding-bottom: 64px; }

/* options */
.opt { display: flex; gap: 12px; width: 100%; text-align: start; padding: 16px; border: 2px solid var(--line); border-radius: 18px; background: var(--card); }
.opt:hover { border-color: color-mix(in srgb, var(--acc) 55%, transparent); box-shadow: 0 6px 18px -10px var(--acc); }
.letter { display: grid; place-items: center; width: 36px; height: 36px; flex-shrink: 0; border-radius: 99px; font-weight: 700;
  background: color-mix(in srgb, var(--acc) 14%, transparent); color: var(--acc); }
.opt small { display: block; color: var(--muted); font-size: 14px; margin-top: 4px; }
.steps { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.steps li { display: flex; align-items: center; gap: 12px; background: var(--card); border-radius: 10px; padding: 10px; font-size: 14px; }
.decided { border: 1px solid color-mix(in srgb, var(--acc) 45%, transparent); background: color-mix(in srgb, var(--acc) 10%, transparent);
  border-radius: 16px; padding: 16px; font-family: var(--display); font-size: 20px; font-weight: 600; }

/* principles */
.pc-humanity { --pc: var(--p-humanity); } .pc-impartiality { --pc: var(--p-impartiality); } .pc-neutrality { --pc: var(--p-neutrality); }
.pc-independence { --pc: var(--p-independence); } .pc-doNoHarm { --pc: var(--p-doNoHarm); }
.icon { display: grid; place-items: center; width: 36px; height: 36px; flex-shrink: 0; border-radius: 10px; background: var(--pc); color: var(--on); }
.icon svg { width: 20px; height: 20px; }
.prow { display: flex; gap: 12px; } .prow b { color: var(--pc); }
.muted { color: var(--muted); font-size: 14px; margin: 0; }
.impact { display: inline-flex; align-items: center; gap: 6px; border-radius: 99px; padding: 4px 12px; font-size: 14px; font-weight: 600; margin: 0 6px 6px 0;
  background: color-mix(in srgb, var(--pc) 14%, transparent); color: var(--pc); }
.impact svg { width: 16px; height: 16px; }
.tone { border: 1px solid; border-radius: 99px; padding: 2px 8px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.tone.success { color: var(--ok); background: color-mix(in srgb, var(--ok) 10%, transparent); }
.tone.warning { color: var(--warn); background: color-mix(in srgb, var(--warn) 10%, transparent); }
.tone.danger, .impact.neg { color: var(--bad); background: color-mix(in srgb, var(--bad) 10%, transparent); border: 1px solid color-mix(in srgb, var(--bad) 40%, transparent); }
.tone.big { font-size: 16px; padding: 4px 12px; }
.meter .head { display: flex; align-items: center; gap: 10px; } .meter .head p { flex: 1; min-width: 0; margin: 0; font-weight: 600; font-size: 14px; }
.track { position: relative; height: 10px; border-radius: 99px; background: var(--soft); overflow: hidden; margin: 10px 0 8px; }
.track .mid { position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(0,0,0,.25); inset-inline-start: 50%; }
.track .fill { position: absolute; top: 0; bottom: 0; border-radius: 99px; }
.footer { border-top: 1px solid var(--line); padding: 24px 0 48px; color: var(--muted); font-size: 14px; }
.footer a { color: var(--brand); font-weight: 600; }
.takeaways { background: var(--soft); border-radius: 18px; padding: 16px; } .takeaways ul { padding-inline-start: 20px; font-size: 14px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* v3: modes, selection, sticky actions, workshop */
.clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.textbtn { background: none; border: 0; color: inherit; font-weight: 600; font-size: 14px; text-decoration: underline; padding: 0; }
.modes { display: grid; gap: 12px; margin-top: 24px; } @media (min-width: 640px) { .modes { grid-template-columns: 1fr 1fr; } }
.mode { text-align: start; border-radius: 18px; padding: 16px; border: 2px solid transparent; background: rgba(255,255,255,.8); color: var(--fg); }
.mode[aria-checked="true"] { background: #fff; }
.mode b { display: flex; align-items: center; gap: 8px; } .mode small { display: block; color: var(--muted); font-size: 14px; margin-top: 4px; }
.radio { width: 18px; height: 18px; border-radius: 99px; border: 2px solid var(--brand); } .mode[aria-checked="true"] .radio { background: var(--brand); }
.pbar { height: 8px; border-radius: 99px; background: var(--soft); overflow: hidden; margin-top: 8px; } .pbar div { height: 100%; background: var(--acc); }
.rowhead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 8px; }
.dots { display: flex; gap: 6px; padding-bottom: 8px; } .dots span { flex: 1; height: 6px; border-radius: 99px; background: var(--soft); }
.dots .on { background: var(--acc); } .dots .now { background: var(--acc); opacity: .4; }
.optwrap { border: 2px solid var(--line); border-radius: 18px; background: var(--card); }
.optwrap.sel { border-color: color-mix(in srgb, var(--acc) 45%, transparent); background: color-mix(in srgb, var(--acc) 8%, var(--card)); }
.optwrap .opt { border: 0; background: transparent; } .optwrap.sel .letter { background: var(--acc); color: var(--on); }
.votes { display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--line); padding: 8px 16px; } .votes b { margin-inline-end: auto; font-size: 14px; }
.round { width: 40px; height: 40px; border-radius: 99px; border: 1px solid var(--line); background: var(--card); font-size: 18px; font-weight: 700; }
.discuss { border: 1px solid color-mix(in srgb, var(--acc) 45%, transparent); background: color-mix(in srgb, var(--acc) 10%, transparent); border-radius: 18px; padding: 16px; }
.discuss ul { padding-inline-start: 20px; font-size: 14px; }
.timer { background: var(--card); border-radius: 12px; padding: 12px; } .timer .row { display: flex; align-items: center; gap: 8px; }
.timer .row span:first-child { margin-inline-end: auto; font-weight: 600; font-size: 14px; } .clock { font-family: var(--display); font-size: 24px; width: 70px; text-align: center; font-variant-numeric: tabular-nums; }
.two-btn { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; } .small { padding: 8px; font-size: 14px; border-radius: 8px; }
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: rgba(251,248,243,.95); border-top: 1px solid var(--line); padding: 12px 16px; }
.dock .btn { max-width: 688px; margin: 0 auto; } .btn:disabled { opacity: .5; cursor: default; }
main.pad { padding-bottom: 120px; }
.wbadge { margin-inline-start: 8px; border-radius: 99px; padding: 2px 8px; font-size: 12px; font-weight: 600; background: color-mix(in srgb, var(--acc) 14%, transparent); color: var(--acc); }
.modebtns { display: grid; gap: 12px; } @media (min-width: 640px) { .modebtns { grid-template-columns: 1fr 1fr; } }
.modebtn { text-align: start; border: 2px solid var(--line); background: var(--card); border-radius: 18px; padding: 16px; }
.modebtn.on { background: var(--acc); color: var(--on); border-color: transparent; } .modebtn small { display: block; margin-top: 4px; opacity: .8; font-size: 14px; }
details.box summary { cursor: pointer; font-family: var(--display); font-size: 20px; font-weight: 600; list-style: none; }
.guide li { display: flex; gap: 12px; font-size: 14px; margin-top: 8px; }
.tl { display: flex; align-items: center; list-style: none; padding: 0; margin: 0 0 8px; }
.tl li { display: flex; align-items: center; } .tl li:not(:last-child) { flex: 1; }
.tc { display: grid; place-items: center; width: 36px; height: 36px; flex-shrink: 0; border-radius: 99px; font-size: 14px; font-weight: 700; background: var(--soft); color: var(--muted); }
.tl .now .tc { background: var(--card); border: 2px solid var(--acc); color: var(--acc); } .tl .done .tc { background: var(--acc); color: var(--on); }
.tline { flex: 1; height: 4px; margin: 0 6px; border-radius: 99px; background: var(--soft); } .tl .done .tline { background: var(--acc); }
.scene { border-inline-start: 4px solid var(--acc); border-radius: 18px; padding: 20px; background: color-mix(in srgb, var(--acc) 10%, transparent); }

/* v4: calmer home */
.hero { padding-top: 16px; padding-bottom: 28px; } .hero .intro { margin-top: 12px; max-width: 36em; font-size: 16px; opacity: .95; }
.modes { grid-template-columns: 1fr 1fr; margin-top: 0; }
.mode { background: var(--card); border: 2px solid var(--line); padding: 12px 14px; }
.mode[aria-checked="true"] { background: var(--card); border-color: var(--brand); }
.mode b { font-size: 15px; } .mode small { font-size: 12.5px; }
.scard .strip { height: 6px; } .scard .body { gap: 6px; }
.titlerow { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; } .titlerow h3 { font-size: 18px; }
.clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 14px; }

</style>
</head>

 data skulle användas, och är något av det känsligt?","Behövs AI verkligen här, eller skulle något enklare fungera?","Vad skulle det kosta i energi, vatten och hårdvara?","Var behåller människor kontrollen – och hur kan någon ifrågasätta utfallet?"],"timer":"Diskussionstimer","timerStart":"Starta","timerPause":"Pausa","timerReset":"Nollställ","timeUp":"Tiden är ute – dags att rösta","voteHeading":"Gruppens röstning","voteHint":"Räkna handuppräckning med + och −. Alternativet med flest röster väljs – du kan ändra det.","votes":"{n} röster","groupChose":"Gruppen valde","afterDiscuss":"Innan ni går vidare: blev det som gruppen trodde? Vad skulle ni göra annorlunda?","groupPath":"Hur gruppen röstade","splitVote":"Röster: {votes}","copySummary":"Kopiera sammanfattning","copied":"Kopierat","downloadSummary":"Ladda ner sammanfattning","guideHeading":"Så leder du en workshop","guideSteps":["Planera 60–90 minuter för 4–20 personer. Visa spelet på en stor skärm eller projektor.","Välj ett eller två scenarier som passar teamets arbete. Läs roll och situation högt.","För varje beslut: läs situationen, diskutera några minuter med timern och rösta sedan med handuppräckning.","Läs konsekvensen och ”varför det spelar roll” tillsammans och stanna vid diskussionsfrågan.","Avsluta med genomgången och frågorna till teamet. Ladda ner sammanfattningen och dela efteråt."],"guideNote":"Inget skickas någonstans: röster och resultat stannar på den här enheten.","startWorkshop":"Starta workshop","playSolo":"Spela själv","yourDecisions":"Dina beslut","principlesToggle":"Om principerna"}},"scenarios":{"ar":[{"id":"flood-line","title":"خط الفيضان","tagline":"روبوت محادثة بالذكاء الاصطناعي لمجتمعات متضررة من الفيضانات في جنوب آسيا","role":"رئيس عمليات الطوارئ، الجمعية الوطنية في بلد دلتا بجنوب آسيا","context":"تسببت أسابيع من أمطار الموسم في نزوح أكثر من 200,000 شخص عبر الدلتا. خطك الهاتفي مثقل — ينتظر المتصلون ساعات للحصول على معلومات عن المآوي وعمليات التوزيع والأقارب المفقودين. يعرض شريك اتصالات روبوت محادثة مجانياً بالذكاء الاصطناعي يجيب بثلاث لغات محلية. فريقك المكوّن من أربعين شخصاً منهك، والمياه ما تزال ترتفع.","topics":["روبوتات المحادثة","المشاركة المجتمعية","حماية البيانات"],"roles":["عمليات الطوارئ","إدارة المعلومات","المشاركة المجتمعية"],"steps":[{"id":"fl-1","title":"ثمانٍ وأربعون ساعة","narrative":"يقول المزوّد إن روبوت المحادثة يمكن أن يعمل خلال 48 ساعة، مدرّباً على الأسئلة الشائعة من فيضانات سابقة. تحذّر مسؤولة إدارة المعلومات من أن الإجابات لم تُتحقق مقابل هذه الطوارئ. تجربة كاملة بمراجعة بشرية ستستغرق أسبوعين — وقتٌ ينام فيه الناس في العراء.","options":[{"id":"fl-1a","label":"الإطلاق خلال 48 ساعة","detail":"السرعة قبل التحقق. تخرج الإجابات دون مراجعة، وتصلح المشكلات كلما ظهرت.","consequence":"خلال ثلاثة أيام يجيب الروبوت على 40,000 سؤال. لكن فرق الميدان تبلغ عن أن إجابة واحدة من كل اثنتي عشرة تقريباً خاطئة — بما فيها توجيهات إلى مأوى في منطقة أُغلق موقعها الليلة الماضية. يقضي الموظفون الأسبوع في مطاردة التصحيحات عبر مجموعات واتساب.","reflection":"السرعة قد تنقذ أرواحاً، لكن المعلومات الآلية غير المتحقق منها قد تسبب ضرراً بحد ذاتها. يلتزم قرار تكنولوجيا المعلومات والاتصالات الحركةَ بتجنب إلحاق الضرر بالمتضررين والتخفيف منه — بما في ذلك الضرر الناجم عن الأدوات التي ننشرها.","impacts":{"humanity":1,"doNoHarm":-2}},{"id":"fl-1b","label":"إجراء تجربة لمدة أسبوعين أولاً","detail":"يراجع بشر كل قالب إجابة قبل الإطلاق. أبطأ، لكنه متحقق منه.","consequence":"يُطلق الروبوت في اليوم الرابع عشر بدقة 98% في الإجابات المتحقق منها. في الفترة الفاصلة، يبقى الخط مثقلاً وتصل بعض المجتمعات المعلومات متأخرة — لكن ما يصلها موثوق، وثقة الناس بالخدمة تصمد.","reflection":"التحقق يكلّف وقتاً، والوقت يكلّف وصولاً. لكن المعلومات الموثوقة جزء من المساعدة الإنسانية المحايدة — إجابة ترسل شخصاً في الاتجاه الخاطئ ليست مساعدة أصلاً.","impacts":{"humanity":-1,"doNoHarm":2,"impartiality":1}},{"id":"fl-1c","label":"الاستغناء عن الروبوت وتوسيع الخط الهاتفي","detail":"توظيف وتدريب مشغّلين مؤقتين بدلاً من ذلك. لا مخاطر تقنية جديدة، لكن وصولاً أقل بكثير.","consequence":"تدرّب 25 مشغّلاً مؤقتاً في عشرة أيام. جودة الإجابات عالية ويصل كل متصل إلى إنسان — لكن الخط لا يغطي إلا جزءاً من الطلب، وكثير من العائلات النازحة لا تتمكن من الاتصال أبداً.","reflection":"اختيار عدم استخدام الذكاء الاصطناعي قرار له عواقب أيضاً. الاستقلال عن المزوّدين محفوظ، لكن الإنسانية تسأل إن كانت أداة متاحة، محكومة بعناية، كانت ستخفف معاناة أكبر.","impacts":{"humanity":-1,"doNoHarm":1,"independence":1}}]},{"id":"fl-2","title":"ما الذي يتذكره الروبوت","narrative":"الإعداد الافتراضي للمزوّد يسجّل كل شيء: أرقام الهواتف، والمواقع التقريبية، وكل سؤال يُطرح — «لتحسين الخدمة». تلاحظ مسؤولة حماية البيانات أن قائمة بالنازحين ومواقعهم واحتياجاتهم هي بالضبط نوع البيانات التي وُجدت معايير حماية البيانات في الحركة لحمايتها.","options":[{"id":"fl-2a","label":"تسجيل كل شيء لخدمة أفضل","detail":"السجلات الكاملة تغذي تحليلات المزوّد. التخصيص يتحسن.","consequence":"تصبح الإجابات أكثر ملاءمة بشكل ملحوظ. بعد أشهر تعلم أن السجلات استُخدمت لتدريب منتج تجاري، ولا توجد طريقة عملية لسحب بيانات 40,000 نازح لم يوافقوا على ذلك أبداً.","reflection":"نادراً ما يتفاوض المتضررون على موافقتهم في الأزمات. التزام حماية البيانات في قرار تكنولوجيا المعلومات والاتصالات يعامل بياناتهم على أنها ملكهم — تُجمع لغرض معلن، وتُحمى، ولا يعاد استخدامها في صمت أبداً.","impacts":{"humanity":1,"doNoHarm":-2,"independence":-1}},{"id":"fl-2b","label":"جمع الحد الأدنى","detail":"جلسات مجهولة، بلا معرّفات، وحدود احتفاظ في العقد. تخصيص أقل.","consequence":"لا يستطيع الروبوت تذكّر المستخدمين العائدين، مما يزعج البعض. لكن عندما تطلب وزارة بيانات المستخدمين بعد شهرين، لا يوجد شيء يحدد الهوية لتسليمه — ويمكن لفرقك أن تقول ذلك بصدق عبر الإذاعة.","reflection":"تقليل البيانات هو البطل الصامت للممارسة المسؤولة: لا يمكنك تسريب أو فقدان أو إجبارك على تسليم بيانات لم تجمعها قط. وهو يحمي الحياد أيضاً إذا اهتمت أطراف النزاع لاحقاً.","impacts":{"doNoHarm":2,"neutrality":1}},{"id":"fl-2c","label":"مشاركة السجلات مع شريك الاتصالات","detail":"يعرضون تحليلات الشبكة مقابل ذلك. لا يُسأل المستخدمون المتضررون.","consequence":"تساعدك التحليلات على رسم خريطة الطلب. ثم يسأل صحفي لماذا تتدفق أسئلة النازحين ومواقعهم إلى شركة خاصة. تُنشر القصة على مستوى البلاد؛ وتنهار ثقة المجتمع بالخط بشدة.","reflection":"المساءلة أمام المتضررين تشمل القدرة على التفسير — قبل أن يقرؤوه في الأخبار — من يحتفظ ببياناتهم ولماذا. شروط الشراكة الأخلاقية مكانها الشراء، لا اتصالات الأزمات بعد وقوعها.","impacts":{"doNoHarm":-2,"independence":-1}}]},{"id":"fl-3","title":"منعطفات خاطئة","narrative":"يتصل مندوب ميداني: الروبوت يرسل العائلات إلى نقطة توزيع أُغلقت قبل يومين. مشى نحو 300 شخص في الحر، بعضهم مع أطفال صغار. يستطيع المزوّد تصحيح الإجابة خلال ساعات — لكنك تعلم الآن أن إجابات أخرى قد تكون قديمة أيضاً.","options":[{"id":"fl-3a","label":"إبقاؤه يعمل أثناء الإصلاح","detail":"تبقى الخدمة متاحة. تُطرح الإصلاحات إجابةً إجابة خلال الأسبوع.","consequence":"يستمر معظم المستخدمين في تلقي المساعدة — ويستمر عدد مجهول في تلقي معلومات قديمة. يُبلَّغ عن موقعين مغلقين آخرين قبل انتهاء تدقيق المحتوى. تفقد الفرق الميدانية ثقتها بالأداة.","reflection":"الاستمرار في خدمة تعلم أنها تضر بعض المستخدمين ينقل المخاطر إلى الأقل قدرة على تحمّلها. عدم إلحاق الضرر يعني الاستعداد لإطفاء ابتكارك بنفسك.","impacts":{"humanity":-1,"doNoHarm":-2}},{"id":"fl-3b","label":"إيقافه وشرح السبب","detail":"تعليق الروبوت، والإعلان عن التصحيح عبر الإذاعة والرسائل القصيرة، وإعادة الإطلاق بعد تدقيق كامل للمحتوى.","consequence":"ثلاثة أيام بلا روبوت، ويتألم الخط الهاتفي مجدداً. لكن التصحيح الشفاف يحظى بقبول: يكرر قادة المجتمع رسالتك، ويحقق يوم إعادة الإطلاق استخداماً قياسياً — الناس يثقون بخدمة تعترف بأخطائها.","reflection":"المشاركة المجتمعية والمساءلة ليستا استبياناً في النهاية — بل تواصل صادق عندما تسوء الأمور. الاعتراف بالخطأ قوّى الخدمة بدل أن يضعفها.","impacts":{"humanity":-1,"doNoHarm":2}},{"id":"fl-3c","label":"إضافة إخلاء مسؤولية والاستمرار","detail":"«قد تكون الإجابات غير دقيقة — تحققوا محلياً.» الخدمة لا تتوقف أبداً.","consequence":"ينخفض الاستخدام قليلاً. لكن بالنسبة لأم تقرر إن كانت ستمشي خمسة كيلومترات مع رضيع، فإن «قد تكون غير دقيقة» ليست قابلة للتنفيذ. ترتفع الشكاوى بين أكثر المستخدمين ضعفاً، ممن لا سبيل لهم إلى «التحقق محلياً».","reflection":"إخلاء المسؤولية ينقل مسؤوليتك إلى المستخدم. المساءلة تعني أن المنظمة — لا الشخص المتضرر — هي من يتحمل عبء إنجاز الأمر بشكل صحيح.","impacts":{"doNoHarm":-1,"impartiality":-1}}]},{"id":"fl-4","title":"من يصغي؟","narrative":"بعد ستة أسابيع، تستقر حالة الطوارئ. عليك أن تقرر كيف يبقى الروبوت — الذي سيصبح على الأرجح خدمة دائمة — خاضعاً للمساءلة أمام من يستخدمونه.","options":[{"id":"fl-4a","label":"تشكيل لجنة ملاحظات مجتمعية","detail":"يراجع المتضررون الإجابات أسبوعياً، ويبلغون عن الأضرار، ويشكلون ما يغطيه الروبوت.","consequence":"تلتقط اللجنة مشكلات لم تُظهرها لوحات المؤشرات قط: إجابات منطقية في العاصمة لكنها غير مفهومة بلهجات ضفاف الأنهار، ومواضيع يخشى الناس السؤال عنها. تتحسن الخدمة وتزداد ثقةً.","reflection":"المشاركة المجتمعية والمساءلة — التزام جوهري في قرار تكنولوجيا المعلومات والاتصالات — تعامل المتضررين كصنّاع قرار بشأن الأدوات التي تخدمهم، لا مجرد أرقام استخدام.","impacts":{"doNoHarm":2,"impartiality":1}},{"id":"fl-4b","label":"الوثوق بمقاييس الاستخدام","detail":"تُظهر اللوحات تفاعلاً قوياً. إذا كان الناس يستخدمونه، فهو يعمل.","consequence":"تبدو الأرقام رائعة في تقرير المانحين. بعد أشهر، تكتشف تقييمات أن المستخدمين ذوي النتائج الأسوأ — كبار السن، وذوي الإعاقة، ومتحدثي اللغات غير السائدة — توقفوا ببساطة عن استخدام الروبوت، دون أن يلحظهم أحد.","reflection":"المقاييس تقيس من بقوا. عدم التحيز يسأل عن الأشخاص الذين لا تراهم البيانات — وهم غالباً الأشد احتياجاً.","impacts":{"impartiality":-2,"doNoHarm":-1}},{"id":"fl-4c","label":"تسليم الإشراف لمتطوعين غير مدربين","detail":"حسن النية المحلي يبقي الخدمة حية بلا تكلفة تُذكر.","consequence":"يعمل المتطوعون بجد، لكن دون تدريب أو مسارات تصعيد، تبقى بعض الردود الضارة أسابيع وتتلقى الأسئلة الحساسة معاملة غير متسقة. يُنهَك متطوعان ويستقيلان.","reflection":"لا يمكن الاستعانة بحسن النية مصدراً للمساءلة. النشر الأخلاقي يشمل تمويل البشر الذين يحافظون على سلامة الأنظمة الآلية — وإلا فالأتمتة غير محكومة فعلاً.","impacts":{"humanity":1,"doNoHarm":-1}}]}],"debrief":"يُظهر خط الفيضان كيف يلامس روبوت محادثة حسن النية كل التزامات قرار تكنولوجيا المعلومات والاتصالات بسرعة: معلومات متحقق منها (عدم إلحاق الضرر)، وتقليل البيانات وتحديد غرضها (حماية البيانات)، وتواصل صادق عند الفشل (المساءلة أمام المجتمعات)، وحوكمة تُبقي المتضررين متحكمين في الأدوات المصممة لخدمتهم."},{"id":"targeting-unseen","title":"استهداف غير المرئيين","tagline":"تحليلات تنبؤية لاختيار المستفيدين في الساحل","role":"مدير برنامج التحويلات النقدية، الاستجابة للجفاف في الساحل","context":"دفع جفاف دام ثمانية عشر شهراً عبر الساحل 60,000 أسرة نحو الأزمة. يستطيع برنامجك النقدي الوصول إلى 15,000 فقط. الاختيار هو أصعب قرار في العملية وأكثرها خلافاً — وتعرض شركة تحليلات نموذجاً تنبؤياً يرتّب الأسر حسب الاحتياج المرجح في أيام بدل أشهر.","topics":["استهداف المستفيدين","التحيز الخوارزمي","مشاركة البيانات مع شركاء التقنية"],"roles":["إدارة البرامج","البيانات والتحليلات","الحماية"],"steps":[{"id":"tu-1","title":"البيانات المتاحة لديك","narrative":"النموذج لا يصلح إلا بجودة بيانات تدريبه. لديك ثلاثة خيارات واقعية، لا يخلو أيها من عيوب، ونافذة انعدام الأمن الغذائي القادمة تُغلق خلال ثمانية أسابيع.","options":[{"id":"tu-1a","label":"استخدام السجل القديم البالغ أربع سنوات","detail":"سريع وجاهز. لكنه يسبق الجفاف والنزوح وإغلاق الحدود.","consequence":"تجهز الترتيبات في خمسة أيام. تكتشف الفرق الميدانية سريعاً أن النموذج يقيّم أسراً تعافت منذ ذلك الحين — وأنه أعمى عن آلاف الأسر النازحة حديثاً التي لم تُسجَّل قط. تتدفق شكاوى الاستبعاد.","reflection":"نموذج مدرّب على واقع الأمس يعيد إنتاج صورة احتياج الأمس. عدم التحيز — المساعدة على أساس الاحتياج وحده — يفشل بصمت عندما لا ترى البيانات من يعاني الآن.","impacts":{"impartiality":-2,"humanity":-1}},{"id":"tu-1b","label":"جمع بيانات جديدة من باب إلى باب","detail":"عدّادون بأجهزة لوحية ونصوص موافقة. ستة أسابيع، وتغطية حقيقية لغير المسجلين.","consequence":"التأخير مؤلم — يمر شهر قحط قبل أن تتدفق الأموال. لكن النموذج يتدرب على الواقع الحالي، بما فيه أسر لم تلتقطها أي قائمة قط. يسميه قادة المجتمع أكثر اختيار عادلاً رأوه.","reflection":"أحياناً يكون الاستخدام المسؤول للذكاء الاصطناعي هو الإبطاء لمنحه مدخلات صادقة. الجمع القائم على الموافقة يجسّد أيضاً معيار حماية البيانات الذي يطلبه قرار تكنولوجيا المعلومات والاتصالات.","impacts":{"impartiality":2,"doNoHarm":1,"humanity":-1}},{"id":"tu-1c","label":"دمج السجل مع مؤشرات الأقمار الصناعية","detail":"مواد الأسطح والغطاء النباتي والوصول إلى الطرق كمؤشرات للاحتياج. رخيص وسريع وبلا مسوح جديدة.","consequence":"التغطية سريعة وواسعة. لكن المؤشرات تسيء قراءة مجموعات كاملة: الرعاة الذين تمشي ثروتهم على أربع تُقيَّم كفقراء مدقعين، بينما أسر مفقرة تحت أسطح صلبة تُقيَّم كميسورة. تصحيح الأخطاء يستغرق أطول من المسح نفسه.","reflection":"المتغيرات البديلة تضمّن افتراضات عن شكل الفقر. عندما تكون الافتراضات خاطئة، يصبح التحيز منهجياً — يضرب النوع نفسه من الأسر في كل مرة، وهذا نقيض عدم التحيز.","impacts":{"impartiality":-1,"doNoHarm":-1,"humanity":1}}]},{"id":"tu-2","title":"النقاط العمياء في النموذج","narrative":"تصل نتائج التحقق: الدقة الإجمالية تبدو قوية، لكن الأسر التي ترأسها نساء ومجموعة عرقية أقلية تُرتَّب بشكل منهجي أدنى مما تشير إليه التقييمات الميدانية. تقول الشركة إن الفجوة «ضمن هامش مقبول». موعد الصرف النهائي بعد عشرة أيام.","options":[{"id":"tu-2a","label":"النشر للوفاء بالموعد","detail":"تتحرك الأموال في وقتها. التحيز المعروف يذهب إلى وثيقة «دروس مستفادة».","consequence":"تتلقى 15,000 أسرة الأموال في موعدها — لكن المستبعدين يشملون حصة غير متناسبة من الأسر التي ترأسها نساء. يُثقَل مكتب الاستئنافات، ويسأل مذيع إذاعة محلية لماذا «نسي الحاسوبُ الأرامل».","reflection":"التحيز المعروف غير المعالج ليس هامشاً تقنياً؛ إنه قرار بالتمييز على نطاق واسع. عدم إلحاق الضرر ينطبق على الأضرار المتوقعة بقدر ما ينطبق على غير المتوقعة.","impacts":{"humanity":1,"impartiality":-2,"doNoHarm":-1}},{"id":"tu-2b","label":"إعادة المعايرة بتحقق مجتمعي","detail":"تراجع لجان محلية حالات الاستبعاد. أسبوعان إضافيان قبل الصرف.","consequence":"يصعب الدفاع عن التأخير أمام المانحين — حتى تصل القائمة المنقحة. تلتقط اللجان مئات الاستبعادات الجائرة، ولأنها ساعدت في تشكيل القائمة، تنخفض النزاعات بشدة. يفوت الموعد؛ وتصمد الشرعية.","reflection":"المشاركة المجتمعية من أقوى أدوات تصحيح التحيز. من يعيشون الواقع يرون أنماطاً لا تلتقطها أي مقاييس تحقق — ومشاركتهم تبني المساءلة التي يدعو إليها قرار تكنولوجيا المعلومات والاتصالات.","impacts":{"impartiality":2,"doNoHarm":1,"humanity":-1}},{"id":"tu-2c","label":"النموذج ينصح والناس يقررون","detail":"يتخذ الموظفون واللجان الاختيارات النهائية، مستخدمين الترتيب كأحد المدخلات بين عدة مدخلات.","consequence":"يستغرق الاختيار وقتاً أطول من الأتمتة الكاملة لكنه يلتزم بالموعد. يظل النموذج يسرّع الفرز الأولي، بينما يمتص البشر نقاطه العمياء. التجاوزات البشرية الموثقة تنشئ سجلاً يمكن تدقيقه وتفسيره.","reflection":"الإشراف البشري الفعلي هو الفرق بين استخدام النموذج وأن يستخدمك. إبقاء القرار النهائي بشرياً يحفظ المساءلة — هناك من يجيب عن كل اسم في القائمة.","impacts":{"impartiality":1,"doNoHarm":1,"independence":1}}]},{"id":"tu-3","title":"ثمن الشريك","narrative":"يمنح العقد القياسي لشركة التحليلات حق الوصول إلى بيانات الأسر «لتحسين النموذج والمنتجات ذات الصلة»، وحق الاستشهاد بالمشروع في التسويق. يعترض الفريق القانوني على البندين. تلمّح الشركة إلى أن إزالتهما قد تنهي الترخيص المجاني.","options":[{"id":"tu-3a","label":"مشاركة بيانات مستعارة الأسماء بموجب العقد","detail":"أُزيلت الأسماء ووُقّع العقد. يحتفظ البرنامج بأدواته المجانية.","consequence":"يوفر البرنامج المال. بعد عام، يثبت باحث أن سجلات الأسر «مستعارة الأسماء» يمكن إعادة تحديد هويات أصحابها بدمج الموقع وحجم الأسرة — وتتضح أن بند الإنفاذ في العقد شبه عديم الفائدة عبر الولايات القضائية.","reflection":"إخفاء الهوية أضعف مما يبدو في المجتمعات الصغيرة، والعقد الذي لا يمكن إنفاذه أملٌ لا ضمانة. يجب أن تنجو حماية البيانات من نهاية الشراكة.","impacts":{"doNoHarm":-2,"independence":-1}},{"id":"tu-3b","label":"مشاركة النتائج المجمعة فقط","detail":"تحصل الشركة على أرقام أداء النموذج، ولا تحصل أبداً على بيانات على مستوى السجل. يعترضون.","consequence":"تتوتر المفاوضات وتهدد الشركة لفترة وجيزة بالانسحاب. تتمسك بموقفك فيقبلون — المقاييس المجمعة تسمح لهم بتحسين النموذج. لا يغادر أي سجل أسرة سيطرتك أبداً.","reflection":"الشراء الأخلاقي يعني أن الحركة هي من تضع شروط حركة بيانات المتضررين، لا المزوّد. الأدوات «المجانية» تُدفع ثمناً بشيء ما — فتأكد ألا يكون خصوصية المستفيدين.","impacts":{"doNoHarm":1,"independence":1}},{"id":"tu-3c","label":"الانسحاب والبناء داخلياً","detail":"أبطأ وأكثر كلفة، ولك بالكامل.","consequence":"يبني فريق البيانات الصغير نموذجاً أبسط في ثلاثة أشهر. هو أقل تطوراً والتأخير حقيقي — لكن كل سطر فيه قابل للتدقيق، وكل سجل يبقى داخلياً، والمهارة تعيش الآن في الحركة.","reflection":"الاستقلال يكلّف أحياناً سرعة ومالاً. امتلاك قدرتك — بدل استئجار صندوق أسود — استثمار طويل الأمد في عمل إنساني مستقل وخاضع للمساءلة.","impacts":{"independence":2,"doNoHarm":1,"humanity":-1}}]},{"id":"tu-4","title":"من يوقّع القائمة؟","narrative":"قرار التصميم الأخير: ما مدى أتمتة التسجيل؟ ينتج النموذج قائمة مرتبة من 15,000 أسرة. على شخص — أو شيء — ما أن يحوّل ذلك الترتيب إلى قائمة نهائية ملزمة.","options":[{"id":"tu-4a","label":"تسجيل أول 15,000 آلياً","detail":"بلا مراجعة بشرية. أسرع نقد ممكن، و«موضوعي» بالكامل.","consequence":"تتحرك الأموال في وقت قياسي. ثم تطفو الأخطاء: أسر مكررة، وقرية وضعها النموذج في الموقع الخاطئ، وعائلات استُبعدت بخطأ إدخال لم يره أي إنسان. دون خطوة مراجعة، كل خطأ نهائي حتى تُبتّ الاستئنافات.","reflection":"الأتمتة الكاملة لا تلغي الحكم البشري — بل تخفيه داخل النموذج والبيانات. القرارات الآلية بشأن بقاء الناس تحتاج إنساناً يلتقط ما يعجز عنه النظام.","impacts":{"doNoHarm":-2,"impartiality":-1,"humanity":1}},{"id":"tu-4b","label":"يتحقق الموظفون من كل حالة","detail":"دقيق وخاضع للمساءلة — وعنق الزجاجة الذي خشيه الجميع.","consequence":"تضيف المراجعة أربعة أسابيع. الأخطاء المكتشفة: مئات. لكن موسم القحط يشتد قبل اكتمال الصرف، وتقضي ليالي صعبة تدافع فيها عن التأخير أمام قادة مجتمع وُعدوا بالسرعة.","reflection":"للمساءلة ثمن من الوقت، وفي أزمة جوع يُقاس الوقت بالوجبات. الدرس الصادق: ابنِ قدرة التحقق قبل الطوارئ، كي لا تكون الدقة والسرعة عدوّين.","impacts":{"doNoHarm":1,"impartiality":1,"humanity":-1}},{"id":"tu-4c","label":"إشراف بشري مع استئنافات مجتمعية","detail":"يفحص الموظفون القائمة عشوائياً، وتُنشر المعايير، ويمكن لأي أسرة الطعن في استبعادها.","consequence":"المعايير المنشورة تبدّد معظم الشكوك قبل أن تنشأ. تلتقط نافذة الاستئنافات 600 استبعاد جائر في أسبوعين. القائمة ليست مثالية — لكنها قابلة للتفسير والتصحيح وموضع ثقة.","reflection":"الشفافية مع آلية طعن فعالة هي شكل المساءلة أمام المتضررين عملياً: ليست خوارزمية بلا عيوب، بل نظاماً يستطيع الناس مساءلته وتصحيحه.","impacts":{"doNoHarm":2,"impartiality":1}}]}],"debrief":"استهداف غير المرئيين يدور عمن لا تراهم البيانات. الاستهداف التنبؤي يلامس عدم التحيز (هل يرى النموذج احتياج اليوم؟)، وحماية البيانات (من يملك بيانات الأسر، وهل يمكن إعادة تحديد هوية الأشخاص «مستعاري الأسماء»؟)، والشراء الأخلاقي (من يضع الشروط مع المزوّدين؟)، والمساءلة (هل تستطيع أسرة مستبعدة الطعن في إجابة الآلة؟)."},{"id":"front-line","title":"عيون على خط الجبهة","tagline":"تقييم الاحتياجات بالذكاء الاصطناعي في نزاع نشط في الشرق الأوسط","role":"مدير العمليات، الاستجابة للنزاع في الشرق الأوسط","context":"في نزاع ممتد، تتحرك خطوط الجبهة أسبوعياً. منطقتان معزولتان، وآخر تقييم احتياجات موثق لديك عمره ثلاثة أشهر. تعرض شركة تقنية عالمية منصة تصويرها الفضائي — مع كشف الأضرار بالتعلم الآلي — مجاناً للاستخدام الإنساني. في هذا السياق، المعلومات عن أماكن الناس واحتياجاتهم ليست مجرد بيانات تشغيلية. إنها حساسة عسكرياً أيضاً.","topics":["التحليلات التنبؤية","الحساسية للنزاع","الاعتماد على السحابة","اتخاذ القرار الآلي"],"roles":["العمليات","الأمن","إدارة المعلومات"],"steps":[{"id":"fo-1","title":"الرؤية دون دخول","narrative":"مفاوضات الوصول متوقفة. تستطيع المنصة رسم خريطة المباني المتضررة في المنطقتين المعزولتين خلال أيام. يحذر منسقك الميداني من أن سطح مبنى لا يقول شيئاً عن من بداخله.","options":[{"id":"fo-1a","label":"إجراء التقييم الفضائي الآن","detail":"سريع وعن بُعد وآمن للموظفين. اقبل النقاط العمياء مؤقتاً.","consequence":"تحصل على أول صورة شاملة للمنطقتين منذ أشهر، ويتسارع تخطيط القوافل. لكن النموذج يقرأ الأسطح السليمة كأرواح سليمة: بلدة مقصوفة بسقف سوق جديد تُقيَّم «في طور التعافي» بينما نظام مياهها مدمر. الاحتياجات في الأماكن غير المرئية لا تُحصى.","reflection":"الاستشعار عن بعد يرى الهياكل لا المعاناة. مستخدماً وحده، يوجه المساعدة نحو المرئي من المدار — مشكلة في عدم التحيز مختبئة داخل خريطة مبهرة.","impacts":{"humanity":1,"impartiality":-1,"doNoHarm":-1}},{"id":"fo-1b","label":"انتظار وصول آمن","detail":"لا تقييم حتى يستطيع المندوبون التحقق على الأرض. بيانات موثقة، على بُعد أسابيع.","consequence":"ينفتح الوصول بعد سبعة أسابيع ويكون التقييم ممتازاً. في الفترة الفاصلة، تذهب عمليتا توزيع إلى بلدتين خاطئتين ولا تتلقى منطقة كاملة شيئاً. كان الانتظار آمناً لجودة البيانات وخطيراً على الناس.","reflection":"الإنسانية توازن كلفة الانتظار مقابل كلفة الخطأ. المعلومات المثالية ترف؛ والانضباط هو معرفة أي القرارات لا يمكنها انتظارها.","impacts":{"humanity":-2,"impartiality":1}},{"id":"fo-1c","label":"دمج الصور مع التقارير المجتمعية","detail":"تبلغ شبكات محلية موثوقة عبر قنوات آمنة؛ يتحقق النموذج وواقع الأرض أحدهما من الآخر.","consequence":"يصحح المبلغون المجتمعيون أسوأ أخطاء النموذج خلال أيام — نظام المياه المدمر، والعيادة العاملة من قبو. الصورة المدمجة هي الأفضل التي حصلت عليها في منطقة بلا وصول، وتشعر الشبكات المحلية بملكيتها.","reflection":"أقوى نشرات الذكاء الاصطناعي في العمل الإنساني تقترن بقدرة الآلة على الاتساع مع المعرفة المجتمعية. هذه مشاركة مجتمعية تؤدي عملاً تحليلياً — وتُبقي المتضررين مؤلفين للبيانات لا مجرد موضوعات لها.","impacts":{"humanity":1,"impartiality":1,"doNoHarm":1}}]},{"id":"fo-2","title":"منصة مجانية، تكاليف خفية","narrative":"منصة الشركة جيدة فعلاً — ومجانية. الخدعة: كل تحليل الصور وبيانات السكان المشتقة تعيش على سحابة الشركة، تحت ولاية قضائية أجنبية، وتحكمها شروطها القياسية. يلاحظ مستشارك الأمني أن تلك الشروط تسمح بالوصول «لتحسين الخدمة».","options":[{"id":"fo-2a","label":"القبول ببنود تعاقدية","detail":"وقّع بسرعة مع حمايات متفاوض عليها. لا تستطيع العملية انتظار شروط مثالية.","consequence":"تُحوّل المنصة وعيك بالوضع. بعد ثمانية أشهر تُستحوذ الشركة، وتتغير الشروط، وتصبح قدرتك على إعادة التفاوض محدودة — البيانات، والاعتمادية، موجودتان أصلاً.","reflection":"الشراء الأخلاقي ينظر إلى ما وراء السعر: الولاية القضائية والشروط وخيارات الخروج. يتآكل الاستقلال بصمت عندما تعتمد قدرة إنسانية حيوية على حسن نية مزوّد.","impacts":{"independence":-2,"doNoHarm":-1}},{"id":"fo-2b","label":"الإصرار على استضافة تسيطر عليها الحركة","detail":"تعمل البيانات والنماذج على بنية تحتية تسيطر عليها الحركة. تستغرق المفاوضات أسابيع.","consequence":"تقاوم الشركة ثم توافق على نشر مخصص — أبطأ في الإعداد، لكن تحت مفاتيحك. عندما تطالب حكومة لاحقاً بالوصول إلى بيانات الحركة، تكون الإجابة بسيطة بنيوياً: ليست للشركة لتمنحها، ولا لك لتشاركها.","reflection":"مكان وجود البيانات يقرر من يمكن إجباره على تسليمها. في بيئات النزاع، السيطرة على البنية التحتية ليست تفصيلاً تقنياً — إنها قرار حماية.","impacts":{"independence":2,"doNoHarm":1,"humanity":-1}},{"id":"fo-2c","label":"الرفض؛ واستخدام أدوات مفتوحة داخلياً","detail":"تحليل صور مفتوح المصدر على خوادمك. أبطأ وأتقشف، ولك بالكامل.","consequence":"يبني محللوك مسار عمل قابلاً للتشغيل في شهر. ينقصه صقل المنصة والفريق مُجهَد — لكن لا اعتماد على مزوّد، ولا سحابة أجنبية، والقدرة تنجو من نهاية أي شراكة.","reflection":"أحياناً يكلّف الخيار المستقل قدرةً. المفاضلة حقيقية ويجب اتخاذها بوعي، بعيون مفتوحة على ما تتقاضاه المنصات «المجانية» فعلاً.","impacts":{"independence":1,"doNoHarm":1,"humanity":-1}}]},{"id":"fo-3","title":"من يشاهد أيضاً؟","narrative":"يتتبع تحليلك الآن تحركات السكان عبر خط الجبهة — وهو بالضبط نوع المعلومات الذي يقدّره الفاعلون المسلحون في الجانبين. يقترح مانح نشر لوحة مفتوحة «للشفافية والتنسيق».","options":[{"id":"fo-3a","label":"نشر اللوحة المفتوحة","detail":"أقصى شفافية. يستطيع أي أحد — بمن فيهم المقاتلون — قراءتها.","consequence":"يتحسن التنسيق بين الوكالات. بعد ثلاثة أسابيع، يُقصف ممر نزوح ظاهر على لوحتك. لا تستطيع إثبات أن اللوحة مكّنته. ولا تستطيع إثبات العكس. يُخلَى الموظفون في الممر.","reflection":"في النزاع، قد تصبح الشفافية حول تحركات الناس معلومات استهداف. قد يتطلب الحياد وعدم إلحاق الضرر نشر أقل مما تعرف — حقيقة قاسية لقطاع يقدّس المساءلة.","impacts":{"neutrality":-2,"doNoHarm":-2}},{"id":"fo-3b","label":"الاقتصار على شركاء إنسانيين موثقين","detail":"وصول على أساس الحاجة للمعرفة، وبروتوكول مشاركة، وتجميع قبل أي تعميم أوسع.","consequence":"التنسيق أبطأ ويتذمر بعض الشركاء من مستويات الوصول. لكن بيانات تحركات السكان لا تتداول أبداً خارج منظمات مقيدة بمبادئ إنسانية، وتستطيع فرقك حساب كل نسخة.","reflection":"مشاركة البيانات المسؤولة تُصمَّم ولا تكون افتراضاً: محدودة الغرض، ومتدرجة الوصول، ومجمّعة حيثما أمكن. التزام حماية البيانات في قرار تكنولوجيا المعلومات والاتصالات ينطبق أكثر حيث تكون المخاطر أعلى.","impacts":{"neutrality":1,"doNoHarm":2}},{"id":"fo-3c","label":"المشاركة بالتساوي مع جميع الأطراف","detail":"امنح كل طرف في النزاع البيانات نفسها، بإنصاف. الحياد كتناظر.","consequence":"يقبل الجانبان البيانات بأدب. ثم تتبع عمليات أحدهما بشكل واضح أنماط الحركة التي وفّرتها. إنصافُك وفر معلومات استخباراتية عسكرية لمن شاء.","reflection":"الحياد هو عدم المساهمة في سير الأعمال العدائية، لا التوزيع المتساوي للبيانات الحساسة. المشاركة المتناظرة لمعلومات غير متناظرة ليست محايدة في آثارها.","impacts":{"neutrality":-1,"doNoHarm":-2,"humanity":-1}}]},{"id":"fo-4","title":"الخوارزمية توصي","narrative":"ترتّب المنصة الآن نقاط التوزيع المقترحة حسب الاحتياج والوصول المتوقعين. تستبعد قائمتها الأولى بلدة محاصرة بالكامل — لا تكاد توجد لدى النموذج بيانات عنها، فيقيّم احتياجها «غير مؤكد/منخفض». يعيش هناك عشرة آلاف شخص.","options":[{"id":"fo-4a","label":"اتباع الخوارزمية","detail":"الوثوق بكفاءة النموذج. لا بيانات، لا توزيع.","consequence":"تعمل التوزيعات بكفاءة مبهرة — في كل مكان إلا البلدة الأشد احتياجاً. بحلول وصول رسالة مهربة إلى مكتبك، يكون الاستبعاد قد دام ستة أسابيع. لم يخطئ النموذج بشأن بياناته. أخطأ بشأن العالم.","reflection":"«لا بيانات» لا تعني «لا احتياج» — بل تعني في النزاع غالباً العكس. يفشل اتخاذ القرار الآلي بأقسى ما يكون حيث الناس أكثر انقطاعاً، وهناك بالضبط حيث يهم عدم التحيز أكثر.","impacts":{"impartiality":-2,"humanity":-1,"doNoHarm":-1}},{"id":"fo-4b","label":"تجاوز بشري موثق","detail":"يعدّل المخططون القائمة ويكتبون السبب. السجل قابل للتدقيق.","consequence":"تُعاد البلدة إلى القائمة استناداً إلى بيانات ما قبل النزاع وتقارير مجتمعية. يبدو توثيق التجاوز بيروقراطياً — حتى مراجعة ما بعد العملية، حين يصبح ذلك السجل وسيلتك للدفاع عن القرار وتحسين تعامل النموذج مع فجوات البيانات.","reflection":"السيطرة البشرية الفعلية تعني أن يستطيع شخص تجاوز الآلة، رسمياً، بأسباب مكتوبة. تعيش المساءلة في تلك الجملة المكتوبة: من قرر، ولماذا.","impacts":{"impartiality":1,"doNoHarm":1}},{"id":"fo-4c","label":"توقيع مزدوج: محلل ومندوب ميداني","detail":"لا تصبح أي توصية آلية قراراً دون توقيعين بشريين. أبطأ عن قصد.","consequence":"تستغرق كل خطة توزيع يوماً إضافياً. في المقابل، تُلتقط فخاخ فجوات البيانات كالبلدة المحاصرة بنيوياً لا بالصدفة — فوظيفة المندوب الميداني هي بالضبط أن يسأل ما الذي لا يستطيع النموذج رؤيته.","reflection":"في البيئات عالية المخاطر، التكرار في الحكم البشري ضمانة لا قصور. دعوة قرار تكنولوجيا المعلومات والاتصالات إلى تجنب الضرر والتخفيف منه تدافع بالضبط عن هذا الاحتكاك المتعمد.","impacts":{"doNoHarm":2,"impartiality":1,"humanity":-1}}]}],"debrief":"تُظهر عيون على خط الجبهة الذكاء الاصطناعي في أعلى مخاطره. النموذج نفسه الذي يسرّع تقييم الاحتياجات قد يعميك عن المعاناة غير المرئية؛ واللوحة نفسها التي تنسّق المساعدة قد تجعلها هدفاً؛ والخوارزمية نفسها التي تحسّن التوزيعات قد تمحو بلدة محاصرة لغياب البيانات. الحياد والاستقلال وعدم إلحاق الضرر ليست قيوداً على التقنية — إنها متطلبات التصميم."},{"id":"cloud-question","title":"مسألة السحابة","tagline":"حياد المزوّدين وسيادة البيانات في منطقة البحر الكاريبي","role":"مسؤول التحول الرقمي، الجمعية الوطنية في الكاريبي","context":"تخدم جمعيتك الوطنية دولاً جزرية حيث الأعاصير مسألة «متى» لا «هل». أنت تُرقمن كل شيء دفعة واحدة: سجل المستفيدين، وأداة تقييم أضرار مدعومة بالذكاء الاصطناعي، ومنصة تبرعات. ثلاثة أبواب مختلفة جداً مفتوحة: عملاق سحابة عالمي يعرض أرصدة مجانية، وحكومة تعرض سحابتها الوطنية، واتحاد إقليمي يشغّل بنية تحتية مفتوحة. خلف كل باب إجابة مختلفة عن السؤال: على تقنية من تعمل حياة ناسك؟","topics":["اختيار مزوّد السحابة","حياد المزوّدين","سيادة البيانات","تقييم الأضرار"],"roles":["تكنولوجيا المعلومات والرقمنة","المشتريات","القيادة"],"steps":[{"id":"cq-1","title":"أين تعيش البيانات","narrative":"سيحمل سجل المستفيدين أسماء ومواقع وتفاصيل ضعف 80,000 أسرة. عرض مزوّد السحابة العملاق سخي: خمس سنوات من الأرصدة، وأمن من الطراز الأول، ومراكز بيانات في الخارج. السحابة الوطنية الحكومية تُبقي البيانات داخل البلاد — وتحت القانون الوطني. خوادم الاتحاد التي تسيطر عليها الحركة أغلى وتصل أبطأ.","options":[{"id":"cq-1a","label":"قبول أرصدة المزوّد العملاق المجانية","detail":"سريع وآمن ومجاني لخمس سنوات. تبقى البيانات في ولاية قضائية أجنبية وفق شروط المزوّد.","consequence":"تُطلق في وقت قياسي وتعمل المنصة بروعة. في السنة الثالثة، تنتهي الأرصدة، وتُعاد تسعيرة الأسعار، ويتضح أن ترحيل سجلات 80,000 أسرة خارج الصيغ الاحتكارية مشروع لم يضعه أحد في الميزانية.","reflection":"سيادة البيانات تُقرر في اليوم الأول لا عند التجديد. الأرصدة المجانية قرار شراء يصل ثمنه لاحقاً — وتكاليف الخروج جزء من سعر أي سحابة.","impacts":{"humanity":1,"independence":-2}},{"id":"cq-1b","label":"استخدام السحابة الوطنية الحكومية","detail":"تبقى البيانات داخل البلاد والوزارة مسرورة. يأتي وصول الدولة مع الإقليم.","consequence":"الاستضافة رخيصة وسلسة سياسياً. ثم يُطلب السجل قضائياً في قضية إنفاذ هجرة، وتكتشف أن «داخل البلاد» تعني أيضاً «في المتناول». ثقة المجتمع بالسجل — التي بُنيت عبر سنوات — تتزعزع بين عشية وضحاها.","reflection":"السيادة على الورق ليست استقلالاً في الممارسة. يجب حماية السجل الإنساني من أي سلطة قد تستخدمه لأغراض غير إنسانية — هذا ما يحميه الاستقلال.","impacts":{"independence":-2,"doNoHarm":-2}},{"id":"cq-1c","label":"البناء على بنية تحتية تسيطر عليها الحركة","detail":"الحزمة المفتوحة للاتحاد الإقليمي. أغلى وأبطأ ولك بالكامل.","consequence":"يستغرق الإطلاق أربعة أشهر إضافية ويلتهم ثلث ميزانية الرقمنة. لكن كل سجل يبقى تحت مفاتيحك، بصيغ مفتوحة، ومع نسخة احتياطية مختبرة في بلد ثانٍ. عندما يقرع المزوّدون والوزارات الباب لاحقاً، تكون الإجابة مبنية سلفاً.","reflection":"السيطرة على البنية التحتية هي الأساس الذي تقوم عليه كل ضمانة أخرى. تكلّف مالاً ووقتاً مقدماً — والتزام الشراء الأخلاقي في قرار تكنولوجيا المعلومات والاتصالات يشمل الاستعداد لدفع هذا الثمن.","impacts":{"independence":2,"doNoHarm":1,"humanity":-1}}]},{"id":"cq-2","title":"عملاء المزوّد الآخرون","narrative":"تعمل أداة تقييم الأضرار بالذكاء الاصطناعي على نماذج مزوّد تجاري واحد. تكشف صحيفة إقليمية أن المزوّد نفسه يورد تحليلات لطرف في نزاع مسلح على بُعد حدودين. يتصل صحفي: هل تُقوّض شراكة جمعيتك الوطنية مع هذا المزوّد حيادها؟","options":[{"id":"cq-2a","label":"عدم قول شيء؛ العقد نظيف","detail":"بياناتك منفصلة واستخدامك إنساني. تجاوز دورة الأخبار.","consequence":"تخفت القصة في أسبوع — لكن ليس في كل مكان. يتوقف قادة مجتمع في منطقة ما عن مشاركة صور الأضرار، وتوقف منظمة شريكة مشاركة البيانات معك بهدوء، متذرعة بـ«التعرض السمعي». فعل التصور الضرر الذي لم تفعله الحقائق أبداً.","reflection":"يُحكَم على الحياد بالتصور بقدر ما يُحكَم عليه بالوقائع. حياد المزوّدين — تقنية من يُراك معتمداً عليها — أصبح الآن جزءاً من كيفية قراءة الأطراف والمجتمعات لعدم تحيزك.","impacts":{"neutrality":-2,"independence":-1}},{"id":"cq-2b","label":"تنويع المزوّدين ونشر العناية الواجبة","detail":"إضافة مزوّد ثانٍ للأعباء الحرجة، واعتماد سياسة علنية لفحص المزوّدين، والإعلان عن ذلك.","consequence":"الترحيل عمل حقيقي والإعداد المزدوج أغلى. لكن السياسة العلنية تجيب عن سؤال الصحفي أفضل من أي بيان صحفي: تستطيع أن تُري بالضبط كيف يُفحص المزوّدون، ولا تستطيع سمعة أي شركة أن تسقط سمعتك معها.","reflection":"حياد المزوّدين يُصنع ولا يُعلَن: تجنب الاعتماد على مزوّد واحد للأنظمة الحرجة، وافحص الموردين مقابل المبادئ الإنسانية، وكن قادراً على إظهار عملك.","impacts":{"neutrality":1,"independence":1,"doNoHarm":1}},{"id":"cq-2c","label":"إنهاء التعاقد مع المزوّد فوراً","detail":"قطيعة نظيفة تُعلن علناً. تتوقف الخدمات أثناء إعادة البناء.","consequence":"يشيد المعلقون بالإعلان. لكن أداة تقييم الأضرار تتوقف تسعة أسابيع — تشمل بداية موسم الأعاصير — وتخرج استجابة ما بعد العاصفة باستهداف أبطأ وأفقر نتيجة لذلك.","reflection":"للخروج المبدئي ضحايا أيضاً. قطع اعتمادية لم تخطط يوماً للإفلات منها فجأة ينقل الكلفة إلى المتضررين — استراتيجية الخروج إجراء لعدم إلحاق الضرر، لا ترف.","impacts":{"neutrality":2,"humanity":-2,"doNoHarm":-1}}]},{"id":"cq-3","title":"تقييم الأضرار قبل موسم الأعاصير","narrative":"أداة تقييم الأضرار بالذكاء الاصطناعي جاهزة قبل ستة أسابيع من ذروة الموسم. يحذرك منسقو المجتمع: تدرب النموذج في الغالب على مساكن رسمية، وقد تُقيَّم المستوطنات غير الرسمية — حيث يعيش الأكثر ضعفاً — بأقل من قيمتها بشكل منهجي. تقييم أضرار تشاركي كامل يستغرق ستة أسابيع. الموسم لن ينتظر.","options":[{"id":"cq-3a","label":"الإطلاق الآن والتقييم لاحقاً","detail":"الموسم لن ينتظر. نفّذ تقييم الأضرار بعد العواصف الأولى.","consequence":"تعمل الأداة جيداً في الأحياء الرسمية وسيئاً في غير الرسمية — كما حُذّر تماماً. تتدفق مساعدات ما بعد العاصفة نحو الضرر الذي استطاع النموذج رؤيته. يوثق التقييم البأثر رجعي، بالتفصيل، من فاتهم.","reflection":"تقييم أضرار يُكتب بعد وقوع الضرر هو تشريح لجثة. عدم إلحاق الضرر يعني تقييم المخاطر المتوقعة على المجتمعات المتضررة قبل النشر — خاصة المخاطر على أقل من تمثله البيانات.","impacts":{"humanity":1,"doNoHarm":-2,"impartiality":-1}},{"id":"cq-3b","label":"إجراء التقييم التشاركي الكامل أولاً","detail":"يساعد ممثلو المجتمع في اختبار الأداة وتحديد الأضرار ووضع التخفيفات. يفوت افتتاح الموسم.","consequence":"تُدار العاصفة الأولى بالأساليب القديمة — أبطأ، لكن ليس أسوأ من العام الماضي. يجد التقييم فجوة المستوطنات غير الرسمية إضافة إلى ضررين لم يتوقعهما أحد، وتصبح التخفيفات المصممة مجتمعياً جزءاً من دليل تشغيل الأداة.","reflection":"التزام المشاركة المجتمعية في قرار تكنولوجيا المعلومات والاتصالات ينطبق على المخاطر لا على الملاحظات فحسب: المعرضون لإخفاقات أداة ما هم الخبراء فيما ستعنيه تلك الإخفاقات.","impacts":{"doNoHarm":2,"impartiality":1,"humanity":-1}},{"id":"cq-3c","label":"إطلاق محدود مع مفتاح إيقاف","detail":"النشر في منطقتين تجريبيتين فقط، مع قنوات ملاحظات مجتمعية، وتحقق بشري من الدرجات منخفضة الثقة، وعتبة إيقاف متفق عليها مسبقاً.","consequence":"تكشف التجربتان فجوة المستوطنات خلال أيام، ويلتقط المحققون البشر معظم الدرجات الخاطئة، وعندما تتجاوز معدلات الخطأ عتبتك في منطقة ما، تُعلَّق الأداة هناك دون ضجة. تتحسن الأداة عاصفةً بعد عاصفة.","reflection":"عندما يحمل التأخير نفسه مخاطر، يكون الإطلاق المحدود مع المراقبة والسند البشري ومفتاح إيقاف مُتدرب عليه استراتيجية مشروعة للتخفيف — بشرط أن تكون الحدود حقيقية وأن يكون أحدهم مخولاً بسحب المفتاح.","impacts":{"doNoHarm":1,"humanity":1}}]},{"id":"cq-4","title":"التجديد","narrative":"بعد ثلاث سنوات، تعمل حزمتك التقنية — وهي منسوجة بعمق في خدمات مزوّد واحد الاحتكارية. يتضمن عرض التجديد خصماً مقابل تكامل أعمق. يطلب مجلس إدارتك توصية.","options":[{"id":"cq-4a","label":"تعميق التكامل مقابل الخصم","detail":"أفضل سعر وأفضل ميزات وجهة واحدة للمساءلة. يصبح القيد كاملاً.","consequence":"تبدو الميزانيات رائعة هذا العام. بعد سنتين يُستحوذ على المزوّد، وتتغير الأولويات، ويعود تقدير الترحيل «البسيط» بثمانية عشر شهراً ورقم يرفض المجلس قراءته بصوت عالٍ.","reflection":"الاعتمادية تتراكم بصمت. كل خطاف احتكاري فاتورة مستقبلية — مالية أو تشغيلية أو مبدئية. يُصان الاستقلال بقرارات شراء تُتخذ قبل سنوات من الأزمة التي تختبره.","impacts":{"independence":-2,"doNoHarm":-1}},{"id":"cq-4b","label":"التجديد ببنود قابلية نقل وخطة خروج مختبرة","detail":"صيغ بيانات مفتوحة، وتدريبات تصدير منتظمة، وتكوينات مودعة لدى طرف ثالث، وبروفة خروج كل سنة.","consequence":"يتذمر المزوّد ثم يوقّع — خطة خروجك هي ما يُبقي أسعاره صادقة. تفشل بروفة التصدير الأولى فشلاً محرجاً؛ وبحلول الثالثة، يستطيع فريقك إقامة السجل في مكان آخر خلال تسعة أيام.","reflection":"خطة خروج لم تختبرها قط هي فرضية. قابلية النقل المُتدرب عليها تحوّل الاعتمادية إلى علاقة تختار استمرارها — وهذا هو شكل الاستقلال عملياً.","impacts":{"independence":2,"doNoHarm":1}},{"id":"cq-4c","label":"إعادة الجوهر إلى الداخل واستئجار قدرة الذروة فقط","detail":"ينتقل السجل والنماذج إلى الداخل؛ يحتفظ المزوّد فقط بالحوسبة المرنة لذروات ما بعد الكوارث.","consequence":"تكلّف المرحلة الانتقالية سنة صعبة وتتدهور بعض الميزات. بعدها، لا تخضع أنظمتك الحرجة لخارطة طريق أي مزوّد، وذروات ما بعد الأعاصير ما تزال تتسع — على بنية تحتية تستطيع الابتعاد عنها.","reflection":"يمكن للبنى الهجينة أن توازن بين السيادة والاتساع. سؤال التصميم دائماً: أي الوظائف قد نخسرها غداً بفقدان مزوّد — وكم ستكلف تلك الخسارة المتضررين؟","impacts":{"independence":1,"doNoHarm":1,"humanity":-1}}]}],"debrief":"مسألة السحابة تدور حول البنية التحتية الكامنة تحت كل قرار ذكاء اصطناعي آخر. مكان وجود البيانات يقرر من يستطيع بلوغها (سيادة البيانات)؛ ونماذج من تعتمد عليها تشكل كيفية قراءة الأطراف والمجتمعات لحيادك (حياد المزوّدين)؛ وقدرتك على الخروج تقرر إن كانت خياراتك لك حقاً (الاستقلال). تقييم الأضرار مكانه قبل النشر — والمجتمعات الأكثر تعرضاً لإخفاقات الأداة مكانها في قلب ذلك التقييم."},{"id":"edge-network","title":"على حافة الشبكة","tagline":"أدوات ذكاء اصطناعي حيث الاتصال والكهرباء شحيحان في شرق أفريقيا","role":"مسؤول تكنولوجيا المعلومات والابتكار، الاستجابة الإقليمية في شرق أفريقيا","context":"يمتد الجفاف والنزوح عبر منطقة حدودية نائية. تحتاج الفرق الميدانية والمتطوعون المجتمعيون إلى الترجمة وملخصات الحالات وإرشادات الإحالة — لكن الاتصال متقطع، والكهرباء تأتي من مولدات وبعض الألواح الشمسية، وأقرب مركز بيانات كبير في قارة أخرى. عليك أن تقرر أي نوع من الذكاء الاصطناعي، إن وُجد، ينتمي إلى هنا.","topics":["ذكاء اصطناعي منخفض الاتصال","البصمة البيئية","نماذج لغوية صغيرة"],"roles":["تكنولوجيا المعلومات والابتكار","العمليات الميدانية","المشاركة المجتمعية"],"steps":[{"id":"en-1","title":"نموذج كبير أم صغير أم لا شيء؟","narrative":"يعرض عرض تقديمي للمزوّد مساعد ذكاء اصطناعي سحابياً يجيب عن أسئلة الميدان ببراعة — عبر اتصال لا تملكه مواقعك الميدانية. البديل نموذج لغوي صغير يعمل دون اتصال على أجهزة لوحية تشحن بالطاقة الشمسية: أقل طلاقة، لكنه متاح دائماً. صوت ثالث في الغرفة يقول إن الإجابة الصادقة قد تكون عدم استخدام الذكاء الاصطناعي أصلاً.","options":[{"id":"en-1a","label":"نشر مساعد الذكاء الاصطناعي السحابي","detail":"أفضل الإجابات وأغنى دعم للغات — حيث توجد إشارة. كل استعلام يركب مراكز بيانات بعيدة متعطشة للطاقة.","consequence":"في المركز الإقليمي، يعشقه الموظفون. في المواقع الميدانية — حيث الأسئلة — يعرض غالباً عجلة تحميل تدور. تعلم لاحقاً أن كل ألف استعلام حملت أيضاً فاتورة خفية: كهرباء مراكز البيانات ومياه التبريد، في منطقة تعدّ كليهما بالجراكن.","reflection":"القدرة التي لا تعمل إلا حيث البنية التحتية موجودة أصلاً توسّع الفجوة بين المتصلين والمعزولين. لكل استعلام ذكاء اصطناعي كلفة طاقة ومياه؛ في بيئات الشح تلك الكلفة جزء من الحساب الإنساني، لا حاشية سفلية.","impacts":{"humanity":1,"doNoHarm":-1,"impartiality":-1}},{"id":"en-1b","label":"تشغيل نموذج صغير على أجهزة لوحية شمسية","detail":"نموذج مدمج يُنزَّل مرة واحدة ويعمل دون اتصال بالكامل. إجابات أبسط وأضيق — لكنها متاحة في كل مكان.","consequence":"يستغرق الإعداد أسبوعين من الضبط الدقيق على أدلتك الميدانية الفعلية. يتعثر النموذج الصغير في الأسئلة النادرة لكنه يعالج اليومية — الترجمة وخطوات الإحالة والنماذج — في كل موقع، في الظلام، أثناء الانقطاعات. استهلاكه الأسبوعي الكامل للطاقة يسعه لوح شمسي واحد.","reflection":"النماذج اللغوية الصغيرة تبادل الصقل بالسيادة: تعمل حيث الناس فعلاً، بجزء يسير من طاقة النموذج الكبير ومياهه، ودون أن تغادر البيانات الجهاز. الملاءمة للغرض تتفوق على أحدث التقنيات.","impacts":{"doNoHarm":1,"independence":1,"impartiality":1}},{"id":"en-1c","label":"لا ذكاء اصطناعي — تقوية الإذاعة والورق","detail":"الاستثمار في الأدلة الميدانية وجدول الإذاعة وشبكة الإحالة البشرية بدلاً من ذلك.","consequence":"موثوق ومحل ثقة وببصمة جديدة صفرية — لكن تراكمات الترجمة تتزايد، وملاحظات الحالات تتكدس دون معالجة، ومتطوعو النوبات الليلية يواصلون الارتجال في إجابات كان نموذج صغير مدرب سيتولاها.","reflection":"رفض الذكاء الاصطناعي خيار مشروع بكلف حقيقية. السؤال ليس «الذكاء الاصطناعي أم المبادئ» بل أي أداة، بحجم يناسب المكان، تخدم الناس أفضل — ومن قرر، وبأي دليل.","impacts":{"humanity":-1,"doNoHarm":1}}]},{"id":"en-2","title":"إبقاؤه حياً","narrative":"أيّما ما يعمل هنا يجب أن ينجو من البنية التحتية. يعرض المزوّد خدمة مُدارة: مزامنة فضائية ليلية، وتحديثات تلقائية، ومراقبة عن بُعد — مقابل رسوم وتدفق بيانات إليه. يقترح منسقك الميداني بديلاً تديره المجتمعات: مراكز شحن شمسية، وشبكة محلية بين المواقع، وبيانات تُزامَن عندما تبلغ الفرق نقطة اتصال.","options":[{"id":"en-2a","label":"اعتماد الخدمة الفضائية المُدارة","detail":"تحديثات ومراقبة بلا جهد. رذاذ دائم من بيانات الاستخدام يتدفق إلى المزوّد، والرسوم الشهرية لا تنتهي أبداً.","consequence":"يبقى كل شيء محدثاً دون أي جهد من الموظفين. بعد ستة أشهر، تقطع مراجعة للميزانية الاشتراك، وتتدهور الأجهزة اللوحية برشاقة لتصبح أوزان ورق غالية — لم يتعلم أحد محلياً صيانتها قط.","reflection":"الراحة التي لا تنجو من بند في الميزانية هشاشة متنكرة. الاعتمادية لا تخص البيانات فحسب؛ بل من يملك المهارات عندما ينتهي العقد.","impacts":{"independence":-2,"doNoHarm":-1}},{"id":"en-2b","label":"مراكز شمسية مجتمعية ومزامنة محلية","detail":"نقاط شحن في المراكز المجتمعية، وشبكة بين المواقع، وتحديثات تحملها الفرق أثناء تنقلها. أبطأ، محلية، ومملوكة.","consequence":"تصل التحديثات بعد أيام لا ثوانٍ من إصدارها. لكن المراكز تصبح بنية تحتية مجتمعية — تُشحن فيها الهواتف أيضاً — والفنيون الذين يُبقون النظام حياً جيرانُ من يخدمهم.","reflection":"البنية التحتية التي تملكها المجتمعات تميل للبقاء بعد المشاريع. إدماج الطاقة والاتصال والصيانة المحلية في التصميم هو تفكير عدم إلحاق الضرر مطبقاً على المدى الطويل.","impacts":{"independence":1,"doNoHarm":2,"humanity":-1}},{"id":"en-2c","label":"هجين: سحابة المزوّد في المركز، ودون اتصال على الأطراف","detail":"المعالجة الثقيلة والتحديثات تتم في المركز المتصل؛ المواقع الميدانية تبقى بأولوية عدم الاتصال.","consequence":"حل وسط قابل للعمل: يحصل المركز على خط المزوّد، ويحتفظ الميدان باستقلاله. لكنه يتطلب بنية منضبطة — مرتين تكتشف ميزات جديدة تفترض الاتصال بصمت، فتعيدها.","reflection":"التصاميم الهجينة يمكن أن توازن الوصول والمرونة، لكن فقط إذا كانت «أولوية عدم الاتصال» قاعدة على المزوّدين طاعتها، لا تفضيلاً يمكنهم تآكله إصداراً بعد إصدار.","impacts":{"independence":1,"doNoHarm":1}}]},{"id":"en-3","title":"سؤال البصمة","narrative":"في اجتماع مجتمعي، ترفع متطوعة شابة هاتفاً يعرض خبراً: مراكز البيانات التي تدرب نماذج الذكاء الاصطناعي الكبيرة تستهلك كهرباء هائلة وملايين اللترات من مياه التبريد — أحياناً في مناطق جفاف كمنطقتك. تسأل: «كم شرب ذكاؤكم الاصطناعي من الماء اليوم؟»","options":[{"id":"en-3a","label":"التعامل معها كسؤال علاقات عامة","detail":"طمأنة الحاضرين بأن المزوّد «ملتزم بالاستدامة» والمضي قدماً.","consequence":"يمضي الاجتماع؛ أما السؤال فلا. يتفوق فيديو المتطوعة عن «الذكاء الاصطناعي العطشان لدى المنظمة» على آخر عشر منشورات لك، ولا يملك الفريق أرقاماً حقيقية للرد.","reflection":"تسأل المجتمعات بشكل متزايد عن الكلفة البيئية للأدوات المستخدمة عليها. «المزوّد يقول إنه بخير» ليست مساءلة — إنه سؤال بلا إجابة وضعت عليه شعاراً.","impacts":{"doNoHarm":-2,"independence":-1}},{"id":"en-3b","label":"القياس والإفصاح ووضع ميزانية","detail":"تتبع الاستعلامات وأحجام النماذج وتقديرات الطاقة والمياه؛ ونشر الأرقام؛ ووضع ميزانية كفاءة لكل إجابة.","consequence":"التقدير الصادق الأول غير مريح — استعلامات السحابة تُضخِّم كل شيء آخر بالمقارنة. تنشره رغم ذلك، وتضع سقفاً، وتنضم المتطوعة الشابة إلى مجموعة المراجعة التي تدقق الأرقام فصلياً.","reflection":"لا يمكنك إدارة بصمة ترفض قياسها. نشر الكلفة الحقيقية — الطاقة والمياه والاستخراج خلف الأجهزة — يحوّل سؤالاً محرجاً إلى ممارسة مساءلة تستطيع المجتمعات التحقق منها.","impacts":{"doNoHarm":2}},{"id":"en-3c","label":"جعل النموذج الصغير هو الافتراضي","detail":"النموذج الصغير غير المتصل افتراضي في كل مكان؛ النموذج السحابي الكبير محجوز للحالات النادرة المعقدة مع مراجعة بشرية.","consequence":"تهبط استعلامات السحابة 90%. بعض الإجابات الدقيقة تصبح أبطأ، لأن إنساناً يراجعها أولاً — ويتضح أن هذا يحسّنها. سؤال البصمة في الاجتماع التالي له إجابة ملموسة.","reflection":"التقشف مبدأ تصميم: أخف أداة تنجز العمل هي عادة الأكثر إنسانية في التشغيل. تحجيم النماذج بصواب هو تخفيف ضرر للناس والكوكب معاً.","impacts":{"doNoHarm":2,"independence":1}}]},{"id":"en-4","title":"من يبقيه يعمل؟","narrative":"بعد ثمانية عشر شهراً، يعمل النظام. تنتهي المنحة التي دفعت ثمنه الربع القادم. ما يحدث تالياً يقرر إن كان هذا مشروعاً أم قدرة.","options":[{"id":"en-4a","label":"تجديد عقد صيانة المزوّد","detail":"الأبسط على الورق: يواصل المزوّد الترقيع واستضافة خط التحديثات وحيازة المعرفة.","consequence":"يُوقَّع التجديد في أسبوع. تبقى المعرفة حيث كانت دائماً — في الخارج. عندما يوقف المزوّد خط الإنتاج بعد سنتين، تكون وثيقة التسليم كتيب مبيعات لخليفته.","reflection":"النظام الذي لا يفهمه إلا مزوّده مستأجَر لا مملوك. عقود الصيانة جيدة؛ الاعتماد عليها في كل المعرفة ليس كذلك.","impacts":{"independence":-2,"doNoHarm":-1}},{"id":"en-4b","label":"تدريب فنيين محليين لامتلاكه","detail":"تمويل سنة من التدريب كي يتمكن الموظفون الإقليميون والفنيون المجتمعيون من صيانة النماذج وتحديثها وتكييفها بأنفسهم.","consequence":"أبطأ في البداية، ويستقطب اثنان من المتدربين من شركة اتصالات — خسارة هي أيضاً قصة نجاح. من يبقون يُبقون النظام حياً عبر فجوة التمويل التالية دون أن يفوتوا أسبوعاً.","reflection":"القدرة التقنية المحلية هي أكثر بنية تحتية يمكنك بناؤها ديمومة. المهارات التي تبقى في المنطقة تواصل خدمتها طويلاً بعد نسيان رمز مشروعك.","impacts":{"independence":2,"doNoHarm":1,"humanity":1}},{"id":"en-4c","label":"تسليمه إلى المجمع الإقليمي للحركة","detail":"تنضم الجمعية الوطنية إلى خدمة إقليمية مشتركة تصون نماذج وأدوات مشتركة لجمعيات عديدة.","consequence":"تخسر بعض التكييف المحلي، وتكسب كلفة وخبرة مشتركتين. النموذج الصغير الذي ضبطه فريقك للغات المحلية يصبح أكثر أصول المجمع استخداماً — استثمارك يتسع إلى ما وراء حدودك.","reflection":"بنية الحركة التحتية المشتركة توزع الكلفة والسيادة معاً. ما تبنيه جمعية واحدة يمكنه، بصيغ مفتوحة وصيانة مجمعة، أن يحمي جمعيات كثيرة.","impacts":{"independence":1,"doNoHarm":1}}]}],"debrief":"على حافة الشبكة يدور حول تحجيم التقنية بما يناسب المكان الذي تخدمه. النماذج الصغيرة وتصميم أولوية عدم الاتصال والطاقة المحلية والمهارات المحلية ليست تنازلات — في بيئات الاتصال المنخفض هي الخيار المرن. وكل استعلام ذكاء اصطناعي يحمل كلفة بيئية من طاقة ومياه واستخراج؛ قياسها والإفصاح عنها وتقليلها جزء من عدم إلحاق الضرر، لا أجندة منفصلة."},{"id":"signals-noise","title":"إشارات وسط الضجيج","tagline":"رصد اجتماعي بالذكاء الاصطناعي أثناء استجابة لإعصار في جنوب شرق آسيا","role":"مستشار المشاركة المجتمعية والمساءلة، الاستجابة للإعصار","context":"ضرب إعصار من الفئة الرابعة أرخبيلاً من الجزر. تنتقل الشائعات أسرع من مياه الفيضان: عن المساعدات، وعن الإخلاءات، وعن الملوم. تعرض منصة رصد اجتماعي ذكاءً اصطناعياً يمسح المنشورات العامة بأربع لغات محلية ويبلغ عن المعلومات المضللة شبه فورياً. فرقك تغرق في بلاغات غير موثقة — لكن الإصغاء على نطاق واسع يعني مراقبة المجتمعات على نطاق واسع.","topics":["الرصد الاجتماعي","المعلومات المضللة","الخصوصية والثقة"],"roles":["المشاركة المجتمعية","الاتصالات","الحماية"],"steps":[{"id":"sn-1","title":"أن تصغي، وكيف","narrative":"تستطيع المنصة استيعاب المنشورات العامة من الشبكات الاجتماعية الرئيسية وتصنيفها ودفع التنبيهات. يطرح مستشار الحماية السؤال المحرج أولاً: ماذا يحدث للمنشورات — وللأشخاص الذين كتبوها — بعد الأزمة؟","options":[{"id":"sn-1a","label":"مسح كامل مع تنبيهات","detail":"استيعاب المنشورات العامة وتصنيفها والتنبيه. أقصى وعي بالموقف، وأقصى جمع.","consequence":"خريطة الشائعات مفيدة فعلاً — تلتقط أمر إخلاء زائفاً خلال ساعة. لكن المنصة تحتفظ ببيانات على مستوى المنشور «لتحسين النموذج»، وتدرك أنك بنيت موقع تنصت بلا مفتاح إيقاف ولا بند انتهاء.","reflection":"العام لا يعني الخالي من العواقب: ينشر الناس في الأزمات دون أن يتخيلوا مراقبة إنسانية — أو أي مراقبة. الجمع الذي يعيش أطول من غرضه هو فشل في حماية البيانات يرتدي لوحة مؤشرات نافعة.","impacts":{"humanity":1,"doNoHarm":-2}},{"id":"sn-1b","label":"اتجاهات مجمعة فقط","detail":"لا تخزين على مستوى المنشور: يحصي النظام المواضيع والذروات، ويحذف التدفق الخام يومياً.","consequence":"تفقد بعض التفاصيل الجنائية — لا تستطيع دائماً تتبع شائعة إلى مصدرها — لكنك تحتفظ بالإنذار المبكر. عندما تطلب وزارة لاحقاً «البيانات الخام»، تكون الإجابة الصادقة أنها لم تعد موجودة.","reflection":"التجميع هو نسخة الرصد الاجتماعي من تقليل البيانات: تحتفظ بالإشارة وتستبعد الأشخاص. التصميم من أجل الحذف هو التصميم من أجل الثقة.","impacts":{"doNoHarm":2,"humanity":-1}},{"id":"sn-1c","label":"القنوات المجتمعية فقط","detail":"الاستغناء عن الرصد الاجتماعي؛ والاعتماد على خطوط الملاحظات والمتطوعين المجتمعيين وشبكات الشركاء.","consequence":"موثوق وبشري وأبطأ. تنتشر شائعة مسمومة عن مياه ملوثة يومين قبل أن ترصدها شبكتك — يومان شربت فيهما بعض الأسر مياهاً غير آمنة بدل المخاطرة بنقاط التوزيع «المسمومة».","reflection":"رفض الإصغاء خيار له عواقب أيضاً. السؤال ليس إن كنت ستسمع المجتمعات، بل كيف تسمعها دون تحويل الإصغاء إلى مراقبة.","impacts":{"humanity":-2,"doNoHarm":1}}]},{"id":"sn-2","title":"التصرف إزاء شائعة","narrative":"يبلغ النظام عن ادعاء سريع الانتشار بأن جمعيتك الوطنية تحوّل المساعدات إلى مجموعة سياسية. الادعاء زائف. لكن التفنيد العلني سيسمي الادعاء والمجموعة والتهمة — في منطقة مستقطبة يُطعن فيها بحيادك أسبوعياً أصلاً.","options":[{"id":"sn-2a","label":"نشر دحض علني مباشر","detail":"سمِّ الشائعة، واذكر الحقائق، وانشر في كل مكان. سريع وشفاف.","consequence":"تصل الحقائق — ويصل الإطار معها. لدورتي أخبار، يُلحم اسمك بتهمة سياسية لم تصنعها. يبلغ فرع محلي عن تهديدات؛ ويبلغ آخر عن تبرعات قياسية. خُدمت الحقيقة؛ وتصل فاتورة الحياد لاحقاً.","reflection":"تضخيم الزيف لنفيه قد ينشر الإطار أبعد من الكذبة. يُختبر الحياد ليس فقط بما تقول، بل بما تختار أن تكرر.","impacts":{"neutrality":-2,"humanity":1}},{"id":"sn-2b","label":"التصحيح عبر أصوات مجتمعية موثوقة","detail":"إطلاع قادة المجتمع ومذيعي الإذاعة وشبكات المتطوعين على الحقائق؛ وترك الأصوات المحلية الموثوقة تحمل التصحيح.","consequence":"يتحرك التصحيح أبطأ من الشائعة يوماً، ثم يتجاوزها. ولأن النفي يأتي من أصوات يثق بها الناس أصلاً، يرسخ دون أن يلحم اسمك بالتهمة.","reflection":"المشاركة المجتمعية استراتيجية حياد أيضاً. تسير التصحيحات على الثقة، والثقة محلية — الناقل غالباً هو الرسالة.","impacts":{"neutrality":1,"doNoHarm":1}},{"id":"sn-2c","label":"المراقبة دون رد","detail":"تغذية الشائعة بالانتباه قد تكون أسوأ؛ راقب وانتظر.","consequence":"تبلغ الشائعة ذروتها وتخفت في بعض المناطق — وتتصلب في منطقة واحدة، حيث تُقاطع التوزيعات أسبوعاً. الانتظار جنّبك الإطار؛ وكلف أسر المقاطعة حصصها.","reflection":"الصمت قرار أيضاً. الحكم على متى تحتاج شائعة إلى رد حرفة: راقب الضرر لا الحجم فحسب، واتفق مسبقاً على عتبات للتحرك.","impacts":{"humanity":-1,"doNoHarm":-1}}]},{"id":"sn-3","title":"التزييف العميق","narrative":"تعلن مذكرة صوتية بلهجة محلية مثالية، يبدو أنها من مديرك، عن توزيع في موقع غير موجود. يتجمع المئات؛ ويغضب بعضهم؛ ويُدخل رجل مسن المستشفى بعد التدافع. ذكاؤك الاصطناعي، المدرب على النصوص والصور، لم يصغِ إلى الصوت إطلاقاً.","options":[{"id":"sn-3a","label":"إضافة مزوّد لكشف التزييف العميق","detail":"يستطيع مزوّد متخصص مسح الصوت والفيديو — إذا بثثت إليه محتوى المجتمع إلى سحابته.","consequence":"يتحسن الكشف، ويغادر تدفق بيانات آخر سيطرتك. بعد ثلاثة أشهر يصل إشعار خرق البيانات من المزوّد إلى بريدك؛ الصوت الذي وجهته إليهم تضمن بصمات صوتية لأشخاص لم يوافقوا على شيء قط.","reflection":"مطاردة كل تهديد جديد بمزوّد جديد تضاعف التعرض أسرع مما تضاعف الأمان. الصوت بيانات بيومترية؛ معاملته كتدفق آخر فحسب فشل في حماية البيانات.","impacts":{"doNoHarm":-2,"independence":-1}},{"id":"sn-3b","label":"بناء قنوات موثقة يستطيع الناس التحقق منها","detail":"تحمل كل الإعلانات الرسمية تحققاً بسيطاً: كلمة سر في الإذاعة، ورسالة قصيرة موقعة، وخطاً ساخناً للتأكيد. علّم النمط قبل الحاجة إليه.","consequence":"تنتشر المذكرة الصوتية المزيفة التالية ساعات ثم تتوقف: يسأل الناس عن كلمة السر. يصبح التحقق عادة مجتمعية لا منتج مزوّد — ويعمل حتى حين تتعطل أنظمتك.","reflection":"المرونة ضد الوسائط الاصطناعية اجتماعية في معظمها: عادات التحقق المتفق عليها مسبقاً تتفوق على سباقات تسلح الكشف، وهي تقوي الثقة المجتمعية بدل استهلاكها.","impacts":{"doNoHarm":2,"neutrality":1}},{"id":"sn-3c","label":"إيقاف كل رصد الذكاء الاصطناعي","detail":"إذا كان النظام عاجزاً عن التقاط أخطر تزييف، فالجهاز كله مشبوه.","consequence":"تفقد إنذار الشائعات المبكر الذي منع بهدوء حالتي ذعر. لا تتقاعد المعلومات المضللة حين تتقاعد أدواتك؛ أمر الإخلاء الزائف التالي يتداول دون رصد يوماً كاملاً.","reflection":"الأدوات تفشل؛ السؤال إن كان الفشل قد صُمم له. هجر نظام نافع لكونه غير كامل يترك الميدان للشائعات — قدرة متدرجة صادقة تتفوق على العدم.","impacts":{"humanity":-2,"doNoHarm":-1}}]},{"id":"sn-4","title":"عندما تمر العاصفة","narrative":"يبدأ التعافي. تتجدد رخصة تجربة منصة الرصد تلقائياً الشهر القادم. تعجب اللوحة القيادة. لم يجب أحد على سؤال مستشارة الحماية الأصلي: ماذا يحدث لكل هذا في زمن السلم؟","options":[{"id":"sn-4a","label":"إبقاؤها تعمل كإنذار مبكر","detail":"تصبح المراقبة بمستوى الأزمات «جاهزية» دائمة. اللوحة لا تنام أبداً.","consequence":"تتحسن الجاهزية على الورق. لكن نظاماً بُني لأسابيع الأعاصير يراقب الآن مواسم سياسية عادية، ويصبح وجوده قصة سنة انتخابات: المنظمة الإنسانية التي لم تتوقف عن الإصغاء قط.","reflection":"تميل صلاحيات الطوارئ إلى أن تصبح أثاثاً. قدرة إصغاء لا تنتهي أبداً ستُستخدم في النهاية لأغراض لم يتخيلها مستخدموها الأوائل — بما فيها الحياد.","impacts":{"neutrality":-2,"doNoHarm":-2}},{"id":"sn-4b","label":"إنهاؤها بإفصاح علني","detail":"أوقف الجمع، واحذف الأرشيف، وانشر ما جُمع ولماذا وما الذي تُعلم.","consequence":"الإفصاح العلني غير مريح للحظة — يعرف الناس حجم الإصغاء — ثم يصبح أصلاً من أصول الثقة: جمعيتك الوطنية هي التي قالت ما فعلت وتوقفت. يُؤرشف الدليل للتفعيل القادم.","reflection":"المساءلة تتضمن نهاية. أن تنشر ما جمعت ولماذا، ثم تتوقف بشكل قابل للتحقق، هو ما تعنيه ممارسة البيانات المسؤولة عندما ترحل الكاميرات.","impacts":{"doNoHarm":2,"neutrality":1}},{"id":"sn-4c","label":"تسليمها إلى الجمعية الوطنية تحت رقابة مجتمعية","detail":"تستمر الأداة تحت الجمعية الوطنية، بموجب ميثاق مع ممثلين مجتمعيين ومراجعة علنية سنوية.","consequence":"التسليم بيروقراطي وحقيقي: يسمي الميثاق ما يجوز مراقبته، وما لا يجوز أبداً، ومن يستطيع إطفاءه. المراجعة السنوية الأولى علنية، قليلة الحضور، وهذا هو المغزى بالضبط.","reflection":"الملكية المحلية برقابة مجتمعية يمكن أن تشرعن أداة مزدوجة الاستخدام: الفرق بين المراقبة والإصغاء هو من يحكمها، وباسم من، وبأي سلطة على إيقافها.","impacts":{"doNoHarm":1,"independence":1,"neutrality":1}}]}],"debrief":"إشارات وسط الضجيج تدور حول الإصغاء دون مراقبة. التجميع بدل الجمع، والرسل الموثوقون بدل الدحض الصاخب، وعادات التحقق بدل سباقات الكشف، والانتهاء بدل لوحة لا تنام أبداً — هكذا تسمع منظمة إنسانية الأزمة دون أن تصبح شيئاً ينبغي أن تخشاه المجتمعات."},{"id":"outbreak-signal","title":"إشارة التفشي","tagline":"الاستخبارات الوبائية والفرز بالذكاء الاصطناعي أثناء تفشي حمى عند معبر حدودي","role":"منسق الطوارئ الصحية، الاستجابة الإقليمية للتفشي","context":"تظهر بؤرة من حالات حمى شديدة قرب معبر حدودي مزدحم. تبلغ منصة استخبارات وبائية — تمسح تقارير العيادات ومبيعات الصيدليات والمنشورات العامة — عن «احتمال حمى نزفية، بثقة 72%». المختبرات على بُعد يومين، ويعبر المعبر آلاف المسافرين يومياً، وتدير جمعيتك الوطنية أقرب عيادتين. لكل ساعة تردد ثمن — ولكل إنذار كاذب ثمن أيضاً.","topics":["الاستخبارات الوبائية","البيانات الصحية","إيصال المخاطر"],"roles":["الصحة","علم الأوبئة","الصحة المجتمعية"],"steps":[{"id":"os-1","title":"إشارة الـ72 في المئة","narrative":"تريد المنصة منك التصعيد الآن. تشير عالمة الأوبئة لديك إلى أن النموذج تدرب غالباً على بيانات حضرية ولم يرَ قط موسم الملاريا في هذه المنطقة، الذي يحاكي الإشارة. تسأل السلطة الصحية الإقليمية عما تعرفه بحلول يوم الجمعة.","options":[{"id":"os-1a","label":"إعلان الإنذار فوراً","detail":"اعتبار الـ72% قابلة للتنفيذ. فعّل خطة الطوارئ، ونبّه الشركاء، وأطلع الإعلام قبل الشائعات.","consequence":"لمدة 48 ساعة تتحشد المنطقة — ثم تأتي المختبرات: ملاريا شديدة، لا حمى نزفية. الإلغاء صحيح تقنياً ومكلف اجتماعياً: في الربع التالي، عندما تبلغ المنصة عن بؤرة كوليرا حقيقية، يتردد مكتبان في المنطقة يوماً كاملاً قبل التحرك.","reflection":"في الاستجابة للتفشيات، تنفق الإنذارات الكاذبة الثقة التي تعتمد عليها الإنذارات الحقيقية. درجة ثقة الذكاء الاصطناعي مدخلٌ لقرار، لا القرار نفسه — عتبات التصعيد ملك لبشر خاضعين للمساءلة، معايرة بالوبائيات المحلية.","impacts":{"humanity":1,"doNoHarm":-2,"neutrality":-1}},{"id":"os-1b","label":"انتظار تأكيد المختبر","detail":"لا تحركات علنية حتى تؤكد المختبرات. جهّز الإمدادات بهدوء في أثناء ذلك.","consequence":"تؤكد المختبرات ملاريا شديدة — لا تفشي. يثبت تجهيزك الصامت فائدته على أي حال. لكن فريقك ينمذج السيناريو المضاد: لو كانت حمى نزفية، لكانت 48 ساعة من الصمت عند معبر حدودي كارثية.","reflection":"انتظار اليقين آمن فقط حين يكون المرض بطيئاً. الانضباط هو مطابقة العتبة مع المخاطر: ما ثمن الإنذار الكاذب، وما ثمن يومين ضائعين، ومن يدفع كليهما؟","impacts":{"humanity":-1,"doNoHarm":1}},{"id":"os-1c","label":"إرسال فريق تحقق خلال ساعات","detail":"فريق تقييم سريع إلى موقع البؤرة، يراجع الأطباء الأدلة الخام للإشارة، وتُجهَّز الإمدادات دون إنذار علني.","consequence":"يجد الفريق الحقيقة في تسع ساعات: ملاريا شديدة ضخّمها نفاد مخزون الأدوية — وإشارة المنصة، مقروءة بعيون بشرية، تحدد بصواب بؤرة ثانية غير مرتبطة تستحق المراقبة. لا تُصعّد أيّاً منهما؛ وتستعد لكليهما.","reflection":"أقوى استخبارات وبائية تقرن يقظة الآلة بالتحقق البشري السريع. يراقب الذكاء الاصطناعي كل شيء كي يفحص الناس ما يهم — تقسيم العمل هذا هو التصميم، لا حلاً مؤقتاً.","impacts":{"humanity":1,"doNoHarm":2,"impartiality":1}}]},{"id":"os-2","title":"الفرز تحت الضغط","narrative":"تتصاعد الحالات المؤكدة وتُثقَل عيادتاك. تعرض شركة تقنية صحية أداة فرز بالذكاء الاصطناعي: يجيب المرضى عن أسئلة على جهاز لوحي، ويمنح النموذج درجة إلحاح، ويرى الموظفون المرضى بترتيب النموذج. ممرضاتك الكبار متشككات؛ أما الطابور فلا.","options":[{"id":"os-2a","label":"دع النموذج يرتب الطابور","detail":"أتمتة كاملة: الدرجة تحدد الترتيب. أسرع إنتاجية، وأقل احتكاك بالموظفين.","consequence":"تقفز الإنتاجية 40%. ثم يظهر النمط: المرضى المسنون الذين يصفون الأعراض بشكل غير مباشر يسجلون درجات منخفضة؛ وكذلك متحدثو لهجة حدودية يترجمها الاستبيان بشكل رديء. لا يُرفض أحد — لكن بعضهم ينتظر حتى ينهار، بعيداً عن أعين المقاييس.","reflection":"الطابور بيان قيم. يحسّن الفرز الآلي ما يستطيع استبيانه سماعه؛ والمرضى الذين يسمعهم أسوأ هم غالباً الأشد مرضاً. عدم التحيز في العيادة يعني تدقيق الترتيب، لا السرعة فحسب.","impacts":{"humanity":1,"impartiality":-2,"doNoHarm":-1}},{"id":"os-2b","label":"النموذج كرأي ثانٍ، والممرضات يقررن","detail":"تُعرض الدرجة على ممرضة الفرز التي يمكنها تجاوزها — ويُسجَّل كل تجاوز ويُراجَع أسبوعياً.","consequence":"تتحسن الإنتاجية 25% لا 40% — لكن سجل التجاوزات يصبح ذهباً: يُظهر بالضبط أين يسيء النموذج قراءة لغة الأعراض المحلية، وتصويبات الممرضات تعيد تدريبه. يثق الموظفون بالأداة لأنها تتعلم منهن علناً.","reflection":"إبقاء الممرضة صاحبة القرار يحفظ المساءلة وينشئ حلقة تعلم لم يعرضها المزوّد قط. في الصحة، «الإنسان في الحلقة» ليس مكبحاً للنظام — بل أكثر مستشعراته دقة.","impacts":{"doNoHarm":2,"impartiality":1}},{"id":"os-2c","label":"التمسك ببروتوكول الفرز القياسي","detail":"لا أدوات جديدة في خضم التفشي. بروتوكول مجرب، ومصنّفون متطوعون إضافيون، وانتظارات أطول.","consequence":"تبقى الرعاية منصفة وقابلة للتفسير — وبطيئة. تتدهور حالتان حرجتان في طابور كانت أداة تسجيل ستدفعهما للأمام. كان البروتوكول آمناً؛ أما الانتظار فلا.","reflection":"رفض الأداة لا يجمّد المفاضلات؛ بل يجعلها أقل وضوحاً. المقارنة الصادقة ليست أبداً «الذكاء الاصطناعي مقابل رعاية مثالية» — بل الذكاء الاصطناعي مقابل الطابور الفعلي، بفرزه الصامت عبر الإنهاك.","impacts":{"impartiality":1,"humanity":-2}}]},{"id":"os-3","title":"قائمة الحالات","narrative":"يطلب اتحاد جامعي ينمذج التفشي قائمة الحالات من عياداتك: سجلات مستعارة لكل مريض بالأعراض والأعمار والمواقع والنتائج. نموذجهم قد يتنبأ بالانتشار — وطابور نشرهم وحوافز مسيرتهم المهنية وخوادمهم كلها في الخارج.","options":[{"id":"os-3a","label":"مشاركة القائمة مستعارة الأسماء","detail":"أُزيلت الأسماء ووُقّع الاتفاق. يتحسن التنبؤ للجميع.","consequence":"يساعد نموذج الاتحاد وزارتين على التخطيط. لكن القائمة تنكر رقيق: تاريخ الأعراض والعمر والقرية معاً تعيد تحديد هوية المرضى، ويثبت صحفي محلي ذلك بمكالمة واحدة. في منطقة حدودية، كون المرء قابلاً للتعرف عليه كمريض ليس حقيقة محايدة.","reflection":"في المجتمعات الصغيرة، البيانات الصحية «مستعارة الأسماء» غالباً اسم مستعار لا حماية. تحمل قوائم التفشي حساسية مزدوجة — المرض والموقع — ومعيار حماية البيانات في قرار تكنولوجيا المعلومات والاتصالات يعاملها على هذا الأساس.","impacts":{"humanity":1,"doNoHarm":-2,"independence":-1}},{"id":"os-3b","label":"مشاركة المجاميع واستضافة التحليل داخل البلد","detail":"تخرج أعداد مجمعة أسبوعية؛ تبقى القائمة الخام داخل البلد، حيث يرحَّب بباحثي الاتحاد للعمل وفق قواعد حماية بياناتك.","consequence":"علم أبطأ، وبيانات ذات سيادة. يقبل باحثان ترتيب الإقامة؛ يتذمر الاتحاد، ثم يستشهد بنموذج حوكمتك كقالب لدراساته الثلاث التالية.","reflection":"يمكنك مشاركة البصيرة دون شحن الأشخاص. سيادة البيانات في الصحة تعني أن يتنقل التحليل نحو البيانات لا العكس — والشركاء الجيدون سيقطعون المسافة.","impacts":{"doNoHarm":2,"independence":1,"humanity":-1}},{"id":"os-3c","label":"الرفض؛ وحماية القائمة حماية مطلقة","detail":"لا وصول خارجي إطلاقاً حتى تنتهي الطوارئ وتكتمل مراجعة أخلاقية كاملة.","consequence":"لا شيء يتسرب، ولا شيء يُتعلم. يُبنى التنبؤ الإقليمي — الذي كان سيوجه تجهيز اللقاحات الموسم القادم — دون بيانات عياداتك، وهو أضعف بشكل ظاهر في مناطقك بالضبط.","reflection":"للحماية المطلقة ثمن يُدفع من البصيرة. الهدف ليس مشاركة صفرية بل مشاركة محكومة: موافقة حيثما أمكن، وتجميع افتراضياً، ومراجعة من أشخاص يحاسَبون أمام مجتمعات القائمة.","impacts":{"humanity":-1,"doNoHarm":1}}]},{"id":"os-4","title":"إخبار الجمهور","narrative":"حان وقت إيصال المخاطر. تعرض المنصة رسائل صحية يصوغها الذكاء الاصطناعي وتُترجم آلياً إلى كل اللغات المحلية خلال ساعة. يعرض عمّال الصحة المجتمعية لديك شيئاً أبطأ: أنفسهم، على الدراجات النارية، بمكبرات صوت وثقة بُنيت عبر سنوات.","options":[{"id":"os-4a","label":"بث رسائل الذكاء الاصطناعي في كل مكان","detail":"السرعة والتغطية: رسائل قصيرة، ونصوص إذاعية، ومنشورات، بكل اللغات، خلال هذه الساعة.","consequence":"التغطية فورية. وكذلك الأخطاء: تستخدم قائمة أعراض مترجمة كلمة تعني «قاتل» في إحدى اللهجات، وتضرب مشتريات الذعر بلدتين، وتُقرأ عبارة عن العزل كـ«هجروا المرضى». تطارد التصحيحات الرسائل أياماً.","reflection":"في الصحة، الرسالة جرعة — الصياغة الخاطئة تضر كالدواء الخاطئ. الترجمة الآلية بسرعة التفشي تحتاج قارئاً بشرياً يعرف ما تفعله الكلمات في كل مجتمع، لا ما تقوله فحسب.","impacts":{"humanity":-1,"doNoHarm":-2}},{"id":"os-4b","label":"عمال الصحة المجتمعية يحملون الرسالة","detail":"أطلع العمال؛ يكيّفون الرسالة قريةً قرية. أبطأ، ووصول أصغر، وثقة أعمق.","consequence":"وصول الأسبوع الأول جزء من البث — لكن الفهم كامل، والأسئلة تُجاب في الحال، وشائعة «هجر المرضى» لا تترسخ أبداً لأن خالة أحدهم تشرح العزل على عتبة بابها.","reflection":"المشاركة المجتمعية والمساءلة هما قناة إيصال المخاطر الأصلية. البشر الموثوقون أبطأ من البث وأسرع من الشائعات — لأن الثقة هي حد السرعة الحقيقي.","impacts":{"doNoHarm":2,"impartiality":1,"humanity":-1}},{"id":"os-4c","label":"المزج: يصوغ الذكاء الاصطناعي وتوافق الأصوات المحلية وتُوصِل","detail":"يصوغ النموذج ويترجم في ساعة؛ يراجع مثقفون مجتمعيون لكل لغة ويوافقون أو يصححون قبل النشر؛ ويوصّل عمال الصحة الأجزاء الصعبة شخصياً.","consequence":"تخرج الرسائل في اليوم نفسه بأربع لغات، كل منها معتمدة ممن يتحدثها كلغة أم. تلتقط خطوة المراجعة الترجمة «القاتلة» قبل النشر. التغطية والثقة، كلتاهما في الغالب.","reflection":"يتعمم النمط: الآلات للسرعة، والمجتمعات للمعنى. التزام المشاركة في قرار تكنولوجيا المعلومات والاتصالات هو ما يحوّل خط ترجمة إلى تواصل يستطيع الناس التصرف بناءً عليه بأمان.","impacts":{"humanity":1,"doNoHarm":2}}]}],"debrief":"إشارة التفشي تدور حول السرعة في ظل عدم اليقين. تراقب الاستخبارات الوبائية أوسع مما تستطيع أي فرقة، لكن درجات ثقتها ليست قرارات، وطوابير فرزها تُرمّز ما تستطيع الاستبيانات سماعه، وجوعها للبيانات يصطدم بحساسية كون المرء قابلاً للتعرف عليه كمريض، ورسائلها تحتاج عيوناً من أهل اللغة قبل آذانهم. الصحة هي حيث يلتقي «تحرك بسرعة» بـ«أولاً، لا تُلحق ضرراً» بأكثر صورة مباشرة — يجب أن تُبنى الأدوات لكليهما."},{"id":"boardroom-test","title":"اختبار مجلس الإدارة","tagline":"استراتيجية ذكاء اصطناعي على مستوى المنظمة لقيادة جمعية وطنية","role":"الأمين العام لجمعية وطنية","context":"يجتمع مجلسك بعد ثلاثة أسابيع، والذكاء الاصطناعي فجأة على كل جدول أعمال: يلمّح مانح كبير إلى أن التمويل المستقبلي سيفضل الشركاء «المتقدمين في الذكاء الاصطناعي»، واكتشف مدققوك موظفين يلصقون وثائق داخلية في روبوتات محادثة عامة، ويريد مدير اللوجستيات أتمتة وظيفة إدارية توظّف أربعين شخصاً. ما ستحمله إلى تلك القاعة سيحدد كيف تستخدم منظمتك الذكاء الاصطناعي لسنوات — ومن يحق له الاعتراض.","topics":["حوكمة الذكاء الاصطناعي","الاستراتيجية والتمويل","القوى العاملة"],"roles":["القيادة","الحوكمة","رعاية الموظفين"],"steps":[{"id":"bt-1","title":"دفعة المانح","narrative":"رسالة المانح ودودة ولا لبس فيها: ستُمنح الأولوية للمنظمات التي تُظهر «تبنياً ملموساً للذكاء الاصطناعي». تحذر مديرة البرامج من أن مطاردة الإشارة ستبعثر المنظمة في عشرات التجارب غير المحكومة. ويحذر مسؤول جمع التبرعات من أن تجاهلها يكلف سبعة أرقام.","options":[{"id":"bt-1a","label":"أعلن دفعة تبنٍّ للذكاء الاصطناعي","detail":
