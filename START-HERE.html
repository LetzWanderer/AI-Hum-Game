e":"La lista de casos","narrative":"Un consorcio universitario que modela el brote pide la lista nominal de tus clínicas: registros anonimizados por paciente con síntomas, edades, ubicaciones y desenlaces. Su modelo podría pronosticar la propagación, y su cola de publicaciones, incentivos de carrera y servidores están todos en el extranjero.","options":[{"id":"os-3a","label":"Compartir la lista anonimizada","detail":"Sin nombres, acuerdo firmado. El pronóstico mejora para todos.","consequence":"El modelo del consorcio ayuda a planificar a dos ministerios. Pero la lista es un disfraz delgado: fecha de síntomas, edad y aldea juntas reidentifican pacientes, y un periodista local lo demuestra con una llamada. En una región fronteriza, ser identificable como paciente no es un hecho neutro.","reflection":"En poblaciones pequeñas, los datos de salud «anonimizados» suelen ser un seudónimo, no una protección. Las listas de brotes cargan doble sensibilidad —enfermedad y ubicación— y el estándar de protección de datos de la Resolución sobre TIC las trata como tales.","impacts":{"humanity":1,"doNoHarm":-2,"independence":-1}},{"id":"os-3b","label":"Compartir agregados y alojar el análisis en el país","detail":"Salen recuentos agregados semanales; la lista cruda se queda en el país, donde los investigadores del consorcio pueden trabajar bajo tus normas de protección de datos.","consequence":"Ciencia más lenta, datos soberanos. Dos investigadores aceptan la residencia; el consorcio protesta, y luego cita tu modelo de gobernanza como plantilla para sus próximos tres estudios.","reflection":"Puedes compartir el conocimiento sin enviar a las personas. La soberanía de datos en salud significa que el análisis viaja hacia los datos, no al revés, y los buenos socios harán el viaje.","impacts":{"doNoHarm":2,"independence":1,"humanity":-1}},{"id":"os-3c","label":"Rechazar; proteger la lista absolutamente","detail":"Sin acceso externo alguno hasta que termine la emergencia y se complete una revisión ética completa.","consequence":"Nada se filtra, y nada se aprende. El pronóstico regional —que habría guiado el preposicionamiento de vacunas la próxima temporada— se construye sin los datos de tus clínicas y es visiblemente más débil exactamente en tus distritos.","reflection":"La protección absoluta tiene un precio que se paga en previsión. La meta no es compartir cero sino compartir gobernadamente: consentimiento cuando sea posible, agregación por defecto, y revisión por personas que rinden cuentas a las comunidades de la lista.","impacts":{"humanity":-1,"doNoHarm":1}}]},{"id":"os-4","title":"Informar al público","narrative":"Llega la hora de la comunicación de riesgos. La plataforma ofrece mensajes de salud redactados por IA y autotraducidos a todos los idiomas locales en una hora. Tus trabajadores de salud comunitaria ofrecen algo más lento: ellos mismos, en motocicleta, con megáfonos y una confianza construida durante años.","options":[{"id":"os-4a","label":"Difundir los mensajes de IA por todas partes","detail":"Velocidad y cobertura: SMS, guiones de radio, publicaciones, todos los idiomas, esta misma hora.","consequence":"La cobertura es instantánea. También los errores: una lista de síntomas traducida usa una palabra que en un dialecto significa «mortal», las compras de pánico golpean dos pueblos, y una frase sobre aislamiento se lee como «abandonar a los enfermos». Las correcciones persiguen a los mensajes durante días.","reflection":"En salud, un mensaje es una dosis: la redacción equivocada daña como el medicamento equivocado. La traducción automática a velocidad de brote necesita un lector humano que sepa lo que las palabras hacen en cada comunidad, no solo lo que dicen.","impacts":{"humanity":-1,"doNoHarm":-2}},{"id":"os-4b","label":"Los trabajadores de salud comunitaria llevan el mensaje","detail":"Informar a los trabajadores; ellos adaptan el mensaje aldea por aldea. Más lento, menor alcance, mayor confianza.","consequence":"El alcance de la primera semana es una fracción de la difusión masiva, pero la comprensión es total, las preguntas se responden en el momento, y el rumor sobre «abandonar a los enfermos» nunca arraiga porque la tía de alguien explica el aislamiento en su puerta.","reflection":"La participación comunitaria y la rendición de cuentas son el canal original de comunicación de riesgos. Los humanos de confianza son más lentos que las transmisiones y más rápidos que los rumores, porque la confianza es el verdadero límite de velocidad.","impacts":{"doNoHarm":2,"impartiality":1,"humanity":-1}},{"id":"os-4c","label":"Combinar: la IA redacta, las voces locales aprueban y entregan","detail":"El modelo redacta y traduce en una hora; revisores comunitarios de cada idioma aprueban o corrigen antes de publicar; los trabajadores de salud entregan las partes difíciles en persona.","consequence":"Los mensajes salen el mismo día en cuatro idiomas, cada uno validado por alguien que lo habla nativamente. La revisión detecta la traducción «mortal» antes de publicar. Cobertura y confianza, casi ambas.","reflection":"El patrón se generaliza: máquinas para la velocidad, comunidades para el significado. El compromiso de participación de la Resolución sobre TIC es lo que convierte una tubería de traducción en comunicación sobre la que la gente puede actuar con seguridad.","impacts":{"humanity":1,"doNoHarm":2}}]}],"debrief":"La señal del brote trata de la velocidad bajo incertidumbre. La IA epidémica vigila más amplio que cualquier equipo, pero sus puntuaciones de confianza no son decisiones, sus colas de triaje codifican lo que los cuestionarios pueden oír, su hambre de datos choca con la sensibilidad de ser identificable como paciente, y sus mensajes necesitan ojos nativos antes que oídos nativos. La salud es donde «muévete rápido» se encuentra más directamente con «primero, no hagas daño»: las herramientas deben construirse para ambos."},{"id":"boardroom-test","title":"La prueba de la junta","tagline":"Estrategia de IA para toda la organización, para la dirección de una Sociedad Nacional","role":"Secretario(a) General de una Sociedad Nacional","context":"Tu junta se reúne en tres semanas y la IA está de repente en todas las agendas: un donante importante insinúa que la financiación futura favorecerá a los socios «con adopción de IA», tus auditores descubrieron personal pegando documentos internos en chatbots públicos, y tu director de logística quiere automatizar una función administrativa que emplea a cuarenta personas. Lo que lleves a esa sala definirá cómo usa la IA tu organización durante años, y quién podrá cuestionarlo.","topics":["Gobernanza de la IA","Estrategia y financiación","Personal"],"roles":["Liderazgo","Gobernanza","Cuidado del personal"],"steps":[{"id":"bt-1","title":"El empujón del donante","narrative":"La carta del donante es amable e inequívoca: se priorizará a las organizaciones que demuestren «adopción concreta de IA». Tu directora de programas advierte que perseguir la señal dispersará a la organización en una docena de pilotos sin gobernanza. Tu responsable de recaudación advierte que ignorarla cuesta siete cifras.","options":[{"id":"bt-1a","label":"Anunciar un impulso de adopción de IA","detail":"Diez pilotos, rápido, visible. Mostrar impulso al donante; resolver la gobernanza sobre la marcha.","consequence":"El donante está encantado y el comunicado se escribe solo. Para el cuarto mes tienes once pilotos, tres proveedores con acceso a datos internos, dos herramientas duplicadas, y nadie que pueda responder una pregunta simple de la junta: ¿quién aprobó cada uno de estos, con qué criterios?","reflection":"El entusiasmo condicionado por la financiación sigue siendo entusiasmo. La independencia incluye la libertad de adoptar tecnología a la velocidad que tu gobernanza realmente puede dirigir: los donantes financian tu misión, no tu cuenta de herramientas.","impacts":{"humanity":1,"independence":-2,"doNoHarm":-1}},{"id":"bt-1b","label":"Declinar la condición con cortesía","detail":"Agradecer al donante, reafirmar tus criterios guiados por la misión, aceptar el riesgo de financiación.","consequence":"La subvención va a una organización más ruidosa. Tu contención queda reivindicada un año después, cuando el proyecto estrella del donante colapsa en un escándalo de datos, pero la reivindicación no paga los proyectos de agua que la subvención habría financiado.","reflection":"Decir no al dinero desalineado es un costo real que pagan programas reales. La independencia no es gratis; la pregunta de la junta es si se valora con honestidad y se revisa cuando cambian los hechos.","impacts":{"independence":1,"humanity":-2}},{"id":"bt-1c","label":"Adoptar un marco de IA basado primero en principios","detail":"Un marco breve y público: para qué usarás IA, para qué nunca la usarás, cómo se aprueban las herramientas, y dos pilotos insignia elegidos por necesidad, no por visibilidad.","consequence":"El marco toma seis semanas y tres borradores. El donante, al verlo, pasa de escéptico a impresionado: le da algo defendible que financiar. Dos pilotos avanzan con criterios que la junta realmente puede leer.","reflection":"Un marco escrito convierte los valores en criterios de adquisición. Es más lento que un comunicado y más rápido que un escándalo, y te permite presentarte ante los financiadores con un documento en lugar de un estado de ánimo.","impacts":{"independence":1,"doNoHarm":2}}]},{"id":"bt-2","title":"La IA en la sombra","narrative":"La auditoría es incómoda: personal de todos los departamentos usa chatbots públicos a diario, para redactar informes a donantes, traducir notas de campo y resumir expedientes. Algunos de esos documentos contienen datos de beneficiarios. Prohibirlo lo llevará a la clandestinidad; autorizarlo suena a respaldar una fuga.","options":[{"id":"bt-2a","label":"Prohibir las herramientas públicas de IA en dispositivos de trabajo","detail":"Política clara, dominios bloqueados, nota disciplinaria. La fuga se detiene, oficialmente.","consequence":"Oficialmente, el cumplimiento es total. Extraoficialmente, el trabajo se muda a los teléfonos personales: los mismos documentos, las mismas herramientas públicas, ahora invisibles tanto para tu equipo de informática como para tu responsable de protección de datos.","reflection":"Una prohibición sin alternativa reubica el riesgo en lugar de reducirlo. Las políticas que ignoran por qué la gente buscó la herramienta —carga de trabajo, traducción, velocidad— se leen como instrucciones de esconderse.","impacts":{"doNoHarm":-1,"independence":-1}},{"id":"bt-2b","label":"Ofrecer una alternativa autorizada y gobernada","detail":"Contratar un servicio empresarial de IA con garantías de no entrenamiento y retención, publicar una guía de uso aceptable de dos páginas en lenguaje claro y capacitar a los equipos sobre lo que nunca debe ingresarse.","consequence":"La adopción de la herramienta gobernada es rápida porque responde a la necesidad real. Las líneas rojas de la guía —nada de datos que identifiquen beneficiarios, nada de expedientes, nada de contenido sensible para la seguridad— se respetan porque el personal ayudó a escribirlas.","reflection":"La gobernanza que se encuentra con el flujo de trabajo real de la gente se cumple. Un carril autorizado con líneas rojas claras vence tanto a la práctica prohibida en la sombra como al libre albedrío sin examen: protección de datos desde el diseño, a nivel de escritorio.","impacts":{"doNoHarm":2,"independence":1}},{"id":"bt-2c","label":"Mirar hacia otro lado por ahora","detail":"Anotar el hallazgo, revisarlo el año próximo. La productividad del personal es real y los presupuestos están ajustados.","consequence":"Nada cambia, visiblemente. Meses después, una traductora pega un informe de incidentes de protección en un chatbot gratuito para cumplir un plazo. Las condiciones del proveedor permiten entrenar con las entradas. Te enteras por un periodista.","reflection":"La gobernanza aplazada es gobernanza por defecto, con los valores por defecto fijados por los proveedores. La organización rinde cuentas por datos que finge no saber que se están moviendo.","impacts":{"doNoHarm":-2,"humanity":1}}]},{"id":"bt-3","title":"Cuarenta puestos de trabajo","narrative":"El caso de negocio de la automatización logística es sólido: liberaría fondos significativos para programas cada año, y eliminaría cuarenta puestos administrativos, muchos ocupados por personas que han servido a la organización durante décadas, en una ciudad donde tu Sociedad Nacional es un empleador importante.","options":[{"id":"bt-3a","label":"Automatizar por completo y redirigir el ahorro","detail":"Las cuentas de la misión son duras: esos fondos vacunan, albergan, alimentan. Los puestos terminan con paquetes estándar.","consequence":"Los presupuestos de programas crecen según lo proyectado. En la ciudad, la historia no son las cuentas sino el método: cuarenta familias se enteran por una carta de reestructuración. Las conversaciones sindicales se vuelven hostiles, los medios locales cubren los «despidos humanitarios», y dos personas de programas renuncian en solidaridad.","reflection":"La humanidad no es solo un principio de campo. Una organización que automatiza a su propia gente sin cuidado enseña a cada observador —personal, comunidad, socios— cuán literalmente debe leer sus valores.","impacts":{"humanity":-2,"doNoHarm":-1,"independence":1}},{"id":"bt-3b","label":"Automatizar despacio, con recapacitación y reubicación","detail":"Transición de dos años: automatizar por fases, recapacitar al personal para nuevos roles (incluida la supervisión de la IA), garantizar cero despidos forzados el primer año.","consequence":"El ahorro llega a media velocidad. Pero veintiséis personas pasan a nuevos roles —ocho de ellas a los puestos de calidad de datos y supervisión que el nuevo sistema genuinamente necesita— y la transición se convierte en la historia que cuentas a quienes se incorporan, en lugar de la que temes.","reflection":"No causar daño incluye a las personas dentro del edificio. Una transición justa es más lenta y más barata que una hostil cuando cuentas la confianza, la retención y el conocimiento institucional que se va con una carta de reestructuración.","impacts":{"humanity":1,"doNoHarm":2,"impartiality":1}},{"id":"bt-3c","label":"Archivar la automatización por completo","detail":"El costo social es demasiado alto. Mantener la función manual; revisitar cuando las bajas naturales abran espacio.","consequence":"Nadie pierde su empleo. El ahorro nunca se materializa, la sociedad de una ciudad vecina entrega más rápido, y tu equipo de logística —consciente de que la decisión se tomó por ellos, no con ellos— deja en silencio de proponer mejoras.","reflection":"Proteger empleos congelando la pregunta protege la plantilla de este año e hipoteca la relevancia del próximo. El camino humano no es «nunca automatizar» sino «automatizar con la gente en el diseño, y tiempo para adaptarse».","impacts":{"humanity":1,"independence":-1}}]},{"id":"bt-4","title":"Quién gobierna las máquinas","narrative":"Último punto de la agenda de la junta: la gobernanza permanente. Tus pilotos se multiplican, el marco necesita un dueño, y alguien debe poder decir que no. La pregunta es quién, con qué mandato, y rindiendo cuentas ante quién.","options":[{"id":"bt-4a","label":"Dejarlo a la dirección ejecutiva","detail":"El equipo directivo ya gestiona riesgos. Sin estructuras nuevas, sin sobrecostos.","consequence":"Funciona hasta que hay trabajo. Las decisiones se toman en los huecos entre otras decisiones; un despliegue de alto riesgo sale durante un pico de respuesta sin revisión alguna, y la pregunta posterior al incidente —«¿quién vigilaba?»— no tiene nombre como respuesta.","reflection":"La gobernanza que vive en el tiempo libre de todos no vive en ninguna parte. La rendición de cuentas necesita un órgano con nombre, mandato, calendario y poder para pausar un despliegue.","impacts":{"doNoHarm":-2,"independence":-1}},{"id":"bt-4b","label":"Crear un grupo de supervisión de IA con voz externa y comunitaria","detail":"Un pequeño grupo permanente —programas, TIC, protección de datos, un ético externo y un representante comunitario— con autoridad para aprobar, condicionar o detener usos de IA, revisado anualmente en público.","consequence":"Las reuniones son mensuales y ocasionalmente incómodas. El primer veto del miembro comunitario —a un piloto de reconocimiento facial en puntos de distribución— te ahorra un titular que nunca ves. La revisión pública anual es tranquila, y esa tranquilidad es el logro.","reflection":"Esto es la Resolución sobre TIC hecha estructura: protección de datos, participación comunitaria y mitigación de daños encarnadas en un órgano que puede actuar. La supervisión con voz externa detecta lo que quienes están dentro están pagados por no notar.","impacts":{"doNoHarm":2,"independence":1}},{"id":"bt-4c","label":"Contratar un auditor externo una vez al año","detail":"Revisión independiente, informe anual, la dirección actúa sobre los hallazgos. A distancia y asequible.","consequence":"La primera auditoría es minuciosa y llega once meses después de las decisiones que revisa. Los hallazgos son precisos, las recomendaciones sensatas, y el piloto más arriesgado terminó —por razones no relacionadas— tres meses antes de que llegara el informe.","reflection":"La auditoría es un espejo retrovisor: esencial, y ciega a lo que se aproxima. La revisión externa anual complementa la supervisión permanente; no puede sustituir a alguien que mira la carretera.","impacts":{"doNoHarm":1,"independence":-1}}]}],"debrief":"La prueba de la junta es donde se decide por adelantado cualquier otro escenario. La presión de los donantes, la IA en la sombra, la automatización de tu propio personal y la pregunta de quién puede decir no: nada de esto son cuestiones tecnológicas; son cuestiones de gobernanza con tecnología dentro. Una Sociedad Nacional que escribe sus líneas rojas, da a su personal un carril gobernado, trata a su propia gente como parte de la «humanidad» y sienta voces comunitarias donde se toman las decisiones tomará mejores decisiones de campo automáticamente."},{"id":"clinic-notes","title":"La clínica que escucha","tagline":"Transcripción con IA en una clínica para personas migrantes en situación irregular en Sweden","role":"Responsable de servicios de salud, clínica de la Cruz Roja en Gothenburg","context":"Tu clínica atiende a personas que no pueden o no se atreven a utilizar el sistema sanitario ordinario: personas migrantes en situación irregular, ciudadanos de la UE sin seguro y personas a quienes se ha denegado el asilo. El personal voluntario de enfermería y medicina dedica casi la mitad de cada consulta a escribir notas, a menudo con la ayuda de un intérprete. Una empresa emergente de tecnología sanitaria ofrece gratuitamente una herramienta de transcripción con IA que escucha la consulta, la traduce y redacta la nota clínica. Las listas de espera son largas y tu voluntariado está al límite del agotamiento.","topics":["Transcripción con IA","Datos de salud","Huella energética"],"roles":["Servicios de salud","Protección de datos","Gestión del voluntariado"],"debrief":"La clínica que escucha muestra que la IA administrativa nunca es solo administrativa. Cuando las personas presentes tienen motivos de sobra para temer que se las grabe, la minimización de datos, el consentimiento informado, el procesamiento local y un presupuesto energético transparente no son elementos accesorios: determinan si la clínica sigue siendo un lugar seguro.","steps":[{"id":"cn-1","title":"La oferta gratuita","narrative":"La herramienta de la empresa graba toda la consulta, envía el audio a un gran modelo de voz alojado fuera de la UE y devuelve una nota bien redactada en sueco en un minuto. Es gratuita durante un año: la empresa quiere mostrar la «IA para el bien». La persona responsable de protección de datos pregunta adónde van las grabaciones. El médico voluntario con más experiencia pregunta si los pacientes seguirán hablando.","options":[{"id":"cn-1a","label":"Aceptar la herramienta gratuita en la nube","detail":"Es la forma más rápida de aliviar la carga del voluntariado. Las grabaciones completas salen de la clínica y se procesan en el extranjero mediante un modelo que no puedes inspeccionar.","consequence":"En una semana, el tiempo dedicado a la documentación se reduce a la mitad. Entonces, la abogada de una paciente pregunta si las autoridades podrían solicitar las grabaciones de su clienta en un procedimiento de expulsión. No puedes asegurar dónde se almacena el audio, durante cuánto tiempo ni quién puede acceder a él. La noticia se difunde en la comunidad y tres pacientes habituales dejan de acudir.","reflection":"Para quienes viven con miedo a las autoridades, la propia grabación puede causar daño. Una herramienta gratuita que se paga con los datos más sensibles de las personas más expuestas no es gratuita. La resolución sobre las TIC compromete al Movimiento a proteger los datos personales precisamente allí donde las consecuencias de una filtración son más graves.","impacts":{"humanity":1,"doNoHarm":-2,"independence":-1}},{"id":"cn-1b","label":"Probar un modelo pequeño que funcione en la clínica","detail":"Un modelo de voz compacto en un ordenador local. Ningún audio sale del edificio; las notas son menos precisas y requieren más correcciones.","consequence":"La puesta en marcha lleva un mes y las notas necesitan correcciones, especialmente en tigriña y darí. Pero nada sale de la clínica, el audio se elimina en cuanto se aprueba la nota y el equipo consume aproximadamente lo mismo que una lámpara de escritorio. El voluntariado ahorra un tercio del tiempo de escritura, en vez de la mitad.","reflection":"Los modelos locales de tamaño adecuado sacrifican un acabado más pulido a cambio de mayor control. Cuando el procesamiento se realiza en las propias instalaciones, sabes dónde están los datos, cuánto tiempo se conservan y cuánta energía consumen: tres preguntas que una organización humanitaria siempre debería poder responder.","impacts":{"doNoHarm":2,"independence":1,"humanity":1}},{"id":"cn-1c","label":"Prescindir de la IA y financiar voluntariado administrativo","detail":"Incorporar personal voluntario de secretaría médica que escriba las notas después de cada turno.","consequence":"La captación funciona entre la comunidad estudiantil de Gothenburg y los pacientes no perciben ningún cambio. Pero resulta difícil mantener al personal de secretaría durante los exámenes y, en la clínica vespertina, el personal médico vuelve a escribir hasta medianoche.","reflection":"Decir no a la IA es una decisión legítima con costes reales, que a menudo recaen en personal y voluntariado agotados. La cuestión no es si la IA es buena o mala, sino si una alternativa más sencilla atiende mejor a las personas en este contexto.","impacts":{"doNoHarm":1,"humanity":-1}}]},{"id":"cn-2","title":"El consentimiento en la sala de espera","narrative":"Sea cual sea la herramienta que utilices, hay que informar a los pacientes de que se les está grabando. Tu equipo prepara un formulario de consentimiento. Una persona voluntaria propone una simple casilla al registrarse. Un intérprete advierte que muchos pacientes marcarán cualquier cosa que les entregue alguien con un chaleco de la Cruz Roja por miedo a que se les deniegue la atención.","options":[{"id":"cn-2a","label":"Una casilla al registrarse","detail":"Rápido y formalmente correcto desde el punto de vista jurídico. Los pacientes dan su consentimiento una sola vez para todas las visitas futuras.","consequence":"La tasa de consentimiento es del 99%. Más adelante, una auditoría revela que la mayoría de los pacientes no comprendieron qué habían aceptado; varios creían que era una condición para recibir tratamiento.","reflection":"El consentimiento otorgado en una relación de dependencia no es un consentimiento libre. Cuando las personas necesitan ayuda, una casilla mide la aceptación, no la comprensión.","impacts":{"doNoHarm":-2,"humanity":-1}},{"id":"cn-2b","label":"Preguntar en cada visita y permitir un «no» real","detail":"El profesional sanitario pregunta en el idioma del paciente al inicio de cada consulta. Negarse no cambia en nada la atención.","consequence":"Aproximadamente uno de cada cinco pacientes se niega, sobre todo entre quienes acaban de llegar. Sus notas se escriben manualmente. La confianza crece: los pacientes cuentan a otros que la clínica pregunta y respeta la respuesta.","reflection":"La posibilidad de rechazar la herramienta sin sufrir consecuencias negativas es lo que hace aceptable el apoyo de la IA. Mantener una alternativa sin IA protege a quienes más la necesitan.","impacts":{"doNoHarm":2,"humanity":1,"impartiality":1}},{"id":"cn-2c","label":"Grabar solo el resumen del profesional sanitario","detail":"No se graba la voz del paciente. Tras la consulta, el profesional sanitario dicta un breve resumen a la herramienta.","consequence":"Las palabras del paciente nunca llegan a la máquina. El ahorro de tiempo es menor, pero el dictado es rápido, el archivo de audio es muy pequeño y su procesamiento necesita una fracción de la energía que requiere transcribir toda la conversación.","reflection":"La minimización de datos puede incorporarse al diseño: cambia lo que recoges en lugar de proteger lo que no deberías haber recogido. Menos datos también significa menos procesamiento, almacenamiento y energía.","impacts":{"doNoHarm":2,"humanity":1}}]},{"id":"cn-3","title":"La factura oculta","narrative":"La filial regional de la Cruz Roja quiere extender la transcripción a los doce puntos de atención sanitaria y apoyo psicosocial del oeste de Sweden y conservar todas las grabaciones durante cinco años «para entrenar un modelo mejor más adelante». Tu especialista voluntario en informática hace los cálculos: almacenar y volver a procesar repetidamente miles de horas de audio requeriría cada año la electricidad y la refrigeración de una sala de servidores.","options":[{"id":"cn-3a","label":"Conservar todo para futuros entrenamientos","detail":"Más datos podrían permitir mejores modelos. El almacenamiento es barato y la red eléctrica de Sweden utiliza principalmente fuentes sin combustibles fósiles.","consequence":"El archivo crece hasta acumular terabytes de las conversaciones más sensibles que ha mantenido tu organización. El consumo energético aumenta cada mes. Nadie llega a entrenar el modelo, pero sigue siendo necesario proteger el archivo, hacer copias de seguridad y suministrarle energía.","reflection":"Una red eléctrica limpia no hace inocuo el derroche: la electricidad utilizada aquí no está disponible para otras necesidades y los equipos ya tienen una huella considerable antes de encenderse. Los datos conservados «por si acaso» generan riesgos para la privacidad y costes energéticos indefinidamente.","impacts":{"doNoHarm":-2,"humanity":-1}},{"id":"cn-3b","label":"Eliminar el audio, medir y publicar el consumo energético","detail":"El audio se elimina en un plazo de 24 horas. Cada centro informa de la energía consumida por consulta y las cifras se incluyen en el informe anual.","consequence":"Las primeras cifras sorprenden a todos: la prueba en la nube consumió unas treinta veces más energía por nota que el modelo local. La junta directiva adopta un presupuesto energético por consulta y dos filiales eligen el modelo local basándose en ese criterio.","reflection":"No puedes gestionar una huella que te niegas a medir. Publicar el coste energético de la IA convierte la sostenibilidad en algo más que un lema: un criterio de decisión que las comunidades y los donantes pueden verificar.","impacts":{"doNoHarm":2,"independence":1}},{"id":"cn-3c","label":"Implantarla solo donde el voluntariado la solicite","detail":"No hay una obligación para toda la región. Los centros deciden adherirse tras revisar los resultados de tu clínica.","consequence":"Cinco centros la adoptan y siete no. El uso y el consumo energético se mantienen proporcionales a las necesidades reales, pero las prácticas difieren y la persona responsable de protección de datos tiene ahora cinco configuraciones que revisar.","reflection":"La ampliación debe basarse en pruebas de utilidad, no en el entusiasmo. A menudo, reducir la huella consiste simplemente en no implantar una herramienta donde no se necesita.","impacts":{"doNoHarm":1,"humanity":1}}]},{"id":"cn-4","title":"Cuando la nota es incorrecta","narrative":"Una paciente vuelve con una infección que ha empeorado. La nota redactada por la IA en su primera visita decía «sin alergias conocidas». Ella había dicho, a través del intérprete, que era alérgica a la penicilina. El médico voluntario aprobó la nota al final de un turno de doce horas sin leerla detenidamente.","options":[{"id":"cn-4a","label":"Tratarlo como un error humano individual","detail":"Recordar al médico que debe leer con más atención. Mantener el procedimiento sin cambios.","consequence":"Dos meses después, otra persona voluntaria aprueba otra nota incorrecta. El patrón es el mismo: personas cansadas, turnos largos y notas que parecen fiables.","reflection":"El sesgo de automatización es previsible: un texto bien redactado invita a aprobarlo. Culpar a las personas oculta un problema de diseño que volverá a repetirse.","impacts":{"doNoHarm":-2,"humanity":-1}},{"id":"cn-4b","label":"Reservar los campos críticos exclusivamente a las personas","detail":"El profesional sanitario siempre pregunta por las alergias, la medicación y los riesgos para la seguridad, y los introduce personalmente. La IA solo redacta el relato clínico.","consequence":"Redactar las notas lleva algo más de tiempo y los errores en los campos críticos se reducen a cero en la siguiente auditoría. Informas a la paciente de lo ocurrido, te disculpas y le explicas el cambio; ella acepta seguir acudiendo.","reflection":"Una supervisión humana significativa exige definir en el diseño dónde deciden las personas, no limitarse a pedirles que firmen. Actuar con transparencia ante la persona afectada forma parte de la rendición de cuentas.","impacts":{"doNoHarm":2,"humanity":1}},{"id":"cn-4c","label":"Suspender la IA y revisar el sistema con los pacientes","detail":"Detener la transcripción durante un mes e invitar a antiguos pacientes e intérpretes a revisar cómo debería funcionar.","consequence":"La pausa cuesta horas de voluntariado. La revisión produce la mejor idea de la clínica hasta ahora: los intérpretes repiten los datos clave a los pacientes antes de aprobar la nota. El proceso es más lento y los errores se vuelven poco frecuentes.","reflection":"Quienes se ven afectados por un sistema suelen estar en la mejor posición para detectar sus fallos. Detenerse a escuchar no es fracasar: es poner en práctica la rendición de cuentas en la acción humanitaria.","impacts":{"doNoHarm":2,"humanity":-1,"impartiality":1}}]}]},{"id":"invoice-engine","title":"El motor de facturas","tagline":"Automatización de la administración financiera en una oficina nacional en the Netherlands","role":"Responsable de Finanzas y Administración, sede de la Sociedad Nacional en The Hague","context":"Tu equipo financiero procesa 40,000 facturas al año: proveedores de alojamientos temporales, reembolsos al voluntariado, pagos a organizaciones asociadas en el extranjero y transferencias monetarias a personas afectadas por las inundaciones en Limburg. Tres de tus ocho empleados se jubilan. Una gran empresa de software ofrece un agente de IA que lee facturas, las clasifica contablemente, señala posibles fraudes y aprueba automáticamente los pagos habituales. La junta directiva quiere generar ahorros que puedan destinarse a los programas.","topics":["Automatización de procesos","Rendición de cuentas financiera","Huella energética"],"roles":["Finanzas y administración","TIC","Auditoría y cumplimiento normativo"],"debrief":"El motor de facturas muestra que la IA de los servicios internos determina quién cobra, quién queda señalado y cuánta energía consume la organización en el proceso. La eficiencia es un objetivo humanitario legítimo, pero solo si las personas siguen respondiendo por los pagos, las alertas pueden impugnarse y se elige la herramienta más ligera que funcione, no la más impresionante.","steps":[{"id":"ie-1","title":"¿Qué herramienta requiere la tarea?","narrative":"El agente del proveedor procesa cada factura mediante un gran modelo de IA de uso general en la nube, incluso las sencillas que siguen la misma plantilla todos los meses. Tu responsable de control financiero señala que el 80% de las facturas procede de solo 200 proveedores habituales. Un especialista voluntario en TIC propone utilizar automatización convencional basada en reglas y un modelo pequeño para el resto más complejo: bastaría para realizar la mayor parte del trabajo.","options":[{"id":"ie-1a","label":"Comprar el agente de IA completo","detail":"Una plataforma para todo. Cada factura, sencilla o compleja, pasa por un gran modelo.","consequence":"Funciona de forma impresionante. También cuesta más que el personal al que sustituye y su informe de uso revela que cada factura recurrente sencilla requiere tanto procesamiento como una conversación larga con un asistente virtual, decenas de miles de veces al año.","reflection":"Utilizar un gran modelo de IA para una tarea que puede realizar una regla sencilla es como enviar un camión para entregar una carta. Cada consulta innecesaria conlleva un coste energético, hídrico y de equipos.","impacts":{"doNoHarm":-1,"independence":-1}},{"id":"ie-1b","label":"Primero las reglas; una IA pequeña para el resto","detail":"Automatización sencilla para las facturas recurrentes; un modelo pequeño lee solo las inusuales; el personal se ocupa de las excepciones.","consequence":"Desarrollarlo con tu equipo de TIC lleva tres meses. Las facturas recurrentes se tramitan rápidamente con apenas procesamiento. El modelo pequeño se encarga de los recibos manuscritos del voluntariado. Los costes de funcionamiento y el consumo energético son una fracción de lo que supone la oferta del proveedor.","reflection":"El diseño frugal es un principio, no una concesión: empieza con la herramienta más sencilla y añade IA solo donde aporte un valor claro. Así también se mantiene el sistema comprensible para quienes lo auditan.","impacts":{"doNoHarm":2,"independence":1}},{"id":"ie-1c","label":"Contratar y formar en su lugar","detail":"Sustituir al personal que se jubila con dos nuevas contrataciones y mejorar el sistema existente.","consequence":"Los pagos siguen siendo correctos y las personas siguen respondiendo por ellos. Pero la contratación lleva meses, los retrasos acumulados alcanzan seis semanas y algunos pequeños proveedores de las zonas inundadas esperan demasiado para cobrar.","reflection":"No automatizar es una decisión legítima, pero el retraso en los pagos también causa daño, especialmente a pequeñas empresas locales y a personas voluntarias que adelantan su propio dinero.","impacts":{"doNoHarm":1,"humanity":-1}}]},{"id":"ie-2","title":"La alerta de fraude","narrative":"Las comprobaciones automáticas empiezan a señalar pagos de «alto riesgo». Observas un patrón: los reembolsos a personas voluntarias con nombres no neerlandeses y las transferencias a organizaciones asociadas en Syria y Sudan se señalan con una frecuencia tres veces mayor. Cada alerta bloquea el pago hasta tres semanas.","options":[{"id":"ie-2a","label":"Confiar en las alertas: el riesgo es lo primero","detail":"El cumplimiento normativo no es negociable. Los pagos bloqueados son el precio de la seguridad.","consequence":"Dos organizaciones asociadas en Sudan no pueden pagar las nóminas a tiempo. Una voluntaria de origen eritreo que compró mantas con su propio dinero espera un mes para recibir el reembolso y abandona el voluntariado. Las alertas no detectan ningún fraude real.","reflection":"Un modelo entrenado con patrones del pasado reproduce las sospechas del pasado. Cuando se aplica a nombres y destinos, se convierte en discriminación contra las mismas personas y organizaciones asociadas a las que una organización humanitaria existe para servir.","impacts":{"impartiality":-2,"humanity":-1,"doNoHarm":-1}},{"id":"ie-2b","label":"Auditar las alertas para detectar sesgos","detail":"Suspender los bloqueos automáticos, contrastar las alertas con los resultados y eliminar los nombres y la nacionalidad como indicadores.","consequence":"La auditoría muestra que las alertas respondían principalmente a nombres y ubicaciones, no al riesgo. Tras los cambios, las tasas de alerta son similares entre grupos y se siguen detectando los dos casos de fraude real del año, gracias a una persona que investiga a partir de un aviso.","reflection":"La imparcialidad también se aplica a los sistemas internos. Comprobar si las decisiones automatizadas producen resultados desiguales es una obligación, no un añadido opcional.","impacts":{"impartiality":2,"doNoHarm":1}},{"id":"ie-2c","label":"Las alertas solo orientan; las personas deciden en 48 horas","detail":"Sin bloqueos automáticos. Una persona del equipo financiero revisa cada alerta y debe decidir en dos días.","consequence":"El equipo se queja de la carga de trabajo adicional, pero los pagos bloqueados se reducen casi a cero. El personal también empieza a registrar los motivos por los que descarta las alertas, lo que aporta información útil para mejorar las reglas.","reflection":"Mantener a las personas en la toma de decisiones, con un plazo que proteja a quien espera, equilibra el control con la dignidad.","impacts":{"impartiality":1,"humanity":1,"doNoHarm":1}}]},{"id":"ie-3","title":"¿Dónde se realiza el procesamiento?","narrative":"El proveedor prevé trasladar todo el procesamiento a un nuevo centro de datos en el norte de the Netherlands, en la misma región donde la población local ha protestado por el consumo de suelo, electricidad y agua de los centros de datos. Una periodista local pregunta si la Cruz Roja forma parte del problema.","options":[{"id":"ie-3a","label":"Dejarlo en manos del proveedor","detail":"El lugar donde el proveedor procesa los datos es asunto suyo. Su informe de sostenibilidad afirma que tiene «neutralidad en carbono».","consequence":"El artículo de la periodista destaca tu silencio. Cuando pides cifras al proveedor, resulta que la «neutralidad en carbono» depende de compensaciones adquiridas en otros lugares; no se publica el consumo real de agua y electricidad.","reflection":"La responsabilidad no termina en el contrato. La contratación ética implica preguntar dónde se realiza el procesamiento y qué coste tiene para la comunidad local y el medio ambiente.","impacts":{"doNoHarm":-2,"independence":-1}},{"id":"ie-3b","label":"Incluir la información energética como condición contractual","detail":"Exigir al proveedor que informe anualmente sobre energía, agua y ubicación, con derecho a rescindir el contrato si no se cumplen los objetivos.","consequence":"Las negociaciones se alargan dos meses más. El proveedor acepta, en parte porque otras ONG siguen tu ejemplo. Publicas el primer informe: las cifras son moderadas gracias a tu diseño que prioriza las reglas.","reflection":"La contratación otorga poder. Cuando las organizaciones humanitarias exigen juntas, los proveedores empiezan a revelar lo que de otro modo ocultarían.","impacts":{"doNoHarm":2,"independence":1}},{"id":"ie-3c","label":"Ejecutar el modelo pequeño en servidores propios","detail":"Alojar el modelo de facturas en tu sala de servidores existente, alimentada por los paneles solares del tejado y un contrato de energía renovable.","consequence":"Tu equipo de TIC debe mantener ahora un sistema más y el rendimiento disminuye durante el pico de actividad de fin de año. Pero sabes exactamente cuánto consume el sistema, y es menos que las cafeteras de la oficina.","reflection":"Contar con infraestructura propia aporta responsabilidad, además de control. Para cargas de trabajo pequeñas y estables, el alojamiento local puede ofrecer mayor independencia y menor impacto.","impacts":{"independence":2,"doNoHarm":1,"humanity":-1}}]},{"id":"ie-4","title":"¿Quién firma?","narrative":"El sistema ya funciona bien. La junta directiva propone el último paso: permitir que apruebe y pague automáticamente todas las facturas inferiores a €5,000, incluidas las pequeñas transferencias monetarias a hogares afectados por las inundaciones en Limburg. Ninguna persona las revisaría.","options":[{"id":"ie-4a","label":"Automatización completa por debajo de €5,000","detail":"Máxima eficiencia. Las excepciones se investigan después.","consequence":"Un error de datos al importar una lista envía pagos duplicados a 300 hogares y, una semana después, los recupera automáticamente. Las familias que ya habían gastado el dinero en reparaciones reciben cartas de reclamación de deuda. Los titulares no hablan de eficiencia.","reflection":"Cuando los pagos automatizados afectan a personas que atraviesan una crisis, los errores causan daños a gran escala. Los importes pequeños no son pequeños para quienes los reciben.","impacts":{"doNoHarm":-2,"humanity":-1}},{"id":"ie-4b","label":"Automatizar los pagos a proveedores y mantener la revisión humana para las personas","detail":"Las facturas habituales de proveedores se tramitan automáticamente. Los pagos a particulares siempre requieren aprobación humana.","consequence":"La mayor parte del volumen se automatiza; los pagos que afectan a la vida de las personas siguen teniendo una persona responsable. Cuando se produce el error de importación, alguien del equipo financiero lo detecta antes de que salga un solo pago duplicado.","reflection":"Fija el límite de la automatización allí donde los errores dejan de ser administrativos y empiezan a afectar personalmente a la gente.","impacts":{"doNoHarm":2,"humanity":1}},{"id":"ie-4c","label":"Automatizar, pero publicar cómo reclamar","detail":"Automatización por debajo de €5,000, con una línea telefónica claramente anunciada y el compromiso de corregir cualquier pago erróneo en 5 días.","consequence":"La línea de reclamaciones detecta los problemas rápidamente y la mayoría se resuelve en pocos días. Pero obliga a las personas afectadas a detectar el error y reclamar, y quienes disponen de menos tiempo y competencias lingüísticas son quienes menos reclaman.","reflection":"Una vía de reclamación es esencial, pero no sustituye a la prevención del daño. La rendición de cuentas funciona mejor antes del error, no solo después.","impacts":{"doNoHarm":1,"humanity":1,"impartiality":-1}}]}]},{"id":"volunteer-roster","title":"El cuadrante del voluntariado","tagline":"Planificación de turnos con IA para el voluntariado de acogida de personas refugiadas en Poland","role":"Responsable de coordinación del voluntariado, filial de la Cruz Roja en Kraków","context":"Dos años después de la primera oleada de llegadas desde Ukraine, tu filial sigue ofreciendo acogida, cafés de idiomas y un punto de distribución de alimentos. Coordinas a 1,800 personas voluntarias mediante hojas de cálculo, grupos de WhatsApp y muchas llamadas a altas horas de la noche. Quedan turnos sin cubrir y se vuelve a recurrir una y otra vez a las mismas personas de confianza. Una empresa tecnológica polaca ofrece un sistema de IA que prevé la demanda, elabora el cuadrante y envía mensajes automáticamente al voluntariado.","topics":["Planificación de turnos con IA","Bienestar del voluntariado","Huella energética"],"roles":["Gestión del voluntariado","Operaciones","Protección"],"debrief":"El cuadrante del voluntariado muestra que una IA que optimiza el tiempo de las personas también toma decisiones sobre ellas: en quién se confía, a quién se pasa por alto y a quién se exige demasiado. Las personas voluntarias no son recursos cuyo rendimiento deba maximizarse. Un sistema adecuado protege su bienestar, recoge la menor cantidad posible de información sobre ellas y no utiliza más procesamiento del que requiere el problema.","steps":[{"id":"vr-1","title":"Lo que el sistema quiere saber","narrative":"Para predecir quién acudirá, el proveedor quiere acceder a los datos de ubicación del teléfono, la actividad en redes sociales y los calendarios del voluntariado, y puntuar la «fiabilidad» de cada persona. La demostración impresiona: predice las ausencias con una precisión del 85%.","options":[{"id":"vr-1a","label":"Conectarlo todo: la precisión importa","detail":"Cuantos más datos, mejor será el cuadrante.","consequence":"Las predicciones son precisas. Entonces, el voluntariado se entera. Varias personas voluntarias ucranianas, también refugiadas, se marchan de inmediato: huyeron de una guerra en la que el rastreo telefónico significaba peligro. Otras sienten que se las vigila en su tiempo libre.","reflection":"Las personas voluntarias son personas, no fuentes de datos. Rastrear su vida fuera de sus funciones rompe la confianza y puede poner en peligro a quienes tienen sus propias necesidades de protección.","impacts":{"doNoHarm":-2,"humanity":-1}},{"id":"vr-1b","label":"Solo lo que el voluntariado decida compartir","detail":"La disponibilidad que cada persona introduce, sus competencias e idiomas. Sin seguimiento ni puntuaciones de fiabilidad.","consequence":"Las predicciones son menos precisas. Pero el voluntariado confía en el sistema y mantiene actualizada su disponibilidad, lo que resulta ser más importante que cualquier indicador de seguimiento.","reflection":"La minimización de datos es respeto en la práctica. La información que las personas facilitan voluntariamente suele ser más fiable que la obtenida sin su participación.","impacts":{"doNoHarm":2,"humanity":1}},{"id":"vr-1c","label":"Un calendario compartido, sin IA","detail":"Una herramienta sencilla de código abierto para planificar turnos. Las personas voluntarias eligen sus propios turnos.","consequence":"Su funcionamiento cuesta muy poco y apenas consume energía. Los turnos populares se cubren al instante; la distribución de alimentos de primera hora sigue sin cubrirse y tú sigues haciendo llamadas a las 6 de la mañana.","reflection":"Las herramientas sencillas suelen bastar, pero conviene preguntarse qué problemas dejan sin resolver y para quién.","impacts":{"doNoHarm":1,"independence":1,"humanity":-1}}]},{"id":"vr-2","title":"El cuadrante optimizado","narrative":"El sistema de planificación aprende que un pequeño grupo de personas voluntarias casi siempre acepta. Empieza a asignarles la mayoría de los turnos difíciles. Una de ellas, una profesora jubilada que lleva dos años colaborando cada semana, te dice que ya no puede dormir.","options":[{"id":"vr-2a","label":"Seguir optimizando la cobertura","detail":"Las personas que llegan necesitan una cobertura completa. El voluntariado dispuesto a colaborar quiere ayudar.","consequence":"La cobertura alcanza el 98%. En tres meses, seis de las personas voluntarias con más experiencia se agotan y se marchan a la vez. El sistema se adapta exigiendo más al siguiente grupo con mayor disposición.","reflection":"Optimizar una sola cifra hace invisible todo lo demás. El bienestar del voluntariado forma parte del principio de humanidad, que se aplica tanto a quienes ayudan como a quienes reciben ayuda.","impacts":{"humanity":-2,"doNoHarm":-1}},{"id":"vr-2b","label":"Incorporar límites y descanso","detail":"Un máximo de turnos por semana, descanso obligatorio tras los turnos nocturnos y un «no, gracias» que nunca perjudique a nadie.","consequence":"La cobertura baja al 90% y captas más voluntariado para cubrir la diferencia. La permanencia del voluntariado mejora notablemente y la profesora jubilada regresa tras un mes de descanso.","reflection":"Los buenos sistemas incorporan el cuidado en sus reglas. Las normas que protegen a las personas de una carga excesiva son salvaguardas humanitarias, no ineficiencias.","impacts":{"humanity":2,"doNoHarm":1}},{"id":"vr-2c","label":"Permitir que el voluntariado conozca y defina las reglas","detail":"Publicar cómo se elabora el cuadrante y crear un grupo de voluntariado que pueda modificar las prioridades.","consequence":"El grupo pide equidad entre los grupos lingüísticos y rotación de los turnos de fin de semana. El sistema tarda más en cambiar, pero inspira mucha más confianza.","reflection":"La transparencia sobre cómo se toman las decisiones permite cuestionarlas. Las reglas compartidas se aceptan más fácilmente que las ocultas.","impacts":{"humanity":1,"impartiality":1,"doNoHarm":1}}]},{"id":"vr-3","title":"Mensajes que nunca cesan","narrative":"El proveedor propone un asistente de conversación con IA que envía a cada persona voluntaria mensajes personalizados, recordatorios y «estímulos motivadores», redactados de nuevo por un gran modelo de lenguaje para cada mensaje: unos 30,000 mensajes al mes en polaco, ucraniano e inglés.","options":[{"id":"vr-3a","label":"Activar mensajes personalizados con IA","detail":"Mensajes cercanos y adaptados en tres idiomas, generados uno a uno.","consequence":"Al principio, el voluntariado encuentra los mensajes amables; después, extraños: una persona recibe un «¡te echamos de menos!» mientras está hospitalizada. El informe energético muestra que los mensajes son ahora la principal fuente de consumo energético del sistema, aunque el texto dice prácticamente lo mismo cada vez.","reflection":"Generar texto nuevo para cada mensaje rutinario multiplica el procesamiento a cambio de pocos beneficios. La IA generativa no es gratuita: cada mensaje tiene un coste energético e hídrico.","impacts":{"doNoHarm":-2,"humanity":-1}},{"id":"vr-3b","label":"Plantillas redactadas por personas en cada idioma","detail":"Personas voluntarias de cada comunidad lingüística redactan una vez plantillas de mensajes breves. El sistema incorpora los nombres y horarios.","consequence":"Los mensajes suenan humanos porque los escribieron personas reales. Las necesidades de procesamiento se reducen casi a cero y el voluntariado disfruta redactando las plantillas en conjunto.","reflection":"A menudo, la cantidad adecuada de IA es menos IA. Reutilizar textos escritos por personas es más barato, consume menos recursos e inspira más confianza.","impacts":{"doNoHarm":2,"humanity":1,"independence":1}},{"id":"vr-3c","label":"Menos mensajes, según la elección del voluntariado","detail":"Las personas voluntarias eligen cómo y con qué frecuencia reciben tus comunicaciones. La opción predeterminada es un resumen semanal.","consequence":"El volumen de mensajes se reduce un 80%. Algunos turnos tardan algo más en cubrirse, pero el voluntariado dice sentirse respetado en lugar de perseguido.","reflection":"Permitir que las personas establezcan sus propios límites reduce tanto la presión como la huella.","impacts":{"doNoHarm":1,"humanity":1}}]},{"id":"vr-4","title":"Una solicitud de las autoridades","narrative":"Las autoridades regionales solicitan los datos del cuadrante del voluntariado —nombres, nacionalidades y disponibilidad— para planificar su propia respuesta de protección civil. El sistema permite exportarlos con un solo clic. Muchas de las personas voluntarias tienen ciudadanía ucraniana y estatuto de protección temporal.","options":[{"id":"vr-4a","label":"Compartir la exportación completa","detail":"Una buena cooperación con las autoridades ayuda a la respuesta global.","consequence":"Los datos se utilizan para la planificación y, más tarde, para comprobar la situación de residencia. El voluntariado se entera por una noticia local. La captación de personas voluntarias ucranianas se desploma.","reflection":"Utilizar para un fin distinto los datos facilitados para otro traiciona la confianza y puede comprometer la independencia y la neutralidad del Movimiento ante las comunidades a las que sirve.","impacts":{"independence":-2,"neutrality":-1,"doNoHarm":-2}},{"id":"vr-4b","label":"Compartir solo cifras agregadas","detail":"Ofrecer cifras por competencias, idioma y distrito, sin nombres ni nacionalidades.","consequence":"Las autoridades obtienen lo que necesitan para planificar. Al principio se quejan, pero después adoptan tu formato como modelo para otras organizaciones.","reflection":"La limitación de la finalidad implica compartir lo necesario para el objetivo declarado y nada más. Los datos agregados protegen a las personas sin dejar de facilitar la cooperación.","impacts":{"independence":1,"neutrality":1,"doNoHarm":2}},{"id":"vr-4c","label":"Pedir al voluntariado que decida si participa","detail":"Explicar la solicitud y permitir que cada persona voluntaria decida si quiere figurar en la lista de las autoridades.","consequence":"Aproximadamente la mitad acepta. El resto agradece que se le haya preguntado. El proceso lleva tres semanas: las autoridades lo consideran lento, pero lo aceptan.","reflection":"El consentimiento y la transparencia permiten que las personas mantengan el control sobre su propia información, incluso cuando la solicitud procede de una entidad asociada.","impacts":{"independence":1,"doNoHarm":1,"humanity":1}}]}]},{"id":"heat-wave","title":"El mapa de calor","tagline":"Predicción con IA para proteger a las personas mayores durante una ola de calor en Sicily","role":"Responsable de salud en emergencias, comité regional de la Cruz Roja en Palermo","context":"Las temperaturas estivales en Sicily ya superan habitualmente los 45°C. El pasado julio, varias personas mayores que vivían solas murieron en sus viviendas antes de que alguien comprobara cómo estaban. Un consorcio europeo de investigación ofrece un modelo de IA que combina previsiones meteorológicas, historiales médicos, datos telefónicos e imágenes satelitales para predecir qué calles y qué personas corren mayor riesgo, de modo que tu voluntariado sepa a qué puertas llamar primero. Ejecutarlo requiere un potente conjunto de servidores en Northern Europe.","topics":["IA predictiva","Adaptación al cambio climático","Huella energética"],"roles":["Salud en emergencias","Gestión de la información","Participación comunitaria"],"debrief":"El mapa de calor refleja una paradoja difícil: la IA utilizada para responder al cambio climático puede aumentar el consumo de energía y recursos que lo impulsa. La predicción puede salvar vidas, pero solo si no excluye a quienes no logra detectar, no recoge más datos de los necesarios y se dimensiona teniendo en cuenta de forma transparente su propia huella.","steps":[{"id":"hw-1","title":"¿Qué tamaño debe tener el modelo?","narrative":"El modelo del consorcio es enorme: vuelve a procesar imágenes satelitales europeas y simulaciones climáticas cada pocas horas. Tu responsable de información calcula que ejecutarlo durante un verano consumiría tanta electricidad como una pequeña localidad siciliana. Una universidad local ofrece una alternativa más sencilla: un índice estadístico de riesgo por calor basado en previsiones meteorológicas, antigüedad de los edificios y datos de edad por barrio.","options":[{"id":"hw-1a","label":"Utilizar el gran modelo de IA","detail":"Las predicciones más precisas disponibles, con el coste energético de una localidad.","consequence":"Las predicciones son excelentes para el centro de la ciudad. Pero las necesidades de procesamiento del modelo hacen que solo se ejecute dos veces al día y su gran huella se convierte en noticia en la prensa italiana: «La Cruz Roja combate el calor con una máquina que calienta el planeta».","reflection":"Las herramientas de respuesta climática deben evaluarse también por su propia huella climática. El modelo más potente no es automáticamente el más humano.","impacts":{"humanity":1,"doNoHarm":-2}},{"id":"hw-1b","label":"Utilizar el índice sencillo de riesgo por calor","detail":"Menos preciso, funciona en un portátil y puede explicarse a cualquier persona voluntaria.","consequence":"El índice señala las mismas zonas de alto riesgo en el 90% de los casos. El voluntariado entiende por qué una calle aparece en rojo y los referentes comunitarios pueden corregirlo, y así lo hacen, añadiendo dos barrios que los datos habían omitido.","reflection":"Los modelos sencillos y explicables invitan a participar y corregir. Lo adecuado para el propósito suele ser mejor que lo más avanzado.","impacts":{"doNoHarm":2,"humanity":1,"independence":1}},{"id":"hw-1c","label":"Utilizar el modelo grande solo durante las alertas por calor","detail":"Ejecutar el modelo grande únicamente cuando el servicio nacional emita una alerta roja.","consequence":"El consumo energético se reduce un 80%. Pero el modelo arranca «en frío» los días de alerta y tarda horas en producir resultados útiles: el primer día, el más mortífero, es el que peor cubre.","reflection":"Limitar el uso es una buena intuición. Pero las soluciones intermedias deben contrastarse con los momentos en que las personas corren realmente mayor riesgo.","impacts":{"doNoHarm":1,"humanity":-1}}]},{"id":"hw-2","title":"¿Quién queda invisible?","narrative":"El modelo depende de datos telefónicos y de historiales médicos registrados. Tu voluntariado señala a quién deja fuera: trabajadores agrícolas migrantes en situación irregular que viven en asentamientos informales fuera de la ciudad y personas mayores sin teléfonos inteligentes. Ninguno de los dos grupos aparece en el mapa de calor.","options":[{"id":"hw-2a","label":"Confiar en el mapa","detail":"La capacidad del voluntariado es limitada. Acudir allí donde los datos indiquen mayor riesgo.","consequence":"Las visitas son eficientes y protegen muchas vidas en la ciudad. En un asentamiento informal cerca de Campobello, dos trabajadores agrícolas son hospitalizados por golpes de calor. Nadie los había visitado.","reflection":"Los datos reflejan a quién se contabiliza, no quién está en riesgo. Asignar ayuda basándose solo en los datos puede excluir silenciosamente a las personas más vulnerables.","impacts":{"impartiality":-2,"humanity":-1}},{"id":"hw-2b","label":"Reservar equipos para quienes no aparecen en el mapa","detail":"Un tercio de la capacidad del voluntariado se destina a lugares y grupos que los datos no muestran, con orientación de contactos comunitarios.","consequence":"La cobertura de la ciudad disminuye ligeramente. Las visitas a los asentamientos llevan agua, sombra y atención temprana a cientos de trabajadores cuya existencia el modelo nunca detectó.","reflection":"La imparcialidad exige prestar ayuda según las necesidades, no según la visibilidad. El conocimiento humano debe corregir los puntos ciegos de los datos.","impacts":{"impartiality":2,"humanity":1}},{"id":"hw-2c","label":"Recoger más datos sobre quienes faltan","detail":"Pedir a los trabajadores migrantes que registren su ubicación en una aplicación móvil para que el modelo pueda incluirlos.","consequence":"Pocos se registran: muchos temen a las autoridades migratorias. Quienes lo hacen generan un conjunto de datos que el consorcio solicita después compartir con otras entidades asociadas.","reflection":"Hacer visibles a las personas ante un sistema puede exponerlas a nuevos riesgos. A veces, la respuesta más segura es trabajar sin depender de esos datos, no completarlos.","impacts":{"impartiality":1,"doNoHarm":-2}}]},{"id":"hw-3","title":"Refrigerar los servidores","narrative":"El consorcio propone instalar un conjunto de servidores local en Palermo para acelerar las predicciones. Durante una ola de calor, los propios servidores necesitarían aire acondicionado constante, consumiendo electricidad de la misma red sobrecargada que mantiene en marcha los ventiladores de las personas mayores. Durante la ola de calor del año pasado, algunas zonas de la ciudad se quedaron sin suministro eléctrico.","options":[{"id":"hw-3a","label":"Instalar los servidores locales","detail":"Predicciones más rápidas y control local.","consequence":"El día más caluroso, el operador de la red solicita reducciones voluntarias del consumo. Tus servidores siguen funcionando y refrigerándose mientras dos barrios sufren cortes rotatorios de electricidad.","reflection":"La infraestructura de IA compite con las personas por la energía y el agua, a veces precisamente cuando más escasean ambas. Esa competencia es una cuestión humanitaria.","impacts":{"doNoHarm":-2,"humanity":-1}},{"id":"hw-3b","label":"Mantener un sistema ligero y alimentado por energía solar","detail":"Ejecutar el índice sencillo en portátiles del centro de operaciones, alimentados por paneles solares en el tejado y baterías de respaldo.","consequence":"El sistema funciona incluso durante el apagón. Las baterías también mantienen operativos los teléfonos y los frigoríficos para medicamentos del centro de operaciones.","reflection":"Un diseño resiliente y de bajo consumo protege las operaciones cuando falla la infraestructura, precisamente cuando más importan las herramientas de respuesta a las crisis.","impacts":{"doNoHarm":2,"independence":1}},{"id":"hw-3c","label":"Procesar en Northern Europe con energías renovables","detail":"Mantener el procesamiento intensivo en un centro de datos alimentado por energía hidroeléctrica en Norway o Sweden.","consequence":"La red local queda aliviada y la electricidad es renovable. Pero la conectividad durante la ola de calor es poco fiable y dependes de una conexión que no controlas cuando más importa.","reflection":"Trasladar el procesamiento a fuentes de energía limpia reduce las emisiones, pero no la dependencia. Sopesa tanto la huella como quién mantiene el control durante una crisis.","impacts":{"doNoHarm":1,"independence":-1}}]},{"id":"hw-4","title":"Llamar a la puerta","narrative":"Los días de alerta, el sistema proporciona a cada persona voluntaria una lista de direcciones ordenadas según el riesgo previsto. Una persona pregunta: «¿Qué digo cuando un señor mayor pregunta por qué lo hemos elegido?». Otra informa de que algunos residentes sienten que se los etiqueta como personas «a punto de morir».","options":[{"id":"hw-4a","label":"No dar explicaciones, solo ayudar","detail":"El modelo es demasiado complejo para explicarlo a la puerta de una casa.","consequence":"La mayoría de las personas acepta la visita. Algunas no abren la puerta. Se difunde el rumor de que la Cruz Roja tiene listas secretas del hospital.","reflection":"Cuando las personas no saben por qué han sido seleccionadas, la sospecha llena ese vacío. La opacidad erosiona la confianza de la que depende la labor humanitaria.","impacts":{"doNoHarm":-1,"humanity":-1}},{"id":"hw-4b","label":"Explicar con sencillez y ofrecer la posibilidad de negarse","detail":"Una explicación sencilla: «En esta calle hace mucho calor y viven muchas personas mayores. ¿Le gustaría que comprobáramos cómo está durante la ola de calor?». Las personas pueden negarse y ser retiradas de la lista.","consequence":"Casi todo el mundo acepta. Algunas personas se niegan y se respeta su decisión. Los vecinos empiezan a informar al voluntariado sobre otras personas que viven solas.","reflection":"Explicar claramente por qué se ofrece ayuda y aceptar un «no» respeta la dignidad y convierte una predicción en una relación.","impacts":{"humanity":2,"doNoHarm":1}},{"id":"hw-4c","label":"Dejar la lista en manos de los barrios","detail":"Compartir el mapa de calor por zonas con grupos parroquiales y asociaciones vecinales, que deciden a quién visitar.","consequence":"La cobertura se vuelve desigual: sólida en barrios organizados y débil en otros. Pero donde funciona, las visitas continúan todo el verano sin necesidad de ningún modelo.","reflection":"Dar el control a las comunidades crea capacidades duraderas, pero sigue siendo necesario prestar atención a quienes no cuentan con una comunidad sólida a su alrededor.","impacts":{"humanity":1,"independence":1,"impartiality":-1}}]}]}],"fr":[{"id":"flood-line","title":"La ligne de crue","tagline":"Un chatbot IA pour les communautés sinistrées en Asie du Sud","role":"Chef(fe) des opérations d’urgence, Société nationale d’un pays du delta en Asie du Sud","context":"Des semaines de pluies de mousson ont déplacé plus de 200 000 personnes à travers le delta. Votre ligne téléphonique est débordée : les appelants attendent des heures pour obtenir des informations sur les abris, les distributions et les proches disparus. Un partenaire télécom propose un chatbot IA gratuit qui répond dans trois langues locales. Votre équipe de quarante personnes est épuisée, et l’eau continue de monter.","topics":["Chatbots IA","Engagement communautaire","Protection des données"],"roles":["Opérations d’urgence","Gestion de l’information","Engagement communautaire"],"steps":[{"id":"fl-1","title":"Quarante-huit heures","narrative":"Le fournisseur affirme que le chatbot peut être en ligne en 48 heures, entraîné sur les FAQ des inondations passées. Votre chargé(e) de gestion de l’information prévient que les réponses n’ont pas été vérifiées pour cette urgence. Un pilote complet avec révision humaine prendrait deux semaines — pendant que des gens dorment dehors.","options":[{"id":"fl-1a","label":"Lancer en 48 heures","detail":"La vitesse avant la vérification. Les réponses partent sans révision, et vous corrigez au fur et à mesure.","consequence":"En trois jours, le chatbot répond à 40 000 questions. Mais les équipes de terrain rapportent qu’environ une réponse sur douze est fausse — y compris des indications vers un abri d’un district où le site a fermé la veille. Le personnel passe la semaine à courir après les corrections sur WhatsApp.","reflection":"La vitesse peut sauver des vies, mais une information automatisée non vérifiée peut elle-même causer du tort. La Résolution TIC engage le Mouvement à éviter et à atténuer les préjudices causés aux personnes affectées — y compris ceux causés par les outils que nous déployons.","impacts":{"humanity":1,"doNoHarm":-2}},{"id":"fl-1b","label":"Mener d’abord un pilote de deux semaines","detail":"Des réviseurs humains vérifient chaque modèle de réponse avant le lancement. Plus lent, mais vérifié.","consequence":"Le chatbot est lancé le jour 14 avec un taux de précision de 98 % sur les réponses vérifiées. Entre-temps, la ligne reste saturée et certaines communautés reçoivent l’information tard — mais ce qu’elles reçoivent est fiable, et la confiance dans le service tient bon.","reflection":"La vérification coûte du temps, et le temps coûte de la portée. Mais une information fiable fait partie d’une assistance humaine et impartiale : une réponse qui envoie quelqu’un dans la mauvaise direction n’est pas de l’aide.","impacts":{"humanity":-1,"doNoHarm":2,"impartiality":1}},{"id":"fl-1c","label":"Renoncer au chatbot, renforcer la ligne","detail":"Recruter et former des opérateurs temporaires. Aucun risque technologique nouveau, mais beaucoup moins de portée.","consequence":"Vous formez 25 opérateurs temporaires en dix jours. La qualité des réponses est élevée et chaque appelant parle à une personne — mais la ligne ne couvre toujours qu’une fraction de la demande, et de nombreuses familles déplacées ne parviennent tout simplement jamais à passer.","reflection":"Choisir de ne pas utiliser l’IA est aussi une décision qui a des conséquences. L’indépendance vis-à-vis des fournisseurs est préservée, mais l’humanité demande si un outil accessible, soigneusement gouverné, aurait pu soulager davantage de souffrances.","impacts":{"humanity":-1,"doNoHarm":1,"independence":1}}]},{"id":"fl-2","title":"Ce dont le chatbot se souvient","narrative":"La configuration par défaut du fournisseur enregistre tout : numéros de téléphone, localisations approximatives et chaque question posée — « pour améliorer le service ». Votre point focal protection des données remarque qu’une liste de personnes déplacées, leurs localisations et leurs besoins est exactement le type de jeu de données que les normes de protection des données du Mouvement existent pour protéger.","options":[{"id":"fl-2a","label":"Tout enregistrer pour un meilleur service","detail":"Les journaux complets alimentent l’analytique du fournisseur. La personnalisation s’améliore.","consequence":"Les réponses deviennent nettement plus pertinentes. Des mois plus tard, vous apprenez que les journaux ont servi à entraîner un produit commercial, et qu’il n’existe aucun moyen pratique de retirer les données de 40 000 personnes déplacées qui n’ont jamais accepté cela.","reflection":"Les personnes affectées ont rarement l’occasion de négocier leur consentement en temps de crise. L’engagement de protection des données de la Résolution TIC considère leurs données comme leur appartenant : collectées pour une finalité déclarée, protégées, et jamais réutilisées en silence.","impacts":{"humanity":1,"doNoHarm":-2,"independence":-1}},{"id":"fl-2b","label":"Collecter le minimum","detail":"Sessions anonymes, aucun identifiant, limites de conservation au contrat. Moins de personnalisation.","consequence":"Le chatbot ne peut pas reconnaître les utilisateurs qui reviennent, ce qui en frustre certains. Mais lorsqu’un ministère demande les données des utilisateurs deux mois plus tard, il n’y a rien d’identifiant à remettre — et vos équipes peuvent le dire honnêtement à la radio.","reflection":"La minimisation des données est le héros discret de la pratique responsable des données : on ne peut ni fuiter, ni perdre, ni être forcé de remettre des données jamais collectées. Cela protège aussi la neutralité si des parties au conflit s’y intéressent plus tard.","impacts":{"doNoHarm":2,"neutrality":1}},{"id":"fl-2c","label":"Partager les journaux avec le partenaire télécom","detail":"Ils offrent de l’analytique réseau en échange. Les utilisateurs affectés ne sont pas consultés.","consequence":"L’analytique vous aide à cartographier la demande. Puis un journaliste demande pourquoi les questions et localisations de personnes déplacées affluent vers une entreprise privée. L’article paraît dans la presse nationale ; la confiance des communautés dans la ligne chute brutalement.","reflection":"La redevabilité envers les personnes affectées inclut la capacité d’expliquer — avant qu’elles ne le lisent dans la presse — qui détient leurs données et pourquoi. Les conditions éthiques des partenariats relèvent de l’achat, pas de la communication de crise après coup.","impacts":{"doNoHarm":-2,"independence":-1}}]},{"id":"fl-3","title":"Mauvaises directions","narrative":"Un délégué de terrain appelle : le chatbot envoie des familles vers un point de distribution fermé depuis deux jours. Environ 300 personnes ont marché sous la chaleur, certaines avec de jeunes enfants. Le fournisseur peut corriger la réponse en quelques heures — mais vous savez désormais que d’autres réponses peuvent être périmées.","options":[{"id":"fl-3a","label":"Le laisser en ligne pendant les corrections","detail":"Le service reste actif. Les correctifs arrivent réponse par réponse au fil de la semaine.","consequence":"La plupart des utilisateurs continuent d’être aidés — et un nombre inconnu continue de recevoir des informations périmées. Deux autres sites fermés sont signalés avant la fin de l’audit de contenu. Les équipes de terrain perdent confiance dans l’outil.","reflection":"Poursuivre un service dont vous savez qu’il nuit à certains utilisateurs transfère le risque sur les personnes les moins à même de l’absorber. Ne pas nuire signifie être prêt à éteindre sa propre innovation.","impacts":{"humanity":-1,"doNoHarm":-2}},{"id":"fl-3b","label":"Le mettre hors ligne et expliquer pourquoi","detail":"Suspendre le chatbot, annoncer la correction par radio et SMS, relancer après un audit complet du contenu.","consequence":"Trois jours sans chatbot, et la ligne téléphonique souffre à nouveau. Mais la correction transparente est bien reçue : les leaders communautaires relaient votre message, et le jour du relancement bat des records d’utilisation — les gens font confiance à un service qui admet ses erreurs.","reflection":"L’engagement communautaire et la redevabilité ne sont pas une enquête en fin de parcours — c’est une communication honnête quand les choses tournent mal. Admettre l’erreur a renforcé, plutôt qu’affaibli, le service.","impacts":{"humanity":-1,"doNoHarm":2}},{"id":"fl-3c","label":"Ajouter un avertissement et continuer","detail":"« Les réponses peuvent être inexactes — vérifiez localement. » Le service ne s’arrête jamais.","consequence":"L’utilisation baisse légèrement. Mais pour une mère qui décide de marcher cinq kilomètres avec un bébé, « peut être inexact » n’est pas exploitable. Les plaintes augmentent parmi les utilisateurs les plus vulnérables, qui n’ont aucun moyen de « vérifier localement ».","reflection":"Un avertissement transfère votre responsabilité à l’utilisateur. La redevabilité signifie que c’est l’organisation — et non la personne affectée — qui porte la charge de bien faire.","impacts":{"doNoHarm":-1,"impartiality":-1}}]},{"id":"fl-4","title":"Qui écoute ?","narrative":"Six semaines plus tard, l’urgence se stabilise. Vous devez décider comment le chatbot — qui deviendra probablement un service permanent — reste comptable envers les personnes qui l’utilisent.","options":[{"id":"fl-4a","label":"Convoquer un panel communautaire de retour","detail":"Des personnes affectées révisent les réponses chaque semaine, signalent les préjudices et orientent ce que couvre le chatbot.","consequence":"Le panel détecte des problèmes que vos tableaux de bord n’ont jamais montrés : des réponses sensées dans la capitale mais pas dans les dialectes riverains, et des sujets que les gens n’osaient pas aborder. Le service s’améliore et gagne en confiance.","reflection":"L’engagement communautaire et la redevabilité — un engagement central de la Résolution TIC — traitent les personnes affectées comme des décisionnaires sur les outils qui les servent, et non comme de simples statistiques d’usage.","impacts":{"doNoHarm":2,"impartiality":1}},{"id":"fl-4b","label":"Faire confiance aux métriques d’usage","detail":"Les tableaux de bord montrent un engagement fort. Si les gens l’utilisent, cela fonctionne.","consequence":"Les chiffres sont superbes dans le rapport au donateur. Des mois plus tard, une évaluation révèle que les utilisateurs aux pires résultats — personnes âgées, en situation de handicap, locuteurs de langues non dominantes — ont simplement cessé d’utiliser le chatbot, en silence.","reflection":"Les métriques mesurent ceux qui sont restés. L’impartialité interroge les personnes que les données ne voient pas — et ce sont souvent celles qui en ont le plus besoin.","impacts":{"impartiality":-2,"doNoHarm":-1}},{"id":"fl-4c","label":"Confier la modération à des volontaires non formés","detail":"La bonne volonté locale maintient le service en vie à coût quasi nul.","consequence":"Les volontaires travaillent dur, mais sans formation ni filière d’escalade, certaines réponses nuisibles restent en ligne des semaines et les questions sensibles reçoivent un traitement incohérent. Deux volontaires s’épuisent et démissionnent.","reflection":"La redevabilité ne se sous-traite pas à la bonne volonté. Un déploiement éthique inclut le financement des humains qui gardent les systèmes automatisés sûrs — sinon l’automatisation n’est pas vraiment gouvernée.","impacts":{"humanity":1,"doNoHarm":-1}}]}],"debrief":"La ligne de crue montre à quelle vitesse un chatbot bien intentionné touche chaque engagement de la Résolution TIC : information vérifiée (ne pas nuire), minimisation et finalité des données (protection des données), communication honnête en cas d’échec (redevabilité envers les communautés), et gouvernance qui laisse les personnes affectées maîtresses des outils censés les servir."},{"id":"targeting-unseen","title":"Cibler les invisibles","tagline":"Analytique prédictive pour la sélection des bénéficiaires au Sahel","role":"Directeur(-trice) du programme de transferts monétaires, Réponse à la sécheresse au Sahel","context":"Dix-huit mois de sécheresse au Sahel ont poussé 60 000 ménages vers la crise. Votre programme de transferts monétaires peut en atteindre 15 000. La sélection est la décision la plus dure et la plus contestée de l’opération — et un cabinet d’analytique propose un modèle prédictif qui classe les ménages par besoin probable en quelques jours au lieu de plusieurs mois.","topics":["Ciblage des bénéficiaires","Biais algorithmique","Partage de données avec des partenaires technologiques"],"roles":["Gestion de programmes","Données et analytique","Protection"],"steps":[{"id":"tu-1","title":"Les données dont vous disposez","narrative":"Le modèle ne vaut que par ses données d’entraînement. Vous avez trois options réalistes, aucune parfaite, et la prochaine fenêtre d’insécurité alimentaire se ferme dans huit semaines.","options":[{"id":"tu-1a","label":"Utiliser le registre vieux de quatre ans","detail":"Rapide et prêt. Mais il est antérieur à la sécheresse, au déplacement et à la fermeture de la frontière.","consequence":"Les classements sont prêts en cinq jours. Les équipes de terrain découvrent vite que le modèle note des ménages qui se sont depuis remis — et qu’il est aveugle à des milliers de familles nouvellement déplacées jamais enregistrées. Les plaintes d’exclusion affluent.","reflection":"Un modèle entraîné sur la réalité d’hier reproduit l’image des besoins d’hier. L’impartialité — aider selon le besoin seul — échoue silencieusement quand les données ne voient pas qui souffre aujourd’hui.","impacts":{"impartiality":-2,"humanity":-1}},{"id":"tu-1b","label":"Collecter des données fraîches porte à porte","detail":"Des enquêteurs avec tablettes et scripts de consentement. Six semaines, une vraie couverture des non-enregistrés.","consequence":"Le retard est douloureux — un mois de soudure passe avant que l’argent ne coule. Mais le modèle s’entraîne sur la réalité actuelle, y compris des ménages qu’aucune liste n’avait jamais captés. Les leaders communautaires parlent de la sélection la plus juste qu’ils aient vue.","reflection":"Parfois, l’usage responsable de l’IA consiste à ralentir pour lui donner des intrants honnêtes. La collecte fondée sur le consentement incarne aussi la norme de protection des données demandée par la Résolution TIC.","impacts":{"impartiality":2,"doNoHarm":1,"humanity":-1}},{"id":"tu-1c","label":"Croiser registre et indicateurs satellites","detail":"Matériaux de toiture, végétation, accès routier comme indicateurs de besoin. Bon marché, rapide, sans nouvelle enquête.","consequence":"La couverture est rapide et large. Mais les indicateurs trompent sur des groupes entiers : les pasteurs dont la richesse marche à quatre pattes sont notés comme démunis, tandis que des familles appauvries sous des toits solides sont notées comme aisées. Corriger les erreurs prend plus longtemps que l’enquête.","reflection":"Les variables indirectes encodent des hypothèses sur ce à quoi ressemble la pauvreté. Quand les hypothèses sont fausses, le biais est systématique — il frappe les mêmes types de ménages à chaque fois, c’est-à-dire l’inverse de l’impartialité.","impacts":{"impartiality":-1,"doNoHarm":-1,"humanity":1}}]},{"id":"tu-2","title":"Les angles morts du modèle","narrative":"Les résultats de validation arrivent : la précision globale semble solide, mais les ménages dirigés par des femmes et un groupe ethnique minoritaire sont systématiquement classés plus bas que ce que les évaluations de terrain indiquent. Le cabinet dit que l’écart est « dans la tolérance acceptable ». La date limite de décaissement est dans dix jours.","options":[{"id":"tu-2a","label":"Déployer pour tenir le délai","detail":"L’argent circule à temps. Le biais connu part dans un document de « leçons apprises ».","consequence":"15 000 ménages reçoivent l’argent comme prévu — mais les exclus comptent une part disproportionnée de ménages dirigés par des femmes. Le bureau des appels est débordé, et un animateur radio local demande pourquoi l’ordinateur a « oublié les veuves ».","reflection":"Un biais connu et non corrigé n’est pas une note technique de bas de page ; c’est une décisi
