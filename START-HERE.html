a till.","consequence":"Bemanningsgraden når 98%. Inom tre månader blir sex av era mest erfarna frivilliga utmattade och slutar samtidigt. Systemet anpassar sig genom att pressa nästa villiga grupp hårdare.","reflection":"När man optimerar för ett enda mått blir allt annat osynligt. Frivilligas välbefinnande är en del av humaniteten — den gäller både dem som hjälper och dem som får hjälp.","impacts":{"humanity":-2,"doNoHarm":-1}},{"id":"vr-2b","label":"Bygg in gränser och vila","detail":"Ett högsta antal pass per vecka, obligatorisk vila efter nattpass och ett ”nej tack” som aldrig räknas någon till nackdel.","consequence":"Bemanningsgraden sjunker till 90% och ni rekryterar för att fylla luckorna. Betydligt fler frivilliga stannar kvar och den pensionerade läraren kommer tillbaka efter en månads vila.","reflection":"Bra system bygger in omsorg. Regler som skyddar människor från överbelastning är humanitära skyddsåtgärder, inte ineffektivitet.","impacts":{"humanity":2,"doNoHarm":1}},{"id":"vr-2c","label":"Låt de frivilliga se och påverka reglerna","detail":"Publicera hur schemat läggs och inrätta en frivilligpanel som kan ändra prioriteringarna.","consequence":"Panelen efterfrågar rättvisa mellan språkgrupper och rullande helgpass. Det tar längre tid att ändra systemet, men förtroendet för det blir mycket större.","reflection":"Öppenhet om hur beslut fattas gör det möjligt att ifrågasätta dem. Gemensamma regler är lättare att acceptera än dolda.","impacts":{"humanity":1,"impartiality":1,"doNoHarm":1}}]},{"id":"vr-3","title":"Meddelanden som aldrig tar slut","narrative":"Leverantören föreslår en AI-chattassistent som skickar personliga meddelanden, påminnelser och ”motiverande puffar” till varje frivillig. En stor språkmodell skriver varje meddelande från grunden — ungefär 30 000 meddelanden i månaden på polska, ukrainska och engelska.","options":[{"id":"vr-3a","label":"Aktivera personliga AI-meddelanden","detail":"Varma, anpassade meddelanden på tre språk, genererade ett i taget.","consequence":"De frivilliga tycker först att meddelandena är trevliga, sedan märkliga — en får ”vi saknar dig!” medan hon ligger på sjukhus. Energirapporten visar att meddelandena nu står för systemets största energianvändning, för texter som säger ungefär samma sak varje gång.","reflection":"Att generera ny text för varje rutinmeddelande mångdubblar beräkningarna för liten nytta. Generativ AI är inte gratis: varje meddelande kostar energi och vatten.","impacts":{"doNoHarm":-2,"humanity":-1}},{"id":"vr-3b","label":"Mänskligt skrivna mallar på varje språk","detail":"Frivilliga från varje språkgrupp skriver korta meddelandemallar en gång. Systemet fyller i namn och tider.","consequence":"Meddelandena låter som riktiga människor eftersom riktiga människor har skrivit dem. Beräkningsbehovet minskar till nästan ingenting och de frivilliga uppskattar att skriva mallarna tillsammans.","reflection":"Ofta är rätt mängd AI mindre AI. Att återanvända mänskligt skriven text är billigare, resurssnålare och mer förtroendeingivande.","impacts":{"doNoHarm":2,"humanity":1,"independence":1}},{"id":"vr-3c","label":"Färre meddelanden, på de frivilligas villkor","detail":"De frivilliga väljer hur och hur ofta de vill bli kontaktade. Standardinställningen är en sammanfattning i veckan.","consequence":"Antalet meddelanden minskar med 80%. Vissa pass fylls lite långsammare, men de frivilliga säger att de känner sig respekterade i stället för jagade.","reflection":"Att låta människor sätta sina egna gränser minskar både pressen och miljöpåverkan.","impacts":{"doNoHarm":1,"humanity":1}}]},{"id":"vr-4","title":"En begäran från myndigheterna","narrative":"De regionala myndigheterna ber om uppgifter från ert frivilligschema — namn, nationalitet och tillgänglighet — för att planera sina egna insatser inom civilt försvar. Systemet kan exportera allt med ett klick. Många av era frivilliga är ukrainska medborgare med tillfälligt skydd.","options":[{"id":"vr-4a","label":"Dela hela exporten","detail":"Gott samarbete med myndigheterna stärker den samlade insatsen.","consequence":"Uppgifterna används för planering och senare för att kontrollera uppehållsstatus. De frivilliga får veta det genom en lokal nyhetsrapport. Rekryteringen av ukrainska frivilliga rasar.","reflection":"Uppgifter som lämnats för ett syfte och används för ett annat sviker förtroendet — och kan äventyra rörelsens självständighet och neutralitet i de berörda samhällenas ögon.","impacts":{"independence":-2,"neutrality":-1,"doNoHarm":-2}},{"id":"vr-4b","label":"Dela bara sammanställda siffror","detail":"Erbjud antal per kompetens, språk och distrikt — inga namn eller nationaliteter.","consequence":"Myndigheterna får vad de behöver för planeringen. Först muttrar de, sedan använder de ert format som mall för andra organisationer.","reflection":"Ändamålsbegränsning innebär att dela det som behövs för det angivna syftet, och inget mer. Sammanställda uppgifter skyddar individer och möjliggör samtidigt samarbete.","impacts":{"independence":1,"neutrality":1,"doNoHarm":2}},{"id":"vr-4c","label":"Be de frivilliga att aktivt samtycka","detail":"Förklara begäran och låt varje frivillig bestämma om de vill finnas med på myndigheternas lista.","consequence":"Ungefär hälften samtycker. Resten är tacksamma för att ha blivit tillfrågade. Det tar tre veckor — myndigheterna tycker att det är långsamt, men accepterar det.","reflection":"Samtycke och öppenhet låter människor behålla kontrollen över sina egna uppgifter, även när begäran kommer från en samarbetspartner.","impacts":{"independence":1,"doNoHarm":1,"humanity":1}}]}]},{"id":"heat-wave","title":"Värmekartan","tagline":"AI-prognoser för att skydda äldre under en värmebölja på Sicilien","role":"Ansvarig för akut hälso- och sjukvård, Röda Korsets regionala kommitté i Palermo","context":"Sommartemperaturerna på Sicilien överstiger nu regelbundet 45°C. Förra juli dog äldre ensamboende i sina lägenheter innan någon hann se till dem. Ett europeiskt forskningskonsortium erbjuder en AI-modell som kombinerar väderprognoser, journaluppgifter, telefondata och satellitbilder för att förutse vilka gator och människor som löper störst risk — så att era frivilliga vet var de ska knacka på först. För att köra modellen krävs ett kraftfullt datorkluster i Nordeuropa.","topics":["Prediktiv AI","Klimatanpassning","Energiförbrukning"],"roles":["Akut hälso- och sjukvård","Informationshantering","Lokalsamhällets delaktighet"],"debrief":"Värmekartan belyser en svår paradox: AI som används för att hantera klimatförändringarna kan själv bidra till den energi- och resursanvändning som driver dem. Prognoser kan rädda liv, men bara om de inte utestänger människor som modellen inte ser, inte samlar in mer data än nödvändigt och dimensioneras med en ärlig bedömning av sin egen miljöpåverkan.","steps":[{"id":"hw-1","title":"Hur stor modell behövs?","narrative":"Konsortiets modell är enorm: den bearbetar europeiska satellitbilder och klimatsimuleringar på nytt med några timmars mellanrum. Din informationsansvariga uppskattar att en sommars drift skulle förbruka lika mycket el som en liten siciliansk by. Ett lokalt universitet erbjuder ett enklare alternativ: ett statistiskt värmeriskindex som bygger på prognoser, byggnaders ålder och åldersuppgifter per bostadsområde.","options":[{"id":"hw-1a","label":"Använd den stora AI-modellen","detail":"De mest exakta prognoserna som finns — med samma energiförbrukning som en by.","consequence":"Prognoserna är utmärkta för stadskärnan. Men modellens stora beräkningsbehov gör att den bara körs två gånger om dagen, och dess stora miljöpåverkan blir en nyhet i italiensk press: ”Röda Korset bekämpar värme med en maskin som värmer planeten”.","reflection":"Verktyg för klimatanpassning måste bedömas utifrån sin egen klimatpåverkan. Den kraftfullaste modellen är inte automatiskt den mest humana.","impacts":{"humanity":1,"doNoHarm":-2}},{"id":"hw-1b","label":"Använd det enkla värmeriskindexet","detail":"Mindre exakt, kan köras på en bärbar dator och går att förklara för alla frivilliga.","consequence":"Indexet pekar ut samma högriskområden i 90% av fallen. De frivilliga förstår varför en gata är röd och lokala företrädare kan korrigera underlaget — vilket de gör genom att lägga till två bostadsområden som saknades i uppgifterna.","reflection":"Enkla, förklarbara modeller öppnar för delaktighet och rättelser. Ändamålsenligt är ofta bättre än det allra senaste.","impacts":{"doNoHarm":2,"humanity":1,"independence":1}},{"id":"hw-1c","label":"Stor modell, men bara vid värmevarningar","detail":"Kör den stora modellen bara när den nationella myndigheten utfärdar en röd varning.","consequence":"Energianvändningen minskar med 80%. Men modellen får en ”kallstart” på varningsdagarna och behöver timmar för att ge användbara resultat — den första och dödligaste dagen är den som täcks sämst.","reflection":"Att begränsa användningen är en god utgångspunkt. Men kompromisser måste prövas mot när människor faktiskt löper störst risk.","impacts":{"doNoHarm":1,"humanity":-1}}]},{"id":"hw-2","title":"Vem är osynlig?","narrative":"Modellen bygger på telefondata och registrerade journaluppgifter. Era frivilliga påpekar vilka som saknas: papperslösa migrantarbetare inom jordbruket som bor i informella bosättningar utanför staden och äldre utan smarttelefon. Ingen av grupperna syns på värmekartan.","options":[{"id":"hw-2a","label":"Lita på kartan","detail":"Antalet frivilliga är begränsat. Gå dit uppgifterna visar att risken är störst.","consequence":"Besöken är effektiva och många liv skyddas i staden. I en informell bosättning nära Campobello läggs två lantarbetare in på sjukhus med värmeslag. Ingen hade besökt dem.","reflection":"Data visar vilka som räknas, inte vilka som är i fara. Att fördela hjälp enbart utifrån data kan i det tysta utestänga de mest utsatta.","impacts":{"impartiality":-2,"humanity":-1}},{"id":"hw-2b","label":"Avsätt team för dem som saknas på kartan","detail":"En tredjedel av frivilligkapaciteten går till platser och grupper som uppgifterna inte fångar upp, med vägledning från lokala kontakter.","consequence":"Täckningen i staden blir något glesare. Besöken i bosättningarna ger vatten, skugga och tidig behandling till hundratals arbetare som modellen aldrig visste fanns.","reflection":"Opartiskhet innebär hjälp efter behov, inte efter synlighet. Mänsklig kunskap måste korrigera uppgifternas blinda fläckar.","impacts":{"impartiality":2,"humanity":1}},{"id":"hw-2c","label":"Samla in mer data om dem som saknas","detail":"Be migrantarbetare registrera sin plats i en mobilapp så att modellen kan ta med dem.","consequence":"Få registrerar sig — många är rädda för migrationsmyndigheterna. De som gör det skapar en datamängd som konsortiet senare ber att få dela med andra partner.","reflection":"Att göra osynliga människor synliga för ett system kan utsätta dem för nya risker. Ibland är det säkrare att arbeta utan dessa uppgifter än att fylla luckorna.","impacts":{"impartiality":1,"doNoHarm":-2}}]},{"id":"hw-3","title":"Att kyla servrarna","narrative":"Konsortiet föreslår att ett lokalt datorkluster installeras i Palermo för att göra prognoserna snabbare. Under en värmebölja skulle servrarna själva behöva ständig luftkonditionering — med el från samma ansträngda elnät som håller äldres fläktar i gång. Under förra årets värmebölja blev delar av staden strömlösa.","options":[{"id":"hw-3a","label":"Installera det lokala klustret","detail":"Snabbare prognoser, lokal kontroll.","consequence":"På den hetaste dagen ber nätoperatören om frivilliga neddragningar. Era servrar fortsätter att köras — och kylas — medan två bostadsområden har roterande strömavbrott.","reflection":"AI-infrastruktur konkurrerar med människor om energi och vatten, ibland just när båda resurserna är som knappast. Den konkurrensen är en humanitär fråga.","impacts":{"doNoHarm":-2,"humanity":-1}},{"id":"hw-3b","label":"Välj en resurssnål lösning med solenergi","detail":"Kör det enkla indexet på bärbara datorer i ledningscentralen, med el från solpaneler på taket och batterireserv.","consequence":"Systemet fungerar även under strömavbrottet. Batterierna håller också ledningscentralens telefoner och läkemedelskylskåp i gång.","reflection":"Motståndskraftig, energisnål utformning skyddar verksamheten när infrastrukturen sviktar — just då krisverktyg behövs mest.","impacts":{"doNoHarm":2,"independence":1}},{"id":"hw-3c","label":"Gör beräkningarna i Nordeuropa med förnybar energi","detail":"Låt de tunga beräkningarna ske i ett vattenkraftsdrivet datacenter i Norge eller Sverige.","consequence":"Det lokala elnätet skonas och elen är förnybar. Men uppkopplingen under värmeböljan är opålitlig och ni är beroende av en förbindelse som ni inte kontrollerar när den behövs som mest.","reflection":"Att flytta beräkningar till ren energi minskar utsläppen men inte beroendet. Väg in både miljöpåverkan och vem som behåller kontrollen i en kris.","impacts":{"doNoHarm":1,"independence":-1}}]},{"id":"hw-4","title":"Att knacka på dörren","narrative":"På varningsdagar ger systemet varje frivillig en adresslista rangordnad efter beräknad risk. En frivillig frågar: ”Vad säger jag när en äldre man frågar varför vi valde honom?” En annan berättar att vissa boende känner sig stämplade som ”på väg att dö”.","options":[{"id":"hw-4a","label":"Förklara inte — hjälp bara","detail":"Modellen är för komplicerad för att förklara vid dörren.","consequence":"De flesta tar emot besöket. Några öppnar inte dörren. Ett rykte sprids om att Röda Korset har hemliga listor från sjukhuset.","reflection":"När människor inte vet varför de har valts ut fylls tomrummet av misstänksamhet. Brist på insyn urholkar det förtroende som humanitärt arbete bygger på.","impacts":{"doNoHarm":-1,"humanity":-1}},{"id":"hw-4b","label":"Förklara enkelt och ge möjlighet att avstå","detail":"En enkel formulering: ”Den här gatan är varm och här bor många äldre. Vill du att vi tittar till dig under värmeböljan?” Människor kan säga nej och tas bort från listan.","consequence":"Nästan alla säger ja. Några avstår och deras val respekteras. Grannar börjar tipsa de frivilliga om andra som bor ensamma.","reflection":"Att tydligt förklara varför hjälp erbjuds — och acceptera ett nej — respekterar människors värdighet och gör en prognos till en relation.","impacts":{"humanity":2,"doNoHarm":1}},{"id":"hw-4c","label":"Låt bostadsområdena ansvara för listan","detail":"Dela värmekartan på områdesnivå med församlingsgrupper och boendeföreningar, som bestämmer vilka de ska se till.","consequence":"Täckningen blir ojämn — stark i välorganiserade områden, svag på andra håll. Men där det fungerar fortsätter tillsynen hela sommaren, utan att någon modell behövs.","reflection":"Att ge lokalsamhällen ansvar bygger varaktig kapacitet, men ni behöver fortfarande uppmärksamma dem som saknar en stark gemenskap omkring sig.","impacts":{"humanity":1,"independence":1,"impartiality":-1}}]}]}]},"settings":{"_help":"Weights multiply every choice's impact for that principle. 1 = normal, 2 = counts double, 0.5 = counts half, 0 = ignored. strongShare = share of the best possible score needed for 'Strong' (0.5 = half).","weights":{"humanity":1,"impartiality":1,"neutrality":1,"independence":1,"doNoHarm":1},"strongShare":0.5}};</script>

(function () {
  "use strict";

  var NAMES = { en: "English", sv: "Svenska", fr: "Français", es: "Español", ar: "العربية", de: "Deutsch", it: "Italiano", pt: "Português", nl: "Nederlands", pl: "Polski", uk: "Українська", ru: "Русский" };
  var RTL = ["ar", "fa", "he", "ur"];
  // Languages = every content/i18n-xx.json file (English first). Optional "languageName" in the file sets the menu label.
  var LANGS = Object.keys(window.GAME_DATA.i18n).sort(function (a, b) { return a === "en" ? -1 : b === "en" ? 1 : 0; })
    .map(function (c) { return [c, window.GAME_DATA.i18n[c].languageName || NAMES[c] || c]; });
  var KEYS = ["humanity", "impartiality", "neutrality", "independence", "doNoHarm"];
  var ACCENT = {
    "flood-line": "accent-flood", "targeting-unseen": "accent-sahel", "front-line": "accent-conflict",
    "cloud-question": "accent-cloud", "edge-network": "accent-edge", "signals-noise": "accent-signals",
    "outbreak-signal": "accent-outbreak", "boardroom-test": "accent-governance",
    "clinic-notes": "accent-clinic", "invoice-engine": "accent-invoice", "volunteer-roster": "accent-roster", "heat-wave": "accent-heat",
  };
  var ICONS = {
    humanity: "M12 21s-7-4.5-9.5-9A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.5 6C19 16.5 12 21 12 21z",
    impartiality: "M12 3v18M5 7h14M5 7l-3 7h6zM19 7l-3 7h6z",
    neutrality: "M4 12h16M12 4a8 8 0 1 0 0 16a8 8 0 1 0 0-16z",
    independence: "M12 3l3 6 6 .9-4.5 4.3 1 6.3L12 17.6 6.5 20.5l1-6.3L3 9.9 9 9z",
    doNoHarm: "M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z",
  };
  var STORE = "hai-game-v1";
  var D = window.GAME_DATA;
  var SET = D.settings || {};
  var W = {}; KEYS_W(); function KEYS_W() { ["humanity", "impartiality", "neutrality", "independence", "doNoHarm"].forEach(function (k) { var w = SET.weights && SET.weights[k]; W[k] = typeof w === "number" ? w : 1; }); }
  var SHARE = typeof SET.strongShare === "number" ? SET.strongShare : 0.5;

  // ---------- saved state (only on this device) ----------
  var saved = {};
  try { saved = JSON.parse(localStorage.getItem(STORE) || "{}"); } catch (e) {}
  var state = {
    lang: saved.lang || "en", mode: saved.mode === "workshop" ? "workshop" : "solo",
    progress: saved.progress || {}, drafts: saved.drafts || {},
    view: "home", id: null, phase: "briefing", play: null, selected: null, more: false, copied: false,
  };
  var timer = { minutes: 3, left: 180, running: false, handle: null };
  function save() {
    try { localStorage.setItem(STORE, JSON.stringify({ lang: state.lang, mode: state.mode, progress: state.progress, drafts: state.drafts })); } catch (e) {}
  }

  // ---------- content with English fallback ----------
  function ui() { return Object.assign({}, D.i18n.en, D.i18n[state.lang] || {}); }
  function scenarios() {
    var local = D.scenarios[state.lang] || [];
    return D.scenarios.en.map(function (s) { return local.find(function (l) { return l.id === s.id; }) || s; });
  }
  function current() { return scenarios().find(function (x) { return x.id === state.id; }); }

  // ---------- scoring ----------
  function empty() { var o = {}; KEYS.forEach(function (k) { o[k] = 0; }); return o; }
  function findOption(s, stepId, optId) {
    var st = s.steps.find(function (x) { return x.id === stepId; });
    return st && st.options.find(function (o) { return o.id === optId; });
  }
  function totalsFor(s, choices) {
    var t = empty();
    choices.forEach(function (c) { var o = findOption(s, c.stepId, c.optionId); if (o) KEYS.forEach(function (k) { t[k] += (o.impacts[k] || 0) * W[k]; }); });
    return t;
  }
  function boundsFor(s) {
    var max = empty(), min = empty();
    s.steps.forEach(function (st) {
      KEYS.forEach(function (k) {
        var v = st.options.map(function (o) { return (o.impacts[k] || 0) * W[k]; });
        max[k] += Math.max.apply(null, v.concat(0)); min[k] += Math.min.apply(null, v.concat(0));
      });
    });
    return { max: max, min: min };
  }
  function done(s) { return (state.progress[s.id] || []).length === s.steps.length; }
  function rating(t, v, max, min) {
    if (max === 0 && min === 0) return [t.ratingNotTested, "warning"];
    if (v > 0 && v >= max * SHARE) return [t.ratingStrong, "success"];
    if (v >= 0) return [t.ratingMixed, "warning"];
    return [t.ratingAtRisk, "danger"];
  }
  function verdict(t, totals, max) {
    var net = 0, best = 0; KEYS.forEach(function (k) { net += totals[k]; best += max[k]; });
    if (net < 0) return [t.verdictAtRisk, "danger"];
    if (best > 0 && net >= best * SHARE) return [t.verdictStrong, "success"];
    return [t.verdictMixed, "warning"];
  }
  // Workshop: option with most votes (ties → earlier option), or none if nobody voted.
  function leading(votes, ids) {
    var best = null, max = 0;
    ids.forEach(function (id) { var v = (votes && votes[id]) || 0; if (v > max) { max = v; best = id; } });
    return best;
  }
  function split(t, st, v) {
    return st.options.map(function (o, j) { return t.optionLetters[j] + " " + ((v && v[o.id]) || 0); }).join(" · ");
  }
  function hasVotes(v) { return v && Object.keys(v).some(function (k) { return v[k]; }); }

  // ---------- tiny html helpers ----------
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function raw(s, v) { return String(s).replace(/\{(\w+)\}/g, function (m, k) { return k in v ? v[k] : m; }); }
  function fmt(s, v) { return esc(raw(s, v)); }
  function icon(k) { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="' + ICONS[k] + '"/></svg>'; }
  function pname(t, k) { var p = t.principles.find(function (x) { return x.key === k; }); return p ? p.name : k; }
  function langSelect(t) {
    return '<select data-lang aria-label="' + esc(t.languageLabel) + '">' + LANGS.map(function (l) {
      return '<option value="' + l[0] + '"' + (l[0] === state.lang ? " selected" : "") + ">" + l[1] + "</option>";
    }).join("") + "</select>";
  }
  function impacts(t, imp) {
    return KEYS.filter(function (k) { return imp[k]; }).map(function (k) {
      var v = imp[k];
      return '<span class="impact pc-' + k + (v < 0 ? " neg" : "") + '">' + icon(k) + esc(pname(t, k)) + " " + (v > 0 ? "+" + v : "−" + Math.abs(v)) + "</span>";
    }).join("");
  }
  function meter(t, k, v, max, min) {
    var p = t.principles.find(function (x) { return x.key === k; });
    var pct = Math.min(Math.abs(v) / Math.max(max, Math.abs(min), 1), 1) * 50;
    var r = rating(t, v, max, min);
    var fill = v === 0 ? "" : '<div class="fill" style="' + (v > 0
      ? "inset-inline-start:50%;width:" + pct + "%;background:var(--pc)"
      : "inset-inline-end:50%;width:" + pct + "%;background:var(--bad);opacity:.7") + '"></div>';
    return '<div class="box meter pc-' + k + '"><div class="head"><span class="icon">' + icon(k) + "</span><p>" + esc(p.name) +
      '</p><span class="tone ' + r[1] + '">' + esc(r[0]) + (v ? " (" + (v > 0 ? "+" : "") + v + ")" : "") + "</span></div>" +
      '<div class="track" role="img" aria-label="' + esc(p.name + ": " + r[0] + ", " + v) + '"><div class="mid"></div>' + fill + "</div>" +
      '<p class="muted">' + esc(p.description) + "</p></div>";
  }
  // Scenario colours: built-in palette by id, or "colors": ["#hex", "#hex"] in the scenario JSON.
  function accent(s) {
    var c = s.colors && s.colors.length === 2 ? ' style="--acc:' + esc(s.colors[0]) + ";--acc2:" + esc(s.colors[1]) + '"' : "";
    return 'class="' + (ACCENT[s.id] || "accent-brand") + '"' + c;
  }
  function box(label, html) { return '<section class="box"><p class="label">' + esc(label) + "</p>" + html + "</section>"; }

  // ---------- home ----------
  function home(t) {
    var list = scenarios(), totals = empty(), max = empty(), min = empty(), count = 0;
    list.forEach(function (s) {
      if (!done(s)) return; count++;
      var tt = totalsFor(s, state.progress[s.id]), b = boundsFor(s);
      KEYS.forEach(function (k) { totals[k] += tt[k]; max[k] += b.max[k]; min[k] += b.min[k]; });
    });
    var modes = ["solo", "workshop"].map(function (m) {
      return '<button class="mode" role="radio" data-mode="' + m + '" aria-checked="' + (state.mode === m) + '"><b>' +
        esc(m === "solo" ? t.modeSolo : t.modeWorkshop) + "</b><small>" + esc(m === "solo" ? t.modeSoloHint : t.modeWorkshopHint) + "</small></button>";
    }).join("");
    var guide = state.mode === "workshop" ? '<details class="box"><summary>' + esc(t.guideHeading) + ' +</summary><ol class="guide" style="padding:0;list-style:none">' +
      t.guideSteps.map(function (g, i) { return '<li><span class="letter">' + (i + 1) + "</span><span>" + esc(g) + "</span></li>"; }).join("") +
      '</ol><p class="muted" style="margin-top:12px;font-size:12px">' + esc(t.guideNote) + "</p></details>" : "";
    var record = count ? '<section class="box"><h2>' + esc(t.recordHeading) + '</h2><p class="muted">' + fmt(t.recordSummary, { n: count }) +
      '</p><div class="grid two">' + KEYS.map(function (k) { return meter(t, k, totals[k], max[k], min[k]); }).join("") + "</div></section>" : "";
    var cards = list.map(function (s) {
      var dr = state.drafts[s.id];
      var go = dr ? fmt(t.inProgress, { i: dr.choices.length + 1, n: s.steps.length }) + " · " + esc(t.resume)
        : esc(done(s) ? t.playAgain : t.startScenario);
      return '<li ' + accent(s) + '><button class="scard" data-open="' + esc(s.id) + '"><div class="strip grad"></div><div class="body"><div class="titlerow"><h3>' + esc(s.title) + "</h3>" +
        (done(s) ? '<span class="chip">✓</span>' : "") + '</div><span class="muted clamp2">' + esc(s.tagline) + "</span><div>" +
        s.topics.slice(0, 2).map(function (x) { return '<span class="chip">' + esc(x) + "</span>"; }).join("") + '</div><span class="go">' + go + " →</span></div></button></li>";
    }).join("");
    var principles = t.principles.map(function (p) {
      return '<li class="prow pc-' + p.key + '"><span class="icon">' + icon(p.key) + "</span><div><b>" + esc(p.name) + '</b><p class="muted">' + esc(p.description) + "</p></div></li>";
    }).join("");
    return '<div class="accent-brand"><header class="grad"><div class="wrap hero"><div class="top">' + langSelect(t) + '</div><p class="kicker" style="margin-top:24px">' +
      esc(t.kicker) + "</p><h1>" + esc(t.appTitle) + '</h1><p class="intro">' + esc(t.intro) + '</p></div></header><main class="wrap stack"><div class="modes" role="radiogroup">' + modes + "</div>" + guide +
      '<section><div class="rowhead"><h2>' + esc(t.scenariosHeading) + '</h2><span class="muted">' + fmt(t.progressOverall, { n: count, m: list.length }) +
      '</span></div><div class="pbar"><div style="width:' + (count / list.length) * 100 + '%"></div></div><ul class="grid two">' + cards + "</ul></section>" + record +
      '<details class="box"><summary>' + esc(t.principlesHeading) + ' +</summary><ul class="grid">' + principles + "</ul></details>" +
      '<footer class="footer"><p>' + esc(t.footerNote) + '</p><a href="https://preparecenter.org/site/ict-resolution/" target="_blank" rel="noreferrer">' +
      esc(t.ictLinkLabel) + "</a></footer></main></div>";
  }

  // ---------- scenario ----------
  function scenario(t) {
    var s = current(), n = s.steps.length, ph = state.phase, play = state.play || { choices: [], mode: state.mode, votes: {} };
    var ch = play.choices, ws = play.mode === "workshop";
    var idx = ph === "consequence" ? ch.length - 1 : ch.length;
    var step = s.steps[Math.min(idx, n - 1)];
    var sv = play.votes[step.id];
    var chosen = state.selected || (ws ? leading(sv, step.options.map(function (o) { return o.id; })) : null);
    var inPlay = ph === "decision" || ph === "consequence";
    var dots = inPlay ? '<ol class="tl" aria-label="' + esc(t.progressLabel) + '">' + s.steps.map(function (st, i) {
      var c = i < ch.length ? "done" : i === idx ? "now" : "";
      return '<li class="' + c + '"' + (c === "now" ? ' aria-current="step"' : "") + '><span class="tc">' + (c === "done" ? "✓" : i + 1) + "</span>" + (i < n - 1 ? '<span class="tline"></span>' : "") + "</li>";
    }).join("") + "</ol>" : "";
    var body = "", dock = "";

    if (ph === "briefing") {
      var prev = state.progress[s.id] || [], dr = state.drafts[s.id];
      body = '<div class="banner grad"><p class="kicker">' + fmt(t.scenarioKicker, { n: n }) + "</p><h1>" + esc(s.title) + "</h1><p>" + esc(s.tagline) + "</p></div>" +
        box(t.yourRole, "<b>" + esc(s.role) + "</b>") + box(t.theSituation, esc(s.context)) +
        '<div><p class="muted" style="font-weight:600;margin-bottom:8px">' + esc(t.roadmapLabel) + '</p><ol class="steps">' +
        s.steps.map(function (st, i) { return '<li><span class="letter">' + (i + 1) + "</span>" + esc(st.title) + "</li>"; }).join("") + "</ol></div>" +
        (dr ? '<button class="btn" data-act="resume">' + esc(t.resume) + " · " + fmt(t.inProgress, { i: dr.choices.length + 1, n: n }) + "</button>" : "") +
        '<div class="modebtns">' + [["solo", t.playSolo, t.modeSoloHint], ["workshop", t.startWorkshop, t.modeWorkshopHint]].map(function (m) {
          return '<button class="modebtn' + (state.mode === m[0] ? " on" : "") + '" data-begin="' + m[0] + '"><b>' + esc(m[1]) + " →</b><small>" + esc(m[2]) + "</small></button>";
        }).join("") + "</div>" +
        (prev.length === n ? '<button class="linkbtn" data-act="review">' + esc(t.debriefHeading) + "</button>" : "");
    } else if (ph === "decision") {
      var mm = String(Math.floor(timer.left / 60)).padStart(2, "0"), ss = String(timer.left % 60).padStart(2, "0");
      body = '<p class="acc" style="font-weight:600;font-size:14px">' + fmt(t.decisionOf, { scenario: s.title, i: idx + 1, n: n }) + "</p><div class=\"scene\"><h1>" + esc(step.title) +
        '</h1><p style="font-size:18px;margin-bottom:0">' + esc(step.narrative) + "</p></div>" +
        (ws ? '<section class="discuss"><h2 style="font-size:18px">' + esc(t.discussHeading) + "</h2><ul>" +
          t.discussPrompts.map(function (q) { return "<li>" + esc(q) + "</li>"; }).join("") + '</ul><div class="timer" aria-live="polite"><div class="row"><span>' + esc(t.timer) +
          '</span><button class="round" data-timer="-1">−</button><span class="clock" dir="ltr" data-clock>' + mm + ":" + ss +
          '</span><button class="round" data-timer="1">+</button></div><div class="two-btn"><button class="btn small" data-timer="toggle"' + (timer.left ? "" : " disabled") + ">" +
          esc(timer.running ? t.timerPause : t.timerStart) + '</button><button class="btn ghost small" data-timer="reset">' + esc(t.timerReset) + "</button></div>" +
          (timer.left ? "" : '<p class="acc" style="font-weight:600;font-size:14px">' + esc(t.timeUp) + "</p>") + "</div></section>" : "") +
        '<div><h2 style="font-family:var(--sans);font-size:16px">' + esc(ws ? t.voteHeading : t.whatDoYouDo) + '</h2><p class="muted">' + esc(ws ? t.voteHint : t.selectFirst) + '</p></div><div class="stack">' +
        step.options.map(function (o, i) {
          var on = chosen === o.id;
          return '<div class="optwrap' + (on ? " sel" : "") + '"><button class="opt" data-choose="' + esc(o.id) + '" aria-pressed="' + on + '"><span class="letter">' +
            (on ? "✓" : esc(t.optionLetters[i] || i + 1)) + "</span><span><b>" + esc(o.label) + "</b><small>" + esc(o.detail) + "</small></span></button>" +
            (ws ? '<div class="votes"><b>' + fmt(t.votes, { n: (sv && sv[o.id]) || 0 }) + '</b><button class="round" data-vote="' + esc(o.id) + '" data-d="-1">−</button><button class="round" data-vote="' +
              esc(o.id) + '" data-d="1">+</button></div>' : "") + "</div>";
        }).join("") + "</div>";
      dock = '<button class="btn" data-act="confirm"' + (chosen ? "" : " disabled") + ">" + esc(chosen ? t.confirmDecision : t.selectFirst) + "</button>";
    } else if (ph === "consequence") {
      var last = ch[ch.length - 1], o = findOption(s, last.stepId, last.optionId), end = ch.length === n;
      body = '<p class="acc" style="font-weight:600;font-size:14px">' + fmt(t.stepOf, { n: ch.length, m: n }) + '</p><div class="decided">' +
        (ws ? esc(t.groupChose + ": " + o.label) : fmt(t.youDecided, { label: o.label })) + "</div>" +
        box(t.whatHappened, esc(o.consequence)) + box(t.whyItMatters, esc(o.reflection)) +
        '<div><p class="muted" style="font-weight:600;margin-bottom:8px">' + esc(t.impactLabel) + "</p>" + impacts(t, o.impacts) + "</div>" +
        (ws ? '<div class="takeaways"><p class="label">' + esc(t.discussHeading) + "</p>" + esc(t.afterDiscuss) + "</div>" : "");
      dock = '<button class="btn" data-act="' + (end ? "debrief" : "next") + '">' + esc(end ? t.seeDebrief : t.nextDecision) + "</button>";
    } else {
      var tot = totalsFor(s, ch), b = boundsFor(s), v = verdict(t, tot, b.max);
      body = '<div class="banner grad"><p class="kicker">' + fmt(t.debriefKicker, { scenario: s.title }) + "</p><h1>" + esc(t.debriefHeading) + "</h1></div>" +
        '<p><span class="muted" style="font-weight:600">' + esc(t.overallVerdict) + ':</span> <span class="tone big ' + v[1] + '">' + esc(v[0]) + "</span></p>" +
        "<section><h2>" + esc(t.principlesBalance) + '</h2><div class="grid two">' + KEYS.map(function (k) { return meter(t, k, tot[k], b.max[k], b.min[k]); }).join("") + "</div></section>" +
        "<p>" + esc(s.debrief) + "</p><section><h2>" + esc(ws ? t.groupPath : t.pathYouTook) + '</h2><div class="grid">' +
        ch.map(function (c, i) {
          var st = s.steps.find(function (x) { return x.id === c.stepId; }), op = findOption(s, c.stepId, c.optionId), vv = play.votes[c.stepId];
          return '<div class="box"><p class="label" style="text-transform:none;letter-spacing:0">' + fmt(t.decisionLabel, { i: i + 1, title: st.title }) + "</p><b>" + esc(op.label) + "</b>" +
            (hasVotes(vv) ? '<p class="muted">' + fmt(t.splitVote, { votes: split(t, st, vv) }) + "</p>" : "") + '<div style="margin-top:8px">' + impacts(t, op.impacts) + "</div></div>";
        }).join("") + '</div></section><section class="takeaways"><h2>' + esc(t.takeawayHeading) + "</h2><ul>" +
        t.takeaways.map(function (q) { return "<li>" + esc(q) + "</li>"; }).join("") + "</ul></section>" +
        (ws ? '<div class="modebtns"><button class="btn ghost" data-act="copy">' + esc(state.copied ? "✓ " + t.copied : t.copySummary) +
          '</button><button class="btn ghost" data-act="download">' + esc(t.downloadSummary) + "</button></div>" : "") +
        '<button class="btn" data-act="replay">' + esc(t.replay) + '</button><button class="btn ghost" data-act="home">' + esc(t.chooseAnother) + "</button>";
    }
    return '<div ' + accent(s) + '><header class="bar"><div class="wrap"><span><button class="back" data-act="home">← ' + esc(t.allScenarios) + "</button>" +
      (ws && ph !== "briefing" ? '<span class="wbadge">' + esc(t.workshopBadge) + "</span>" : "") + "</span>" + langSelect(t) + "</div>" +
      '</header><main class="wrap stack' + (inPlay ? " pad" : "") + '">' + dots + body + "</main>" + (dock ? '<div class="dock">' + dock + "</div>" : "") + "</div>";
  }

  function summary(t) {
    var s = current(), p = state.play, lines = [t.appTitle + " — " + s.title, s.role, ""];
    p.choices.forEach(function (c, i) {
      var st = s.steps.find(function (x) { return x.id === c.stepId; }), o = findOption(s, c.stepId, c.optionId);
      lines.push(raw(t.decisionLabel, { i: i + 1, title: st.title }), t.groupChose + ": " + o.label);
      if (hasVotes(p.votes[c.stepId])) lines.push(raw(t.splitVote, { votes: split(t, st, p.votes[c.stepId]) }));
      lines.push("");
    });
    lines.push(t.takeawayHeading);
    t.takeaways.forEach(function (q) { lines.push("• " + q); });
    return lines.join("\n");
  }

  // ---------- render + events ----------
  var root = document.getElementById("app");
  var lastKey = "";
  function render() {
    var t = ui();
    document.documentElement.lang = state.lang;
    document.documentElement.dir = RTL.indexOf(state.lang) >= 0 ? "rtl" : "ltr";
    document.title = t.appTitle;
    root.innerHTML = state.view === "home" ? home(t) : scenario(t);
    // Only jump to the top when the screen changes, not on every vote tap.
    var key = state.view + state.id + state.phase + (state.play ? state.play.choices.length : "");
    if (key !== lastKey) window.scrollTo(0, 0);
    lastKey = key;
  }
  function stopTimer() { clearInterval(timer.handle); timer.running = false; }
  function resetTimer(m) { stopTimer(); timer.minutes = Math.min(15, Math.max(1, m)); timer.left = timer.minutes * 60; }
  function syncDraft() {
    var p = state.play, s = current();
    if (p.choices.length === s.steps.length) delete state.drafts[s.id]; else state.drafts[s.id] = p;
    save();
  }
  function begin(m) {
    state.mode = m; state.play = { choices: [], mode: m, votes: {} }; state.selected = null; state.phase = "decision";
    resetTimer(timer.minutes); syncDraft();
  }

  root.addEventListener("change", function (e) {
    if (e.target.matches("[data-lang]")) { state.lang = e.target.value; save(); render(); }
  });
  root.addEventListener("click", function (e) {
    var el = e.target.closest("[data-open],[data-choose],[data-act],[data-mode],[data-begin],[data-vote],[data-timer]");
    if (!el) return;
    var ds = el.dataset, s = state.id && current();
    if (ds.mode) { state.mode = ds.mode; save(); }
    else if (ds.open) { state.view = "scenario"; state.id = ds.open; state.phase = "briefing"; state.play = null; state.copied = false; }
    else if (ds.begin) begin(ds.begin);
    else if (ds.choose) state.selected = ds.choose;
    else if (ds.vote) {
      var st = s.steps[state.play.choices.length], v = state.play.votes[st.id] = state.play.votes[st.id] || {};
      v[ds.vote] = Math.max(0, (v[ds.vote] || 0) + Number(ds.d)); syncDraft();
    } else if (ds.timer) {
      if (ds.timer === "toggle") {
        if (timer.running) stopTimer();
        else {
          timer.running = true;
          timer.handle = setInterval(function () {
            timer.left = Math.max(0, timer.left - 1);
            if (!timer.left) { stopTimer(); render(); return; }
            var c = root.querySelector("[data-clock]");
            if (c) c.textContent = String(Math.floor(timer.left / 60)).padStart(2, "0") + ":" + String(timer.left % 60).padStart(2, "0");
          }, 1000);
        }
      } else if (ds.timer === "reset") resetTimer(timer.minutes);
      else resetTimer(timer.minutes + Number(ds.timer));
    } else {
      var a = ds.act, t = ui();
      if (a === "more") state.more = !state.more;
      if (a === "home") { stopTimer(); state.view = "home"; }
      if (a === "replay") begin(state.play.mode);
      if (a === "resume") { state.play = state.drafts[s.id]; state.mode = state.play.mode; state.selected = null; state.phase = "decision"; save(); }
      if (a === "review") { state.play = { choices: state.progress[s.id].slice(), mode: "solo", votes: {} }; state.phase = "debrief"; }
      if (a === "next") { state.phase = "decision"; resetTimer(timer.minutes); }
      if (a === "debrief") state.phase = "debrief";
      if (a === "confirm") {
        var step = s.steps[state.play.choices.length];
        var pick = state.selected || (state.play.mode === "workshop" ? leading(state.play.votes[step.id], step.options.map(function (o) { return o.id; })) : null);
        if (!pick) return;
        state.play.choices.push({ stepId: step.id, optionId: pick });
        state.selected = null; state.phase = "consequence"; stopTimer();
        if (state.play.choices.length === s.steps.length) state.progress[s.id] = state.play.choices.slice();
        syncDraft();
      }
      if (a === "copy") {
        if (navigator.clipboard) navigator.clipboard.writeText(summary(t)).then(function () { state.copied = true; render(); }, function () {});
        return;
      }
      if (a === "download") {
        var url = URL.createObjectURL(new Blob([summary(t)], { type: "text/plain;charset=utf-8" }));
        var link = document.createElement("a"); link.href = url; link.download = "workshop-" + s.id + ".txt";
        document.body.appendChild(link); link.click(); link.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 30000);
        return;
      }
    }
    render();
  });

  render();
})();

</script>
