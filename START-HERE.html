"Run the full participatory assessment first","detail":"Community representatives help test the tool, identify harms, and set mitigations. The season opener is missed.","consequence":"The first storm is handled with old methods — slower, but no worse than last year. The assessment finds the informal-settlement gap plus two harms nobody predicted, and the community-designed mitigations become part of the tool’s operating manual.","reflection":"The ICT Resolution’s community engagement commitment applies to risk, not just feedback: the people exposed to a tool’s failures are the experts on what those failures would mean.","impacts":{"doNoHarm":2,"impartiality":1,"humanity":-1}},{"id":"cq-3c","label":"Launch limited, with a kill switch","detail":"Deploy in two pilot districts only, with community feedback channels, human verification of low-confidence scores, and a pre-agreed shutdown trigger.","consequence":"The pilots surface the settlement gap within days, human verifiers catch most mis-scores, and when error rates cross your trigger in one district, the tool is paused there without drama. The tool improves storm by storm.","reflection":"When delay itself carries risk, a bounded launch with monitoring, human backstop, and a rehearsed kill switch is a legitimate harm-mitigation strategy — provided the limits are real and someone is empowered to pull the switch.","impacts":{"doNoHarm":1,"humanity":1}}]},{"id":"cq-4","title":"The renewal","narrative":"Three years in, your stack works — and is deeply woven into one vendor’s proprietary services. The renewal offer includes a discount for deeper integration. Your board asks for a recommendation.","options":[{"id":"cq-4a","label":"Deepen the integration for the discount","detail":"Best price, best features, one throat to choke. Lock-in becomes total.","consequence":"Budgets look great this year. Two years later the vendor is acquired, priorities shift, and your “simple” migration estimate comes back at eighteen months and a figure the board refuses to read aloud.","reflection":"Dependency compounds quietly. Every proprietary hook is a future invoice — financial, operational, or principled. Independence is preserved in procurement decisions made years before the crisis that tests it.","impacts":{"independence":-2,"doNoHarm":-1}},{"id":"cq-4b","label":"Renew with portability clauses and a tested exit plan","detail":"Open data formats, regular export drills, escrowed configurations, and an exit rehearsal every year.","consequence":"The vendor grumbles, then signs — your exit plan is why they keep the pricing honest. The first export drill fails embarrassingly; by the third, your team can stand up the registry elsewhere in nine days.","reflection":"An exit plan you have never tested is a hypothesis. Rehearsed portability converts dependency into a relationship you choose to continue — which is what independence looks like in practice.","impacts":{"independence":2,"doNoHarm":1}},{"id":"cq-4c","label":"Repatriate the core, rent only burst capacity","detail":"Registry and models move in-house; the vendor keeps only elastic compute for post-disaster surges.","consequence":"The transition costs a hard year and some features degrade. Afterwards, your critical systems answer to no vendor’s roadmap, and post-hurricane surges still scale — on infrastructure you can walk away from.","reflection":"Hybrid architectures can balance sovereignty with scale. The design question is always: which functions could we lose a vendor for tomorrow — and what would that loss cost affected people?","impacts":{"independence":1,"doNoHarm":1,"humanity":-1}}]}],"debrief":"The Cloud Question is about the infrastructure beneath every other AI decision. Where data lives decides who can reach it (data sovereignty); whose models you depend on shapes how parties and communities read your neutrality (vendor neutrality); and whether you can exit decides whether your choices are really yours (independence). Do-no-harm assessment belongs before deployment — and the communities most exposed to a tool’s failures belong inside that assessment."},{"id":"edge-network","title":"The Edge of the Network","tagline":"AI tools where connectivity and power are scarce in East Africa","role":"ICT & Innovation Officer, East Africa Regional Response","context":"Drought and displacement straddle a remote border region. Field teams and community volunteers need translation, case-note summaries, and referral guidance — but connectivity is patchy, electricity comes from generators and a few solar panels, and the nearest big datacenter is on another continent. You must decide what kind of AI, if any, belongs here.","topics":["Low-connectivity AI","Environmental footprint","Small language models"],"roles":["ICT & innovation","Field operations","Community engagement"],"steps":[{"id":"en-1","title":"Big model, small model, or none?","narrative":"A vendor demo shows a cloud AI assistant that answers field questions beautifully — over a connection your field sites do not have. The alternative is a small language model that runs offline on solar-charged tablets: less fluent, but always on. A third voice in the room says the honest answer might be no AI at all.","options":[{"id":"en-1a","label":"Deploy the cloud AI assistant","detail":"Best answers, richest language support — where there is signal. Every query rides on distant, energy-hungry datacenters.","consequence":"In the regional hub, staff love it. At the field sites — where the questions are — it mostly shows a spinning wheel. You learn later that each thousand queries also carried an invisible invoice: datacenter electricity and cooling water, in a region that counts both in jerrycans.","reflection":"Capability that only works where infrastructure already exists widens the gap between the connected and the cut off. Every AI query has an energy and water cost; in scarce settings that cost is part of the humanitarian calculation, not a footnote.","impacts":{"humanity":1,"doNoHarm":-1,"impartiality":-1}},{"id":"en-1b","label":"Run a small model on solar tablets","detail":"A compact model, downloaded once, runs fully offline. Answers are simpler and narrower — and available everywhere.","consequence":"Setup takes a fortnight of fine-tuning on your actual field guides. The small model stumbles on rare questions but handles the everyday ones — translation, referral steps, forms — at every site, in the dark, during outages. Its entire weekly energy use fits on one solar panel.","reflection":"Small language models trade polish for sovereignty: they run where people actually are, on a fraction of the energy and water of a large model, with no data leaving the device. Fit-for-purpose beats state-of-the-art.","impacts":{"doNoHarm":1,"independence":1,"impartiality":1}},{"id":"en-1c","label":"No AI — strengthen radio and paper","detail":"Invest in the field guides, the radio schedule, and the human referral network instead.","consequence":"Reliable, trusted, and zero new footprint — but translation backlogs grow, case notes pile up unprocessed, and night-shift volunteers keep improvising answers a trained small model could have handled.","reflection":"Declining AI is a legitimate choice with real costs. The question is not \"AI or principles\" but which tool, sized to the place, serves people best — and who decided, on what evidence.","impacts":{"humanity":-1,"doNoHarm":1}}]},{"id":"en-2","title":"Keeping it alive","narrative":"Whatever runs here must survive the infrastructure. The vendor offers a managed service: nightly satellite sync, automatic updates, remote monitoring — for a fee and a data stream home. Your field coordinator proposes a community-run alternative: solar charging hubs, a local mesh between sites, and data that syncs when teams reach connectivity.","options":[{"id":"en-2a","label":"Take the managed satellite service","detail":"Effortless updates and monitoring. A constant trickle of usage data flows to the vendor, and the monthly fee never ends.","consequence":"Everything stays current with zero staff effort. Six months in, a budget review cuts the subscription, and the tablets degrade gracefully into expensive paperweights — nobody local ever learned to maintain them.","reflection":"Convenience that cannot survive a budget line is fragility in disguise. Dependency is not only about data; it is about who holds the skills when the contract ends.","impacts":{"independence":-2,"doNoHarm":-1}},{"id":"en-2b","label":"Community-run solar hubs and local sync","detail":"Charging hubs at community centers, a mesh between sites, updates carried by teams as they travel. Slower, local, and owned.","consequence":"Updates arrive days, not seconds, after release. But the hubs become community infrastructure — phones charge there too — and the technicians who keep the system alive are neighbours of the people it serves.","reflection":"Infrastructure that communities own tends to outlive projects. Building local power, connectivity, and maintenance into the design is do-no-harm thinking applied to the long term.","impacts":{"independence":1,"doNoHarm":2,"humanity":-1}},{"id":"en-2c","label":"Hybrid: vendor cloud in the hub, offline at the edge","detail":"Heavy processing and updates happen in the connected hub; field sites stay offline-first.","consequence":"A workable compromise: the hub gets the vendor pipeline, the field keeps its autonomy. It demands disciplined architecture, though — twice you catch new features silently assuming connectivity, and push them back.","reflection":"Hybrid designs can balance reach and resilience, but only if offline-first is a rule vendors must obey, not a preference they can erode release by release.","impacts":{"independence":1,"doNoHarm":1}}]},{"id":"en-3","title":"The footprint question","narrative":"At a community meeting, a youth volunteer holds up a phone showing a news story: datacenters training large AI models consume vast electricity and millions of litres of cooling water — sometimes in drought regions like yours. She asks: \"How much water did your AI drink today?\"","options":[{"id":"en-3a","label":"Treat it as a PR question","detail":"Reassure the room that the vendor is \"committed to sustainability\" and move on.","consequence":"The meeting moves on; the question does not. The volunteer’s video about \"the NGO’s thirsty AI\" outperforms your last ten posts, and the team has no real numbers to answer with.","reflection":"Communities increasingly ask about the environmental cost of the tools used on them. \"The vendor says it is fine\" is not accountability — it is an unanswered question with a logo on it.","impacts":{"doNoHarm":-2,"independence":-1}},{"id":"en-3b","label":"Measure, disclose, and set a budget","detail":"Track queries, model sizes, and estimated energy and water; publish the numbers; set an efficiency budget per response.","consequence":"The first honest estimate is uncomfortable — the cloud queries dwarf everything else. You publish it anyway, set a cap, and the youth volunteer joins the review group that checks the numbers quarterly.","reflection":"You cannot manage a footprint you refuse to measure. Publishing the true cost — energy, water, extraction behind the hardware — turns an awkward question into an accountability practice communities can verify.","impacts":{"doNoHarm":2}},{"id":"en-3c","label":"Shift the default to the small model","detail":"Make the offline small model the default everywhere; reserve the large cloud model for rare, complex cases with human review.","consequence":"Cloud queries drop by 90%. A few nuanced answers get slower, because a human now checks them first — which turns out to improve them. The footprint question at the next meeting has a concrete answer.","reflection":"Frugality is a design principle: the lightest tool that does the job is usually the most humane one to run. Right-sizing models is harm mitigation for people and planet at once.","impacts":{"doNoHarm":2,"independence":1}}]},{"id":"en-4","title":"Who keeps it running?","narrative":"Eighteen months on, the system works. The grant that paid for it ends next quarter. Whatever happens next decides whether this was a project or a capability.","options":[{"id":"en-4a","label":"Renew the vendor maintenance contract","detail":"Simplest on paper: the vendor keeps patching, hosting the update pipeline, and holding the knowledge.","consequence":"The renewal is signed in a week. The knowledge stays where it has always been — outside. When the vendor discontinues the product line two years later, the handover document is a sales brochure for its successor.","reflection":"A system only its vendor understands is rented, not owned. Maintenance contracts are fine; depending on them for all knowledge is not.","impacts":{"independence":-2,"doNoHarm":-1}},{"id":"en-4b","label":"Train local technicians to own it","detail":"Fund a year of training so regional staff and community technicians can maintain, update, and adapt the models themselves.","consequence":"Slower at first, and two trainees are recruited away by a telecom company — a loss that is also a success story. The ones who stay keep the system alive through the next funding gap without missing a week.","reflection":"Local technical capacity is the most durable infrastructure you can build. Skills that stay in the region keep serving it long after your project code is forgotten.","impacts":{"independence":2,"doNoHarm":1,"humanity":1}},{"id":"en-4c","label":"Hand it to the regional Movement pool","detail":"The National Society joins a shared regional service that maintains common models and tooling for many societies.","consequence":"You lose some local tailoring, gain shared cost and shared expertise. The small model your team tuned for local languages becomes the pool’s most-used asset — your investment scales beyond your borders.","reflection":"Shared Movement infrastructure spreads both cost and sovereignty. What one society builds can, with open formats and pooled maintenance, protect many.","impacts":{"independence":1,"doNoHarm":1}}]}],"debrief":"The Edge of the Network is about sizing technology to the place it serves. Small models, offline-first design, local power, and local skills are not compromises — in low-connectivity settings they are the resilient choice. And every AI query carries an environmental cost in energy, water, and extraction; measuring it, disclosing it, and minimizing it is part of do no harm, not a separate agenda."},{"id":"signals-noise","title":"Signals in the Noise","tagline":"AI social listening during a typhoon response in Southeast Asia","role":"Community Engagement & Accountability Advisor, Typhoon Response","context":"A category-4 typhoon has made landfall across an island chain. Rumors travel faster than the floodwater: about aid, about evacuations, about who is to blame. A social-listening platform offers AI that scans public posts in four local languages and flags misinformation in near real time. Your teams are drowning in unverified reports — but listening at scale means watching communities at scale.","topics":["Social listening","Misinformation","Privacy & trust"],"roles":["Community engagement","Communications","Protection"],"steps":[{"id":"sn-1","title":"To listen, and how","narrative":"The platform can ingest public posts from the main social networks, classify them, and push alerts. Your protection adviser asks the uncomfortable question first: what happens to the posts — and the people who wrote them — after the crisis?","options":[{"id":"sn-1a","label":"Full scanning with alerts","detail":"Ingest public posts, classify, alert. Maximum situational awareness, maximum collection.","consequence":"The rumor map is genuinely useful — you catch a false evacuation order within an hour. But the platform retains post-level data \"for model improvement,\" and you realize you have built a listening post with no off switch and no sunset clause.","reflection":"Public does not mean consequence-free: people post in crisis without imagining humanitarian — or any — surveillance. Collection that outlives its purpose is a data protection failure wearing a useful dashboard.","impacts":{"humanity":1,"doNoHarm":-2}},{"id":"sn-1b","label":"Aggregate trends only","detail":"No post-level storage: the system counts themes and spikes, and deletes the raw stream daily.","consequence":"You lose some forensic detail — you cannot always trace a rumor to its source — but you keep the early warning. When a ministry later requests \"the raw data,\" the honest answer is that it no longer exists.","reflection":"Aggregation is the social-listening version of data minimization: you keep the signal, discard the people. Designing for deletion is designing for trust.","impacts":{"doNoHarm":2,"humanity":-1}},{"id":"sn-1c","label":"Community channels only","detail":"Skip social listening; rely on feedback hotlines, community volunteers, and partner networks.","consequence":"Trusted, human, and slower. A poisonous rumor about contaminated water circulates for two days before your network surfaces it — two days in which some families drank unsafe water rather than risk the \"poisoned\" distribution points.","reflection":"Refusing to listen is also a choice with consequences. The question is not whether to hear communities, but how to hear them without turning listening into surveillance.","impacts":{"humanity":-2,"doNoHarm":1}}]},{"id":"sn-2","title":"Acting on a rumor","narrative":"The system flags a fast-spreading claim that your National Society is diverting aid to one political group. It is false. But a public takedown would name the claim, the group, and the accusation — in a polarized region where your neutrality is already questioned weekly.","options":[{"id":"sn-2a","label":"Publish a direct public rebuttal","detail":"Name the rumor, state the facts, post it everywhere. Fast and transparent.","consequence":"The facts land — and so does the frame. For two news cycles, your name is welded to a political accusation you did not make. One local branch reports threats; another reports record donations. The truth was served; the neutrality bill arrives later.","reflection":"Amplifying a falsehood to deny it can spread the frame further than the lie. Neutrality is tested not only by what you say, but by what you choose to repeat.","impacts":{"neutrality":-2,"humanity":1}},{"id":"sn-2b","label":"Correct through trusted community voices","detail":"Brief community leaders, radio hosts, and volunteer networks with the facts; let trusted local voices carry the correction.","consequence":"The correction moves slower than the rumor for a day, then overtakes it. Because the denial comes from voices people already trust, it sticks without welding your name to the accusation.","reflection":"Community engagement is also a neutrality strategy. Corrections travel on trust, and trust is local — the messenger is often the message.","impacts":{"neutrality":1,"doNoHarm":1}},{"id":"sn-2c","label":"Monitor but do not respond","detail":"Feeding the rumor with attention may be worse; watch and wait.","consequence":"The rumor crests and fades in some areas — and hardens in one district, where distributions are boycotted for a week. Waiting spared you the frame; it cost the boycotted families their rations.","reflection":"Silence is a decision too. Judging when a rumor needs an answer is a craft: watch the harm, not just the volume, and pre-agree thresholds for acting.","impacts":{"humanity":-1,"doNoHarm":-1}}]},{"id":"sn-3","title":"The deepfake","narrative":"A voice note in perfect local dialect, apparently from your director, announces a distribution at a venue that does not exist. Hundreds gather; some are angry; one elderly man is hospitalized after the crush. Your AI, trained on text and images, never listened to audio at all.","options":[{"id":"sn-3a","label":"Add a deepfake-detection vendor","detail":"A specialist vendor can scan audio and video — if you stream community content to their cloud.","consequence":"Detection improves, and another data stream leaves your control. Three months later the vendor’s breach disclosure lands in your inbox; the audio you routed to them included voice prints of people who never consented to anything.","reflection":"Chasing each new threat with a new vendor multiplies exposure faster than it multiplies safety. Voice is biometric data; treating it as just another feed is a data protection failure.","impacts":{"doNoHarm":-2,"independence":-1}},{"id":"sn-3b","label":"Build verified channels people can check","detail":"All official announcements carry a simple verification: a code word on the radio, a signed SMS, a hotline to confirm. Teach the pattern before you need it.","consequence":"The next fake voice note spreads for hours, then stalls: people ask for the code word. Verification becomes a community habit, not a vendor product — and it works even when your systems are down.","reflection":"Resilience against synthetic media is mostly social: pre-agreed verification habits beat detection arms races, and they strengthen, rather than consume, community trust.","impacts":{"doNoHarm":2,"neutrality":1}},{"id":"sn-3c","label":"Shut down all AI listening","detail":"If the system cannot catch the most dangerous fake, the whole apparatus is suspect.","consequence":"You lose the rumor early-warning that had quietly prevented two panics. Misinformation does not retire when your tools do; the next false evacuation order circulates unseen for a full day.","reflection":"Tools fail; the question is whether failure was designed for. Abandoning a useful system for being imperfect leaves the field to the rumors — graded, honest capability beats none.","impacts":{"humanity":-2,"doNoHarm":-1}}]},{"id":"sn-4","title":"When the storm passes","narrative":"Recovery begins. The listening platform’s trial licence auto-renews next month. Leadership likes the dashboard. Nobody has answered the protection adviser’s original question: what happens to all of this in peacetime?","options":[{"id":"sn-4a","label":"Keep it running for early warning","detail":"Crisis-grade monitoring becomes permanent preparedness. The dashboard never sleeps.","consequence":"Preparedness improves on paper. But a system built for typhoon weeks now watches ordinary political seasons, and its existence becomes an election-year story: the humanitarian organization that never stopped listening.","reflection":"Emergency powers tend to become furniture. A listening capability that never sunsets will eventually be used for purposes its first users never imagined — neutrality included.","impacts":{"neutrality":-2,"doNoHarm":-2}},{"id":"sn-4b","label":"Sunset it with a public account","detail":"End the collection, delete the archives, and publish what was collected, why, and what was learned.","consequence":"The public accounting is briefly uncomfortable — people learn the scale of the listening — then becomes a trust asset: your National Society is the one that said what it did and stopped. The playbook is archived for the next activation.","reflection":"Accountability includes an ending. Publishing what you collected and why, then verifiably stopping, is what responsible data practice means when the cameras are gone.","impacts":{"doNoHarm":2,"neutrality":1}},{"id":"sn-4c","label":"Hand it to the National Society under community oversight","detail":"The tool continues under the National Society, governed by a charter with community representatives and an annual public review.","consequence":"The handover is bureaucratic and real: the charter names what may be monitored, what must never be, and who can switch it off. The first annual review is public, sparsely attended, and exactly the point.","reflection":"Local ownership with community oversight can make a dual-use tool legitimate: the difference between surveillance and listening is who governs it, in whose name, with what power to stop it.","impacts":{"doNoHarm":1,"independence":1,"neutrality":1}}]}],"debrief":"Signals in the Noise is about listening without surveilling. Aggregation over collection, trusted messengers over loud rebuttals, verification habits over detection arms races, and a sunset over a dashboard that never sleeps — these are how a humanitarian organization hears a crisis without becoming something communities should fear."},{"id":"outbreak-signal","title":"The Outbreak Signal","tagline":"Epidemic intelligence and AI triage during a fever outbreak at a border crossing","role":"Health Emergency Coordinator, Regional Outbreak Response","context":"A cluster of severe fever cases appears near a busy border crossing. An epidemic-intelligence platform — scanning clinic reports, pharmacy sales, and public posts — flags “possible hemorrhagic fever, 72% confidence.” Labs are two days away, the crossing sees thousands of travelers daily, and your National Society runs the two nearest clinics. Every hour of hesitation has a price — and so does every false alarm.","topics":["Epidemic intelligence","Health data","Risk communication"],"roles":["Health","Epidemiology","Community health"],"steps":[{"id":"os-1","title":"The 72 percent signal","narrative":"The platform wants you to escalate now. Your epidemiologist points out the model was trained mostly on urban data and has never seen this region’s malaria season, which mimics the signal. The regional health authority asks what you know by Friday.","options":[{"id":"os-1a","label":"Declare an alert immediately","detail":"Treat 72% as actionable. Trigger the contingency plan, alert partners, brief the media before rumors do.","consequence":"For 48 hours the region mobilizes — then labs come back: severe malaria, not hemorrhagic fever. The cancellation is technically correct and socially costly: next quarter, when the platform flags a real cholera cluster, two district offices hesitate a full day before acting.","reflection":"In outbreak response, false alarms spend the trust that real alarms depend on. An AI confidence score is an input to a decision, not the decision — escalation thresholds belong to accountable humans, calibrated with local epidemiology.","impacts":{"humanity":1,"doNoHarm":-2,"neutrality":-1}},{"id":"os-1b","label":"Wait for laboratory confirmation","detail":"No public moves until the labs confirm. Quietly ready supplies in the meantime.","consequence":"The labs confirm severe malaria — no outbreak. Your quiet prepositioning proves useful anyway. But your team models the counterfactual: had it been hemorrhagic fever, 48 silent hours at a border crossing would have been catastrophic.","reflection":"Waiting for certainty is safe only when the disease is slow. The discipline is matching the threshold to the stakes: what does a false alarm cost, what do two lost days cost, and who bears each?","impacts":{"humanity":-1,"doNoHarm":1}},{"id":"os-1c","label":"Send a verification team within hours","detail":"Rapid assessment team to the cluster site, clinicians review the signal’s raw evidence, preposition supplies without public alarm.","consequence":"The team finds the truth in nine hours: severe malaria amplified by a medicine stock-out — and the platform’s signal, read by human eyes, correctly identifies a second, unrelated cluster worth watching. You escalate neither, prepare for both.","reflection":"The strongest epidemic intelligence pairs machine vigilance with fast human verification. The AI watches everything so that people can check what matters — that division of labor is the design, not a workaround.","impacts":{"humanity":1,"doNoHarm":2,"impartiality":1}}]},{"id":"os-2","title":"Triage under pressure","narrative":"Confirmed cases climb and your two clinics are overwhelmed. A health-tech firm offers an AI triage tool: patients answer questions on a tablet, the model scores urgency, staff see patients in the model’s order. Your senior nurses are skeptical; the queue is not.","options":[{"id":"os-2a","label":"Let the model order the queue","detail":"Full automation: the score sets the order. Fastest throughput, least staff friction.","consequence":"Throughput jumps 40%. Then the pattern emerges: elderly patients describing symptoms indirectly score low; so do speakers of a border dialect the questionnaire translates poorly. Nobody is refused care — some just wait until they collapse, out of sight of the metrics.","reflection":"A queue is a values statement. Automated triage optimizes for what its questionnaire can hear; the patients it hears worst are often the sickest. Impartiality in a clinic means auditing the order, not just the speed.","impacts":{"humanity":1,"impartiality":-2,"doNoHarm":-1}},{"id":"os-2b","label":"Model as second opinion, nurses decide","detail":"The score is shown to the triage nurse, who may override — and every override is logged and reviewed weekly.","consequence":"Throughput improves 25%, not 40% — but the override log becomes gold: it shows exactly where the model misreads local symptom language, and the nurses’ corrections retrain it. Staff trust the tool because it visibly learns from them.","reflection":"Keeping the nurse in charge preserves accountability and creates a learning loop the vendor never offered. In health, “human in the loop” is not a brake on the system — it is the system’s most accurate sensor.","impacts":{"doNoHarm":2,"impartiality":1}},{"id":"os-2c","label":"Stick to the standard triage protocol","detail":"No new tools mid-outbreak. Experienced protocol, extra volunteer screeners, longer waits.","consequence":"Care stays equitable and explainable — and slow. Two critical cases deteriorate in the queue that a scoring tool might have pulled forward. The protocol was safe; the wait was not.","reflection":"Refusing a tool does not freeze the trade-offs; it just makes them less visible. The honest comparison is never “AI vs. perfect care” — it is AI vs. the actual queue, with its own silent triage by exhaustion.","impacts":{"impartiality":1,"humanity":-2}}]},{"id":"os-3","title":"The line list","narrative":"A university consortium modeling the outbreak asks for your clinics’ line list: anonymized patient-level records of symptoms, ages, locations, outcomes. Their model could forecast the spread — and their publication queue, career incentives, and servers are all abroad.","options":[{"id":"os-3a","label":"Share the anonymized line list","detail":"Names removed, agreement signed. The forecast improves for everyone.","consequence":"The consortium’s model helps two ministries plan. But the line list is a thin disguise: symptom-date, age, and village together re-identify patients, and a local journalist demonstrates it with one phone call. In a border region, being identifiable as a patient is not a neutral fact.","reflection":"In small populations, “anonymized” health data is often a pseudonym, not a protection. Outbreak line lists carry double sensitivity — illness and location — and the ICT Resolution’s data protection standard treats them accordingly.","impacts":{"humanity":1,"doNoHarm":-2,"independence":-1}},{"id":"os-3b","label":"Share aggregates, host the analysis in-country","detail":"Weekly aggregate counts go out; the raw line list stays in-country, where the consortium’s researchers are welcome to work under your data protection rules.","consequence":"Slower science, sovereign data. Two researchers accept the residency arrangement; the consortium grumbles, then cites your governance model as a template for its next three studies.","reflection":"You can share the insight without shipping the people. Data sovereignty in health means analysis travels to the data, not the reverse — and good partners will make the trip.","impacts":{"doNoHarm":2,"independence":1,"humanity":-1}},{"id":"os-3c","label":"Decline; protect the list absolutely","detail":"No external access at all until the emergency ends and a full ethics review is complete.","consequence":"Nothing leaks, and nothing is learned. The regional forecast — which would have guided vaccine prepositioning next season — is built without your clinics’ data and is visibly weaker in exactly your districts.","reflection":"Absolute protection has a price paid in foresight. The goal is not zero sharing but governed sharing: consent where possible, aggregation by default, and review by people answerable to the communities in the list.","impacts":{"humanity":-1,"doNoHarm":1}}]},{"id":"os-4","title":"Telling the public","narrative":"Risk communication time. The platform offers AI-drafted, auto-translated health messages in all local languages within the hour. Your community health workers offer something slower: themselves, on motorbikes, with megaphones and trust built over years.","options":[{"id":"os-4a","label":"Blast the AI-drafted messages everywhere","detail":"Speed and coverage: SMS, radio scripts, social posts, all languages, this hour.","consequence":"Coverage is instant. So are the errors: a translated symptom list uses a word that means “deathly” in one dialect, panic-buying hits two towns, and a phrase about isolation reads as “abandon the sick.” Corrections chase the messages for days.","reflection":"In health, a message is a dose — wrong wording harms like wrong medicine. Machine translation at outbreak speed needs a human reader who knows what the words do in each community, not just what they say.","impacts":{"humanity":-1,"doNoHarm":-2}},{"id":"os-4b","label":"Community health workers carry the message","detail":"Brief the workers; they adapt the message village by village. Slower, smaller reach, deeper trust.","consequence":"Reach in week one is a fraction of the blast — but comprehension is total, questions get answered on the spot, and the rumor about “abandoning the sick” never takes root because someone’s aunt explains isolation on her doorstep.","reflection":"Community engagement and accountability is the original risk-communication channel. Trusted humans are slower than broadcasts and faster than rumors — because trust is the actual speed limit.","impacts":{"doNoHarm":2,"impartiality":1,"humanity":-1}},{"id":"os-4c","label":"Blend: AI drafts, local voices approve and deliver","detail":"The model drafts and translates in an hour; community reviewers in each language approve or fix before anything ships; health workers deliver the hard parts in person.","consequence":"Messages go out same-day in four languages, each signed off by someone who speaks it natively. The review step catches the “deathly” translation before it ships. Coverage and trust, mostly both.","reflection":"The pattern generalizes: machines for speed, communities for meaning. The ICT Resolution’s engagement commitment is what turns a translation pipeline into communication people can act on safely.","impacts":{"humanity":1,"doNoHarm":2}}]}],"debrief":"The Outbreak Signal is about speed under uncertainty. Epidemic AI watches wider than any team can, but its confidence scores are not decisions, its triage queues encode what questionnaires can hear, its data hunger collides with the sensitivity of being identifiable as a patient, and its messages need native eyes before native ears. Health is where “move fast” meets “first, do no harm” most directly — the tooling must be built for both."},{"id":"boardroom-test","title":"The Boardroom Test","tagline":"Organisation-wide AI strategy for a National Society leadership","role":"Secretary General of a National Society","context":"Your board meets in three weeks, and AI is suddenly on every agenda: a major donor hints that future funding favors “AI-forward” partners, your auditors found staff pasting internal documents into public chatbots, and your logistics director wants to automate a back-office function that employs forty people. Whatever you bring to that boardroom will define how your organisation uses AI for years — and who gets to question it.","topics":["AI governance","Strategy & funding","Workforce"],"roles":["Leadership","Governance","Staff care"],"steps":[{"id":"bt-1","title":"The donor’s nudge","narrative":"The donor’s letter is friendly and unmistakable: organizations demonstrating “concrete AI adoption” will be prioritized. Your programmes director warns that chasing the signal will scatter the organisation into a dozen ungoverned pilots. Your fundraiser warns that ignoring it costs seven figures.","options":[{"id":"bt-1a","label":"Announce an AI adoption push","detail":"Ten pilots, fast, visible. Show the donor momentum; sort out governance as you go.","consequence":"The donor is delighted and the press release writes itself. By month four you have eleven pilots, three vendors with access to internal data, two duplicated tools, and no one who can answer a simple question from the board: who approved each of these, against what criteria?","reflection":"Funding-conditioned enthusiasm is still enthusiasm. Independence includes the freedom to adopt technology at the speed your governance can actually steer — donors fund your mission, not your tool count.","impacts":{"humanity":1,"independence":-2,"doNoHarm":-1}},{"id":"bt-1b","label":"Decline the condition politely","detail":"Thank the donor, restate your mission-driven criteria, accept the funding risk.","consequence":"The grant goes to a louder organization. Your restraint is vindicated a year later when the donor’s showcase project collapses in a data scandal — but vindication does not pay for the water projects the grant would have.","reflection":"Saying no to misaligned money is a real cost borne by real programmes. Independence is not free; the boardroom question is whether it is priced in honestly, and revisited as facts change.","impacts":{"independence":1,"humanity":-2}},{"id":"bt-1c","label":"Adopt a principles-first AI framework","detail":"A short, public framework: what you will use AI for, what you will never use it for, how tools are approved, and two flagship pilots chosen by need, not visibility.","consequence":"The framework takes six weeks and three drafts. The donor, presented with it, shifts from skeptical to impressed — it gives them something defensible to fund. Two pilots proceed with criteria the board can actually read.","reflection":"A written framework converts values into procurement criteria. It is slower than a press release and faster than a scandal — and it lets you meet funders with a document instead of a mood.","impacts":{"independence":1,"doNoHarm":2}}]},{"id":"bt-2","title":"The shadow AI","narrative":"The audit is awkward: staff across departments use public chatbots daily — drafting donor reports, translating field notes, summarizing case files. Some of those documents contain beneficiary data. Banning it will drive it underground; licensing it feels like endorsing a leak.","options":[{"id":"bt-2a","label":"Ban public AI tools on work devices","detail":"Clear policy, blocked domains, disciplinary note. The leak stops — officially.","consequence":"Officially, compliance is total. Unofficially, the work moves to personal phones — the same documents, the same public tools, now invisible to your IT team and your data protection officer alike.","reflection":"A ban without an alternative relocates risk rather than reducing it. Policies that ignore why people reached for the tool — workload, translation, speed — are read as instructions to hide.","impacts":{"doNoHarm":-1,"independence":-1}},{"id":"bt-2b","label":"Provide a sanctioned, governed alternative","detail":"Contract an enterprise AI service with no-training and retention guarantees, publish a two-page acceptable-use guide in plain language, and train teams on what must never go in.","consequence":"Adoption of the governed tool is fast because it answers the real need. The guide’s red lines — no beneficiary-identifying data, no case files, no security-sensitive content — hold because staff helped write them.","reflection":"Governance that meets people’s actual workflow gets followed. A sanctioned lane with clear red lines beats both a banned shadow practice and an unexamined free-for-all — data protection by design, at desk level.","impacts":{"doNoHarm":2,"independence":1}},{"id":"bt-2c","label":"Look the other way for now","detail":"Note the finding, revisit next year. Staff productivity is real and budgets are tight.","consequence":"Nothing changes — visibly. Months later a translator pastes a protection incident report into a free chatbot to meet a deadline. The vendor’s terms allow training on inputs. You learn this from a journalist.","reflection":"Deferred governance is governance by default — with the defaults set by vendors. The organization is accountable for data it pretends not to know is moving.","impacts":{"doNoHarm":-2,"humanity":1}}]},{"id":"bt-3","title":"Forty jobs","narrative":"The logistics automation business case is strong: it would free significant funds for programmes every year — and it would eliminate forty back-office roles, many held by people who have served the organization for decades, in a town where your National Society is a major employer.","options":[{"id":"bt-3a","label":"Automate fully, redirect the savings","detail":"The mission math is stark: those funds vaccinate, shelter, feed. Roles end with standard packages.","consequence":"Programme budgets grow as projected. In town, the story is not the math but the method: forty families learn from a restructure letter. Union talks turn hostile, local media cover the “humanitarian layoffs,” and two programme staff resign in solidarity.","reflection":"Humanity is not only a field principle. An organization that automates its own people without care teaches every observer — staff, community, partners — how literally to read its values.","impacts":{"humanity":-2,"doNoHarm":-1,"independence":1}},{"id":"bt-3b","label":"Automate slowly, with retraining and redeployment","detail":"Two-year transition: automate in phases, retrain staff for new roles (including AI oversight), guarantee no forced redundancies in year one.","consequence":"Savings arrive at half speed. But twenty-six staff move into new roles — eight of them into the data-quality and oversight jobs the new system genuinely needs — and the transition becomes the story you tell recruits instead of the one you fear.","reflection":"Do no harm includes the people inside the building. A just transition is slower and cheaper than a hostile one once you count trust, retention, and the institutional knowledge that walks out with a restructure letter.","impacts":{"humanity":1,"doNoHarm":2,"impartiality":1}},{"id":"bt-3c","label":"Shelve automation entirely","detail":"The social cost is too high. Keep the function manual; revisit when attrition opens space.","consequence":"No one loses a job. The savings never materialize, a competitor city’s society delivers faster, and your logistics team — aware the decision was made for them, not with them — quietly stops proposing improvements.","reflection":"Protecting jobs by freezing the question protects this year’s roster and mortgages next year’s relevance. The humane path is not “never automate” but “automate with people in the design, and time to adapt.”","impacts":{"humanity":1,"independence":-1}}]},{"id":"bt-4","title":"Who governs the machines","narrative":"Final board agenda item: standing governance. Your pilots are multiplying, the framework needs an owner, and someone must be able to say no. The question is who, with what mandate, and answerable to whom.","options":[{"id":"bt-4a","label":"Leave it to executive management","detail":"The management team already runs risk. No new structures, no overhead.","consequence":"It works until it is busy. Decisions get made in the gaps between other decisions; a high-risk deployment ships during a response surge with no review at all, and the post-incident question — “who was watching?” — has no name for an answer.","reflection":"Governance that lives in everyone’s spare time lives nowhere. Accountability needs a named body with a mandate, a calendar, and the power to pause a deployment.","impacts":{"doNoHarm":-2,"independence":-1}},{"id":"bt-4b","label":"Create an AI oversight group with an outside and community voice","detail":"A small standing group — programmes, ICT, data protection, an external ethicist, and a community representative — with authority to approve, condition, or halt AI use, reviewed annually in public.","consequence":"Meetings are monthly and occasionally uncomfortable. The community member’s first veto — on a face-recognition pilot at distribution points — saves you from a headline you never see. The annual public review is quiet, and that quiet is the achievement.","reflection":"This is the ICT Resolution made structural: data protection, community engagement, and harm mitigation embodied in a body that can act. Oversight with an outside voice catches what insiders are paid not to notice.","impacts":{"doNoHarm":2,"independence":1}},{"id":"bt-4c","label":"Hire an external auditor once a year","detail":"Independent review, annual report, management acts on findings. Arms-length and affordable.","consequence":"The first audit is thorough and lands eleven months after the decisions it reviews. Findings are accurate, recommendations sensible, and the riskiest pilot ended — for unrelated reasons — three months before the report arrived.","reflection":"Audit is a rear-view mirror: essential, and blind to what is approaching. Annual external review complements standing oversight; it cannot substitute for someone watching the road.","impacts":{"doNoHarm":1,"independence":-1}}]}],"debrief":"The Boardroom Test is where every other scenario is decided in advance. Donor pressure, shadow AI, automation of your own workforce, and the question of who may say no — none of these are technology questions; they are governance questions with technology inside. A National Society that writes its red lines down, gives staff a governed lane, treats its own people as part of “humanity,” and seats community voices where decisions are made will make better field choices automatically."},{"id":"clinic-notes","title":"The Listening Clinic","tagline":"AI transcription in a health clinic for undocumented migrants in Sweden","role":"Head of Health Services, Red Cross health clinic in EU","context":"Your clinic sees people who cannot or dare not use the regular healthcare system: undocumented migrants, EU citizens without insurance, people who were refused asylum. Volunteer nurses and doctors spend almost half of each appointment typing notes, often through an interpreter. A health-tech start-up offers free AI transcription that listens to the consultation, translates it, and writes the medical note. Waiting lists are long, and your volunteers are burning out.","topics":["AI transcription","Health data","Energy footprint"],"roles":["Health services","Data protection","Volunteer management"],"debrief":"The Listening Clinic shows that administrative AI is never only administrative. When the people in the room have every reason to fear being recorded, data minimisation, informed consent, local processing and an honest energy budget are not extras — they decide whether the clinic remains a safe place at all.","steps":[{"id":"cn-1","title":"The free offer","narrative":"The start-up's tool records the full consultation, sends the audio to a large speech model hosted outside the EU, and returns a polished note in your language within a minute. It is free for a year — the company wants to showcase 'AI for good'. Your data protection officer asks where the recordings go. Your most senior doctor asks whether the patients will still talk.","options":[{"id":"cn-1a","label":"Accept the free cloud tool","detail":"Fastest relief for volunteers and staff. Full recordings leave the clinic and are processed abroad by a model you cannot inspect.","consequence":"Documentation time halves within a week. Then a patient's lawyer asks whether recordings of her client could be requested by authorities in a deportation case. You cannot say for certain where the audio is stored, for how long, or who can access it. Word spreads in the community, and three regular patients stop coming.","reflection":"For people living in fear of authorities, the record itself can be the harm. A free tool paid for with the most sensitive data of the most exposed people is not free. The ICT Resolution commits the Movement to protect personal data precisely where the consequences of a leak are greatest.","impacts":{"humanity":1,"doNoHarm":-2,"independence":-1}},{"id":"cn-1b","label":"Pilot a small model that runs in the clinic","detail":"A compact speech model on a local computer. No audio leaves the building; notes are rougher and need more editing.","consequence":"Setup takes a month and the notes need correcting, especially in Tigrinya and Dari. But nothing leaves the clinic, audio is deleted the moment the note is approved, and the machine draws about as much power as a desk lamp. Volunteers save a third of their typing time instead of half.","reflection":"Local, right-sized models trade polish for control. When processing stays on site, you know where the data is, how long it lives, and how much energy it consumes — three things a humanitarian organisation should always be able to answer.","impacts":{"doNoHarm":2,"independence":1,"humanity":1}},{"id":"cn-1c","label":"No AI — fund admin volunteers instead","detail":"Recruit volunteer medical secretaries to type notes after each shift.","consequence":"Recruitment works in your city's student community, and patients notice no change. But secretaries are hard to keep through the exam season, and in the evening clinic doctors are back to typing until midnight.","reflection":"Saying no to AI is a legitimate choice with real costs, often carried by exhausted staff and volunteers. The question is not whether AI is good or bad, but whether a lighter alternative serves people better here.","impacts":{"doNoHarm":1,"humanity":-1}}]},{"id":"cn-2","title":"Consent in the waiting room","narrative":"Whatever tool you use, patients must be told they are being recorded. Your team drafts a consent form. One volunteer suggests a simple checkbox at registration. An interpreter warns that many patients will tick anything a person in a Red Cross vest hands them, out of fear of being turned away.","options":[{"id":"cn-2a","label":"A checkbox at registration","detail":"Quick and legally tidy. Patients agree once for all future visits.","consequence":"Consent rates are 99%. An audit later finds that most patients did not understand what they agreed to — several believed it was a condition of treatment.","reflection":"Consent given under dependency is not free consent. When people need help, a checkbox measures compliance, not understanding.","impacts":{"doNoHarm":-2,"humanity":-1}},{"id":"cn-2b","label":"Ask at every visit, with a real 'no'","detail":"The clinician asks in the patient's language at the start of each consultation. Saying no changes nothing about the care.","consequence":"About one in five patients says no, mostly the newest arrivals. Their notes are typed by hand. Trust grows: patients tell others that the clinic asks, and means it.","reflection":"An opt-out that carries no penalty is what makes AI support acceptable. Keeping a non-AI path open protects the people who most need it.","impacts":{"doNoHarm":2,"humanity":1,"impartiality":1}},{"id":"cn-2c","label":"Record only the clinician's summary","detail":"No patient voice is recorded. After the consultation, the clinician dictates a short summary into the tool.","consequence":"The patient's words never touch the machine. Time savings are smaller, but dictation is quick, the audio is tiny, and processing needs a fraction of the energy of full-conversation transcription.","reflection":"Data minimisation can be a design choice: change what you capture rather than protecting what you shouldn't have captured. Less data is also less computing, storage and energy.","impacts":{"doNoHarm":2,"humanity":1}}]},{"id":"cn-3","title":"The hidden bill","narrative":"The regional Red Cross branch wants to roll transcription out to all twelve health and psychosocial support points in western Sweden — and to keep every recording for five years 'to train a better model later'. Your IT volunteer does the maths: storing and repeatedly reprocessing thousands of hours of audio would need a server room's worth of electricity and cooling every year.","options":[{"id":"cn-3a","label":"Keep everything for future training","detail":"More data might mean better models. Storage is cheap, and Sweden's grid is mostly fossil-free.","consequence":"The archive grows to terabytes of the most sensitive conversations your organisation has ever held. Energy use climbs every month. Nobody ever trains the model, but the archive must still be secured, backed up and powered.","reflection":"A clean grid does not make waste harmless: electricity used here is electricity not available for other needs, and hardware has a heavy footprint before it is ever switched on. Data kept 'just in case' carries privacy risk and energy cost indefinitely.","impacts":{"doNoHarm":-2,"humanity":-1}},{"id":"cn-3b","label":"Delete audio, measure and publish energy use","detail":"Audio deleted within 24 hours. Each site reports energy per consultation, and the numbers go in the annual report.","consequence":"The first figures surprise everyone: the cloud pilot used about thirty times more energy per note than the local model. The board adopts an energy budget per consultation, and two branches choose the local model on that basis.","reflection":"You cannot manage a footprint you refuse to measure. Publishing the energy cost of AI turns sustainability from a slogan into a decision rule communities and donors can check.","impacts":{"doNoHarm":2,"independence":1}},{"id":"cn-3c","label":"Roll out only where volunteers ask for it","detail":"No region-wide mandate. Sites opt in after reviewing the evidence from your clinic.","consequence":"Five sites adopt it, seven don't. Usage — and energy — stays proportionate to real need, but practices differ and the data protection officer now has five configurations to check.","reflection":"Scaling should follow evidence of value, not enthusiasm. Smaller footprints often come from simply not deploying where a tool isn't needed.","impacts":{"doNoHarm":1,"humanity":1}}]},{"id":"cn-4","title":"When the note is wrong","narrative":"A patient returns with a worsening infection. The AI-drafted note from her first visit said 'no known allergies'. She had said, through the interpreter, that she was allergic to penicillin. The volunteer doctor approved the note at the end of a twelve-hour shift without reading it closely.","options":[{"id":"cn-4a","label":"Treat it as individual human error","detail":"Remind the doctor to read more carefully. Keep the workflow as is.","consequence":"Two months later, a different volunteer approves a different wrong note. The pattern is the same: tired people, long shifts, notes that look confident.","reflection":"Automation bias is predictable: polished text invites approval. Blaming individuals hides a design problem that will repeat.","impacts":{"doNoHarm":-2,"humanity":-1}},{"id":"cn-4b","label":"Make critical fields human-only","detail":"Allergies, medication and safety risks are always asked and typed by the clinician. The AI drafts only the narrative.","consequence":"Notes take a little longer, and errors on critical fields drop to zero in the next audit. You tell the patient what happened, apologise, and explain the change — she agrees to keep coming.","reflection":"Meaningful human oversight means designing where humans decide, not just asking them to sign. Being open with the person affected is part of accountability.","impacts":{"doNoHarm":2,"humanity":1}},{"id":"cn-4c","label":"Pause AI and review with patients","detail":"Stop transcription for a month and invite former patients and interpreters to review how it should work.","consequence":"The pause costs volunteer hours. The review produces the clinic's best idea yet: interpreters read the key facts back to patients before the note is approved. It's slower, and errors become rare.","reflection":"Those affected by a system are often best placed to see where it fails. Pausing to listen is not failure — it is how humanitarian accountability works in practice.","impacts":{"doNoHarm":2,"humanity":-1,"impartiality":1}}]}]},{"id":"invoice-engine","title":"The Invoice Engine","tagline":"Automating finance admin at a national office in the Netherlands","role":"Director of Finance & Administration, National Society headquarters in The Hague","context":"Your finance team processes 40,000 invoices a year: suppliers for shelters, refunds to volunteers, payments to partner organisations abroad, and cash transfers to people affected by the floods in Limburg. Three of your eight staff are retiring. A large software vendor offers an AI agent that reads invoices, codes them, flags fraud and approves routine payments automatically. The board wants savings that can go to programmes.","topics":["Process automation","Financial accountability","Energy footprint"],"roles":["Finance & administration","ICT","Audit & compliance"],"debrief":"The Invoice Engine shows that back-office AI shapes who gets paid, who gets flagged and how much energy the organisation burns doing it. Efficiency is a legitimate humanitarian goal — but only when people stay accountable for payments, flags can be challenged, and the lightest tool that works is chosen over the most impressive one.","steps":[{"id":"ie-1","title":"Which tool for the job?","narrative":"The vendor's agent runs every invoice through a large general-purpose AI model in the cloud — even the simple ones that follow the same template each month. Your controller notes that 80% of your invoices come from just 200 regular suppliers. An ICT volunteer suggests that ordinary rule-based automation, plus a small model for the messy remainder, would do most of the work.","options":[{"id":"ie-1a","label":"Buy the full AI agent","detail":"One platform for everything. Every invoice, simple or complex, goes through a large model.","consequence":"It works, impressively. It also costs more than the staff it replaces, and its usage report reveals that each simple recurring invoice uses as much computing as a long chat conversation — tens of thousands of times a year.","reflection":"Using a large AI model for a task a simple rule can do is like sending a lorry to deliver a letter. Every unnecessary query carries an energy, water and hardware cost.","impacts":{"doNoHarm":-1,"independence":-1}},{"id":"ie-1b","label":"Rules first, small AI for the rest","detail":"Plain automation for recurring invoices; a small model reads only the unusual ones; staff handle exceptions.","consequence":"It takes three months to build with your ICT team. Recurring invoices fly through with almost no computing. The small model handles handwritten receipts from volunteers. Running costs and energy use are a fraction of the vendor offer.","reflection":"Frugal design is a principle, not a compromise: start with the simplest tool and add AI only where it adds clear value. That is also how you keep the system understandable to auditors.","impacts":{"doNoHarm":2,"independence":1}},{"id":"ie-1c","label":"Hire and train instead","detail":"Replace the retiring staff with two new hires and improve the existing system.","consequence":"Payments stay accurate and people stay accountable. But recruitment takes months, backlogs reach six weeks, and some small suppliers in flood areas wait too long to be paid.","reflection":"Not automating is a legitimate choice — but late payment is also a harm, especially to small local businesses and volunteers who advance their own money.","impacts":{"doNoHarm":1,"humanity":-1}}]},{"id":"ie-2","title":"The fraud flag","narrative":"The automated checks begin flagging 'high-risk' payments. You notice a pattern: refunds to volunteers with non-Dutch names and transfers to partner organisations in Syria and Sudan are flagged three times more often. Each flag freezes the payment for up to three weeks.","options":[{"id":"ie-2a","label":"Trust the flags — risk comes first","detail":"Compliance is non-negotiable. Frozen payments are the price of safety.","consequence":"Two partner organisations in Sudan miss payroll. A volunteer of Eritrean origin who paid for blankets with her own money waits a month for a refund and quits. The flags catch no actual fraud.","reflection":"A model trained on past patterns reproduces past suspicion. Applied to names and destinations, it turns into discrimination — against the very people and partners a humanitarian organisation exists to serve.","impacts":{"impartiality":-2,"humanity":-1,"doNoHarm":-1}},{"id":"ie-2b","label":"Audit the flags for bias","detail":"Pause automatic freezes, test the flags against outcomes, and remove names and nationality as signals.","consequence":"The audit shows the flags were mostly picking up names and geography, not risk. After the changes, flag rates are even across groups, and the two genuine fraud cases of the year are still caught — by a human investigator following up on a tip.","reflection":"Impartiality applies to back-office systems too. Testing automated decisions for unequal outcomes is a duty, not a nice-to-have.","impacts":{"impartiality":2,"doNoHarm":1}},{"id":"ie-2c","label":"Flags only advise; humans decide within 48 hours","detail":"No automatic freezes. A finance officer reviews each flag and must decide within two days.","consequence":"The team grumbles about the extra workload, but frozen payments drop to almost zero. The officers also start writing down why they clear flags, which becomes useful evidence for improving the rules.","reflection":"Keeping humans in the decision — with a deadline that protects the person waiting — balances control with dignity.","impacts":{"impartiality":1,"humanity":1,"doNoHarm":1}}]},{"id":"ie-3","title":"Where does the computing happen?","narrative":"The vendor plans to move all processing to a new data centre in the north of the Netherlands — the same region where local residents have protested about data centres taking land, electricity and water. A local journalist asks whether the Red Cross is part of the problem.","options":[{"id":"ie-3a","label":"Leave it to the vendor","detail":"Where the vendor computes is the vendor's business. Their sustainability report says 'carbon neutral'.","consequence":"The journalist's article quotes your silence. When you ask the vendor for numbers, 'carbon neutral' turns out to rely on offsets bought elsewhere; the actual water and electricity use is not published.","reflection":"Responsibility does not end at the contract. Ethical procurement includes asking where computing happens and what it costs the local community and environment.","impacts":{"doNoHarm":-2,"independence":-1}},{"id":"ie-3b","label":"Make energy reporting a contract term","detail":"Require the vendor to report energy, water and location per year, with a right to exit if targets aren't met.","consequence":"Negotiations take two extra months. The vendor agrees, partly because other NGOs follow your lead. You publish the first report — the numbers are modest because of your rules-first design.","reflection":"Procurement is power. When humanitarian organisations ask together, vendors begin to disclose what they otherwise hide.","impacts":{"doNoHarm":2,"independence":1}},{"id":"ie-3c","label":"Run the small model on your own servers","detail":"Host the invoice model in your existing server room, powered by your rooftop solar and green contract.","consequence":"Your ICT team now maintains one more system, and performance dips during the year-end peak. But you know exactly what the system uses — and it is less than the office coffee machines.","reflection":"Owning the infrastructure brings responsibility as well as control. For small, steady workloads, local hosting can be both more independent and lighter.","impacts":{"independence":2,"doNoHarm":1,"humanity":-1}}]},{"id":"ie-4","title":"Who signs?","narrative":"The system now works well. The board proposes the final step: let it approve and pay all invoices under €5,000 automatically — including the small cash transfers to flood-affected households in Limburg. No human would see them.","options":[{"id":"ie-4a","label":"Full automation under €5,000","detail":"Maximum efficiency. Exceptions are investigated afterwards.","consequence":"A data error in a list import sends double payments to 300 households, then automatically claws them back a week later. Families who had already spent the money on repairs receive debt letters. The headlines are not about efficiency.","reflection":"When automated payments touch people affected by a crisis, errors become harm at scale. Small amounts are not small to the people who receive them.","impacts":{"doNoHarm":-2,"humanity":-1}},{"id":"ie-4b","label":"Automate suppliers, keep humans on people","detail":"Routine supplier invoices go through automatically. Payments to individuals always have a human sign-off.","consequence":"Most of the volume is automated; the payments that touch people's lives still have a name attached. When the import error happens, a finance officer catches it before a single double payment leaves.","reflection":"Draw the line for automation where errors stop being administrative and start being personal.","impacts":{"doNoHarm":2,"humanity":1}},{"id":"ie-4c","label":"Automate, but publish how to appeal","detail":"Automation under €5,000, with a clear phone line and a 5-day promise to fix any wrong payment.","consequence":"The appeal line catches problems fast, and most are fixed within days. But it puts the burden on people affected to notice and complain — and those with the least time and language skills complain least.","reflection":"An appeal route is essential, but it is not a substitute for preventing harm. Accountability works best before the error, not only after it.","impacts":{"doNoHarm":1,"humanity":1,"impartiality":-1}}]}]},{"id":"volunteer-roster","title":"The Volunteer Roster","tagline":"AI scheduling for refugee-reception volunteers in Poland","role":"Volunteer Coordinator, Red Cross branch in Kraków","context":"Two years after the first wave of arrivals from Ukraine, your branch still runs reception, language cafés and a food distribution point. You coordinate 1,800 volunteers through spreadsheets, WhatsApp groups and a lot of late-night phone calls. Shifts go uncovered and the same reliable people are asked again and again. A Polish tech company offers an AI system that predicts demand, builds the roster and messages volunteers automatically.","topics":["AI scheduling","Volunteer wellbeing","Energy footprint"],"roles":["Volunteer management","Operations","Protection"],"debrief":"The Volunteer Roster shows that an AI that optimises people's time is also making decisions about people — who is trusted, who is overlooked, who is pushed too hard. Volunteers are not resources to be maximised. The right system protects their wellbeing, collects as little about them as possible, and uses no more computing than the problem needs.","steps":[{"id":"vr-1","title":"What the system wants to know","narrative":"To predict who will turn up, the vendor wants to connect to volunteers' phone location data, social media activity and calendars, and to score each person's 'reliability'. The demo is impressive: it predicts no-shows with 85% accuracy.","options":[{"id":"vr-1a","label":"Connect everything — accuracy matters","detail":"The more data, the better the roster.","consequence":"The predictions are accurate. Then volunteers find out. Several Ukrainian volunteers, refugees themselves, leave immediately — they fled a war where phone tracking meant danger. Others feel watched in their free time.","reflection":"Volunteers are people, not data sources. Tracking their lives beyond the role breaks trust and can endanger those with their own protection concerns.","impacts":{"doNoHarm":-2,"humanity":-1}},{"id":"vr-1b","label":"Only what volunteers choose to share","detail":"Availability they enter themselves, their skills and languages. No tracking, no reliability scores.","consequence":"Predictions are less precise. But volunteers trust the system and keep their availability up to date — which turns out to matter more than any tracking signal.","reflection":"Data minimisation is respect in practice. Information people give willingly is often more reliable than information taken from them.","impacts":{"doNoHarm":2,"humanity":1}},{"id":"vr-1c","label":"A shared calendar, no AI","detail":"A simple open-source scheduling tool. Volunteers pick their own shifts.","consequence":"It costs almost nothing to run and uses barely any energy. Popular shifts fill instantly; the early-morning food distribution still goes uncovered, and you are still making the 6 a.m. calls.","reflection":"Simple tools are often enough — but it's worth asking which problems they leave unsolved, and for whom.","impacts":{"doNoHarm":1,"independence":1,"humanity":-1}}]},{"id":"vr-2","title":"The optimised roster","narrative":"The scheduling system learns that a small group of volunteers almost always says yes. It starts giving them most of the hard shifts. One of them — a retired teacher who has volunteered every week for two years — tells you she can't sleep anymore.","options":[{"id":"vr-2a","label":"Keep optimising for coverage","detail":"Full coverage is what people arriving need. Willing volunteers want to help.","consequence":"Coverage reaches 98%. Within three months, six of your most experienced volunteers burn out and leave at once. The system adjusts by pushing the next most willing group harder.","reflection":"Optimising for a single number makes everything else invisible. Volunteer wellbeing is part of humanity — it applies to those who help as well as those helped.","impacts":{"humanity":-2,"doNoHarm":-1}},{"id":"vr-2b","label":"Build in limits and rest","detail":"Maximum shifts per week, mandatory rest after night shifts, and a 'no thanks' that never counts against anyone.","consequence":"Coverage drops to 90%, and you recruit to fill the gap. Volunteer retention improves sharply, and the retired teacher comes back after a month's rest.","reflection":"Good systems encode care. Rules that protect people from being overused are humanitarian safeguards, not inefficiencies.","impacts":{"humanity":2,"doNoHarm":1}},{"id":"vr-2c","label":"Let volunteers see and shape the rules","detail":"Publish how the roster is built and set up a volunteer panel that can change the priorities.","consequence":"The panel asks for fairness between language groups and for weekend shifts to rotate. The system becomes slower to change but far more trusted.","reflection":"Transparency about how decisions are made lets people challenge them. Shared rules are easier to accept than hidden ones.","impacts":{"humanity":1,"impartiality":1,"doNoHarm":1}}]},{"id":"vr-3","title":"Messages that never stop","narrative":"The vendor proposes an AI chat assistant that sends each volunteer personalised messages, reminders and 'motivational nudges', written fresh by a large language model for every message — about 30,000 messages a month across Polish, Ukrainian and English.","options":[{"id":"vr-3a","label":"Turn on personalised AI messages","detail":"Warm, tailored messages in three languages, generated one by one.","consequence":"Volunteers find the messages friendly at first, then strange — one receives a 'we miss you!' while in hospital. The energy report shows the messages are now the system's largest energy use, for text that said much the same each time.","reflection":"Generating fresh text for every routine message multiplies computing for little gain. Generative AI is not free: each message has an energy and water cost.","impacts":{"doNoHarm":-2,"humanity":-1}},{"id":"vr-3b","label":"Human-written templates in each language","detail":"Volunteers from each language community write short message templates once. The system fills in names and times.","consequence":"The messages sound like real people because they were written by real people. Computing needs drop to almost nothing, and volunteers enjoy writing the templates together.","reflection":"Often the right amount of AI is less AI. Reusing human-written text is cheaper, lighter and more trustworthy.","impacts":{"doNoHarm":2,"humanity":1,"independence":1}},{"id":"vr-3c","label":"Fewer messages, by volunteer choice","detail":"Volunteers choose how and how often they hear from you. The default is one weekly summary.","consequence":"Message volume drops by 80%. Some shifts fill a little more slowly, but volunteers say they feel respected rather than chased.","reflection":"Letting people set their own boundaries reduces both pressure and footprint.","impacts":{"doNoHarm":1,"humanity":1}}]},{"id":"vr-4","title":"A request from the authorities","narrative":"The regional authorities ask for your volunteer roster data — names, nationalities, availability — to plan their own civil-defence response. The system makes the export one click away. Many of your volunteers are Ukrainian citizens with temporary protection status.","options":[{"id":"vr-4a","label":"Share the full export","detail":"Good cooperation with the authorities helps the overall response.","consequence":"The data is used for planning, and later for checking residence status. Volunteers learn about it from a local news report. Recruitment among Ukrainian volunteers collapses.","reflection":"Data given for one purpose and used for another betrays trust — and can compromise the Movement's independence and neutrality in the eyes of the communities it serves.","impacts":{"independence":-2,"neutrality":-1,"doNoHarm":-2}},{"id":"vr-4b","label":"Share only aggregated numbers","detail":"Offer counts by skill, language and district — no names or nationalities.","consequence":"The authorities get what they need for planning. They grumble at first, then adopt your format as a template for other organisations.","reflection":"Purpose limitation means sharing what's needed for the stated goal and no more. Aggregates protect individuals while still supporting cooperation.","impacts":{"independence":1,"neutrality":1,"doNoHarm":2}},{"id":"vr-4c","label":"Ask volunteers to opt in","detail":"Explain the request and let each volunteer decide whether to be listed with the authorities.","consequence":"About half agree. The rest are grateful to have been asked. It takes three weeks — the authorities find this slow, but accept it.","reflection":"Consent and transparency keep people in control of their own information, even when the request comes from a partner.","impacts":{"independence":1,"doNoHarm":1,"humanity":1}}]}]},{"id":"heat-wave","title":"The Heat Map","tagline":"AI forecasting to protect older people during a heatwave in Sicily","role":"Head of Emergency Health, Red Cross regional committee in Palermo","context":"Summer temperatures in Sicily now regularly pass 45°C. Last July, older people living alone died in their apartments before anyone checked on them. A European research consortium offers an AI model that combines weather forecasts, health records, phone data and satellite imagery to predict which streets and which people face the highest risk — so your volunteers know where to knock first. Running it requires a powerful computing cluster in Northern Europe.","topics":["Predictive AI","Climate adaptation","Energy footprint"],"roles":["Emergency health","Information management","Community engagement"],"debrief":"The Heat Map captures a hard paradox: AI used to respond to climate change can itself add to the energy and resource use that drives it. Prediction can save lives, but only if it doesn't exclude the people it fails to see, doesn't take more data than needed, and is sized honestly against its own footprint.","steps":[{"id":"hw-1","title":"How big a model?","narrative":"The consortium's model is huge: it reprocesses European satellite imagery and climate simulations every few hours. Your information officer estimates that one summer of running it would use as much electricity as a small Sicilian village. A local university offers a simpler alternative: a statistical heat-risk index built from forecasts, building age and age data by neighbourhood.","options":[{"id":"hw-1a","label":"Use the large AI model","detail":"The most precise predictions available — at the energy cost of a village.","consequence":"The predictions are excellent for the city centre. But the model's appetite for computing means it runs only twice a day, and its large footprint becomes a story in the Italian press: 'Red Cross fights heat with a machine that heats the planet'.","reflection":"Climate-response tools must be judged by their own climate footprint. The most powerful model is not automatically the most humane one.","impacts":{"humanity":1,"doNoHarm":-2}},{"id":"hw-1b","label":"Use the simple heat-risk index","detail":"Less precise, runs on a laptop, and explainable to any volunteer.","consequence":"The index points to the same high-risk areas for 90% of cases. Volunteers understand why a street is red, and community leaders can correct it — which they do, adding two neighbourhoods the data missed.","reflection":"Simple, explainable models invite participation and correction. Fit-for-purpose is often better than state-of-the-art.","impacts":{"doNoHarm":2,"humanity":1,"independence":1}},{"id":"hw-1c","label":"Large model, but only during heat alerts","detail":"Run the big model only when the national service issues a red alert.","consequence":"Energy use falls by 80%. But the model starts 'cold' on alert days and takes hours to produce useful results — the first, deadliest day is the one it covers worst.","reflection":"Limiting use is a good instinct. But compromises have to be checked against when people are actually most at risk.","impacts":{"doNoHarm":1,"humanity":-1}}]},{"id":"hw-2","title":"Who is invisible?","narrative":"The model relies on phone data and registered health records. Your volunteers point out who that misses: undocumented migrant farm workers living in informal settlements outside the city, and older people without smartphones. Neither group appears on the heat map.","options":[{"id":"hw-2a","label":"Trust the map","detail":"Volunteers are limited. Go where the data says risk is highest.","consequence":"Visits are efficient and many lives are protected in the city. In an informal settlement near Campobello, two farm workers are hospitalised with heatstroke. No one had visited.","reflection":"Data reflects who is counted, not who is at risk. Allocating help by data alone can quietly exclude the most vulnerable.","impacts":{"impartiality":-2,"humanity":-1}},{"id":"hw-2b","label":"Reserve teams for the unmapped","detail":"A third of volunteer capacity goes to places and groups the data can't see, guided by community contacts.","consequence":"City coverage is slightly thinner. Settlement visits bring water, shade and early treatment to hundreds of workers the model never knew existed.","reflection":"Impartiality means help according to need, not according to visibility. Human knowledge must correct the data's blind spots.","impacts":{"impartiality":2,"humanity":1}},{"id":"hw-2c","label":"Collect more data on the missing","detail":"Ask migrant workers to register their location on a phone app so the model can include them.","consequence":"Few register — many fear immigration authorities. Those who do create a dataset that the consortium later asks to share with other partners.","reflection":"Making invisibl
