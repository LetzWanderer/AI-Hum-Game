s sont payés pour ne pas remarquer.","impacts":{"doNoHarm":2,"independence":1}},{"id":"bt-4c","label":"Mandater un auditeur externe une fois par an","detail":"Revue indépendante, rapport annuel, la direction donne suite aux constats. À distance et abordable.","consequence":"Le premier audit est minutieux et arrive onze mois après les décisions qu’il examine. Les constats sont exacts, les recommandations sensées, et le pilote le plus risqué s’est terminé — pour des raisons sans rapport — trois mois avant l’arrivée du rapport.","reflection":"L’audit est un rétroviseur : indispensable, et aveugle à ce qui approche. La revue externe annuelle complète la supervision permanente ; elle ne peut pas remplacer quelqu’un qui regarde la route.","impacts":{"doNoHarm":1,"independence":-1}}]}],"debrief":"L’épreuve du conseil est l’endroit où tous les autres scénarios se décident par avance. La pression des donateurs, l’IA de l’ombre, l’automatisation de vos propres effectifs et la question de qui peut dire non — rien de tout cela n’est une question de technologie ; ce sont des questions de gouvernance avec de la technologie dedans. Une Société nationale qui écrit ses lignes rouges, offre à son personnel une voie gouvernée, traite ses propres gens comme partie de « l’humanité » et assoit des voix communautaires là où les décisions se prennent fera automatiquement de meilleurs choix sur le terrain."},{"id":"clinic-notes","title":"La clinique à l’écoute","tagline":"La transcription par IA dans une clinique pour migrants sans papiers en Suède","role":"Responsable des services de santé, clinique de la Croix-Rouge à Gothenburg","context":"Votre clinique accueille des personnes qui ne peuvent pas ou n’osent pas recourir au système de santé ordinaire : migrants sans papiers, citoyens de l’UE sans assurance maladie, personnes déboutées de l’asile. Les infirmiers et médecins bénévoles consacrent près de la moitié de chaque consultation à saisir des notes, souvent avec l’aide d’un interprète. Une jeune entreprise de technologies de santé propose gratuitement un outil de transcription par IA qui écoute la consultation, la traduit et rédige la note médicale. Les listes d’attente sont longues et vos bénévoles s’épuisent.","topics":["Transcription par IA","Données de santé","Empreinte énergétique"],"roles":["Services de santé","Protection des données","Gestion des bénévoles"],"debrief":"La clinique à l’écoute montre que l’IA administrative n’est jamais seulement administrative. Lorsque les personnes présentes ont toutes les raisons de craindre d’être enregistrées, la minimisation des données, le consentement éclairé, le traitement local et un budget énergétique transparent ne sont pas des options : ils déterminent si la clinique reste un lieu sûr.","steps":[{"id":"cn-1","title":"L’offre gratuite","narrative":"L’outil de la jeune entreprise enregistre toute la consultation, envoie l’audio à un grand modèle de traitement de la parole hébergé hors de l’UE et restitue en une minute une note soignée en suédois. Il est gratuit pendant un an : l’entreprise veut mettre en avant « l’IA au service du bien ». Votre délégué à la protection des données demande où vont les enregistrements. Votre médecin bénévole le plus expérimenté se demande si les patients continueront à se confier.","options":[{"id":"cn-1a","label":"Accepter l’outil gratuit dans le cloud","detail":"Le soulagement le plus rapide pour les bénévoles. Les enregistrements complets quittent la clinique et sont traités à l’étranger par un modèle que vous ne pouvez pas examiner.","consequence":"En une semaine, le temps consacré à la documentation est divisé par deux. Puis l’avocate d’une patiente demande si les autorités pourraient réclamer les enregistrements de sa cliente dans le cadre d’une procédure d’expulsion. Vous ne pouvez pas dire avec certitude où l’audio est stocké, pendant combien de temps ni qui peut y accéder. La nouvelle se répand dans la communauté et trois patients réguliers cessent de venir.","reflection":"Pour les personnes qui vivent dans la crainte des autorités, l’enregistrement lui-même peut être source de préjudice. Un outil gratuit payé avec les données les plus sensibles des personnes les plus exposées n’est pas gratuit. La résolution sur les TIC engage le Mouvement à protéger les données à caractère personnel précisément là où les conséquences d’une fuite seraient les plus graves.","impacts":{"humanity":1,"doNoHarm":-2,"independence":-1}},{"id":"cn-1b","label":"Tester un petit modèle fonctionnant dans la clinique","detail":"Un modèle compact de traitement de la parole installé sur un ordinateur local. Aucun enregistrement audio ne quitte le bâtiment ; les notes sont moins abouties et nécessitent davantage de corrections.","consequence":"L’installation prend un mois et les notes doivent être corrigées, surtout en tigrigna et en dari. Mais rien ne quitte la clinique, l’audio est supprimé dès que la note est validée et la machine consomme à peu près autant qu’une lampe de bureau. Les bénévoles économisent un tiers de leur temps de saisie plutôt que la moitié.","reflection":"Les modèles locaux, dimensionnés selon les besoins, privilégient la maîtrise à la qualité de présentation. Lorsque le traitement reste sur place, vous savez où sont les données, combien de temps elles sont conservées et combien d’énergie leur traitement consomme : trois questions auxquelles une organisation humanitaire devrait toujours pouvoir répondre.","impacts":{"doNoHarm":2,"independence":1,"humanity":1}},{"id":"cn-1c","label":"Pas d’IA : financer plutôt des bénévoles administratifs","detail":"Recruter des secrétaires médicaux bénévoles pour saisir les notes après chaque permanence.","consequence":"Le recrutement fonctionne auprès des étudiants de Gothenburg et les patients ne remarquent aucun changement. Mais il est difficile de garder les secrétaires pendant les examens et, lors des consultations du soir, les médecins se remettent à saisir leurs notes jusqu’à minuit.","reflection":"Refuser l’IA est un choix légitime qui a un coût réel, souvent supporté par du personnel et des bénévoles épuisés. La question n’est pas de savoir si l’IA est bonne ou mauvaise, mais si une solution plus légère répond mieux aux besoins des personnes dans ce contexte.","impacts":{"doNoHarm":1,"humanity":-1}}]},{"id":"cn-2","title":"Le consentement dans la salle d’attente","narrative":"Quel que soit l’outil utilisé, les patients doivent être informés qu’ils sont enregistrés. Votre équipe rédige un formulaire de consentement. Un bénévole propose une simple case à cocher à l’inscription. Un interprète prévient que beaucoup de patients cocheront tout ce qu’une personne portant un gilet de la Croix-Rouge leur présentera, de peur de se voir refuser l’accès aux soins.","options":[{"id":"cn-2a","label":"Une case à cocher à l’inscription","detail":"Rapide et en ordre sur le plan juridique. Les patients donnent leur accord une fois pour toutes les consultations à venir.","consequence":"Le taux de consentement atteint 99 %. Un audit révèle ensuite que la plupart des patients n’avaient pas compris ce qu’ils avaient accepté ; plusieurs pensaient que c’était une condition pour être soignés.","reflection":"Un consentement donné dans une situation de dépendance n’est pas un consentement libre. Lorsque les personnes ont besoin d’aide, une case cochée mesure leur acquiescement, pas leur compréhension.","impacts":{"doNoHarm":-2,"humanity":-1}},{"id":"cn-2b","label":"Demander à chaque visite, avec une véritable possibilité de refus","detail":"Le soignant pose la question dans la langue du patient au début de chaque consultation. Un refus ne change rien aux soins.","consequence":"Environ un patient sur cinq refuse, surtout parmi les nouveaux arrivants. Leurs notes sont saisies manuellement. La confiance grandit : les patients disent à d’autres que la clinique leur demande leur avis et qu’elle en tient réellement compte.","reflection":"C’est la possibilité de refuser sans aucune conséquence défavorable qui rend l’appui de l’IA acceptable. Maintenir une solution sans IA protège les personnes qui en ont le plus besoin.","impacts":{"doNoHarm":2,"humanity":1,"impartiality":1}},{"id":"cn-2c","label":"Enregistrer uniquement le résumé du soignant","detail":"La voix du patient n’est jamais enregistrée. Après la consultation, le soignant dicte un bref résumé à l’outil.","consequence":"Les paroles du patient ne passent jamais par la machine. Le gain de temps est moindre, mais la dictée est rapide, le fichier audio est minuscule et son traitement ne nécessite qu’une fraction de l’énergie consommée par la transcription de toute la conversation.","reflection":"La minimisation des données peut être un choix de conception : modifier ce que l’on recueille plutôt que protéger ce que l’on n’aurait pas dû recueillir. Moins de données, c’est aussi moins de calcul, de stockage et d’énergie.","impacts":{"doNoHarm":2,"humanity":1}}]},{"id":"cn-3","title":"La facture cachée","narrative":"La section régionale de la Croix-Rouge souhaite déployer la transcription dans les douze points de santé et de soutien psychosocial de l’ouest de la Suède, et conserver chaque enregistrement pendant cinq ans « pour entraîner un meilleur modèle plus tard ». Votre bénévole informatique fait le calcul : stocker et retraiter régulièrement des milliers d’heures d’audio nécessiterait chaque année autant d’électricité et de refroidissement qu’une salle de serveurs.","options":[{"id":"cn-3a","label":"Tout conserver pour un entraînement futur","detail":"Davantage de données pourrait permettre de meilleurs modèles. Le stockage est peu coûteux et le réseau électrique suédois repose principalement sur des sources non fossiles.","consequence":"Les archives atteignent plusieurs téraoctets de conversations parmi les plus sensibles que votre organisation ait jamais recueillies. La consommation d’énergie augmente chaque mois. Personne n’entraîne finalement le modèle, mais il faut toujours sécuriser les archives, les sauvegarder et alimenter les équipements.","reflection":"Une électricité décarbonée ne rend pas le gaspillage inoffensif : l’électricité utilisée ici n’est pas disponible pour d’autres besoins et le matériel a déjà une lourde empreinte avant même sa mise sous tension. Les données conservées « au cas où » entraînent indéfiniment des risques pour la vie privée et des coûts énergétiques.","impacts":{"doNoHarm":-2,"humanity":-1}},{"id":"cn-3b","label":"Supprimer l’audio, mesurer et publier la consommation d’énergie","detail":"L’audio est supprimé sous 24 heures. Chaque site communique sa consommation d’énergie par consultation et les chiffres figurent dans le rapport annuel.","consequence":"Les premiers chiffres surprennent tout le monde : le projet pilote dans le cloud consommait environ trente fois plus d’énergie par note que le modèle local. Le conseil d’administration adopte un budget énergétique par consultation et deux sections choisissent le modèle local sur cette base.","reflection":"On ne peut pas maîtriser une empreinte que l’on refuse de mesurer. Publier le coût énergétique de l’IA transforme la durabilité, jusque-là simple slogan, en un critère de décision que les communautés et les donateurs peuvent vérifier.","impacts":{"doNoHarm":2,"independence":1}},{"id":"cn-3c","label":"Déployer uniquement là où les bénévoles le demandent","detail":"Aucune obligation à l’échelle régionale. Les sites choisissent de participer après avoir examiné les résultats de votre clinique.","consequence":"Cinq sites l’adoptent, sept ne le font pas. L’utilisation, et donc la consommation d’énergie, reste proportionnée aux besoins réels, mais les pratiques divergent et le délégué à la protection des données doit désormais vérifier cinq configurations.","reflection":"Le déploiement à plus grande échelle doit reposer sur des preuves d’utilité, pas sur l’enthousiasme. Réduire l’empreinte consiste souvent simplement à ne pas installer un outil là où il n’est pas nécessaire.","impacts":{"doNoHarm":1,"humanity":1}}]},{"id":"cn-4","title":"Quand la note est erronée","narrative":"Une patiente revient avec une infection qui s’aggrave. La note rédigée par l’IA lors de sa première visite indiquait « aucune allergie connue ». Elle avait pourtant précisé, par l’intermédiaire de l’interprète, qu’elle était allergique à la pénicilline. Le médecin bénévole avait validé la note à la fin d’une permanence de douze heures sans la lire attentivement.","options":[{"id":"cn-4a","label":"Traiter l’incident comme une erreur humaine individuelle","detail":"Rappeler au médecin de lire plus attentivement. Conserver le fonctionnement actuel.","consequence":"Deux mois plus tard, un autre bénévole valide une autre note erronée. Le schéma est identique : des personnes fatiguées, de longues permanences et des notes qui paraissent fiables.","reflection":"Le biais d’automatisation est prévisible : un texte soigné incite à l’approuver. Rejeter la faute sur les individus masque un problème de conception qui se reproduira.","impacts":{"doNoHarm":-2,"humanity":-1}},{"id":"cn-4b","label":"Réserver les champs critiques à une saisie humaine","detail":"Les allergies, les médicaments et les risques pour la sécurité font toujours l’objet de questions et d’une saisie par le soignant. L’IA rédige uniquement la partie descriptive.","consequence":"Les notes prennent un peu plus de temps et, lors de l’audit suivant, les erreurs dans les champs critiques sont nulles. Vous expliquez à la patiente ce qui s’est passé, lui présentez des excuses et lui décrivez le changement ; elle accepte de continuer à venir.","reflection":"Un contrôle humain effectif suppose de prévoir où les humains prennent les décisions, et pas seulement de leur demander de signer. La transparence envers la personne touchée fait partie de la redevabilité.","impacts":{"doNoHarm":2,"humanity":1}},{"id":"cn-4c","label":"Suspendre l’IA et réexaminer le dispositif avec les patients","detail":"Interrompre la transcription pendant un mois et inviter d’anciens patients et des interprètes à réfléchir à son fonctionnement.","consequence":"La pause mobilise davantage d’heures de bénévolat. La réflexion fait émerger la meilleure idée de la clinique à ce jour : les interprètes relisent aux patients les informations essentielles avant la validation de la note. C’est plus lent et les erreurs deviennent rares.","reflection":"Les personnes concernées par un système sont souvent les mieux placées pour repérer ses défaillances. Faire une pause pour écouter n’est pas un échec : c’est ainsi que la redevabilité humanitaire se concrétise.","impacts":{"doNoHarm":2,"humanity":-1,"impartiality":1}}]}]},{"id":"invoice-engine","title":"Le moteur de facturation","tagline":"Automatiser la gestion financière au siège national aux Pays-Bas","role":"Directeur des finances et de l’administration, siège de la Société nationale à The Hague","context":"Votre équipe financière traite 40 000 factures par an : fournisseurs de centres d’hébergement, remboursements aux bénévoles, paiements à des organisations partenaires à l’étranger et transferts monétaires aux personnes touchées par les inondations dans le Limburg. Trois de vos huit collaborateurs partent à la retraite. Un grand éditeur de logiciels propose un agent d’IA qui lit les factures, les impute, signale les fraudes et approuve automatiquement les paiements courants. Le conseil d’administration souhaite réaliser des économies au profit des programmes.","topics":["Automatisation des processus","Redevabilité financière","Empreinte énergétique"],"roles":["Finances et administration","TIC","Audit et conformité"],"debrief":"Le moteur de facturation montre que l’IA des services administratifs détermine qui est payé, qui fait l’objet d’un signalement et combien d’énergie l’organisation consomme pour cela. L’efficacité est un objectif humanitaire légitime, mais seulement si des personnes restent responsables des paiements, si les signalements peuvent être contestés et si l’on privilégie l’outil fonctionnel le plus léger plutôt que le plus impressionnant.","steps":[{"id":"ie-1","title":"Quel outil pour cette tâche ?","narrative":"L’agent du fournisseur fait passer chaque facture par un grand modèle d’IA généraliste dans le cloud, même les factures simples qui suivent le même modèle chaque mois. Votre contrôleur de gestion note que 80 % des factures proviennent de seulement 200 fournisseurs réguliers. Un bénévole spécialiste des TIC suggère qu’une automatisation classique fondée sur des règles, complétée par un petit modèle pour les cas complexes restants, ferait l’essentiel du travail.","options":[{"id":"ie-1a","label":"Acheter l’agent d’IA complet","detail":"Une plateforme unique pour tout. Chaque facture, simple ou complexe, passe par un grand modèle.","consequence":"Le système fonctionne de manière impressionnante. Mais il coûte aussi plus cher que le personnel qu’il remplace et son rapport d’utilisation révèle que chaque facture récurrente simple mobilise autant de calcul qu’une longue conversation en ligne, et cela des dizaines de milliers de fois par an.","reflection":"Utiliser un grand modèle d’IA pour une tâche qu’une simple règle peut accomplir revient à envoyer un camion livrer une lettre. Chaque requête inutile a un coût en énergie, en eau et en matériel.","impacts":{"doNoHarm":-1,"independence":-1}},{"id":"ie-1b","label":"Des règles d’abord, une petite IA pour le reste","detail":"Une automatisation simple pour les factures récurrentes ; un petit modèle ne lit que les factures inhabituelles ; le personnel traite les exceptions.","consequence":"La mise en place prend trois mois avec votre équipe TIC. Les factures récurrentes sont traitées à grande vitesse, presque sans calcul. Le petit modèle prend en charge les reçus manuscrits des bénévoles. Les coûts de fonctionnement et la consommation d’énergie ne représentent qu’une fraction de ceux de l’offre du fournisseur.","reflection":"La conception frugale est un principe, pas un compromis : commencer par l’outil le plus simple et n’ajouter l’IA que là où elle apporte une valeur manifeste. C’est aussi ainsi que le système reste compréhensible pour les auditeurs.","impacts":{"doNoHarm":2,"independence":1}},{"id":"ie-1c","label":"Recruter et former plutôt qu’automatiser","detail":"Remplacer les départs à la retraite par deux recrutements et améliorer le système existant.","consequence":"Les paiements restent exacts et les responsabilités restent humaines. Mais le recrutement prend des mois, les retards atteignent six semaines et certains petits fournisseurs des zones inondées attendent trop longtemps leur paiement.","reflection":"Ne pas automatiser est un choix légitime, mais le retard de paiement est aussi un préjudice, surtout pour les petites entreprises locales et les bénévoles qui avancent leur propre argent.","impacts":{"doNoHarm":1,"humanity":-1}}]},{"id":"ie-2","title":"Le signalement de fraude","narrative":"Les contrôles automatisés commencent à signaler des paiements « à haut risque ». Vous remarquez une tendance : les remboursements aux bénévoles portant des noms non néerlandais et les transferts aux organisations partenaires en Syrie et au Soudan sont signalés trois fois plus souvent. Chaque signalement bloque le paiement jusqu’à trois semaines.","options":[{"id":"ie-2a","label":"Faire confiance aux signalements : le risque avant tout","detail":"La conformité n’est pas négociable. Le blocage des paiements est le prix de la sécurité.","consequence":"Deux organisations partenaires au Soudan ne peuvent pas verser les salaires à temps. Une bénévole d’origine érythréenne qui a acheté des couvertures avec son propre argent attend un mois son remboursement et démissionne. Les signalements ne détectent aucune fraude réelle.","reflection":"Un modèle entraîné sur les tendances passées reproduit les soupçons du passé. Appliqué aux noms et aux destinations, il devient discriminatoire envers les personnes et les partenaires mêmes qu’une organisation humanitaire a pour mission de servir.","impacts":{"impartiality":-2,"humanity":-1,"doNoHarm":-1}},{"id":"ie-2b","label":"Auditer les signalements pour détecter les biais","detail":"Suspendre les blocages automatiques, confronter les signalements aux résultats et supprimer les noms et la nationalité des critères utilisés.","consequence":"L’audit montre que les signalements reposaient surtout sur les noms et la géographie, pas sur le risque. Après les changements, les taux de signalement sont similaires entre les groupes et les deux véritables cas de fraude de l’année sont tout de même détectés, par un enquêteur humain donnant suite à un renseignement.","reflection":"L’impartialité s’applique aussi aux systèmes administratifs. Vérifier si les décisions automatisées produisent des résultats inéquitables est un devoir, pas un simple avantage.","impacts":{"impartiality":2,"doNoHarm":1}},{"id":"ie-2c","label":"Des signalements consultatifs ; une décision humaine sous 48 heures","detail":"Aucun blocage automatique. Un agent financier examine chaque signalement et doit décider sous deux jours.","consequence":"L’équipe proteste contre la charge de travail supplémentaire, mais les paiements bloqués deviennent presque inexistants. Les agents commencent aussi à consigner les raisons pour lesquelles ils lèvent les alertes, ce qui fournit des éléments utiles pour améliorer les règles.","reflection":"Maintenir les humains dans la décision, avec un délai qui protège la personne en attente, permet de concilier contrôle et dignité.","impacts":{"impartiality":1,"humanity":1,"doNoHarm":1}}]},{"id":"ie-3","title":"Où les calculs sont-ils effectués ?","narrative":"Le fournisseur prévoit de transférer tous les traitements vers un nouveau centre de données dans le nord des Pays-Bas, dans la région même où les habitants ont protesté contre l’accaparement des terres, de l’électricité et de l’eau par ces centres. Un journaliste local demande si la Croix-Rouge fait partie du problème.","options":[{"id":"ie-3a","label":"Laisser le fournisseur décider","detail":"Le lieu où le fournisseur effectue ses calculs le regarde. Son rapport de durabilité indique « neutre en carbone ».","consequence":"L’article du journaliste souligne votre silence. Lorsque vous demandez des chiffres au fournisseur, il apparaît que la « neutralité carbone » repose sur des compensations achetées ailleurs ; la consommation réelle d’eau et d’électricité n’est pas publiée.","reflection":"La responsabilité ne s’arrête pas au contrat. Un approvisionnement éthique suppose de demander où les calculs sont effectués et quel en est le coût pour la communauté locale et l’environnement.","impacts":{"doNoHarm":-2,"independence":-1}},{"id":"ie-3b","label":"Inscrire le suivi énergétique dans le contrat","detail":"Exiger du fournisseur un rapport annuel sur l’énergie, l’eau et les lieux de traitement, avec un droit de résiliation si les objectifs ne sont pas atteints.","consequence":"Les négociations prennent deux mois de plus. Le fournisseur accepte, en partie parce que d’autres ONG suivent votre exemple. Vous publiez le premier rapport : les chiffres restent modestes grâce à votre conception privilégiant les règles.","reflection":"Les achats sont un levier de pouvoir. Lorsque les organisations humanitaires formulent ensemble leurs demandes, les fournisseurs commencent à divulguer ce qu’ils cacheraient autrement.","impacts":{"doNoHarm":2,"independence":1}},{"id":"ie-3c","label":"Exécuter le petit modèle sur vos propres serveurs","detail":"Héberger le modèle de traitement des factures dans votre salle de serveurs existante, alimentée par vos panneaux solaires en toiture et votre contrat d’électricité verte.","consequence":"Votre équipe TIC doit désormais entretenir un système supplémentaire et les performances baissent pendant le pic de fin d’année. Mais vous savez exactement ce que le système consomme, et c’est moins que les machines à café du bureau.","reflection":"Posséder l’infrastructure apporte des responsabilités autant que de la maîtrise. Pour des charges de travail faibles et régulières, l’hébergement local peut offrir à la fois plus d’indépendance et une empreinte moindre.","impacts":{"independence":2,"doNoHarm":1,"humanity":-1}}]},{"id":"ie-4","title":"Qui signe ?","narrative":"Le système fonctionne désormais bien. Le conseil d’administration propose la dernière étape : le laisser approuver et payer automatiquement toutes les factures de moins de 5 000 €, y compris les petits transferts monétaires aux ménages touchés par les inondations dans le Limburg. Aucun humain ne les examinerait.","options":[{"id":"ie-4a","label":"Automatisation complète en dessous de 5 000 €","detail":"Une efficacité maximale. Les exceptions sont examinées après coup.","consequence":"Une erreur de données lors de l’importation d’une liste entraîne des doubles paiements à 300 ménages, puis leur récupération automatique une semaine plus tard. Des familles qui ont déjà dépensé l’argent pour des réparations reçoivent des courriers de recouvrement. Les gros titres ne parlent pas d’efficacité.","reflection":"Lorsque les paiements automatisés concernent des personnes touchées par une crise, les erreurs causent des préjudices à grande échelle. De petits montants ne sont pas petits pour les personnes qui les reçoivent.","impacts":{"doNoHarm":-2,"humanity":-1}},{"id":"ie-4b","label":"Automatiser pour les fournisseurs, garder une validation humaine pour les personnes","detail":"Les factures courantes des fournisseurs sont traitées automatiquement. Les paiements aux particuliers exigent toujours une validation humaine.","consequence":"L’essentiel du volume est automatisé ; les paiements qui touchent la vie des personnes restent associés à un responsable identifié. Lorsque l’erreur d’importation survient, un agent financier la repère avant qu’un seul double paiement ne soit effectué.","reflection":"Fixez la limite de l’automatisation là où les erreurs cessent d’être administratives pour devenir personnelles.","impacts":{"doNoHarm":2,"humanity":1}},{"id":"ie-4c","label":"Automatiser, mais publier les modalités de recours","detail":"Automatisation en dessous de 5 000 €, avec une ligne téléphonique clairement indiquée et l’engagement de corriger tout paiement erroné sous 5 jours.","consequence":"La ligne de recours permet de repérer rapidement les problèmes et la plupart sont résolus en quelques jours. Mais elle fait peser sur les personnes concernées la charge de détecter les erreurs et de les signaler ; celles qui ont le moins de temps et de compétences linguistiques se plaignent le moins.","reflection":"Une voie de recours est indispensable, mais elle ne remplace pas la prévention des préjudices. La redevabilité est plus efficace avant l’erreur, pas seulement après.","impacts":{"doNoHarm":1,"humanity":1,"impartiality":-1}}]}]},{"id":"volunteer-roster","title":"Le planning des bénévoles","tagline":"Planifier par IA les permanences des bénévoles chargés de l’accueil des réfugiés en Pologne","role":"Coordinateur des bénévoles, section de la Croix-Rouge à Kraków","context":"Deux ans après la première vague d’arrivées d’Ukraine, votre section assure toujours l’accueil, des cafés linguistiques et un point de distribution alimentaire. Vous coordonnez 1 800 bénévoles à l’aide de tableurs, de groupes WhatsApp et de nombreux appels tard le soir. Des permanences restent sans bénévole et les mêmes personnes fiables sont sollicitées sans cesse. Une entreprise technologique polonaise propose un système d’IA qui prévoit la demande, établit le planning et envoie automatiquement des messages aux bénévoles.","topics":["Planification par IA","Bien-être des bénévoles","Empreinte énergétique"],"roles":["Gestion des bénévoles","Opérations","Protection"],"debrief":"Le planning des bénévoles montre qu’une IA qui optimise le temps des personnes prend aussi des décisions à leur sujet : à qui faire confiance, qui négliger, qui solliciter excessivement. Les bénévoles ne sont pas des ressources à exploiter au maximum. Un système adapté protège leur bien-être, recueille le moins d’informations possible à leur sujet et ne mobilise pas plus de calcul que nécessaire.","steps":[{"id":"vr-1","title":"Ce que le système veut savoir","narrative":"Pour prévoir qui viendra, le fournisseur souhaite accéder aux données de localisation des téléphones des bénévoles, à leur activité sur les réseaux sociaux et à leurs agendas, et attribuer à chacun une note de « fiabilité ». La démonstration est impressionnante : le système prévoit les absences avec une précision de 85 %.","options":[{"id":"vr-1a","label":"Tout connecter : la précision compte","detail":"Plus il y a de données, meilleur est le planning.","consequence":"Les prévisions sont exactes. Puis les bénévoles découvrent le dispositif. Plusieurs bénévoles ukrainiens, eux-mêmes réfugiés, partent immédiatement : ils ont fui une guerre où le suivi des téléphones était synonyme de danger. D’autres se sentent surveillés pendant leur temps libre.","reflection":"Les bénévoles sont des personnes, pas des sources de données. Suivre leur vie en dehors de leur mission brise la confiance et peut mettre en danger ceux qui ont eux-mêmes des besoins de protection.","impacts":{"doNoHarm":-2,"humanity":-1}},{"id":"vr-1b","label":"Uniquement ce que les bénévoles choisissent de communiquer","detail":"Les disponibilités qu’ils saisissent eux-mêmes, leurs compétences et leurs langues. Aucun suivi, aucune note de fiabilité.","consequence":"Les prévisions sont moins précises. Mais les bénévoles font confiance au système et actualisent leurs disponibilités, ce qui s’avère plus important que n’importe quelle donnée de suivi.","reflection":"La minimisation des données est une forme concrète de respect. Les informations que les personnes donnent volontairement sont souvent plus fiables que celles qu’on leur soutire.","impacts":{"doNoHarm":2,"humanity":1}},{"id":"vr-1c","label":"Un calendrier partagé, sans IA","detail":"Un outil simple de planification à code source ouvert. Les bénévoles choisissent eux-mêmes leurs permanences.","consequence":"Son fonctionnement ne coûte presque rien et consomme à peine de l’énergie. Les créneaux prisés sont immédiatement pourvus ; la distribution alimentaire matinale reste sans bénévole et vous passez toujours les appels de 6 heures du matin.","reflection":"Des outils simples suffisent souvent, mais il vaut la peine de se demander quels problèmes ils laissent sans réponse, et pour qui.","impacts":{"doNoHarm":1,"independence":1,"humanity":-1}}]},{"id":"vr-2","title":"Le planning optimisé","narrative":"Le système de planification apprend qu’un petit groupe de bénévoles répond presque toujours oui. Il commence à leur attribuer la plupart des permanences difficiles. L’une d’elles, une enseignante retraitée bénévole chaque semaine depuis deux ans, vous confie qu’elle n’arrive plus à dormir.","options":[{"id":"vr-2a","label":"Continuer à optimiser la couverture des permanences","detail":"Les personnes qui arrivent ont besoin que toutes les permanences soient assurées. Les bénévoles disponibles veulent aider.","consequence":"La couverture atteint 98 %. En trois mois, six de vos bénévoles les plus expérimentés s’épuisent et partent en même temps. Le système s’adapte en sollicitant davantage le groupe suivant le plus disposé à aider.","reflection":"Optimiser un seul indicateur rend tout le reste invisible. Le bien-être des bénévoles relève du principe d’humanité : celui-ci s’applique autant aux personnes qui aident qu’à celles qui sont aidées.","impacts":{"humanity":-2,"doNoHarm":-1}},{"id":"vr-2b","label":"Intégrer des limites et du repos","detail":"Un nombre maximal de permanences par semaine, un repos obligatoire après les permanences de nuit et un « non merci » qui ne pénalise jamais personne.","consequence":"La couverture tombe à 90 % et vous recrutez pour combler l’écart. La fidélisation des bénévoles s’améliore nettement et l’enseignante retraitée revient après un mois de repos.","reflection":"Les bons systèmes intègrent le souci des personnes. Les règles qui les protègent d’une sollicitation excessive sont des garanties humanitaires, pas des inefficacités.","impacts":{"humanity":2,"doNoHarm":1}},{"id":"vr-2c","label":"Permettre aux bénévoles de consulter et de façonner les règles","detail":"Publier la méthode d’élaboration du planning et créer un comité de bénévoles pouvant modifier les priorités.","consequence":"Le comité demande l’équité entre les groupes linguistiques et une rotation des permanences de fin de semaine. Le système évolue plus lentement, mais inspire bien davantage confiance.","reflection":"La transparence sur la prise de décision permet aux personnes de contester les décisions. Des règles partagées sont plus faciles à accepter que des règles cachées.","impacts":{"humanity":1,"impartiality":1,"doNoHarm":1}}]},{"id":"vr-3","title":"Des messages incessants","narrative":"Le fournisseur propose un assistant conversationnel d’IA qui envoie à chaque bénévole des messages personnalisés, des rappels et des « encouragements à agir », rédigés à chaque fois par un grand modèle de langage : environ 30 000 messages par mois en polonais, en ukrainien et en anglais.","options":[{"id":"vr-3a","label":"Activer les messages personnalisés par IA","detail":"Des messages chaleureux et adaptés en trois langues, générés un par un.","consequence":"Les bénévoles trouvent d’abord les messages sympathiques, puis étranges : l’un reçoit « Vous nous manquez ! » alors qu’il est à l’hôpital. Le rapport énergétique montre que les messages sont désormais le premier poste de consommation d’énergie du système, pour des textes qui disent à peu près toujours la même chose.","reflection":"Générer un nouveau texte pour chaque message courant multiplie les calculs pour un gain minime. L’IA générative n’est pas gratuite : chaque message a un coût en énergie et en eau.","impacts":{"doNoHarm":-2,"humanity":-1}},{"id":"vr-3b","label":"Des modèles rédigés par des humains dans chaque langue","detail":"Des bénévoles de chaque communauté linguistique rédigent une fois pour toutes de courts modèles de messages. Le système insère les noms et les horaires.","consequence":"Les messages ont une voix humaine parce que des humains les ont écrits. Les besoins de calcul deviennent presque nuls et les bénévoles apprécient de rédiger les modèles ensemble.","reflection":"Souvent, la bonne dose d’IA, c’est moins d’IA. Réutiliser des textes rédigés par des humains est moins coûteux, plus léger et plus digne de confiance.","impacts":{"doNoHarm":2,"humanity":1,"independence":1}},{"id":"vr-3c","label":"Moins de messages, selon le choix des bénévoles","detail":"Les bénévoles choisissent comment et à quelle fréquence vous les contactez. Par défaut, ils reçoivent un récapitulatif hebdomadaire.","consequence":"Le volume de messages baisse de 80 %. Certaines permanences se remplissent un peu plus lentement, mais les bénévoles disent se sentir respectés plutôt que harcelés.","reflection":"Permettre aux personnes de fixer leurs propres limites réduit à la fois la pression et l’empreinte.","impacts":{"doNoHarm":1,"humanity":1}}]},{"id":"vr-4","title":"Une demande des autorités","narrative":"Les autorités régionales demandent les données de votre planning de bénévoles, noms, nationalités et disponibilités, pour organiser leur propre réponse de protection civile. Le système permet de les exporter en un clic. Nombre de vos bénévoles sont des citoyens ukrainiens bénéficiant d’une protection temporaire.","options":[{"id":"vr-4a","label":"Transmettre l’export complet","detail":"Une bonne coopération avec les autorités contribue à l’ensemble de la réponse.","consequence":"Les données servent à la planification, puis à la vérification des titres de séjour. Les bénévoles l’apprennent dans un reportage local. Le recrutement de bénévoles ukrainiens s’effondre.","reflection":"Utiliser à d’autres fins des données communiquées pour un objectif précis trahit la confiance et peut compromettre l’indépendance et la neutralité du Mouvement aux yeux des communautés qu’il sert.","impacts":{"independence":-2,"neutrality":-1,"doNoHarm":-2}},{"id":"vr-4b","label":"Ne communiquer que des chiffres agrégés","detail":"Proposer des effectifs par compétence, langue et district, sans noms ni nationalités.","consequence":"Les autorités obtiennent ce dont elles ont besoin pour planifier. Elles protestent d’abord, puis adoptent votre format comme modèle pour les autres organisations.","reflection":"La limitation des finalités consiste à ne partager que ce qui est nécessaire à l’objectif annoncé. Les données agrégées protègent les individus tout en permettant la coopération.","impacts":{"independence":1,"neutrality":1,"doNoHarm":2}},{"id":"vr-4c","label":"Demander un accord explicite aux bénévoles","detail":"Expliquer la demande et laisser chaque bénévole décider s’il souhaite figurer sur la liste transmise aux autorités.","consequence":"Environ la moitié accepte. Les autres sont reconnaissants d’avoir été consultés. Cela prend trois semaines : les autorités trouvent ce délai long, mais l’acceptent.","reflection":"Le consentement et la transparence permettent aux personnes de garder la maîtrise de leurs informations, même lorsque la demande vient d’un partenaire.","impacts":{"independence":1,"doNoHarm":1,"humanity":1}}]}]},{"id":"heat-wave","title":"La carte des risques liés à la chaleur","tagline":"Prévoir par IA pour protéger les personnes âgées pendant une canicule en Sicile","role":"Responsable de la santé en situation d’urgence, comité régional de la Croix-Rouge à Palermo","context":"En Sicile, les températures estivales dépassent désormais régulièrement 45 °C. En juillet dernier, des personnes âgées vivant seules sont mortes dans leur appartement avant que quiconque prenne de leurs nouvelles. Un consortium de recherche européen propose un modèle d’IA combinant prévisions météorologiques, dossiers médicaux, données téléphoniques et images satellites pour prévoir quelles rues et quelles personnes sont les plus exposées, afin que vos bénévoles sachent à quelles portes frapper en premier. Son fonctionnement nécessite une puissante grappe de calcul en Europe du Nord.","topics":["IA prédictive","Adaptation au changement climatique","Empreinte énergétique"],"roles":["Santé en situation d’urgence","Gestion de l’information","Engagement communautaire"],"debrief":"La carte des risques liés à la chaleur illustre un paradoxe difficile : l’IA utilisée pour répondre au changement climatique peut elle-même accroître la consommation d’énergie et de ressources qui l’alimente. La prévision peut sauver des vies, mais seulement si elle n’exclut pas les personnes qu’elle ne voit pas, ne recueille pas plus de données que nécessaire et est dimensionnée en tenant honnêtement compte de sa propre empreinte.","steps":[{"id":"hw-1","title":"Quelle taille de modèle ?","narrative":"Le modèle du consortium est immense : il retraite les images satellites européennes et les simulations climatiques toutes les quelques heures. Votre responsable de l’information estime qu’un été d’utilisation consommerait autant d’électricité qu’un petit village sicilien. Une université locale propose une solution plus simple : un indice statistique de risque lié à la chaleur, construit à partir des prévisions, de l’ancienneté des bâtiments et des données d’âge par quartier.","options":[{"id":"hw-1a","label":"Utiliser le grand modèle d’IA","detail":"Les prévisions les plus précises disponibles, au prix de la consommation énergétique d’un village.","consequence":"Les prévisions sont excellentes pour le centre-ville. Mais les besoins de calcul du modèle ne permettent de l’exécuter que deux fois par jour et sa lourde empreinte fait les gros titres de la presse italienne : « La Croix-Rouge lutte contre la chaleur avec une machine qui réchauffe la planète ».","reflection":"Les outils de réponse au changement climatique doivent être évalués à l’aune de leur propre empreinte climatique. Le modèle le plus puissant n’est pas automatiquement le plus humain.","impacts":{"humanity":1,"doNoHarm":-2}},{"id":"hw-1b","label":"Utiliser l’indice simple de risque lié à la chaleur","detail":"Moins précis, il fonctionne sur un ordinateur portable et peut être expliqué à n’importe quel bénévole.","consequence":"L’indice désigne les mêmes zones à haut risque dans 90 % des cas. Les bénévoles comprennent pourquoi une rue est en rouge et les responsables communautaires peuvent le corriger, ce qu’ils font en ajoutant deux quartiers absents des données.","reflection":"Les modèles simples et explicables favorisent la participation et les corrections. Un outil adapté à l’usage vaut souvent mieux qu’une technologie de pointe.","impacts":{"doNoHarm":2,"humanity":1,"independence":1}},{"id":"hw-1c","label":"Le grand modèle, mais uniquement pendant les alertes canicule","detail":"N’exécuter le grand modèle que lorsque le service national émet une alerte rouge.","consequence":"La consommation d’énergie baisse de 80 %. Mais le modèle démarre « à froid » les jours d’alerte et met des heures à produire des résultats utiles : le premier jour, le plus meurtrier, est celui qu’il couvre le moins bien.","reflection":"Limiter l’utilisation est un bon réflexe. Mais il faut vérifier les compromis au regard des moments où les personnes sont réellement le plus exposées.","impacts":{"doNoHarm":1,"humanity":-1}}]},{"id":"hw-2","title":"Qui est invisible ?","narrative":"Le modèle repose sur les données téléphoniques et les dossiers médicaux enregistrés. Vos bénévoles soulignent qui en est absent : les travailleurs agricoles migrants sans papiers vivant dans des installations informelles hors de la ville et les personnes âgées sans smartphone. Aucun de ces deux groupes ne figure sur la carte des risques liés à la chaleur.","options":[{"id":"hw-2a","label":"Faire confiance à la carte","detail":"Le nombre de bénévoles est limité. Aller là où les données indiquent le risque le plus élevé.","consequence":"Les visites sont efficaces et de nombreuses vies sont protégées en ville. Dans une installation informelle près de Campobello, deux travailleurs agricoles sont hospitalisés pour un coup de chaleur. Personne ne leur avait rendu visite.","reflection":"Les données reflètent les personnes recensées, pas les personnes en danger. Répartir l’aide sur la seule base des données peut exclure silencieusement les plus vulnérables.","impacts":{"impartiality":-2,"humanity":-1}},{"id":"hw-2b","label":"Réserver des équipes aux personnes absentes de la carte","detail":"Un tiers des capacités bénévoles est consacré aux lieux et aux groupes que les données ne voient pas, avec l’appui de contacts communautaires.","consequence":"La couverture en ville est légèrement réduite. Les visites dans les installations apportent de l’eau, de l’ombre et des soins précoces à des centaines de travailleurs dont le modèle ignorait l’existence.","reflection":"L’impartialité signifie apporter une aide selon les besoins, et non selon la visibilité. La connaissance humaine doit corriger les angles morts des données.","impacts":{"impartiality":2,"humanity":1}},{"id":"hw-2c","label":"Recueillir davantage de données sur les personnes absentes","detail":"Demander aux travailleurs migrants d’enregistrer leur localisation dans une application téléphonique afin que le modèle puisse les inclure.","consequence":"Peu s’inscrivent : beaucoup craignent les autorités chargées de l’immigration. Ceux qui le font créent un jeu de données que le consortium demande ensuite à partager avec d’autres partenaires.","reflection":"Rendre visibles dans un système des personnes jusque-là invisibles peut les exposer à de nouveaux risques. Parfois, la réponse la plus sûre consiste à agir sans ces données plutôt qu’à les compléter.","impacts":{"impartiality":1,"doNoHarm":-2}}]},{"id":"hw-3","title":"Refroidir les serveurs","narrative":"Le consortium propose d’installer une grappe de calcul locale à Palermo pour accélérer les prévisions. En période de canicule, les serveurs nécessiteraient eux-mêmes une climatisation permanente, alimentée par le même réseau sous tension qui fait fonctionner les ventilateurs des personnes âgées. Pendant la canicule de l’an dernier, certains secteurs de la ville ont subi des coupures de courant.","options":[{"id":"hw-3a","label":"Installer la grappe locale","detail":"Des prévisions plus rapides, une maîtrise locale.","consequence":"Le jour le plus chaud, le gestionnaire du réseau demande des réductions volontaires de consommation. Vos serveurs continuent de fonctionner, et d’être refroidis, alors que deux quartiers subissent des coupures tournantes.","reflection":"Les infrastructures d’IA entrent en concurrence avec les personnes pour l’énergie et l’eau, parfois précisément au moment où ces deux ressources sont les plus rares. Cette concurrence est une question humanitaire.","impacts":{"doNoHarm":-2,"humanity":-1}},{"id":"hw-3b","label":"Privilégier la légèreté et l’énergie solaire","detail":"Exécuter l’indice simple sur des ordinateurs portables au centre opérationnel, alimentés par des panneaux solaires en toiture avec des batteries de secours.","consequence":"Le système fonctionne même pendant la panne. Les batteries maintiennent aussi en service les téléphones du centre opérationnel et les réfrigérateurs destinés aux médicaments.","reflection":"Une conception résiliente et peu énergivore protège les opérations lorsque les infrastructures défaillent, précisément lorsque les outils de gestion de crise sont les plus importants.","impacts":{"doNoHarm":2,"independence":1}},{"id":"hw-3c","label":"Effectuer les calculs en Europe du Nord, avec des énergies renouvelables","detail":"Laisser les calculs lourds dans un centre de données alimenté par l’hydroélectricité en Norvège ou en Suède.","consequence":"Le réseau local est épargné et l’électricité est renouvelable. Mais la connectivité est peu fiable pendant la canicule et vous dépendez d’une liaison que vous ne maîtrisez pas au moment le plus crucial.","reflection":"Déplacer les calculs vers une énergie décarbonée réduit les émissions, mais pas la dépendance. Évaluez à la fois l’empreinte et la question de savoir qui garde la maîtrise en situation de crise.","impacts":{"doNoHarm":1,"independence":-1}}]},{"id":"hw-4","title":"Frapper à la porte","narrative":"Les jours d’alerte, le système donne à chaque bénévole une liste d’adresses classées selon le risque prévu. Un bénévole demande : « Que dois-je dire lorsqu’un homme âgé me demande pourquoi nous l’avons choisi ? » Un autre rapporte que certains habitants se sentent étiquetés comme « sur le point de mourir ».","options":[{"id":"hw-4a","label":"Ne pas expliquer : simplement aider","detail":"Le modèle est trop complexe pour être expliqué sur le pas de la porte.","consequence":"La plupart des personnes acceptent la visite. Certaines n’ouvrent pas. Une rumeur se répand : la Croix-Rouge aurait des listes secrètes provenant de l’hôpital.","reflection":"Lorsque les personnes ignorent pourquoi elles ont été choisies, le soupçon comble ce vide. L’opacité érode la confiance dont dépend l’action humanitaire.","impacts":{"doNoHarm":-1,"humanity":-1}},{"id":"hw-4b","label":"Expliquer simplement et permettre le refus","detail":"Une formule simple : « Cette rue est très chaude et compte de nombreux habitants âgés. Souhaitez-vous que nous prenions de vos nouvelles pendant la canicule ? » Les personnes peuvent refuser et être retirées de la liste.","consequence":"Presque tout le monde accepte. Quelques personnes refusent et leur choix est respecté. Des voisins commencent à signaler aux bénévoles d’autres personnes vivant seules.","reflection":"Expliquer clairement pourquoi une aide est proposée, et accepter un refus, respecte la dignité et transforme une prévision en relation humaine.","impacts":{"humanity":2,"doNoHarm":1}},{"id":"hw-4c","label":"Confier la gestion de la liste aux quartiers","detail":"Partager la carte des risques liés à la chaleur à l’échelle des zones avec les groupes paroissiaux et les associations de quartier, qui décident à qui rendre visite.","consequence":"La couverture devient inégale : forte dans les quartiers organisés, faible ailleurs. Mais là où cela fonctionne, les visites se poursuivent tout l’été, sans aucun modèle.","reflection":"Confier la responsabilité aux communautés renforce durablement leurs capacités, mais il faut toujours veiller aux personnes qui ne bénéficient pas d’un solide entourage communautaire.","impacts":{"humanity":1,"independence":1,"impartiality":-1}}]}]}],"sv":[{"id":"flood-line","title":"Översvämningens linje","tagline":"En AI-chattbot för översvämningsdrabbade samhällen i Sydasien","role":"Chef för katastrofinsatsen, Röda Korset i ett deltaland i Sydasien","context":"Veckor av monsunregn har drivit över 200 000 människor på flykt i deltat. Din telefonlinje är överbelastad — de som ringer väntar i timmar på information om boenden, utdelningar och saknade anhöriga. En telekompartner erbjuder en gratis AI-chattbot som svarar på tre lokala språk. Ditt fyrtioköp är utmattat, och vattnet stiger fortfarande.","topics":["AI-chattbotar","Samverkan med lokalsamhällen","Dataskydd"],"roles":["Katastrofinsats","Informationshantering","Samverkan med lokalsamhällen"],"steps":[{"id":"fl-1","title":"Fyrtioåtta timmar","narrative":"Leverantören säger att chattboten kan vara igång inom 48 timmar, tränad på vanliga frågor från tidigare översvämningar. Din informationsansvarige varnar för att svaren inte har verifierats mot just denna katastrof. En fullständig pilot med mänsklig granskning skulle ta två veckor — tid då människor sover under bar himmel.","options":[{"id":"fl-1a","label":"Lansera inom 48 timmar","detail":"Snabbhet före verifiering. Svaren går ut ogranskade, och du åtgärdar problemen allt eftersom de dyker upp.","consequence":"Inom tre dagar svarar chattboten på 40 000 frågor. Men fältteamen rapporterar att ungefär var tolfte svar är fel — inklusive vägbeskrivningar till ett boende i ett distrikt där platsen stängdes i går kväll. Personalen tillbringar veckan med att jaga rättelser i WhatsApp-grupper.","reflection":"Snabbhet kan rädda liv, men overifierad automatiserad information kan i sig orsaka skada. IKT-resolutionen ålägger Rörelsen att undvika och mildra skada på drabbade människor — inklusive skada orsakad av verktygen vi använder.","impacts":{"humanity":1,"doNoHarm":-2}},{"id":"fl-1b","label":"Kör en två veckor lång pilot först","detail":"Mänskliga granskare kontrollerar varje svarsmall före lansering. Långsammare, men verifierat.","consequence":"Chattboten lanseras dag 14 med 98 procents träffsäkerhet på verifierade svar. Under mellantiden är linjen fortfarande överbelastad och vissa samhällen får information sent — men det de får är tillförlitligt, och förtroendet för tjänsten håller.","reflection":"Verifiering kostar tid, och tid kostar räckvidd. Men tillförlitlig information är en del av opartisk, humanitär hjälp — ett svar som skickar någon åt fel håll är ingen hjälp alls.","impacts":{"humanity":-1,"doNoHarm":2,"impartiality":1}},{"id":"fl-1c","label":"Skippa chattboten, förstärk telefonlinjen","detail":"Rekrytera och utbilda tillfälliga operatörer i stället. Ingen ny teknisk risk, men mycket mindre räckvidd.","consequence":"Du utbildar 25 tillfälliga operatörer på tio dagar. Svarskvaliteten är hög och varje samtal når en människa — men linjen täcker fortfarande bara en bråkdel av efterfrågan, och många fördrivna familjer kommer helt enkelt aldrig fram.","reflection":"Att välja bort AI är också ett beslut med konsekvenser. Oberoendet från leverantörer bevaras, men mänskligheten frågar om ett nåbart verktyg, varsamt styrt, kunde ha lindrat mer lidande.","impacts":{"humanity":-1,"doNoHarm":1,"independence":1}}]},{"id":"fl-2","title":"Vad chattboten minns","narrative":"Leverantörens standardinställning loggar allt: telefonnummer, ungefärliga platser och varje ställd fråga — ”för att förbättra tjänsten”. Din dataskyddsansvarige påpekar att en lista över fördrivna människor, deras platser och deras behov är exakt den typ av datamängd som Rörelsens dataskyddsstandarder finns till för att skydda.","options":[{"id":"fl-2a","label":"Logga allt för en bättre tjänst","detail":"Fullständiga interaktionsloggar matar leverantörens analysmotor. Personanpassningen förbättras.","consequence":"Svaren blir märkbart mer relevanta. Månader senare får du veta att loggarna användes för att träna en kommersiell produkt, och det finns inget praktiskt sätt att dra tillbaka uppgifter om 40 000 fördrivna människor som aldrig samtyckte till det.","reflection":"Drabbade människor får sällan förhandla om sitt samtycke i en kris. IKT-resolutionens dataskyddsåtagande behandlar deras data som deras egna — insamlade för ett angivet syfte, skyddade och aldrig tyst återanvända.","impacts":{"humanity":1,"doNoHarm":-2,"independence":-1}},{"id":"fl-2b","label":"Samla in det minimala","detail":"Anonyma sessioner, inga identifierare, lagringsgränser i avtalet. Mindre personanpassning.","consequence":"Chattboten kan inte känna igen återkommande användare, vilket frustrerar vissa. Men när ett departement begär användardata två månader senare finns det inget identifierbart att lämna ut — och dina team kan säga det ärligt i radion.","reflection":"Dataminimering är den tysta hjälten i ansvarsfull datahantering: du kan varken läcka, förlora eller tvingas lämna ut data du aldrig samlade in. Det skyddar också neutraliteten om konfliktparter senare blir intresserade.","impacts":{"doNoHarm":2,"neutrality":1}},{"id":"fl-2c","label":"Dela loggarna med telekompartnern","detail":"De erbjuder nätverksanalys i utbyte. De drabbade användarna tillfrågas inte.","consequence":"Analysen hjälper dig att kartlägga efterfrågan. Sedan frågar en journalist varför fördrivna människors frågor och platser flödar till ett privat företag. Storyn publiceras rikstäckande; samhällenas förtroende för linjen sjunker kraftigt.","reflection":"Ansvarsskyldighet gentemot drabbade människor innebär att kunna förklara — innan de läser det i tidningen — vem som förvarar deras data och varför. Etiska partnervillkor hör hemma i upphandlingen, inte i kriskommunikationen efteråt.","impacts":{"doNoHarm":-2,"independence":-1}}]},{"id":"fl-3","title":"Fel väg","narrative":"En fältdelegat ringer: chattboten har skickat familjer till en utdelningsplats som stängde för två dagar sedan. Cirka 300 människor gick dit i hettan, en del med små barn. Leverantören kan rätta svaret inom några timmar — men du vet nu att andra svar också kan vara föråldrade.","options":[{"id":"fl-3a","label":"Håll den igång medan du lagar","detail":"Tjänsten förblir uppe. Korrigeringar rullas ut svar för svar under veckan.","consequence":"De flesta användare fortsätter få hjälp — och ett okänt antal fortsätter få föråldrad information. Ytterligare två stängda platser rapporteras innan innehållsgranskningen är klar. Fältteamen tappar förtroendet för verktyget.","reflection":"Att fortsätta driva en tjänst som du vet skadar vissa användare förskjuter risken till dem som har sämst förmåga att bära den. Att inte skada innebär att vara beredd att stänga av sin egen innovation.","impacts":{"humanity":-1,"doNoHarm":-2}},{"id":"fl-3b","label":"Ta den offline och berätta varför","detail":"Pausa chattboten, meddela korrigeringen via radio och SMS, återlansera efter en fullständig innehållsgranskning.","consequence":"Tre dagar utan chattbot, och telefonlinjen stönar igen. Men den transparenta korrigeringen tas väl emot: lokala ledare upprepar ditt budskap, och återlanseringsdagen slår användningsrekord — människor litar på en tjänst som erkänner misstag.","reflection":"Samverkan med lokalsamhällen och ansvarsskyldighet är inte en undersökning i slutet — det är ärlig kommunikation när saker går fel. Att erkänna felet stärkte, snarare än försvagade, tjänsten.","impacts":{"humanity":-1,"doNoHarm":2}},{"id":"fl-3c","label":"Lägg till en ansvarsfriskrivning och fortsätt","detail":"”Svaren kan vara felaktiga — verifiera lokalt.” Tjänsten går aldrig ner.","consequence":"Användningen sjunker något. Men för en mamma som funderar på att gå fem kilometer med ett litet barn är ”kan vara felaktig” inte användbart. Klagomålen ökar bland de mest utsatta användarna, som inte har något sätt att ”verifiera lokalt”.","reflection":"En ansvarsfriskrivning för över ditt ansvar på användaren. Ansvarsskyldighet betyder att organisationen — inte den drabbade personen — bär bördan av att få det rätt.","impacts":{"doNoHarm":-1,"impartiality":-1}}]},{"id":"fl-4","title":"Vem lyssnar?","narrative":"Sex veckor in stabiliseras katastrofen. Du måste bestämma hur chattboten — som sannolikt blir en permanent tjänst — förblir ansvarsskyldig gentemot dem som använder den.","options":[{"id":"fl-4a","label":"Kalla till en panel med återkoppling från lokalsamhället","detail":"Drabbade människor granskar svar varje vecka, flaggar skador och formar vad chattboten täcker.","consequence":"Panelen fångar problem som dina mätinstrument aldrig visade: svar som var rimliga i huvudstaden men inte i floddialekterna, och ämnen som människor var rädda att fråga om. Tjänsten blir bättre och mer betrodd.","reflection":"Samverkan med lokalsamhällen och ansvarsskyldighet — ett centralt åtagande i IKT-resolutionen — behandlar drabbade människor som beslutsfattare om verktygen som tjänar dem, inte bara som användningsstatistik.","impacts":{"doNoHarm":2,"impartiality":1}},{"id":"fl-4b","label":"Lita på användningsstatistiken","detail":"Mätinstrumenten visar starkt engagemang. Om människor använder den fungerar den.","consequence":"Siffrorna ser strålande ut i givarrypporterna. Månader senare visar en utvärdering att användarna med sämst utfall — äldre, personer med funktionsnedsättning, talare av icke-dominerande språk — helt enkelt slutade använda chattboten, osynligt.","reflection":"Statistik mäter dem som stannade kvar. Opartiskheten frågar om dem som data inte kan se — och de är ofta de mest behövande.","impacts":{"impartiality":-2,"doNoHarm":-1}},{"id":"fl-4c","label":"Lämna modereringen till outbildade volontärer","detail":"Lokal god vilja håller tjänsten vid liv till nästan noll kostnad.","consequence":"Volontärerna arbetar hårt, men utan utbildning eller eskaleringsvägar står vissa skadliga svar kvar i veckor och känsliga frågor får inkonsekvent behandling. Två volontärer bränner ut sig och slutar.","reflection":"Ansvarsskyldighet kan inte läggas ut på god vilja. Etisk användning inkluderar att finansiera människorna som håller automatiserade system säkra — annars är automatiseringen inte verkligt styrd.","impacts":{"humanity":1,"doNoHarm":-1}}]}],"debrief":"Översvämningens linje visar hur snabbt en välmenande chattbot berör varje åtagande i IKT-resolutionen: verifierad information (att inte skada), dataminimering och ändamål (dataskydd), ärlig kommunikation när saker går fel (ansvarsskyldighet gentemot samhällen) och styrning som låter drabbade människor behålla kontrollen över verktygen som är tänkta att tjäna dem."},{"id":"targeting-unseen","title":"Att sikta på de osynliga","tagline":"Prediktiv analys för urval av mottagare i Sahel","role":"Programchef för kontantstöd, Torkinsatsen i Sahel","context":"En arton månader lång torka i Sahel har drivit 60 000 hushåll mot kris. Ditt kontantprogram kan nå 15 000. Urvalet är det svåraste och mest omtvistade beslutet i insatsen — och ett analysföretag erbjuder en prediktiv modell som rangordnar hushåll efter sannolikt behov på dagar i stället för månader.","topics":["Urval av mottagare","Algoritmisk snedvridning","Datadelning med teknikpartner"],"roles":["Programledning","Data och analys","Skydd"],"steps":[{"id":"tu-1","title":"Den data du har","narrative":"Modellen är bara så bra som sin träningsdata. Du har tre realistiska alternativ, inget perfekt, och nästa period av osäker livsmedelsförsörjning stänger om åtta veckor.","options":[{"id":"tu-1a","label":"Använd det fyra år gamla registret","detail":"Snabbt och klart. Men det är äldre än torkan, fördrivningen och gränsstängningen.","consequence":"Rangordningarna är klara på fem dagar. Fältteamen upptäcker snabbt att modellen poängsätter hushåll som sedan dess har återhämtat sig — och är blind för tusentals nyligen fördrivna familjer som aldrig registrerades. Klagomål om uteslutning strömmar in.","reflection":"En modell tränad på gårdagens verklighet reproducerar gårdagens bild av behov. Opartiskhet — hjälp enbart efter behov — misslyckas tyst när datan inte kan se vem som lider nu.","impacts":{"impartiality":-2,"humanity":-1}},{"id":"tu-1b","label":"Samla in färsk data från dörr till dörr","detail":"Intervjuare med surfplattor och samtyckesmanus. Sex veckor, verklig täckning av de oregistrerade.","consequence":"Fördröjningen är smärtsam — en månad av knapphet hinner passera innan pengarna flödar. Men modellen tränas på dagens verklighet, inklusive hushåll som ingen lista någonsin fångat. Lokala ledare kallar det det rättvisaste urval de sett.","reflection":"Ibland är ansvarsfull AI-användning att sakta ner för att ge den ärliga indata. Samtyckesbaserad insamling förevisar också den dataskyddsstandard som IKT-resolutionen efterfrågar.","impacts":{"impartiality":2,"doNoHarm":1,"humanity":-1}},{"id":"tu-1c","label":"Blanda registret med satellitproxyer","detail":"Takmaterial, vegetation, vägåtkomst som behovsindikatorer. Billigt, snabbt, inga nya undersökningar.","consequence":"Täckningen är snabb och bred. Men proxyerna misslyder hela grupper: nomader vars rikedom går på fyra ben poängsätts som utfattiga, medan fattigdomsdrabbade familjer under solida tak poängsätts som välbärgade. Att rätta felen tar längre tid än undersökningen skulle ha gjort.","reflection":"Proxyvariabler kodar antaganden om hur fattigdom ser ut. När antagandena är fel blir snedvridningen systematisk — den träffar samma typer av hushåll varje gång, vilket är motsatsen till opartiskhet.","impacts":{"impartiality":-1,"doNoHarm":-1,"humanity":1}}]},{"id":"tu-2","title":"Modellens blinda fläckar","narrative":"Valideringsresultaten kommer tillbaka: den övergripande träffsäkerheten ser stark ut, men kvinnohushåll och en etnisk minoritetsgrupp rangordnas systematiskt lägre än vad fältbedömningar säger att de borde. Företaget säger att gapet är ”inom acceptabel tolerans”. Utbetalningsdeadline är om tio dagar.","options":[{"id":"tu-2a","label":"Driftsätt för att hålla deadline","detail":"Pengarna flödar i tid. Den kända snedvridningen hamnar i ett ”lärdomar”-dokument.","consequence":"15 000 hushåll får pengar enligt plan — men bland de uteslutna finns en oproportionerligt stor andel kvinnohushåll. Besvärsavdelningen överbelastas, och en lokal radiopratare frågar varför datorn ”glömde änkorna”.","reflection":"En känd, oåtgärdad snedvridning är ingen teknisk fotnot; det är ett beslut att diskriminera i stor skala. Att inte skada gäller de skador du kan förutse lika mycket som de du inte kan.","impacts":{"humanity":1,"impartiality":-2,"doNoHarm":-1}},{"id":"tu-2b","label":"Kalibrera om med validering från lokalsamhället","detail":"Lokala kommittéer granskar uteslutningsfall. Två veckor till före utbetalning.","consequence":"Fördröjningen är svår att försvara inför givare — tills den reviderade listan landar. Kommittéerna fångar hundratals felaktiga uteslutningar, och eftersom de hjälpt till att forma listan minskar tvisterna kraftigt. Deadlinen spricker; legitimiteten håller.","reflection":"Samverkan med lokalsamhällen är ett av de starkaste verktygen för att korrigera snedvridning. De som lever verkligheten ser mönster som inga valideringsmått fångar — och deras medverkan bygger den ansvarsskyldighet som IKT-resolutionen efterlyser.","impacts":{"impartiality":2,"doNoHarm":1,"humanity":-1}},{"id":"tu-2c","label":"Modellen råder, människor beslutar","detail":"Personal och kommittéer fattar de slutgiltiga urvalsbesluten, med rangordningen som ett av flera underlag.","consequence":"Urvalet tar längre tid än ren automatisering men håller tidplanen. Modellen snabbar fortfarande upp den inledande sorteringen, medan människor absorberar dess blinda fläckar. Dokumenterade mänskliga åsidosättanden skapar en granskningsbar och förklarbar historik.","reflection":"Meningsfull mänsklig insyn är skillnaden mellan att använda en modell och att användas av den. Att hålla det slutgiltiga beslutet mänskligt bevarar ansvarsskyldigheten — någon kan svara för varje namn på listan.","impacts":{"impartiality":1,"doNoHarm":1,"independence":1}}]},{"id":"tu-3","title":"Partnerns pris","narrative":"Analysföretagets standardavtal ger det tillgång till hushållsdatan ”för att förbättra modellen och relaterade produkter”, samt rätten att citera projektet i sin marknadsföring. Juristerna flaggar båda klausulerna. Företaget antyder att att ta bort dem kan avsluta gratislicensen.","options":[{"id":"tu-3a","label":"Dela pseudonymiserad data enligt avtal","detail":"Namn borttagna, avtal undertecknat. Programmet behåller sina gratisverktyg.","consequence":"Programmet sparar pengar. Ett år senare visar en forskare att de ”pseudonymiserade” hushållsuppgifterna kan återidentifieras genom att kombinera plats och hushållsstorlek — och avtalets sanktionsklausul visar sig nästan värdelös över jurisdiktionsgränser.","reflection":"Pseudonymisering är svagare än det ser ut i små populationer, och ett avtal du inte kan driva igenom är ett hopp, inte en skyddsåtgärd. Dataskydd måste överleva partnerskapets slut.","impacts":{"doNoHarm":-2,"independence":-1}},{"id":"tu-3b","label":"Dela bara aggregerade resultat","detail":"Företaget får modellens prestandamått, aldrig data på radnivå. De invänder.","consequence":"Förhandlingarna blir spända och företaget hotar kort med att dra sig ur. Du står fast, och de accepterar — aggregerade mätvärden låter dem fortfarande förbättra modellen. Ingen hushållsuppgift lämnar någonsin din kontroll.","reflection":"Etisk upphandling betyder att Rörelsen sätter villkoren för hur drabbade människors data rör sig, inte leverantören. ”Gratis” verktyg betalas med något — se till att det inte är mottagarnas integritet.","impacts":{"doNoHarm":1,"independence":1}},{"id":"tu-3c","label":"Dra dig ur och bygg internt","detail":"Långsammare, dyrare, och helt ditt eget.","consequence":"Ditt lilla datateam bygger en enklare modell på tre månader. Den är mindre sofistikerad och förseningen är verklig — men varje rad är granskningsbar, varje uppgift stannar internt, och kompetensen lever nu i Rörelsen.","reflection":"Oberoende kostar ibland snabbhet och pengar. Att äga sin förmåga — i stället för att hyra en svart låda — är en långsiktig investering i ansvarstagande, självständigt humanitärt arbete.","impacts":{"independence":2,"doNoHarm":1,"humanity":-1}}]},{"id":"tu-4","title":"Vem skriver under listan?","narrative":"Sista designbeslutet: hur automatiserad är registreringen? Modellen producerar en rangordnad lista över 15 000 hushåll. Någon — eller något — måste förvandla den rangordningen till en slutgiltig, bindande lista.","options":[{"id":"tu-4a","label":"Registrera de 15 000 främsta automatiskt","detail":"Ingen mänsklig granskning. Snabbaste möjliga pengar, fullt ”objektivt”.","consequence":"Pengarna flödar i rekordtid. Sedan dyker felen upp: dubblerade hushåll, en by som modellen felmappat, familjer uteslutna av ett inmatningsfel som ingen människa såg. Utan granskningssteg är varje fel slutgiltigt tills besvären malts igenom.","reflection":"Full automatisering tar inte bort mänskligt omdöme — den gömmer det inuti modellen och datan. Automatiserade beslut om människors överlevnad behöver en människa som kan fånga det systemet inte kan.","impacts":{"doNoHarm":-2,"impartiality":-1,"humanity":1}},{"id":"tu-4b","label":"Personalen verifierar varje fall","detail":"Noggrant och ansvarsfullt — och den flaskhals alla fruktade.","consequence":"Verifieringen tillför fyra veckor. Fångade fel: hundratals. Men hungersäsongen biter innan utbetalningen är klar, och du tillbringar svåra nätter med att försvara förseningen inför lokala ledare som lovats snabbhet.","reflection":"Ansvarsskyldighet har ett pris i tid, och i en hungerkris mäts tid i måltider. Den ärliga läxan: bygg verifieringskapacitet före katastrofen, så att noggrannhet och snabbhet inte är fiender.","impacts":{"doNoHarm":1,"impartiality":1,"humanity":-1}},{"id":"tu-4c","label":"Människa i loopen plus möjlighet att överklaga","detail":"Personalen stickprovskontrollerar listan, kriterierna publiceras, och varje hushåll kan ifrågasätta sin uteslutning.","consequence":"Publicerade kriterier skingrar de flesta misstankar innan de uppstår. Besvärsfönstret fångar 600 felaktiga uteslutningar på två veckor. Listan är inte perfekt — men den är förklarbar, korrigerbar och betrodd.","reflection":"Transparens plus en fungerande besvärsfunktion är vad ansvarsskyldighet gentemot drabbade människor ser ut som i praktiken: inte en felfri algoritm, utan ett system som människor kan ifrågasätta och korrigera.","impacts":{"doNoHarm":2,"impartiality":1}}]}],"debrief":"Att sikta på de osynliga handlar om vem datan inte kan se. Prediktivt urval berör opartiskhet (ser modellen dagens behov?), dataskydd (vem äger hushållsdatan, och kan ”pseudonymiserade” människor återidentifieras?), etisk upphandling (vem sätter villkoren med leverantörerna?) och ansvarsskyldighet (kan en utesluten familj ifrågasätta maskinens svar?)."},{"id":"front-line","title":"Ögon på frontlinjen","tagline":"AI-baserad behovsbedömning i en aktiv konflikt i Mellanöstern","role":"Insatschef, Konfliktinsatsen i Mellanöstern","context":"I en utdragen konflikt flyttar frontlinjerna varje vecka. Två distrikt är avskurna, och din senaste verifierade behovsbedömning är tre månader gammal. Ett globalt teknikföretag erbjuder sin satellitbildsplattform — med maskininlärningsbaserad skadedetektering — gratis för humanitärt bruk. I detta sammanhang är information om var människor befinner sig och vad de behöver inte bara operativa data. Den är också militärt känslig.","topics":["Prediktiv analys","Konfliktkänslighet","Molnberoende","Automatiserat beslutsfattande"],"roles":["Insats","Säkerhet","Informationshantering"],"steps":[{"id":"fo-1","title":"Att se utan att träda in","narrative":"Förhandlingarna om tillträde har stannat av. Plattformen kan kartlägga skadade byggnader i båda avskurna distrikten inom några dagar. Din fältkoordinator varnar för att en byggnads tak inte säger något om människorna inuti.","options":[{"id":"fo-1a","label":"Kör satellitbedömningen nu","detail":"Snabb, fjärrstyrd och säker för personalen. Acceptera de blinda fläckarna för tillfället.","consequence":"Du får den första distriktsövergripande bilden på månader, och konvojplaneringen accelererar. Men modellen läser intakta tak som intakta liv: en beskjuten stad med ett nytt marknadstak poängsätts som ”i återhämtning”, medan dess vattensystem är förstört. Behov på osynliga platser räknas inte.","reflection":"Fjärranalys ser strukturer, inte lidande. Använd ensam snedvrider den hjälpen mot det som är synligt från omloppsbanan — ett opartiskhetsproblem som gömmer sig i en imponerande karta.","impacts":{"humanity":1,"impartiality":-1,"doNoHarm":-1}},{"id":"fo-1b","label":"Vänta på säkert tillträde","detail":"Ingen bedömning förrän delegater kan verifiera på plats. Verifierad data, veckor bort.","consequence":"Tillträdet öppnas sju veckor senare och bedömningen är utmärkt. Under mellantiden går två utdelningar till fel städer och ett distrikt får ingenting alls. Väntan var säker för datakvaliteten och farlig för människorna.","reflection":"Mänskligheten väger kostnaden av att vänta mot kostnaden av fel. Perfekt information är en lyx; disciplinen är att veta vilka beslut som inte kan vänta på den.","impacts":{"humanity":-2,"impartiality":1}},{"id":"fo-1c","label":"Kombinera bilder med rapporter från lokalsamhället","detail":"Betrodda lokala nätverk rapporterar via säkra kanaler; modellen och fältverkligheten kontrollerar varandra.","consequence":"Samhällsrapporterarna korrigerar modellens värsta missar inom några dagar — det förstörda vattensystemet, kliniken som drivs från en källare. Den kombinerade bilden är den bästa du någonsin haft i ett område utan tillträde, och de lokala nätverken känner ägarskap för den.","reflection":"De starkaste AI-insatserna i humanitärt arbete parar maskinens skala med samhällets kunskap. Det är samverkan med lokalsamhällen som gör analytiskt arbete — och det behåller drabbade människor som författare, inte bara subjekt, till datan.","impacts":{"humanity":1,"impartiality":1,"doNoHarm":1}}]},{"id":"fo-2","title":"Gratis plattform, dolda kostnader","narrative":"Företagets plattform är genuint bra — och gratis. Haken: all bildanalys och härledd befolkningsdata bor på företagets moln, under en utländsk jurisdiktion, styrd av dess standardvillkor. Din säkerhetsrådgivare noterar att villkoren tillåter åtkomst för ”tjänsteförbättring”.","options":[{"id":"fo-2a","label":"Acceptera med avtalsklausuler","detail":"Skriv under snabbt med förhandlade skydd. Insatsen kan inte vänta på perfekta villkor.","consequence":"Plattformen förvandlar din lägesbild. Åtta månader senare köps företaget upp, villkoren ändras, och ditt utrymme att omförhandla är begränsat — datan, och beroendet, finns redan där.","reflection":"Etisk upphandling ser bortom prislappen: jurisdiktion, villkor och utträdesalternativ. Oberoende eroderar tyst när en kritisk humanitär förmåga beror på en leverantörs goda vilja.","impacts":{"independence":-2,"doNoHarm":-1}},{"id":"fo-2b","label":"Insistera på drift som Rörelsen kontrollerar","detail":"Data och modeller körs på infrastruktur som Rörelsen kontrollerar. Förhandlingarna tar veckor.","consequence":"Företaget motsätter sig, och går sedan med på en dedikerad driftsättning — långsammare att få upp, men under dina nycklar. När en regering senare kräver tillgång till rörelsedata är svaret strukturellt enkelt: det är inte företagets att ge, och inte ditt att dela.","reflection":"Var data bor avgör vem som kan tvingas lämna ut den. I konfliktmiljöer är kontroll över infrastruktur inte en IT-detalj — det är ett skyddsbeslut.","impacts":{"independence":2,"doNoHarm":1,"humanity":-1}},{"id":"fo-2c","label":"Avböj; använd öppna verktyg internt","detail":"Bildanalys med öppen källkod på egna servrar. Långsammare, sparsammare, helt ditt eget.","consequence":"Dina analytiker bygger en fungerande pipeline på en månad. Den saknar plattformens polityr och teamet är hårt ansträngt — men det finns inget leverantörsberoende, inget utländskt moln, och förmågan överlever slutet av varje partnerskap.","reflection":"Ibland kostar det självständiga valet kapacitet. Avvägningen är verklig och bör fattas medvetet, med öppna ögon för vad ”gratis” plattformar faktiskt tar betalt.","impacts":{"independence":1,"doNoHarm":1,"humanity":-1}}]},{"id":"fo-3","title":"Vem mer tittar?","narrative":"Din analys spårar nu befolkningsrörelser över frontlinjen — exakt den typ av information som väpnade aktörer på båda sidor skulle värdesätta. En givare föreslår att publicera en öppen instrumentpanel ”för transparens och samordning”.","options":[{"id":"fo-3a","label":"Publicera den öppna instrumentpanelen","detail":"Maximal transparens. Vem som helst — inklusive kombattanter — kan läsa den.","consequence":"Samordningen mellan organisationer förbättras. Tre veckor senare beskjuts en fördrivningskorridor som syns på din instrumentpanel. Du kan inte bevisa att panelen möjliggjorde det. Du kan inte bevisa att den inte gjorde det. Personalen i korridoren evakuerad.","reflection":"I konflikt kan transparens om människors rörelser bli målinformation. Neutralitet och att inte skada kan kräva att publicera mindre än man vet — en svår sanning för en sektor som värdesätter ansvarsskyldighet.","impacts":{"neutrality":-2,"doNoHarm":-2}},{"id":"fo-3b","label":"Begränsa till granskade humanitära partner","detail":"Åtkomst efter behov att veta, delningsprotokoll, aggregering innan något sprids vidare.","consequence":"Samordningen blir långsammare och vissa partner muttrar om åtkomstnivåerna. Men befolkningsrörelsedata cirkulerar aldrig utanför organisationer bundna av humanitära principer, och dina team kan redovisa varje kopia.","reflection":"Ansvarsfull datadelning är designad, inte standard: ändamålsbegränsad, åtkomsttrappad och aggregerad där det är möjligt. IKT-resolutionens dataskyddsåtagande gäller mest där insatserna är högst.","impacts":{"neutrality":1,"doNoHarm":2}},{"id":"fo-3c","label":"Dela lika med alla parter","detail":"Ge varje konfliktpart samma data, jämlikt. Neutralitet som symmetri.","consequence":"Båda sidor tar emot datan artigt. Den ena sidans operationer följer sedan iögonfallande de rörelsemönster du tillhandahöll. Din jämlikhet levererade militär underrättelse till vem som ville ha den.","reflection":"Neutralitet handlar om att inte bidra till fientligheternas förande, inte om lika fördelning av känslig data. Symmetrisk delning av asymmetrisk information är inte neutral i sina effekter.","impacts":{"neutrality":-1,"doNoHarm":-2,"humanity":-1}}]},{"id":"fo-4","title":"Algoritmen rekommenderar","narrative":"Plattformen rangordnar nu föreslagna utdelningsplatser efter förutspått behov och tillgänglighet. Dess topp lista utesluter en belägrad stad helt — modellen har nästan ingen data därifrån, så den poängsätter dess behov som ”osäkert/lågt”. Tio tusen människor bor där.","options":[{"id":"fo-4a","label":"Följ algoritmen","detail":"Lita på modellens effektivitet. Ingen data, ingen utdelning.","consequence":"Utdelningarna löper med imponerande effektivitet — överallt utom i staden som behövde det mest. När ett insmugglat brev når ditt kontor har uteslutningen pågått i sex veckor. Modellen hade inte fel om sin data. Den hade fel om världen.","reflection":"”Ingen data” är inte ”inget behov” — i konflikt betyder det ofta motsatsen. Automatiserat beslutsfattande misslyckas hårdast exakt där människor är mest avskurna, vilket är där opartiskheten betyder mest.","impacts":{"impartiality":-2,"humanity":-1,"doNoHarm":-1}},{"id":"fo-4b","label":"Mänskligt åsidosättande, dokumenterat","detail":"Planerarna justerar listan och skriver ner varför. Historiken är granskningsbar.","consequence":"Staden läggs tillbaka utifrån data från före konflikten och samhällsrapporter. Att dokumentera åsidosättandet känns byråkratiskt — tills utvärderingen efteråt, där den dokumentationen är hur du försvarar beslutet och förbättrar modellens hantering av dataluckor.","reflection":"Meningsfull mänsklig kontroll betyder att en person kan åsidosätta maskinen, officiellt, med skäl. Ansvarsskyldigheten lever i den skrivna meningen: vem beslutade, och varför.","impacts":{"impartiality":1,"doNoHarm":1}},{"id":"fo-4c","label":"Dubbel signering: analytiker plus fältdelegat","detail":"Ingen automatiserad rekommendation blir beslut utan två mänskliga underskrifter. Långsammare, med avsikt.","consequence":"Varje utdelningsplan tar en extra dag. I utbyte fångas dataluckor som den belägrade staden strukturellt, inte av en händelse — fältdelegatens jobb är just att fråga vad modellen inte kan se.","reflection":"I högriskmiljöer är redundans i mänskligt omdöme en skyddsåtgärd, inte en ineffektivitet. IKT-resolutionens uppmaning att undvika och mildra skada talar för exakt denna typ av avsiktlig friktion.","impacts":{"doNoHarm":2,"impartiality":1,"humanity":-1}}]}],"debrief":"Ögon på frontlinjen visar AI vid dess högsta insatser. Samma modell som accelererar behovsbedömningen kan förblinda dig för osynligt lidande; samma instrumentpanel som samordnar hjälpen kan göra den till mål; samma algoritm som optimerar utdelningar kan radera en belägrad stad för brist på data. Neutralitet, oberoende och att inte skada är inte begränsningar på tekniken — de är designkraven."},{"id":"cloud-question","title":"Molnfrågan","taglin
