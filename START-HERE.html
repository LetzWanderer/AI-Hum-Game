"عشر تجارب، بسرعة، بشكل ظاهر. أظهر الزخم للمانح؛ ورتّب الحوكمة أثناء السير.","consequence":"يسعد المانح ويكتب البيان الصحفي نفسه. بحلول الشهر الرابع لديك إحدى عشرة تجربة، وثلاثة مزوّدين بوصول إلى بيانات داخلية، وأداتان مكررتان، ولا أحد يستطيع الإجابة عن سؤال بسيط من المجلس: من وافق على كل منها، وبأي معايير؟","reflection":"الحماس المشروط بالتمويل يبقى حماساً. الاستقلال يشمل حرية تبني التقنية بالسرعة التي تستطيع حوكمتك توجيهها فعلاً — المانحون يمولون مهمتك، لا عدّاد أدواتك.","impacts":{"humanity":1,"independence":-2,"doNoHarm":-1}},{"id":"bt-1b","label":"ارفض الشرط بأدب","detail":"اشكر المانح، وأكد معاييرك الموجهة بالمهمة، واقبل مخاطرة التمويل.","consequence":"تذهب المنحة لمنظمة أعلى صوتاً. يُثبت ضبطك صوابه بعد عام عندما ينهار مشروع المانح اللامع في فضيحة بيانات — لكن الإثبات لا يدفع ثمن مشاريع المياه التي كانت المنحة ستمولها.","reflection":"قول لا لمال غير متوافق كلفة حقيقية تتحملها برامج حقيقية. الاستقلال ليس مجانياً؛ وسؤال المجلس هو إن كان مسعّراً بصدق، ويُعاد النظر فيه حين تتغير الوقائع.","impacts":{"independence":1,"humanity":-2}},{"id":"bt-1c","label":"اعتمد إطاراً للذكاء الاصطناعي تبدأ فيه المبادئ","detail":"إطار قصير وعلني: فيمَ ستستخدم الذكاء الاصطناعي، وفيمَ لن تستخدمه أبداً، وكيف تُعتمد الأدوات، وتجربتان رائدتان تُختاران بالحاجة لا بالظهور.","consequence":"يستغرق الإطار ستة أسابيع وثلاث مسودات. المانح، عند عرضه عليه، ينتقل من متشكك إلى معجب — فهو يمنحه شيئاً قابلاً للدفاع ليموله. تمضي تجربتان بمعايير يستطيع المجلس قراءتها فعلاً.","reflection":"الإطار المكتوب يحوّل القيم إلى معايير شراء. أبطأ من بيان صحفي وأسرع من فضيحة — ويتيح لك مقابلة الممولين بوثيقة بدل مزاج.","impacts":{"independence":1,"doNoHarm":2}}]},{"id":"bt-2","title":"ذكاء الظل الاصطناعي","narrative":"التدقيق محرج: موظفون في كل الأقسام يستخدمون روبوتات محادثة عامة يومياً — لصياغة تقارير المانحين، وترجمة ملاحظات الميدان، وتلخيص ملفات الحالات. بعض تلك الوثائق يحوي بيانات مستفيدين. حظرها سيدفعها تحت الأرض؛ وترخيصها يبدو كإقرار لتسريب.","options":[{"id":"bt-2a","label":"احظر أدوات الذكاء الاصطناعي العامة على أجهزة العمل","detail":"سياسة واضحة، ونطاقات محظورة، وملاحظة تأديبية. يتوقف التسريب — رسمياً.","consequence":"رسمياً، الامتثال كامل. وغير رسمياً، ينتقل العمل إلى الهواتف الشخصية — الوثائق نفسها، والأدوات العامة نفسها، غير مرئية الآن لفريق تقنية المعلومات ومسؤول حماية البيانات على حد سواء.","reflection":"الحظر بلا بديل ينقل المخاطر بدل تقليلها. السياسات التي تتجاهل لماذا لجأ الناس إلى الأداة — عبء العمل، الترجمة، السرعة — تُقرأ كتعليمات بالاختباء.","impacts":{"doNoHarm":-1,"independence":-1}},{"id":"bt-2b","label":"وفّر بديلاً معتمداً ومحكوماً","detail":"تعاقد مع خدمة ذكاء اصطناعي مؤسسية بضمانات عدم التدريب والاحتفاظ، وانشر دليل استخدام مقبول من صفحتين بلغة واضحة، ودرّب الفرق على ما لا يجوز إدخاله أبداً.","consequence":"تبنّي الأداة المحكومة سريع لأنها تجيب عن الحاجة الحقيقية. تصمد الخطوط الحمراء في الدليل — لا بيانات تحدد هوية المستفيدين، لا ملفات حالات، لا محتوى حساس أمنياً — لأن الموظفين ساعدوا في كتابتها.","reflection":"الحوكمة التي تلاقي سير عمل الناس الفعلي تُتَّبع. مسار معتمد بخطوط حمراء واضحة يتفوق على الممارسة المحظورة في الظل وعلى الفوضى غير المدروسة معاً — حماية بيانات منذ التصميم، على مستوى المكتب.","impacts":{"doNoHarm":2,"independence":1}},{"id":"bt-2c","label":"غضّ الطرف مؤقتاً","detail":"سجّل الملاحظة، وأعد النظر العام القادم. إنتاجية الموظفين حقيقية والميزانيات ضيقة.","consequence":"لا شيء يتغير — ظاهرياً. بعد أشهر تلصق مترجمة تقرير حوادث حماية في روبوت محادثة مجاني للحاق بموعد نهائي. شروط المزوّد تسمح بالتدريب على المدخلات. تعلم بذلك من صحفي.","reflection":"الحوكمة المؤجلة حوكمة بالوضع الافتراضي — وحدودها الافتراضية يضعها المزوّدون. المنظمة مسؤولة عن بيانات تتظاهر بعدم معرفة أنها تتحرك.","impacts":{"doNoHarm":-2,"humanity":1}}]},{"id":"bt-3","title":"أربعون وظيفة","narrative":"مبرر أتمتة اللوجستيات قوي: ستحرر أموالاً كبيرة للبرامج كل عام — وستلغي أربعين وظيفة إدارية، يشغل كثيراً منها أشخاص خدموا المنظمة عقوداً، في مدينة تعد فيها جمعيتك الوطنية من كبار أرباب العمل.","options":[{"id":"bt-3a","label":"أتمت كاملاً ووجّه المدخرات","detail":"حساب المهمة قاسٍ: تلك الأموال تُلقّح وتُؤوي وتُطعم. تنتهي الوظائف بحزم قياسية.","consequence":"تنمو ميزانيات البرامج كما هو متوقع. في المدينة، القصة ليست الحساب بل الطريقة: أربعون أسرة تعلم برسالة إعادة هيكلة. تتحول محادثات النقابة إلى عدائية، وتغطي وسائل الإعلام المحلية «التسريحات الإنسانية»، ويستقيل اثنان من موظفي البرامج تضامناً.","reflection":"الإنسانية ليست مبدأ ميدانياً فقط. منظمة تُؤتمت أبناءها دون رعاية تعلّم كل مراقب — موظفين ومجتمعاً وشركاء — كم حرفياً يقرؤون قيمها.","impacts":{"humanity":-2,"doNoHarm":-1,"independence":1}},{"id":"bt-3b","label":"أتمت ببطء، مع إعادة تأهيل وإعادة توظيف","detail":"انتقال على سنتين: أتمتة على مراحل، وإعادة تأهيل الموظفين لأدوار جديدة (بما فيها الإشراف على الذكاء الاصطناعي)، وضمان عدم وجود تسريحات قسرية في السنة الأولى.","consequence":"تصل المدخرات بنصف السرعة. لكن ستة وعشرين موظفاً ينتقلون لأدوار جديدة — ثمانية منهم إلى وظائف جودة البيانات والإشراف التي يحتاجها النظام الجديد فعلاً — وتصبح المرحلة الانتقالية القصة التي ترويها للمنضمين الجدد بدل التي تخشاها.","reflection":"عدم إلحاق الضرر يشمل من هم داخل المبنى. الانتقال العادل أبطأ وأرخص من العدائي حين تحسب الثقة والاحتفاظ والمعرفة المؤسسية التي تخرج مع رسالة إعادة الهيكلة.","impacts":{"humanity":1,"doNoHarm":2,"impartiality":1}},{"id":"bt-3c","label":"أرشف الأتمتة كلياً","detail":"الكلفة الاجتماعية باهظة جداً. أبقِ الوظيفة يدوية؛ وأعد النظر حين تفتح المغادرات الطبيعية مساحة.","consequence":"لا أحد يفقد وظيفته. لا تتحقق المدخرات أبداً، وجمعية مدينة مجاورة تسلّم أسرع، وفريقك اللوجستي — مدركاً أن القرار اتُّخذ عنهم لا معهم — يتوقف بهدوء عن اقتراح التحسينات.","reflection":"حماية الوظائف بتجميد السؤال تحمي قائمة هذا العام وترهن ملاءمة العام القادم. المسار الإنساني ليس «لا أتمتة أبداً» بل «أتمتة مع الناس في التصميم، ووقتاً للتكيّف».","impacts":{"humanity":1,"independence":-1}}]},{"id":"bt-4","title":"من يحكم الآلات","narrative":"البند الأخير في جدول المجلس: الحوكمة الدائمة. تجاربك تتكاثر، والإطار يحتاج مالكاً، ولا بد لأحدهم من القدرة على قول لا. السؤال هو من، وبأي تفويض، ويحاسَب أمام من.","options":[{"id":"bt-4a","label":"اتركها للإدارة التنفيذية","detail":"فريق الإدارة يدير المخاطر أصلاً. لا هياكل جديدة، ولا كلف إضافية.","consequence":"ينجح الأمر حتى ينشغل. تُتخذ القرارات في الفجوات بين قرارات أخرى؛ يخرج نشر عالي المخاطر أثناء ذروة استجابة دون أي مراجعة، وسؤال ما بعد الحادثة — «من كان يراقب؟» — لا يجد اسماً للإجابة.","reflection":"الحوكمة التي تعيش في وقت فراغ الجميع لا تعيش في أي مكان. المساءلة تحتاج هيئة مسماة بتفويض وتقويم وسلطة إيقاف نشر.","impacts":{"doNoHarm":-2,"independence":-1}},{"id":"bt-4b","label":"أنشئ مجموعة إشراف على الذكاء الاصطناعي بصوت خارجي ومجتمعي","detail":"مجموعة دائمة صغيرة — برامج، وتكنولوجيا معلومات، وحماية بيانات، وخبير أخلاقيات خارجي، وممثل مجتمعي — بسلطة الموافقة أو الاشتراط أو الإيقاف، تُراجَع سنوياً علناً.","consequence":"الاجتماعات شهرية وأحياناً غير مريحة. أول فيتو للعضو المجتمعي — على تجربة تعرّف على الوجوه في نقاط التوزيع — يجنّبك عنواناً صحفياً لن تراه أبداً. المراجعة العلنية السنوية هادئة، وذلك الهدوء هو الإنجاز.","reflection":"هذا هو قرار تكنولوجيا المعلومات والاتصالات مصنوعاً هيكلاً: حماية البيانات والمشاركة المجتمعية والتخفيف من الضرر متجسدة في هيئة تستطيع التصرف. الإشراف بصوت خارجي يلتقط ما يُدفع للمقربين كي لا يلاحظوه.","impacts":{"doNoHarm":2,"independence":1}},{"id":"bt-4c","label":"وظّف مدققاً خارجياً مرة في السنة","detail":"مراجعة مستقلة، وتقرير سنوي، والإدارة تتصرف بناءً على النتائج. على بُعد وبكلفة معقولة.","consequence":"التدقيق الأول دقيق ويصل بعد أحد عشر شهراً من القرارات التي يراجعها. النتائج صحيحة والتوصيات معقولة، وأخطر تجربة انتهت — لأسباب لا صلة لها — قبل وصول التقرير بثلاثة أشهر.","reflection":"التدقيق مرآة رؤية خلفية: ضروري، وأعمى عما يقترب. المراجعة الخارجية السنوية تكمل الإشراف الدائم؛ ولا تستطيع أن تحل محل من يراقب الطريق.","impacts":{"doNoHarm":1,"independence":-1}}]}],"debrief":"اختبار مجلس الإدارة هو حيث تُقرر كل السيناريوهات الأخرى مسبقاً. ضغط المانحين، وذكاء الظل، وأتمتة قواك العاملة، وسؤال من يستطيع قول لا — ليس أيٌّ منها سؤال تقنية؛ بل أسئلة حوكمة بداخلها تقنية. جمعية وطنية تكتب خطوطها الحمراء، وتمنح موظفيها مساراً محكوماً، وتعامل أبناءها كجزء من «الإنسانية»، وتُجلس الأصوات المجتمعية حيث تُتخذ القرارات، ستتخذ خيارات ميدانية أفضل تلقائياً."},{"id":"clinic-notes","title":"عيادة الإصغاء","tagline":"التفريغ النصي بالذكاء الاصطناعي في عيادة صحية للمهاجرين غير الحائزين على وثائق في السويد","role":"رئيس الخدمات الصحية، عيادة الصليب الأحمر في غوتنبرغ","context":"تستقبل عيادتك أشخاصاً لا يستطيعون الاستفادة من نظام الرعاية الصحية المعتاد أو لا يجرؤون على ذلك: مهاجرين غير حائزين على وثائق، ومواطنين من الاتحاد الأوروبي بلا تأمين، وأشخاصاً رُفضت طلبات لجوئهم. يقضي الممرضون والأطباء المتطوعون قرابة نصف وقت كل موعد في كتابة الملاحظات، وغالباً بالاستعانة بمترجم شفوي. تعرض شركة ناشئة للتكنولوجيا الصحية خدمة مجانية للتفريغ النصي بالذكاء الاصطناعي تستمع إلى الاستشارة وتترجمها وتكتب الملاحظة الطبية. قوائم الانتظار طويلة، ومتطوعوك يعانون من الإنهاك.","topics":["التفريغ النصي بالذكاء الاصطناعي","البيانات الصحية","البصمة الطاقية"],"roles":["الخدمات الصحية","حماية البيانات","إدارة المتطوعين"],"debrief":"تُظهر عيادة الإصغاء أن الذكاء الاصطناعي الإداري لا يقتصر أبداً على الإدارة. فعندما تكون لدى الحاضرين كل الأسباب للخوف من تسجيل حديثهم، لا يكون تقليل البيانات إلى الحد الأدنى، والموافقة المستنيرة، والمعالجة المحلية، والتقدير الصادق لاستهلاك الطاقة إضافات اختيارية، بل عوامل تحدد ما إذا كانت العيادة ستظل مكاناً آمناً أصلاً.","steps":[{"id":"cn-1","title":"العرض المجاني","narrative":"تسجّل أداة الشركة الناشئة الاستشارة كاملة، وترسل الصوت إلى نموذج كبير لمعالجة الكلام مستضاف خارج الاتحاد الأوروبي، ثم تعيد ملاحظة مصاغة بعناية باللغة السويدية خلال دقيقة. الخدمة مجانية لمدة عام، إذ تريد الشركة عرض مثال على «الذكاء الاصطناعي من أجل الخير». يسأل مسؤول حماية البيانات لديك عن وجهة التسجيلات. ويسأل أكثر أطبائك المتطوعين خبرة عما إذا كان المرضى سيواصلون الحديث.","options":[{"id":"cn-1a","label":"قبول الأداة السحابية المجانية","detail":"أسرع وسيلة لتخفيف العبء عن المتطوعين. تغادر التسجيلات الكاملة العيادة وتُعالج في الخارج بنموذج لا يمكنك فحصه.","consequence":"ينخفض وقت التوثيق إلى النصف خلال أسبوع. ثم تسأل محامية إحدى المريضات عما إذا كان بإمكان السلطات طلب تسجيلات موكلتها في قضية ترحيل. لا يمكنك الجزم بمكان تخزين الصوت أو مدة الاحتفاظ به أو من يمكنه الوصول إليه. ينتشر الخبر في المجتمع المحلي، ويتوقف ثلاثة مرضى منتظمين عن الحضور.","reflection":"بالنسبة لمن يعيشون في خوف من السلطات، قد يكون التسجيل نفسه مصدر الضرر. الأداة المجانية التي يُدفع ثمنها بأشد بيانات الأشخاص الأكثر عرضة للمخاطر حساسية ليست مجانية. ويُلزم قرار تكنولوجيا المعلومات والاتصالات الحركة بحماية البيانات الشخصية، ولا سيما حيث تكون عواقب تسريبها أشد خطورة.","impacts":{"humanity":1,"doNoHarm":-2,"independence":-1}},{"id":"cn-1b","label":"تجريب نموذج صغير يعمل داخل العيادة","detail":"نموذج مدمج لمعالجة الكلام على حاسوب محلي. لا يغادر أي صوت المبنى؛ وتكون الملاحظات أقل إتقاناً وتحتاج إلى مزيد من التحرير.","consequence":"يستغرق الإعداد شهراً، وتحتاج الملاحظات إلى تصحيح، خصوصاً باللغتين التغرينية والدارية. لكن لا شيء يغادر العيادة، ويُحذف الصوت فور اعتماد الملاحظة، ويستهلك الجهاز طاقة تقارب استهلاك مصباح مكتبي. يوفر المتطوعون ثلث وقت الكتابة بدلاً من نصفه.","reflection":"تستبدل النماذج المحلية المناسبة الحجم بعض الإتقان بمزيد من التحكم. عندما تبقى المعالجة في الموقع، تعرف أين توجد البيانات، ومدة بقائها، ومقدار الطاقة التي تستهلكها؛ وهي ثلاثة أسئلة ينبغي لأي منظمة إنسانية أن تتمكن دائماً من الإجابة عنها.","impacts":{"doNoHarm":2,"independence":1,"humanity":1}},{"id":"cn-1c","label":"عدم استخدام الذكاء الاصطناعي وتمويل متطوعين إداريين بدلاً منه","detail":"استقطاب أمناء سر طبيين متطوعين لكتابة الملاحظات بعد كل مناوبة.","consequence":"ينجح الاستقطاب في أوساط الطلاب في غوتنبرغ، ولا يلاحظ المرضى أي تغيير. لكن يصعب الاحتفاظ بأمناء السر خلال موسم الامتحانات، ويعود الأطباء في العيادة المسائية إلى الكتابة حتى منتصف الليل.","reflection":"رفض الذكاء الاصطناعي خيار مشروع له تكاليف حقيقية، غالباً ما يتحملها موظفون ومتطوعون منهكون. ليس السؤال ما إذا كان الذكاء الاصطناعي جيداً أم سيئاً، بل ما إذا كان بديل أخف يخدم الناس هنا على نحو أفضل.","impacts":{"doNoHarm":1,"humanity":-1}}]},{"id":"cn-2","title":"الموافقة في غرفة الانتظار","narrative":"أياً كانت الأداة التي تستخدمها، يجب إبلاغ المرضى بأن حديثهم يُسجّل. يصوغ فريقك استمارة موافقة. يقترح أحد المتطوعين خانة اختيار بسيطة عند التسجيل. ويحذر مترجم شفوي من أن كثيراً من المرضى سيضعون علامة على أي شيء يقدمه لهم شخص يرتدي سترة الصليب الأحمر، خوفاً من رفض استقبالهم.","options":[{"id":"cn-2a","label":"خانة اختيار عند التسجيل","detail":"إجراء سريع ومستوفٍ للشكل القانوني. يوافق المرضى مرة واحدة على جميع الزيارات المستقبلية.","consequence":"تبلغ معدلات الموافقة 99%. ويكشف تدقيق لاحق أن معظم المرضى لم يفهموا ما وافقوا عليه، إذ اعتقد عدد منهم أن ذلك شرط لتلقي العلاج.","reflection":"الموافقة التي تُمنح في ظل الاعتماد على المساعدة ليست موافقة حرة. عندما يحتاج الناس إلى المساعدة، تقيس خانة الاختيار الامتثال، لا الفهم.","impacts":{"doNoHarm":-2,"humanity":-1}},{"id":"cn-2b","label":"طلب الموافقة في كل زيارة، مع إمكانية حقيقية للرفض","detail":"يسأل الممارس الصحي بلغة المريض في بداية كل استشارة. ولا يغيّر الرفض شيئاً في الرعاية المقدمة.","consequence":"يرفض نحو مريض واحد من كل خمسة، ومعظمهم من الوافدين حديثاً. تُكتب ملاحظاتهم يدوياً. وتنمو الثقة: يخبر المرضى الآخرين بأن العيادة تطلب موافقتهم وتحترم قرارهم فعلاً.","reflection":"إتاحة الرفض دون أي تبعات هي ما يجعل الاستعانة بالذكاء الاصطناعي مقبولة. والإبقاء على مسار لا يستخدم الذكاء الاصطناعي يحمي الأشخاص الأشد حاجة إليه.","impacts":{"doNoHarm":2,"humanity":1,"impartiality":1}},{"id":"cn-2c","label":"تسجيل ملخص الممارس الصحي فقط","detail":"لا يُسجّل صوت المريض. بعد الاستشارة، يملي الممارس الصحي ملخصاً قصيراً على الأداة.","consequence":"لا تدخل كلمات المريض إلى الجهاز أبداً. يكون توفير الوقت أقل، لكن الإملاء سريع، والملف الصوتي صغير جداً، وتحتاج المعالجة إلى جزء يسير من الطاقة اللازمة لتفريغ محادثة كاملة.","reflection":"يمكن أن يكون تقليل البيانات إلى الحد الأدنى خياراً تصميمياً: غيّر ما تجمعه بدلاً من حماية ما لم يكن ينبغي جمعه أصلاً. وتعني البيانات الأقل أيضاً حوسبة وتخزيناً وطاقة أقل.","impacts":{"doNoHarm":2,"humanity":1}}]},{"id":"cn-3","title":"الفاتورة الخفية","narrative":"يريد الفرع الإقليمي للصليب الأحمر تعميم التفريغ النصي على جميع نقاط الخدمات الصحية والدعم النفسي والاجتماعي الاثنتي عشرة في غرب السويد، والاحتفاظ بكل تسجيل لمدة خمس سنوات «لتدريب نموذج أفضل لاحقاً». يجري متطوع تكنولوجيا المعلومات لديك الحسابات: تخزين آلاف الساعات الصوتية وإعادة معالجتها مراراً سيحتاجان سنوياً إلى كهرباء وتبريد يعادلان احتياجات غرفة خوادم كاملة.","options":[{"id":"cn-3a","label":"الاحتفاظ بكل شيء للتدريب مستقبلاً","detail":"قد تعني البيانات الأكثر نماذج أفضل. التخزين رخيص، وشبكة الكهرباء في السويد تعتمد في معظمها على مصادر غير أحفورية.","consequence":"ينمو الأرشيف ليبلغ تيرابايتات من أكثر المحادثات حساسية التي استضافتها منظمتك على الإطلاق. يرتفع استهلاك الطاقة كل شهر. لا يدرب أحد النموذج قط، لكن الأرشيف يظل بحاجة إلى الحماية والنسخ الاحتياطي والطاقة.","reflection":"لا تجعل شبكة الكهرباء النظيفة الهدر بلا ضرر: فالكهرباء المستخدمة هنا لا تتاح لاحتياجات أخرى، وللأجهزة بصمة كبيرة حتى قبل تشغيلها. والبيانات المحتفظ بها «احتياطاً» تحمل مخاطر على الخصوصية وتكلفة طاقية إلى أجل غير مسمى.","impacts":{"doNoHarm":-2,"humanity":-1}},{"id":"cn-3b","label":"حذف الصوت وقياس استهلاك الطاقة ونشره","detail":"يُحذف الصوت خلال 24 ساعة. ويبلغ كل موقع عن استهلاك الطاقة لكل استشارة، وتُدرج الأرقام في التقرير السنوي.","consequence":"تفاجئ الأرقام الأولى الجميع: استهلكت التجربة السحابية طاقة لكل ملاحظة تعادل نحو ثلاثين ضعف استهلاك النموذج المحلي. يعتمد مجلس الإدارة ميزانية طاقة لكل استشارة، ويختار فرعان النموذج المحلي على هذا الأساس.","reflection":"لا يمكنك إدارة بصمة ترفض قياسها. إن نشر تكلفة الذكاء الاصطناعي من حيث الطاقة يحوّل الاستدامة من شعار إلى معيار لاتخاذ القرار تستطيع المجتمعات المحلية والجهات المانحة التحقق منه.","impacts":{"doNoHarm":2,"independence":1}},{"id":"cn-3c","label":"التعميم فقط حيث يطلبه المتطوعون","detail":"لا إلزام على مستوى الإقليم. تختار المواقع المشاركة بعد مراجعة الأدلة المستمدة من عيادتك.","consequence":"تعتمده خمسة مواقع، ولا تعتمده سبعة. يظل الاستخدام، ومعه استهلاك الطاقة، متناسباً مع الحاجة الفعلية، لكن الممارسات تختلف، ويصبح على مسؤول حماية البيانات فحص خمسة إعدادات مختلفة.","reflection":"ينبغي أن يستند التوسع إلى أدلة على القيمة، لا إلى الحماس. وغالباً ما تتحقق بصمات أصغر بمجرد عدم نشر أداة حيث لا حاجة إليها.","impacts":{"doNoHarm":1,"humanity":1}}]},{"id":"cn-4","title":"عندما تكون الملاحظة خاطئة","narrative":"تعود مريضة وقد تفاقمت العدوى لديها. ورد في الملاحظة التي صاغها الذكاء الاصطناعي لزيارتها الأولى «لا توجد حساسية معروفة». لكنها قالت عبر المترجم الشفوي إنها تعاني من حساسية للبنسلين. اعتمد الطبيب المتطوع الملاحظة في نهاية مناوبة استمرت اثنتي عشرة ساعة دون قراءتها بعناية.","options":[{"id":"cn-4a","label":"اعتبار الأمر خطأً بشرياً فردياً","detail":"تذكير الطبيب بضرورة القراءة بعناية أكبر. والإبقاء على سير العمل كما هو.","consequence":"بعد شهرين، يعتمد متطوع آخر ملاحظة خاطئة أخرى. ويتكرر النمط نفسه: أشخاص متعبون، ومناوبات طويلة، وملاحظات تبدو واثقة من صحة محتواها.","reflection":"الانحياز إلى الأتمتة متوقع: فالنص المصقول يشجع على اعتماده. وإلقاء اللوم على الأفراد يحجب مشكلة في التصميم ستتكرر.","impacts":{"doNoHarm":-2,"humanity":-1}},{"id":"cn-4b","label":"قصر الحقول الحساسة على الإدخال البشري","detail":"يسأل الممارس الصحي دائماً عن الحساسية والأدوية ومخاطر السلامة ويدخلها بنفسه. ويصوغ الذكاء الاصطناعي الجزء السردي فقط.","consequence":"تستغرق الملاحظات وقتاً أطول قليلاً، وتنخفض أخطاء الحقول الحساسة إلى الصفر في التدقيق التالي. تخبر المريضة بما حدث، وتعتذر، وتشرح التغيير، فتوافق على مواصلة الحضور.","reflection":"تعني الرقابة البشرية الفعلية تصميم مواضع اتخاذ البشر للقرار، لا مجرد مطالبتهم بالتوقيع. والصراحة مع الشخص المتضرر جزء من المساءلة.","impacts":{"doNoHarm":2,"humanity":1}},{"id":"cn-4c","label":"تعليق الذكاء الاصطناعي وإجراء مراجعة مع المرضى","detail":"إيقاف التفريغ النصي لمدة شهر ودعوة مرضى سابقين ومترجمين شفويين لمراجعة الكيفية التي ينبغي أن يعمل بها.","consequence":"يستهلك التوقف ساعات من وقت المتطوعين. وتنتج المراجعة أفضل فكرة للعيادة حتى الآن: يعيد المترجمون الشفويون قراءة الحقائق الأساسية على المرضى قبل اعتماد الملاحظة. يصبح العمل أبطأ، والأخطاء نادرة.","reflection":"غالباً ما يكون المتأثرون بالنظام الأقدر على معرفة مواضع إخفاقه. والتوقف للإصغاء ليس فشلاً، بل هو تجسيد للمساءلة الإنسانية في الممارسة.","impacts":{"doNoHarm":2,"humanity":-1,"impartiality":1}}]}]},{"id":"invoice-engine","title":"محرّك الفواتير","tagline":"أتمتة الإدارة المالية في مكتب وطني في هولندا","role":"مدير الشؤون المالية والإدارية، مقر الجمعية الوطنية في لاهاي","context":"يعالج فريقك المالي 40,000 فاتورة سنوياً: مستحقات موردي مراكز الإيواء، ورد النفقات للمتطوعين، ومدفوعات للمنظمات الشريكة في الخارج، وتحويلات نقدية للأشخاص المتضررين من الفيضانات في ليمبورغ. سيتقاعد ثلاثة من موظفيك الثمانية. يعرض مورد برمجيات كبير وكيلاً للذكاء الاصطناعي يقرأ الفواتير ويصنفها محاسبياً ويرصد مؤشرات الاحتيال ويعتمد المدفوعات الروتينية تلقائياً. يريد مجلس الإدارة وفورات يمكن توجيهها إلى البرامج.","topics":["أتمتة العمليات","المساءلة المالية","البصمة الطاقية"],"roles":["الشؤون المالية والإدارية","تكنولوجيا المعلومات والاتصالات","التدقيق والامتثال"],"debrief":"يُظهر محرّك الفواتير أن الذكاء الاصطناعي في الأعمال الإدارية يحدد من يتلقى المدفوعات، ومن يُصنَّف مشبوهاً، ومقدار الطاقة التي تستهلكها المنظمة في ذلك. الكفاءة هدف إنساني مشروع، ولكن فقط عندما يظل البشر مسؤولين عن المدفوعات، ويمكن الاعتراض على التنبيهات، وتُختار أخف أداة فعالة بدلاً من أكثرها إبهاراً.","steps":[{"id":"ie-1","title":"ما الأداة المناسبة للمهمة؟","narrative":"يمرر وكيل المورد كل فاتورة عبر نموذج ذكاء اصطناعي كبير للأغراض العامة في السحابة، حتى الفواتير البسيطة التي تتبع القالب نفسه كل شهر. يلاحظ المراقب المالي لديك أن 80% من فواتيرك تأتي من 200 مورد منتظم فقط. ويقترح متطوع في تكنولوجيا المعلومات والاتصالات أن الأتمتة المعتادة القائمة على القواعد، مع نموذج صغير للبقية المعقدة، ستنجز معظم العمل.","options":[{"id":"ie-1a","label":"شراء وكيل الذكاء الاصطناعي الكامل","detail":"منصة واحدة لكل شيء. تمر كل فاتورة، بسيطة كانت أم معقدة، عبر نموذج كبير.","consequence":"يعمل على نحو مبهر. لكنه يكلف أيضاً أكثر من الموظفين الذين يحل محلهم، ويكشف تقرير استخدامه أن كل فاتورة متكررة بسيطة تستهلك حوسبة تعادل محادثة دردشة طويلة، ويتكرر ذلك عشرات الآلاف من المرات سنوياً.","reflection":"استخدام نموذج ذكاء اصطناعي كبير لمهمة تنجزها قاعدة بسيطة يشبه إرسال شاحنة لتسليم رسالة. فكل استعلام غير ضروري ينطوي على تكلفة من الطاقة والمياه والأجهزة.","impacts":{"doNoHarm":-1,"independence":-1}},{"id":"ie-1b","label":"القواعد أولاً، وذكاء اصطناعي صغير للبقية","detail":"أتمتة بسيطة للفواتير المتكررة؛ ولا يقرأ النموذج الصغير إلا الفواتير غير المعتادة؛ ويتولى الموظفون الحالات الاستثنائية.","consequence":"يستغرق بناؤه مع فريق تكنولوجيا المعلومات والاتصالات ثلاثة أشهر. تمر الفواتير المتكررة بسرعة دون حوسبة تُذكر. ويتولى النموذج الصغير إيصالات المتطوعين المكتوبة بخط اليد. وتبلغ تكاليف التشغيل واستهلاك الطاقة جزءاً يسيراً من عرض المورد.","reflection":"التصميم المقتصد مبدأ وليس تنازلاً: ابدأ بأبسط أداة، وأضف الذكاء الاصطناعي فقط حيث يحقق قيمة واضحة. وهذه أيضاً طريقة لإبقاء النظام مفهوماً للمدققين.","impacts":{"doNoHarm":2,"independence":1}},{"id":"ie-1c","label":"التوظيف والتدريب بدلاً من ذلك","detail":"تعويض الموظفين المتقاعدين بموظفين جديدين وتحسين النظام القائم.","consequence":"تظل المدفوعات دقيقة وتبقى المساءلة البشرية قائمة. لكن التوظيف يستغرق أشهراً، ويتراكم العمل لستة أسابيع، وينتظر بعض صغار الموردين في مناطق الفيضانات طويلاً جداً لتلقي مستحقاتهم.","reflection":"عدم الأتمتة خيار مشروع، لكن تأخر السداد ضرر أيضاً، خصوصاً للمشروعات المحلية الصغيرة والمتطوعين الذين يدفعون من أموالهم مقدماً.","impacts":{"doNoHarm":1,"humanity":-1}}]},{"id":"ie-2","title":"تنبيه الاحتيال","narrative":"تبدأ عمليات الفحص الآلية بوضع علامات على مدفوعات «عالية المخاطر». تلاحظ نمطاً: تُرفع التنبيهات بشأن رد نفقات المتطوعين ذوي الأسماء غير الهولندية والتحويلات إلى المنظمات الشريكة في سورية والسودان بمعدل أعلى بثلاث مرات. ويجمّد كل تنبيه الدفعة لمدة تصل إلى ثلاثة أسابيع.","options":[{"id":"ie-2a","label":"الثقة بالتنبيهات، فالمخاطر أولاً","detail":"الامتثال غير قابل للتفاوض. وتجميد المدفوعات هو ثمن الأمان.","consequence":"تعجز منظمتان شريكتان في السودان عن دفع الرواتب في موعدها. وتنتظر متطوعة من أصل إريتري دفعت ثمن بطانيات من مالها الخاص شهراً لاسترداد نفقاتها، ثم تنسحب. ولا تكشف التنبيهات أي احتيال فعلي.","reflection":"يعيد النموذج المدرَّب على أنماط الماضي إنتاج الشكوك السابقة. وعند تطبيقه على الأسماء والوجهات، يتحول إلى تمييز ضد الأشخاص والشركاء أنفسهم الذين وُجدت المنظمة الإنسانية لخدمتهم.","impacts":{"impartiality":-2,"humanity":-1,"doNoHarm":-1}},{"id":"ie-2b","label":"تدقيق التنبيهات بحثاً عن التحيز","detail":"تعليق التجميد التلقائي، واختبار التنبيهات بمقارنتها بالنتائج، وإزالة الأسماء والجنسية من مؤشرات الرصد.","consequence":"يُظهر التدقيق أن التنبيهات كانت تلتقط في الغالب الأسماء والموقع الجغرافي، لا المخاطر. وبعد التغييرات تتساوى معدلات التنبيه بين الفئات، ويظل كشف حالتي الاحتيال الحقيقيتين خلال العام ممكناً، على يد محقق بشري يتابع بلاغاً.","reflection":"ينطبق مبدأ عدم التحيز على الأنظمة الإدارية أيضاً. واختبار القرارات الآلية للكشف عن تفاوت نتائجها واجب، لا إضافة مستحبة.","impacts":{"impartiality":2,"doNoHarm":1}},{"id":"ie-2c","label":"التنبيهات استشارية فقط، والبشر يقررون خلال 48 ساعة","detail":"لا تجميد تلقائياً. يراجع موظف مالي كل تنبيه، وعليه اتخاذ القرار خلال يومين.","consequence":"يتذمر الفريق من عبء العمل الإضافي، لكن المدفوعات المجمّدة تنخفض إلى ما يقارب الصفر. ويبدأ الموظفون أيضاً بتدوين أسباب استبعاد التنبيهات، فتتحول إلى أدلة مفيدة لتحسين القواعد.","reflection":"إن إبقاء البشر في دائرة القرار، مع مهلة تحمي الشخص المنتظر، يوازن بين الرقابة والكرامة.","impacts":{"impartiality":1,"humanity":1,"doNoHarm":1}}]},{"id":"ie-3","title":"أين تجري الحوسبة؟","narrative":"يعتزم المورد نقل جميع عمليات المعالجة إلى مركز بيانات جديد في شمال هولندا، وهي المنطقة نفسها التي احتج فيها السكان المحليون على استحواذ مراكز البيانات على الأراضي والكهرباء والمياه. يسأل صحفي محلي عما إذا كان الصليب الأحمر جزءاً من المشكلة.","options":[{"id":"ie-3a","label":"ترك الأمر للمورد","detail":"مكان حوسبة المورد شأن يخصه. ويقول تقرير استدامته إنه «محايد كربونياً».","consequence":"يشير مقال الصحفي إلى صمتك. وعندما تطلب أرقاماً من المورد، يتبين أن «الحياد الكربوني» يعتمد على تعويضات مشتراة من أماكن أخرى؛ أما الاستهلاك الفعلي للمياه والكهرباء فلا يُنشر.","reflection":"لا تنتهي المسؤولية عند العقد. فالمشتريات الأخلاقية تشمل السؤال عن مكان الحوسبة وتكلفتها على المجتمع المحلي والبيئة.","impacts":{"doNoHarm":-2,"independence":-1}},{"id":"ie-3b","label":"جعل الإبلاغ عن الطاقة شرطاً تعاقدياً","detail":"إلزام المورد بتقرير سنوي عن الطاقة والمياه وموقع المعالجة، مع حق إنهاء العقد إذا لم تتحقق الأهداف.","consequence":"تستغرق المفاوضات شهرين إضافيين. يوافق المورد، جزئياً لأن منظمات غير حكومية أخرى تحذو حذوك. تنشر التقرير الأول، وتكون الأرقام متواضعة بفضل تصميمك الذي يعطي الأولوية للقواعد.","reflection":"المشتريات قوة تأثير. عندما تطالب المنظمات الإنسانية مجتمعة، يبدأ الموردون بالكشف عما كانوا سيخفونه لولا ذلك.","impacts":{"doNoHarm":2,"independence":1}},{"id":"ie-3c","label":"تشغيل النموذج الصغير على خوادمك","detail":"استضافة نموذج الفواتير في غرفة الخوادم الحالية، باستخدام الطاقة الشمسية من السطح وعقد توريد الكهرباء الخضراء.","consequence":"يتولى فريق تكنولوجيا المعلومات والاتصالات الآن صيانة نظام إضافي، ويتراجع الأداء خلال ذروة نهاية العام. لكنك تعرف بالضبط ما يستهلكه النظام، وهو أقل من استهلاك آلات القهوة في المكتب.","reflection":"تجلب ملكية البنية التحتية المسؤولية إلى جانب التحكم. ولأعباء العمل الصغيرة والمستقرة، قد تكون الاستضافة المحلية أكثر استقلالية وأخف أثراً في آن واحد.","impacts":{"independence":2,"doNoHarm":1,"humanity":-1}}]},{"id":"ie-4","title":"من يوقّع؟","narrative":"يعمل النظام الآن جيداً. يقترح مجلس الإدارة الخطوة الأخيرة: السماح له باعتماد جميع الفواتير التي تقل عن €5,000 وسدادها تلقائياً، بما فيها التحويلات النقدية الصغيرة إلى الأسر المتضررة من الفيضانات في ليمبورغ. لن يطّلع عليها أي إنسان.","options":[{"id":"ie-4a","label":"أتمتة كاملة للمبالغ دون €5,000","detail":"أقصى كفاءة. تُحقَّق الحالات الاستثنائية بعد ذلك.","consequence":"يؤدي خطأ في البيانات عند استيراد قائمة إلى إرسال دفعات مضاعفة إلى 300 أسرة، ثم استردادها تلقائياً بعد أسبوع. تتلقى الأسر التي أنفقت المال بالفعل على الإصلاحات خطابات مطالبة بديون. ولا تتحدث العناوين الصحفية عن الكفاءة.","reflection":"عندما تمس المدفوعات الآلية أشخاصاً متضررين من أزمة، تتحول الأخطاء إلى ضرر واسع النطاق. فالمبالغ الصغيرة ليست صغيرة في نظر من يتلقونها.","impacts":{"doNoHarm":-2,"humanity":-1}},{"id":"ie-4b","label":"أتمتة مدفوعات الموردين وإبقاء مدفوعات الأفراد بيد البشر","detail":"تمر فواتير الموردين الروتينية تلقائياً. وتتطلب المدفوعات للأفراد دائماً اعتماداً بشرياً.","consequence":"تُؤتمت غالبية المعاملات؛ وتظل المدفوعات التي تمس حياة الناس مرتبطة باسم شخص مسؤول. وعندما يحدث خطأ الاستيراد، يكتشفه موظف مالي قبل إرسال أي دفعة مضاعفة.","reflection":"ضع حد الأتمتة حيث تتوقف الأخطاء عن كونها إدارية وتبدأ بإحداث أثر شخصي.","impacts":{"doNoHarm":2,"humanity":1}},{"id":"ie-4c","label":"الأتمتة مع نشر طريقة الاعتراض","detail":"أتمتة المبالغ دون €5,000، مع خط هاتفي واضح والتزام بتصحيح أي دفعة خاطئة خلال 5 أيام.","consequence":"يرصد خط الاعتراض المشكلات سريعاً، وتُعالج معظمها خلال أيام. لكنه يحمّل المتضررين مسؤولية ملاحظة الخطأ والشكوى، والأقل وقتاً ومهارات لغوية هم الأقل تقدماً بالشكاوى.","reflection":"مسار الاعتراض ضروري، لكنه ليس بديلاً عن منع الضرر. وتكون المساءلة أكثر فعالية قبل وقوع الخطأ، لا بعده فقط.","impacts":{"doNoHarm":1,"humanity":1,"impartiality":-1}}]}]},{"id":"volunteer-roster","title":"جدول مناوبات المتطوعين","tagline":"جدولة بالذكاء الاصطناعي لمتطوعي استقبال اللاجئين في بولندا","role":"منسق المتطوعين، فرع الصليب الأحمر في كراكوف","context":"بعد عامين على موجة الوافدين الأولى من أوكرانيا، لا يزال فرعك يدير الاستقبال ومقاهي تعلم اللغات ونقطة لتوزيع الأغذية. تنسق عمل 1,800 متطوع عبر جداول البيانات ومجموعات واتساب وكثير من المكالمات الهاتفية المتأخرة ليلاً. تبقى مناوبات بلا متطوعين، ويُطلب من الأشخاص الموثوقين أنفسهم المساعدة مراراً. تعرض شركة تكنولوجيا بولندية نظام ذكاء اصطناعي يتنبأ بالطلب ويعد جدول المناوبات ويراسل المتطوعين تلقائياً.","topics":["الجدولة بالذكاء الاصطناعي","رفاه المتطوعين","البصمة الطاقية"],"roles":["إدارة المتطوعين","العمليات","الحماية"],"debrief":"يُظهر جدول مناوبات المتطوعين أن الذكاء الاصطناعي الذي يحسّن استخدام وقت الناس يتخذ أيضاً قرارات بشأنهم: من يُوثق به، ومن يُغفل، ومن يُحمَّل فوق طاقته. ليس المتطوعون موارد ينبغي تعظيم استغلالها. النظام المناسب يحمي رفاههم، ويجمع أقل قدر ممكن من المعلومات عنهم، ولا يستخدم حوسبة تتجاوز ما تحتاجه المشكلة.","steps":[{"id":"vr-1","title":"ما يريد النظام معرفته","narrative":"للتنبؤ بمن سيحضر، يريد المورد ربط النظام ببيانات مواقع هواتف المتطوعين ونشاطهم على وسائل التواصل الاجتماعي وتقويماتهم، وتقييم «موثوقية» كل شخص. العرض التجريبي مبهر: يتنبأ بالتغيب بدقة تبلغ 85%.","options":[{"id":"vr-1a","label":"ربط كل شيء، فالدقة مهمة","detail":"كلما زادت البيانات، تحسّن جدول المناوبات.","consequence":"تكون التنبؤات دقيقة. ثم يكتشف المتطوعون الأمر. ينسحب فوراً عدد من المتطوعين الأوكرانيين، وهم أنفسهم لاجئون؛ فقد فروا من حرب كان تتبع الهواتف فيها يعني الخطر. ويشعر آخرون بأنهم مراقبون في أوقات فراغهم.","reflection":"المتطوعون أشخاص، لا مصادر بيانات. وتتبع حياتهم خارج نطاق دورهم يهدم الثقة وقد يعرّض للخطر من لديهم شواغل حماية خاصة بهم.","impacts":{"doNoHarm":-2,"humanity":-1}},{"id":"vr-1b","label":"الاكتفاء بما يختار المتطوعون مشاركته","detail":"أوقات التفرغ التي يدخلونها بأنفسهم، ومهاراتهم ولغاتهم. لا تتبع ولا درجات للموثوقية.","consequence":"تكون التنبؤات أقل دقة. لكن المتطوعين يثقون بالنظام ويحدّثون أوقات تفرغهم باستمرار، وهو ما يتبين أنه أهم من أي مؤشر للتتبع.","reflection":"تقليل البيانات إلى الحد الأدنى هو احترام مطبّق عملياً. وغالباً ما تكون المعلومات التي يقدمها الناس طوعاً أكثر موثوقية من المعلومات التي تُؤخذ منهم.","impacts":{"doNoHarm":2,"humanity":1}},{"id":"vr-1c","label":"تقويم مشترك بلا ذكاء اصطناعي","detail":"أداة جدولة بسيطة مفتوحة المصدر. يختار المتطوعون مناوباتهم بأنفسهم.","consequence":"لا يكلف تشغيلها شيئاً تقريباً، ولا تستهلك طاقة تُذكر. تمتلئ المناوبات المرغوبة فوراً؛ لكن توزيع الأغذية في الصباح الباكر يظل بلا تغطية، وتظل تجري المكالمات في الساعة 6 صباحاً.","reflection":"غالباً ما تكفي الأدوات البسيطة، لكن يجدر التساؤل عن المشكلات التي تتركها بلا حل، ومن يتأثر بذلك.","impacts":{"doNoHarm":1,"independence":1,"humanity":-1}}]},{"id":"vr-2","title":"جدول المناوبات المحسَّن","narrative":"يتعلم نظام الجدولة أن مجموعة صغيرة من المتطوعين توافق دائماً تقريباً. فيبدأ بإسناد معظم المناوبات الشاقة إليهم. تخبرك إحداهن، وهي معلمة متقاعدة تتطوع كل أسبوع منذ عامين، بأنها لم تعد تستطيع النوم.","options":[{"id":"vr-2a","label":"مواصلة تحسين التغطية","detail":"التغطية الكاملة هي ما يحتاجه الوافدون. والمتطوعون المستعدون يريدون المساعدة.","consequence":"تصل التغطية إلى 98%. وخلال ثلاثة أشهر، يصاب ستة من أكثر متطوعيك خبرة بالإنهاك وينسحبون دفعة واحدة. ويتكيف النظام بالضغط أكثر على المجموعة التالية الأكثر استعداداً.","reflection":"تحسين رقم واحد يجعل كل ما عداه غير مرئي. رفاه المتطوعين جزء من مبدأ الإنسانية، وهو ينطبق على من يقدمون المساعدة كما ينطبق على من يتلقونها.","impacts":{"humanity":-2,"doNoHarm":-1}},{"id":"vr-2b","label":"إدراج حدود وفترات راحة","detail":"حد أقصى للمناوبات أسبوعياً، وراحة إلزامية بعد المناوبات الليلية، وحق في قول «لا، شكراً» دون أن يُحسب ذلك على أحد.","consequence":"تنخفض التغطية إلى 90%، فتستقطب متطوعين لسد الفجوة. يتحسن الاحتفاظ بالمتطوعين بوضوح، وتعود المعلمة المتقاعدة بعد شهر من الراحة.","reflection":"تُدرج الأنظمة الجيدة الرعاية في قواعدها. والقواعد التي تحمي الناس من الإفراط في استنزافهم ضمانات إنسانية، لا أوجه قصور في الكفاءة.","impacts":{"humanity":2,"doNoHarm":1}},{"id":"vr-2c","label":"تمكين المتطوعين من الاطلاع على القواعد وصياغتها","detail":"نشر كيفية إعداد جدول المناوبات وتشكيل لجنة متطوعين تستطيع تغيير الأولويات.","consequence":"تطلب اللجنة الإنصاف بين المجموعات اللغوية وتناوب مناوبات نهاية الأسبوع. يصبح تعديل النظام أبطأ، لكنه يحظى بثقة أكبر بكثير.","reflection":"تتيح الشفافية بشأن كيفية اتخاذ القرارات للناس الاعتراض عليها. والقواعد المشتركة أسهل قبولاً من القواعد الخفية.","impacts":{"humanity":1,"impartiality":1,"doNoHarm":1}}]},{"id":"vr-3","title":"رسائل لا تتوقف","narrative":"يقترح المورد مساعد دردشة بالذكاء الاصطناعي يرسل لكل متطوع رسائل شخصية وتذكيرات و«دفعات تحفيزية»، يكتبها نموذج لغوي كبير من جديد لكل رسالة، بمعدل نحو 30,000 رسالة شهرياً بالبولندية والأوكرانية والإنجليزية.","options":[{"id":"vr-3a","label":"تفعيل رسائل الذكاء الاصطناعي المخصصة","detail":"رسائل ودودة ومصممة لكل شخص بثلاث لغات، تُولَّد واحدة تلو الأخرى.","consequence":"يجد المتطوعون الرسائل ودودة في البداية، ثم غريبة؛ إذ يتلقى أحدهم رسالة «نفتقدك!» وهو في المستشفى. ويُظهر تقرير الطاقة أن الرسائل أصبحت أكبر مصدر لاستهلاك الطاقة في النظام، رغم أن نصوصها تقول تقريباً الشيء نفسه في كل مرة.","reflection":"توليد نص جديد لكل رسالة روتينية يضاعف الحوسبة مقابل فائدة ضئيلة. الذكاء الاصطناعي التوليدي ليس مجانياً: لكل رسالة تكلفة من الطاقة والمياه.","impacts":{"doNoHarm":-2,"humanity":-1}},{"id":"vr-3b","label":"قوالب يكتبها البشر بكل لغة","detail":"يكتب متطوعون من كل مجموعة لغوية قوالب رسائل قصيرة مرة واحدة. ويملأ النظام الأسماء والأوقات.","consequence":"تبدو الرسائل بشرية فعلاً لأن بشراً حقيقيين كتبوها. تنخفض احتياجات الحوسبة إلى ما يقارب الصفر، ويستمتع المتطوعون بكتابة القوالب معاً.","reflection":"غالباً ما يكون القدر المناسب من الذكاء الاصطناعي هو قدر أقل منه. فإعادة استخدام نصوص كتبها البشر أقل تكلفة وأخف أثراً وأكثر جدارة بالثقة.","impacts":{"doNoHarm":2,"humanity":1,"independence":1}},{"id":"vr-3c","label":"رسائل أقل باختيار المتطوعين","detail":"يختار المتطوعون وسيلة التواصل معك ووتيرته. والإعداد الافتراضي ملخص أسبوعي واحد.","consequence":"ينخفض عدد الرسائل بنسبة 80%. تمتلئ بعض المناوبات ببطء أكبر قليلاً، لكن المتطوعين يقولون إنهم يشعرون بالاحترام بدلاً من الملاحقة.","reflection":"السماح للناس بوضع حدودهم الخاصة يقلل الضغط والبصمة معاً.","impacts":{"doNoHarm":1,"humanity":1}}]},{"id":"vr-4","title":"طلب من السلطات","narrative":"تطلب السلطات الإقليمية بيانات جدول المتطوعين، من أسماء وجنسيات وأوقات تفرغ، لتخطيط استجابتها في مجال الدفاع المدني. يجعل النظام تصديرها ممكناً بنقرة واحدة. وكثير من متطوعيك مواطنون أوكرانيون يتمتعون بوضع الحماية المؤقتة.","options":[{"id":"vr-4a","label":"مشاركة ملف التصدير كاملاً","detail":"التعاون الجيد مع السلطات يدعم الاستجابة العامة.","consequence":"تُستخدم البيانات للتخطيط، ثم لاحقاً للتحقق من وضع الإقامة. يعلم المتطوعون بالأمر من تقرير إخباري محلي. وينهار استقطاب المتطوعين الأوكرانيين.","reflection":"استخدام بيانات قُدمت لغرض ما في غرض آخر يخون الثقة، وقد يمس باستقلال الحركة وحيادها في نظر المجتمعات التي تخدمها.","impacts":{"independence":-2,"neutrality":-1,"doNoHarm":-2}},{"id":"vr-4b","label":"مشاركة الأعداد المجمّعة فقط","detail":"تقديم أعداد بحسب المهارة واللغة والمنطقة، دون أسماء أو جنسيات.","consequence":"تحصل السلطات على ما تحتاجه للتخطيط. تتذمر أولاً، ثم تعتمد تنسيقك نموذجاً للمنظمات الأخرى.","reflection":"يعني تقييد الغرض مشاركة ما يلزم للهدف المعلن، ولا أكثر. وتحمي البيانات المجمّعة الأفراد مع استمرار دعم التعاون.","impacts":{"independence":1,"neutrality":1,"doNoHarm":2}},{"id":"vr-4c","label":"طلب موافقة المتطوعين على المشاركة","detail":"شرح الطلب وترك القرار لكل متطوع بشأن إدراج اسمه لدى السلطات.","consequence":"يوافق نحو النصف. ويشعر الباقون بالامتنان لأن رأيهم طُلب. يستغرق الأمر ثلاثة أسابيع؛ وترى السلطات ذلك بطيئاً، لكنها تقبله.","reflection":"تُبقي الموافقة والشفافية الناس متحكمين في معلوماتهم الشخصية، حتى عندما يأتي الطلب من شريك.","impacts":{"independence":1,"doNoHarm":1,"humanity":1}}]}]},{"id":"heat-wave","title":"خريطة مخاطر الحر","tagline":"التنبؤ بالذكاء الاصطناعي لحماية كبار السن خلال موجة حر في صقلية","role":"رئيس الخدمات الصحية في الطوارئ، اللجنة الإقليمية للصليب الأحمر في باليرمو","context":"أصبحت درجات الحرارة صيفاً في صقلية تتجاوز 45 درجة مئوية بانتظام. في يوليو الماضي، توفي كبار سن يعيشون بمفردهم في شققهم قبل أن يطمئن عليهم أحد. يعرض ائتلاف بحثي أوروبي نموذج ذكاء اصطناعي يجمع توقعات الطقس والسجلات الصحية وبيانات الهواتف وصور الأقمار الاصطناعية للتنبؤ بالشوارع والأشخاص الأكثر عرضة للخطر، كي يعرف متطوعوك الأبواب التي ينبغي طرقها أولاً. ويتطلب تشغيله عنقود حوسبة قوياً في شمال أوروبا.","topics":["الذكاء الاصطناعي التنبؤي","التكيف مع تغير المناخ","البصمة الطاقية"],"roles":["الخدمات الصحية في الطوارئ","إدارة المعلومات","المشاركة المجتمعية"],"debrief":"تجسّد خريطة مخاطر الحر مفارقة صعبة: فالذكاء الاصطناعي المستخدم للاستجابة لتغير المناخ قد يزيد بنفسه استهلاك الطاقة والموارد الذي يسهم في تفاقمه. يمكن للتنبؤ إنقاذ الأرواح، ولكن فقط إذا لم يستبعد الأشخاص الذين يعجز عن رؤيتهم، ولم يجمع بيانات تتجاوز الحاجة، وكان حجمه متناسباً بصدق مع بصمته.","steps":[{"id":"hw-1","title":"ما حجم النموذج المناسب؟","narrative":"نموذج الائتلاف ضخم: يعيد معالجة صور الأقمار الاصطناعية الأوروبية ومحاكاة المناخ كل بضع ساعات. يقدّر مسؤول المعلومات لديك أن تشغيله لصيف واحد سيستهلك كهرباء تعادل استهلاك قرية صغيرة في صقلية. تعرض جامعة محلية بديلاً أبسط: مؤشر إحصائي لمخاطر الحر مبني على التوقعات وعمر المباني وبيانات الأعمار بحسب الأحياء.","options":[{"id":"hw-1a","label":"استخدام نموذج الذكاء الاصطناعي الكبير","detail":"أدق التنبؤات المتاحة، بتكلفة طاقية تعادل استهلاك قرية.","consequence":"تكون التنبؤات ممتازة لوسط المدينة. لكن حاجة النموذج الكبيرة إلى الحوسبة تعني أنه لا يعمل إلا مرتين يومياً، وتصبح بصمته الكبيرة موضوعاً في الصحافة الإيطالية: «الصليب الأحمر يكافح الحر بآلة تسخّن الكوكب».","reflection":"يجب تقييم أدوات الاستجابة المناخية بناءً على بصمتها المناخية أيضاً. فالنموذج الأقوى ليس بالضرورة الأكثر إنسانية.","impacts":{"humanity":1,"doNoHarm":-2}},{"id":"hw-1b","label":"استخدام مؤشر مخاطر الحر البسيط","detail":"أقل دقة، ويعمل على حاسوب محمول، ويمكن شرحه لأي متطوع.","consequence":"يشير المؤشر إلى المناطق عالية المخاطر نفسها في 90% من الحالات. يفهم المتطوعون سبب تلوين شارع بالأحمر، ويستطيع قادة المجتمع المحلي تصحيحه، وهو ما يفعلونه بإضافة حيين أغفلتهما البيانات.","reflection":"تتيح النماذج البسيطة القابلة للتفسير المشاركة والتصحيح. وغالباً ما تكون الملاءمة للغرض أفضل من أحدث التقنيات.","impacts":{"doNoHarm":2,"humanity":1,"independence":1}},{"id":"hw-1c","label":"نموذج كبير، ولكن خلال إنذارات الحر فقط","detail":"تشغيل النموذج الكبير فقط عندما تصدر الهيئة الوطنية إنذاراً أحمر.","consequence":"ينخفض استهلاك الطاقة بنسبة 80%. لكن النموذج يبدأ من الصفر في أيام الإنذار ويستغرق ساعات لإنتاج نتائج مفيدة؛ ويكون اليوم الأول، وهو الأشد فتكاً، الأضعف تغطية.","reflection":"الحد من الاستخدام توجه سليم. لكن ينبغي اختبار الحلول الوسط على ضوء الأوقات التي يكون فيها الناس فعلاً أشد عرضة للخطر.","impacts":{"doNoHarm":1,"humanity":-1}}]},{"id":"hw-2","title":"من لا يظهر على الخريطة؟","narrative":"يعتمد النموذج على بيانات الهواتف والسجلات الصحية المسجلة. يشير متطوعوك إلى من يغفلهم ذلك: العمال الزراعيون المهاجرون غير الحائزين على وثائق والمقيمون في تجمعات غير رسمية خارج المدينة، وكبار السن الذين لا يملكون هواتف ذكية. لا تظهر أي من المجموعتين على خريطة مخاطر الحر.","options":[{"id":"hw-2a","label":"الثقة بالخريطة","detail":"عدد المتطوعين محدود. توجّه إلى حيث تشير البيانات إلى أعلى المخاطر.","consequence":"تكون الزيارات فعالة، وتُحمى أرواح كثيرة في المدينة. وفي تجمع غير رسمي قرب كامبوبيلو، يُنقل عاملان زراعيان إلى المستشفى بسبب ضربة حر. لم يزرهما أحد.","reflection":"تعكس البيانات من يُحصى، لا من يتعرض للخطر. وقد يؤدي تخصيص المساعدة بالاعتماد على البيانات وحدها إلى استبعاد الأكثر ضعفاً بصمت.","impacts":{"impartiality":-2,"humanity":-1}},{"id":"hw-2b","label":"تخصيص فرق لمن لا يظهرون على الخريطة","detail":"يُخصص ثلث قدرة المتطوعين لأماكن وفئات لا تراها البيانات، بتوجيه من جهات اتصال مجتمعية.","consequence":"تتراجع تغطية المدينة قليلاً. وتوفر زيارات التجمعات المياه والظل والعلاج المبكر لمئات العمال الذين لم يعرف النموذج بوجودهم قط.","reflection":"يعني عدم التحيز تقديم المساعدة بحسب الحاجة، لا بحسب الظهور في البيانات. ويجب أن تصحح المعرفة البشرية مواطن القصور في البيانات.","impacts":{"impartiality":2,"humanity":1}},{"id":"hw-2c","label":"جمع مزيد من البيانات عن الفئات الغائبة","detail":"طلب تسجيل العمال المهاجرين مواقعهم على تطبيق هاتفي ليتمكن النموذج من إدراجهم.","consequence":"يسجل عدد قليل، فكثيرون يخشون سلطات الهجرة. ويُنشئ من يسجلون مجموعة بيانات يطلب الائتلاف لاحقاً مشاركتها مع شركاء آخرين.","reflection":"إظهار الأشخاص غير المرئيين لنظام ما قد يعرّضهم لمخاطر جديدة. وأحياناً يكون الحل الأكثر أماناً العمل دون الاعتماد على البيانات، لا سد فجواتها.","impacts":{"impartiality":1,"doNoHarm":-2}}]},{"id":"hw-3","title":"تبريد الخوادم","narrative":"يقترح الائتلاف تركيب عنقود حوسبة محلي في باليرمو لتسريع التنبؤات. وخلال موجة حر، ستحتاج الخوادم نفسها إلى تكييف مستمر، مستهلكة كهرباء من الشبكة المجهدة نفسها التي تشغّل مراوح كبار السن. وخلال موجة الحر العام الماضي، انقطعت الكهرباء عن أجزاء من المدينة.","options":[{"id":"hw-3a","label":"تركيب عنقود الحوسبة المحلي","detail":"تنبؤات أسرع وتحكم محلي.","consequence":"في أشد الأيام حرارة، يطلب مشغّل الشبكة تخفيض الاستهلاك طوعاً. تواصل خوادمك العمل والتبريد، بينما يتعرض حيان لانقطاعات كهرباء دورية.","reflection":"تنافس البنية التحتية للذكاء الاصطناعي الناس على الطاقة والمياه، وأحياناً في الوقت الذي يبلغ فيه شحّهما أقصاه. وهذه المنافسة مسألة إنسانية.","impacts":{"doNoHarm":-2,"humanity":-1}},{"id":"hw-3b","label":"نظام خفيف يعمل بالطاقة الشمسية","detail":"تشغيل المؤشر البسيط على حواسيب محمولة في مركز العمليات، باستخدام ألواح شمسية على السطح وبطاريات احتياطية.","consequence":"يعمل النظام حتى أثناء انقطاع الكهرباء. وتحافظ البطاريات أيضاً على تشغيل هواتف مركز العمليات وثلاجات الأدوية.","reflection":"يحمي التصميم المرن منخفض استهلاك الطاقة العمليات عند تعطل البنية التحتية، وهو الوقت الذي تكون فيه أدوات الاستجابة للأزمات أشد أهمية.","impacts":{"doNoHarm":2,"independence":1}},{"id":"hw-3c","label":"الحوسبة في شمال أوروبا باستخدام الطاقة المتجددة","detail":"إبقاء الحوسبة الثقيلة في مركز بيانات يعمل بالطاقة الكهرومائية في النرويج أو السويد.","consequence":"تُجنَّب الشبكة المحلية العبء، وتكون الكهرباء متجددة. لكن الاتصال خلال موجة الحر غير موثوق، وتعتمد على وصلة لا تتحكم بها في أشد الأوقات أهمية.","reflection":"نقل الحوسبة إلى مصادر طاقة نظيفة يقلل الانبعاثات، لكنه لا يقلل الاعتماد على الغير. وازن بين البصمة وبين من يملك التحكم في الأزمة.","impacts":{"doNoHarm":1,"independence":-1}}]},{"id":"hw-4","title":"طرق الأبواب","narrative":"في أيام الإنذار، يعطي النظام كل متطوع قائمة عناوين مرتبة بحسب المخاطر المتوقعة. يسأل أحد المتطوعين: «ماذا أقول عندما يسألني رجل مسن لماذا اخترناه؟». ويبلغ آخر أن بعض السكان يشعرون بأنهم وُصموا بأنهم «على وشك الموت».","options":[{"id":"hw-4a","label":"عدم الشرح، والاكتفاء بالمساعدة","detail":"النموذج معقد جداً بحيث لا يمكن شرحه عند عتبة الباب.","consequence":"يقبل معظم الناس الزيارة. ولا يفتح بعضهم الباب. وتنتشر شائعة بأن لدى الصليب الأحمر قوائم سرية من المستشفى.","reflection":"عندما لا يعرف الناس سبب اختيارهم، تملأ الشكوك الفراغ. والغموض يقوّض الثقة التي يعتمد عليها العمل الإنساني.","impacts":{"doNoHarm":-1,"humanity":-1}},{"id":"hw-4b","label":"الشرح بوضوح وإتاحة الرفض","detail":"صيغة بسيطة: «هذا الشارع شديد الحر وفيه كثير من كبار السن. هل ترغبون في أن نطمئن عليكم خلال موجة الحر؟». ويمكن للناس الرفض وحذف أسمائهم.","consequence":"يوافق الجميع تقريباً. ويختار قلة الرفض، ويُحترم خيارهم. ويبدأ الجيران بإخبار المتطوعين عن أشخاص آخرين يعيشون بمفردهم.","reflection":"إن توضيح سبب عرض المساعدة، وقبول الرفض، يحترمان الكرامة ويحوّلان التنبؤ إلى علاقة.","impacts":{"humanity":2,"doNoHarm":1}},{"id":"hw-4c","label":"إسناد إدارة القائمة إلى الأحياء","detail":"مشاركة خريطة مخاطر الحر على مستوى المناطق مع مجموعات الرعايا الكنسية وجمعيات الأحياء، لتقرر من ينبغي الاطمئنان عليه.","consequence":"تصبح التغطية متفاوتة؛ قوية في الأحياء المنظمة وضعيفة في غيرها. لكن حيث تنجح، يستمر الاطمئنان طوال الصيف دون حاجة إلى نموذج.","reflection":"إسناد القيادة للمجتمعات المحلية يبني قدرات مستدامة، لكن يظل عليك الانتباه لمن لا يحيط بهم مجتمع قوي.","impacts":{"humanity":1,"independence":1,"impartiality":-1}}]}]}],"en":[{"id":"flood-line","title":"The Flood Line","tagline":"An AI chatbot for flood-affected communities in South Asia","role":"Head of Emergency Operations, National Society of a South Asian delta country","context":"Weeks of monsoon rain have displaced over 200,000 people across the delta. Your phone hotline is overwhelmed — callers wait hours for information about shelter, distributions, and missing relatives. A telecom partner offers a free AI chatbot that answers questions in three local languages. Your team of forty is exhausted, and the water is still rising.","topics":["AI chatbots","Community engagement","Data protection"],"roles":["Emergency operations","Information management","Community engagement"],"steps":[{"id":"fl-1","title":"Forty-eight hours","narrative":"The vendor says the chatbot can go live in 48 hours, trained on FAQs from past floods. Your information management officer warns the answers have not been verified against this emergency. A full pilot with human review would take two weeks — time when people are sleeping in the open.","options":[{"id":"fl-1a","label":"Launch in 48 hours","detail":"Speed over verification. Answers go out unreviewed, and you fix problems as they surface.","consequence":"Within three days the chatbot answers 40,000 questions. But field teams report that roughly one answer in twelve is wrong — including shelter directions for a district where the site closed last night. Staff spend the week chasing corrections across WhatsApp groups.","reflection":"Speed can save lives, but unverified automated information can itself cause harm. The ICT Resolution commits the Movement to avoiding and mitigating harm to affected people — including harm caused by the tools we deploy.","impacts":{"humanity":1,"doNoHarm":-2}},{"id":"fl-1b","label":"Run a two-week pilot first","detail":"Human reviewers check every answer template before launch. Slower, but verified.","consequence":"The chatbot launches on day 14 with a 98% accuracy rate on verified answers. In the gap, the hotline stays overwhelmed and some communities get information late — but what they get is reliable, and trust in the service holds.","reflection":"Verification costs time, and time costs reach. But reliable information is part of impartial, humane assistance — an answer that sends someone the wrong way is not help at all.","impacts":{"humanity":-1,"doNoHarm":2,"impartiality":1}},{"id":"fl-1c","label":"Skip the chatbot, scale the hotline","detail":"Recruit and train temporary operators instead. No new technology risk, far less reach.","consequence":"You train 25 temporary operators in ten days. Answer quality is high and every caller reaches a person — but the hotline still covers only a fraction of demand, and many displaced families simply never get through.","reflection":"Choosing not to use AI is also a decision with consequences. Independence from vendors is preserved, but humanity asks whether a reachable tool, carefully governed, could have alleviated more suffering.","impacts":{"humanity":-1,"doNoHarm":1,"independence":1}}]},{"id":"fl-2","title":"What the chatbot remembers","narrative":"The vendor’s default configuration logs everything: phone numbers, rough locations, and every question asked — “to improve the service.” Your data protection focal point notes that a list of displaced people, their locations, and their needs is exactly the kind of dataset the Movement’s data protection standards exist to protect.","options":[{"id":"fl-2a","label":"Log everything for a better service","detail":"Full interaction logs feed the vendor’s analytics pipeline. Personalisation improves.","consequence":"Responses get noticeably more relevant. Months later you learn the logs were used to train a commercial product, and there is no practical way to withdraw the data of 40,000 displaced people who never agreed to that.","reflection":"Affected people rarely get to negotiate consent in a crisis. The ICT Resolution’s data protection commitment treats their data as theirs — collected for a stated purpose, protected, and never quietly repurposed.","impacts":{"humanity":1,"doNoHarm":-2,"independence":-1}},{"id":"fl-2b","label":"Collect the minimum","detail":"Anonymous sessions, no identifiers, retention limits in the contract. Less personalisation.","consequence":"The chatbot cannot remember returning users, which frustrates some. But when a ministry requests user data two months later, there is nothing identifying to hand over — and your teams can say so honestly on the radio.","reflection":"Data minimisation is the quiet hero of responsible data practice: you cannot leak, lose, or be forced to surrender data you never collected. It also protects neutrality if conflict parties later take an interest.","impacts":{"doNoHarm":2,"neutrality":1}},{"id":"fl-2c","label":"Share logs with the telecom partner","detail":"They offer network analytics in exchange. Affected users are not asked.","consequence":"The analytics help you map demand. Then a journalist asks why displaced people’s questions and locations flow to a private company. The story runs nationally; community trust in the hotline drops sharply.","reflection":"Accountability to affected people includes being able to explain — before they read it in the news — who holds their data and why. Ethical partnership terms belong in procurement, not in crisis comms afterwards.","impacts":{"doNoHarm":-2,"independence":-1}}]},{"id":"fl-3","title":"Wrong turns","narrative":"A field delegate calls: the chatbot has been sending families to a distribution point that closed two days ago. About 300 people walked there in the heat, some with small children. The vendor can patch the answer within hours — but you now know other answers may be stale too.","options":[{"id":"fl-3a","label":"Keep it running while you patch","detail":"The service stays up. Fixes roll out answer by answer over the week.","consequence":"Most users keep getting help — and an unknown number keep getting stale information. Two more closed sites are reported before the content audit finishes. Field teams lose confidence in the tool.","reflection":"Continuing a service you know is harming some users shifts risk onto the people least able to absorb it. Do no harm means being willing to switch off your own innovation.","impacts":{"humanity":-1,"doNoHarm":-2}},{"id":"fl-3b","label":"Take it offline and say why","detail":"Suspend the chatbot, announce the correction by radio and SMS, relaunch after a full content audit.","consequence":"Three days without the chatbot, and the hotline groans again. But the transparent correction lands well: community leaders repeat your message, and relaunch day brings record usage — people trust a service that admits mistakes.","reflection":"Community engagement and accountability is not a survey at the end — it is honest communication when things go wrong. Admitting error strengthened, rather than weakened, the service.","impacts":{"humanity":-1,"doNoHarm":2}},{"id":"fl-3c","label":"Add a disclaimer and continue","detail":"“Answers may be inaccurate — verify locally.” The service never goes down.","consequence":"Usage dips slightly. But for a mother deciding whether to walk five kilometres with a toddler, “may be inaccurate” is not actionable. Complaints rise among the most vulnerable users, who have no way to “verify locally.”","reflection":"A disclaimer transfers your responsibility to the user. Accountability means the organisation — not the affected person — carries the burden of getting it right.","impacts":{"doNoHarm":-1,"impartiality":-1}}]},{"id":"fl-4","title":"Who’s listening?","narrative":"Six weeks in, the emergency is stabilising. You must decide how the chatbot — likely to become a permanent service — stays answerable to the people who use it.","options":[{"id":"fl-4a","label":"Convene a community feedback panel","detail":"Affected people review answers weekly, flag harm, and shape what the chatbot covers.","consequence":"The panel catches problems your dashboards never showed: answers that made sense in the capital but not in riverside dialects, and topics people were afraid to ask about. The service gets better and more trusted.","reflection":"Community engagement and accountability — a core ICT Resolution commitment — treats affected people as decision-makers about the tools that serve them, not just data points about usage.","impacts":{"doNoHarm":2,"impartiality":1}},{"id":"fl-4b","label":"Trust the usage metrics","detail":"Dashboards show strong engagement. If people use it, it works.","consequence":"Numbers look great in the donor report. Months later, an evaluation finds the users with the worst outcomes — elderly, disabled, non-dominant-language speakers — simply stopped using the chatbot, invisibly.","reflection":"Metrics measure the people who stayed. Impartiality asks about the people the data cannot see — and they are often those most in need.","impacts":{"impartiality":-2,"doNoHarm":-1}},{"id":"fl-4c","label":"Hand moderation to untrained volunteers","detail":"Local goodwill keeps the service alive at almost no cost.","consequence":"Volunteers work hard, but without training or escalation routes, some harmful replies stand for weeks and sensitive questions get inconsistent treatment. Two volunteers burn out and quit.","reflection":"Accountability cannot be outsourced to goodwill. Ethical deployment includes resourcing the humans who keep automated systems safe — or the automation is not really governed at all.","impacts":{"humanity":1,"doNoHarm":-1}}]}],"debrief":"The Flood Line shows how quickly a well-intentioned chatbot touches every commitment in the ICT Resolution: verified information (do no harm), data minimisation and purpose (data protection), honest communication when things fail (accountability to communities), and governance that keeps affected people in charge of the tools meant to serve them."},{"id":"targeting-unseen","title":"Targeting the Unseen","tagline":"Predictive analytics for beneficiary selection in the Sahel","role":"Cash Programme Director, Sahel Drought Response","context":"An eighteen-month drought across the Sahel has pushed 60,000 households toward crisis. Your cash programme can reach 15,000. Selection is the hardest, most contested decision in the operation — and an analytics firm offers a predictive model that ranks households by likely need in days instead of months.","topics":["Beneficiary targeting","Algorithmic bias","Data sharing with tech partners"],"roles":["Programme management","Data & analytics","Protection"],"steps":[{"id":"tu-1","title":"The data you have","narrative":"The model is only as good as its training data. You have three realistic options, none perfect, and the next food-insecurity window closes in eight weeks.","options":[{"id":"tu-1a","label":"Use the four-year-old registry","detail":"Fast and ready. But it predates the drought, the displacement, and the border closure.","consequence":"Rankings are ready in five days. Field teams quickly find the model scores households that have since recovered — and is blind to thousands of newly displaced families who were never registered. Exclusion complaints flood in.","reflection":"A model trained on yesterday’s reality reproduces yesterday’s picture of need. Impartiality — help based on need alone — fails quietly when the data cannot see who is suffering now.","impacts":{"impartiality":-2,"humanity":-1}},{"id":"tu-1b","label":"Collect fresh data door to door","detail":"Enumerators with tablets and consent scripts. Six weeks, real coverage of the unregistered.","consequence":"The delay is painful — one lean month passes before cash flows. But the model trains on current reality, including households no list had ever captured. Community leaders call it the fairest selection they have seen.","reflection":"Sometimes the responsible use of AI is slowing down to give it honest inputs. Consent-based collection also models the data protection standard the ICT Resolution asks for.","impacts":{"impartiality":2,"doNoHarm":1,"humanity":-1}},{"id":"tu-1c","label":"Blend registry with satellite proxies","detail":"Roof materials, vegetation, road access as need proxies. Cheap, fast, no new surveys.","consequence":"Coverage is fast and broad. But proxies misread whole groups: pastoralists whose wealth walks on four legs score as destitute, while impoverished families under solid roofs score as fine. Correcting the errors takes longer than the survey would have.","reflection":"Proxy variables encode assumptions about what poverty looks like. When the assumptions are wrong, the bias is systematic — it hits the same kinds of households every time, which is the opposite of impartiality.","impacts":{"impartiality":-1,"doNoHarm":-1,"humanity":1}}]},{"id":"tu-2","title":"The model’s blind spots","narrative":"Validation results come back: overall accuracy looks strong, but female-headed households and a minority ethnic group are systematically ranked lower than ground-truth assessments say they should be. The firm says the gap is “within acceptable tolerance.” The disbursement deadline is in ten days.","options":[{"id":"tu-2a","label":"Deploy to meet the deadline","detail":"Cash moves on time. The known bias goes into a “lessons learned” document.","consequence":"15,000 households get cash on schedule — but the excluded include a disproportionate share of female-headed households. The appeals desk is overwhelmed, and a local radio host asks why the computer “forgot the widows.”","reflection":"A known, unmitigated bias is not a technical footnote; it is a decision to discriminate at scale. Do no harm applies to the harms you can predict as much as the ones you cannot.","impacts":{"humanity":1,"impartiality":-2,"doNoHarm":-1}},{"id":"tu-2b","label":"Recalibrate with community validation","detail":"Local committees review exclusion cases. Two more weeks before disbursement.","consequence":"The delay is hard to defend to donors — until the revised list lands. Committees catch hundreds of wrongful exclusions, and because they helped shape the list, disputes drop sharply. The deadline slips; the legitimacy holds.","reflection":"Community engagement is one of the strongest bias-correction tools available. People who live the reality see patterns no validation metric captures — and their involvement builds the accountability the ICT Resolution calls for.","impacts":{"impartiality":2,"doNoHarm":1,"humanity":-1}},{"id":"tu-2c","label":"Model advises, people decide","detail":"Staff and committees make final selections, using the ranking as one input among several.","consequence":"Selection takes longer than pure automation but stays on schedule. The model still speeds up the early sorting, while humans absorb its blind spots. Documented human overrides create a record you can audit and explain.","reflection":"Meaningful human oversight is the difference between using a model and being used by one. Keeping the final decision human preserves accountability — someone can answer for every name on the list.","impacts":{"impartiality":1,"doNoHarm":1,"independence":1}}]},{"id":"tu-3","title":"The partner’s price","narrative":"The analytics firm’s standard contract grants it access to the household dataset “to improve the model and related products,” and the right to cite the project in marketing. Legal flags both clauses. The firm hints that removing them may end the free licence.","options":[{"id":"tu-3a","label":"Share pseudonymised data under contract","detail":"Names stripped, contract signed. The programme keeps its free tools.","consequence":"The programme saves money. A year later, a researcher demonstrates that the “pseudonymised” household records can be re-identified by combining location and family size — and the contract’s enforcement clause turns out to be nearly useless across jurisdictions.","reflection":"Pseudonymisation is weaker than it looks in small populations, and a contract you cannot enforce is a hope, not a safeguard. Data protection must survive the end of the partnership.","impacts":{"doNoHarm":-2,"independence":-1}},{"id":"tu-3b","label":"Share only aggregated results","detail":"The firm gets model performance numbers, never row-level data. They push back.","consequence":"Negotiations get tense and the firm briefly threatens to walk. You hold the line, and they accept — aggregated metrics still let them improve the model. No household record ever leaves your control.","reflection":"Ethical procurement means the Movement sets the terms on which affected people’s data moves, not the vendor. “Free” tools are paid for in something — make sure it is not beneficiaries’ privacy.","impacts":{"doNoHarm":1,"independence":1}},{"id":"tu-3c","label":"Walk away and build in-house","detail":"Slower, costlier, and entirely yours.","consequence":"Your small data team builds a simpler model over three months. It is less sophisticated and the delay is real — but every line of it is auditable, every record stays in-house, and the skill now lives in the Movement.","reflection":"Independence sometimes costs speed and money. Owning your capability — rather than renting a black box — is a long-term investment in accountable, autonomous humanitarian action.","impacts":{"independence":2,"doNoHarm":1,"humanity":-1}}]},{"id":"tu-4","title":"Who signs the list?","narrative":"Final design decision: how automated is enrolment? The model produces a ranked list of 15,000 households. Someone — or something — has to turn that ranking into a final, binding list.","options":[{"id":"tu-4a","label":"Auto-enrol the top 15,000","detail":"No human review. Fastest possible cash, fully “objective.”","consequence":"Cash moves in record time. Then the errors surface: duplicated households, a village mis-mapped by the model, families excluded by a data-entry typo no human ever saw. With no review step, every error is final until the appeals grind through.","reflection":"Full automation does not remove human judgement — it hides it inside the model and the data. Automated decision-making about people’s survival needs a human who can catch what the system cannot.","impacts":{"doNoHarm":-2,"impartiality":-1,"humanity":1}},{"id":"tu-4b","label":"Staff verify every case","detail":"Thorough and accountable — and the bottleneck everyone feared.","consequence":"Verification adds four weeks. Errors caught: hundreds. But the lean season bites before disbursement finishes, and you spend difficult nights defending the delay to community leaders who were promised speed.","reflection":"Accountability has a price in time, and in a hunger crisis time is measured in meals. The honest lesson: build verification capacity before the emergency, so diligence and speed are not enemies.","impacts":{"doNoHarm":1,"impartiality":1,"humanity":-1}},{"id":"tu-4c","label":"Human-in-the-loop plus community appeals","detail":"Staff spot-check the list, criteria are published, and any household can challenge its exclusion.","consequence":"Published criteria defuse most suspicion before it starts. The appeals window catches 600 wrongful exclusions in two weeks. The list is not perfect — but it is explainable, correctable, and trusted.","reflection":"Transparency plus a working appeal mechanism is what accountability to affected people looks like in practice: not a flawless algorithm, but a system people can question and correct.","impacts":{"doNoHarm":2,"impartiality":1}}]}],"debrief":"Targeting the Unseen is about who the data cannot see. Predictive targeting touches impartiality (does the model see today’s need?), data protection (who owns household data, and can “pseudonymised” people be re-identified?), ethical procurement (who sets the terms with vendors?), and accountability (can an excluded family challenge the machine’s answer?)."},{"id":"front-line","title":"Eyes on the Front Line","tagline":"AI needs assessment in an active conflict in the Middle East","role":"Operations Director, Middle East Conflict Response","context":"In a protracted conflict, front lines shift weekly. Two districts are cut off, and your last verified needs assessment is three months old. A global tech firm offers its satellite-imagery platform — with machine-learning damage detection — free for humanitarian use. In this context, information about where people are and what they need is not just operational data. It is also militarily sensitive.","topics":["Predictive analytics","Conflict sensitivity","Cloud dependency","Automated decision-making"],"roles":["Operations","Security","Information management"],"steps":[{"id":"fo-1","title":"Seeing without entering","narrative":"Access negotiations have stalled. The platform can map damaged buildings across both cut-off districts within days. Your field coordinator cautions that a building’s roof says nothing about the people inside it.","options":[{"id":"fo-1a","label":"Run the satellite assessment now","detail":"Fast, remote, and safe for staff. Accept the blind spots for now.","consequence":"You get the first district-wide picture in months, and convoy planning accelerates. But the model reads intact roofs as intact lives: a shelled town with a new market roof scores “recovering,” while its water system is destroyed. Needs in invisible places go uncounted.","reflection":"Remote sensing sees structures, not suffering. Used alone, it skews assistance toward what is visible from orbit — an impartiality problem hiding inside an impressive map.","impacts":{"humanity":1,"impartiality":-1,"doNoHarm":-1}},{"id":"fo-1b","label":"Wait for safe access","detail":"No assessment until delegates can verify on the ground. Verified data, weeks away.","consequence":"Access opens seven weeks later and the assessment is excellent. In the gap, two distributions go to the wrong towns and one district gets nothing at all. The wait was safe for data quality and dangerous for people.","reflection":"Humanity weighs the cost of waiting against the cost of error. Perfect information is a luxury; the discipline is knowing which decisions cannot wait for it.","impacts":{"humanity":-2,"impartiality":1}},{"id":"fo-1c","label":"Combine imagery with community reports","detail":"Trusted local networks report via secure channels; the model and the ground truth check each other.","consequence":"Community reporters correct the model’s worst misses within days — the destroyed water system, the clinic operating from a basement. The combined picture is the best you have ever had in a no-access area, and local networks feel ownership of it.","reflection":"The strongest AI deployments in humanitarian work pair machine scale with community knowledge. That is community engagement doing analytical work — and it keeps affected people as authors, not just subjects, of the data.","impacts":{"humanity":1,"impartiality":1,"doNoHarm":1}}]},{"id":"fo-2","title":"Free platform, hidden costs","narrative":"The firm’s platform is genuinely good — and free. The catch: all imagery analysis and derived population data live on the firm’s cloud, under a foreign jurisdiction, governed by its standard terms. Your security adviser notes those terms allow “service improvement” access.","options":[{"id":"fo-2a","label":"Accept with contract clauses","detail":"Sign quickly with negotiated protections. The operation cannot wait for perfect terms.","consequence":"The platform transforms your situational awareness. Eight months later the firm is acquired, the terms change, and your leverage to renegotiate is limited — the data, and the dependency, are already there.","reflection":"Ethical procurement looks past the price tag to jurisdiction, terms, and exit options. Independence erodes quietly when a critical humanitarian capability depends on a vendor’s goodwill.","impacts":{"independence":-2,"doNoHarm":-1}},{"id":"fo-2b","label":"Insist on Movement-controlled hosting","detail":"Data and models run on infrastructure the Movement controls. Negotiations take weeks.","consequence":"The firm resists, then agrees to a dedicated deployment — slower to stand up, but under your keys. When a government later demands access to movement data, the answer is structurally simple: it is not the firm’s to give, and not yours to share.","reflection":"Where data lives decides who can be forced to surrender it. In conflict settings, control of infrastructure is not an IT detail — it is a protection decision.","impacts":{"independence":2,"doNoHarm":1,"humanity":-1}},{"id":"fo-2c","label":"Decline; use open tools in-house","detail":"Open-source imagery analysis on your own servers. Slower, leaner, fully yours.","consequence":"Your analysts build a workable pipeline in a month. It lacks the platform’s polish and the team is stretched thin — but there is no vendor dependency, no foreign cloud, and the capability survives the end of any partnership.","reflection":"Sometimes the independent choice costs capacity. The trade-off is real and should be made deliberately, with eyes open about what “free” platforms actually charge.","impacts":{"independence":1,"doNoHarm":1,"humanity":-1}}]},{"id":"fo-3","title":"Who else is watching?","narrative":"Your analysis now tracks population movements across the front line — exactly the kind of information armed actors on both sides would value. A donor proposes publishing an open dashboard “for transparency and coordination.”","options":[{"id":"fo-3a","label":"Publish the open dashboard","detail":"Maximum transparency. Anyone — including combatants — can read it.","consequence":"Coordination improves among agencies. Three weeks later, a displacement corridor visible on your dashboard is shelled. You cannot prove the dashboard enabled it. You cannot prove it did not. Staff in the corridor are evacuated.","reflection":"In conflict, transparency about people’s movements can become targeting information. Neutrality and do no harm can require publishing less than you know — a hard truth for an accountability-minded sector.","impacts":{"neutrality":-2,"doNoHarm":-2}},{"id":"fo-3b","label":"Restrict to vetted humanitarian partners","detail":"Need-to-know access, sharing protocol, aggregation before anything goes wider.","consequence":"Coordination is slower and some partners grumble about access tiers. But population movement data never circulates beyond organisations bound by humanitarian principles, and your teams can account for every copy.","reflection":"Responsible data sharing is designed, not defaulted: purpose-limited, access-tiered, and aggregated wherever possible. The ICT Resolution’s data protection commitment applies most where the stakes are highest.","impacts":{"neutrality":1,"doNoHarm":2}},{"id":"fo-3c","label":"Share equally with all parties","detail":"Give every conflict party the same data, even-handedly. Neutrality as symmetry.","consequence":"Both sides accept the data politely. One side’s operations then conspicuously track the movement patterns you provided. Your even-handedness supplied military intelligence to anyone who wanted it.","reflection":"Neutrality is about not contributing to the conduct of hostilities, not about equal distribution of sensitive data. Symmetric sharing of asymmetric information is not neutral in its effects.","impacts":{"neutrality":-1,"doNoHarm":-2,"humanity":-1}}]},{"id":"fo-4","title":"The algorithm recommends","narrative":"The platform now ranks proposed distribution points by predicted need and access. Its top list excludes one besieged town entirely — the model has almost no data from it, so it scores its need as “uncertain/low.” Ten thousand people live there.","options":[{"id":"fo-4a","label":"Follow the algorithm","detail":"Trust the model’s efficiency. No data, no distribution.","consequence":"Distributions run with impressive efficiency — everywhere except the town that needed it most. By the time a smuggled letter reaches your office, the exclusion has lasted six weeks. The model was not wrong about its data. It was wrong about the world.","reflection":"“No data” is not “no need” — in conflict it often means the opposite. Automated decision-making fails hardest exactly where people are most cut off, which is where impartiality matters most.","impacts":{"impartiality":-2,"humanity":-1,"doNoHarm":-1}},{"id":"fo-4b","label":"Human override, documented","detail":"Planners adjust the list and write down why. The record is auditable.","consequence":"The town is added back based on pre-conflict data and community reports. Documenting the override feels bureaucratic — until the after-action review, when that record is how you defend the decision and improve the model’s handling of data gaps.","reflection":"Meaningful human control means a person can overrule the machine, on the record, with reasons. Accountability lives in that written sentence: who decided, and why.","impacts":{"impartiality":1,"doNoHarm":1}},{"id":"fo-4c","label":"Dual sign-off: analyst plus field delegate","detail":"No automated recommendation becomes a decision without two human signatures. Slower by design.","consequence":"Every distribution plan takes an extra day. In exchange, data-gap traps like the besieged town are caught structurally, not by luck — the field delegate’s job is precisely to ask what the model cannot see.","reflection":"In high-stakes settings, redundancy in human judgement is a safeguard, not an inefficiency. The ICT Resolution’s call to avoid and mitigate harm argues for exactly this kind of deliberate friction.","impacts":{"doNoHarm":2,"impartiality":1,"humanity":-1}}]}],"debrief":"Eyes on the Front Line shows AI at its highest stakes. The same model that accelerates needs assessment can blind you to invisible suffering; the same dashboard that coordinates aid can target it; the same algorithm that optimises distributions can erase a besieged town for lack of data. Neutrality, independence, and do no harm are not constraints on the technology — they are the design requirements."},{"id":"cloud-question","title":"The Cloud Question","tagline":"Vendor neutrality and data sovereignty in the Caribbean","role":"Digital Transformation Lead, Caribbean National Society","context":"Your National Society serves island states where hurricanes are a question of when, not if. You are digitising everything at once: a beneficiary registry, an AI-assisted damage assessment tool, and a donations platform. Three very different doors are open — a global cloud giant offering free credits, a government offering its national cloud, and a regional consortium running open infrastructure. Behind each door is a different answer to the question: whose technology do your people’s lives run on?","topics":["Cloud provider choice","Vendor neutrality","Data sovereignty","Do-no-harm assessment"],"roles":["ICT & digital","Procurement","Leadership"],"steps":[{"id":"cq-1","title":"Where the data lives","narrative":"The beneficiary registry will hold names, locations, and vulnerability details for 80,000 households. The hyperscaler’s offer is generous: five years of credits, top-tier security, data centres abroad. The government’s national cloud keeps data in-country — and under national law. The consortium’s Movement-controlled servers cost more and arrive slower.","options":[{"id":"cq-1a","label":"Take the hyperscaler’s free credits","detail":"Fast, secure, and free for five years. Data sits in a foreign jurisdiction under the vendor’s terms.","consequence":"You launch in record time and the platform performs beautifully. In year three, the credits end, prices are repriced, and migrating 80,000 household records out of proprietary formats turns out to be a project nobody budgeted for.","reflection":"Data sovereignty is decided on day one, not at renewal. Free credits are a procurement decision whose cost arrives later — and exit costs are part of the price of any cloud.","impacts":{"humanity":1,"independence":-2}},{"id":"cq-1b","label":"Use the government’s national cloud","detail":"Data stays in-country and the ministry is delighted. State access comes with the territory.","consequence":"Hosting is cheap and politically smooth. Then the registry is subpoenaed in a migration enforcement case, and you discover that “in-country” also means “within reach.” Community trust in the registry — built over years — wobbles overnight.","reflection":"Sovereignty on paper is not independence in practice. A humanitarian registry must be shielded from any authority that might use it for non-humanitarian ends — that is what independence protects.","impacts":{"independence":-2,"doNoHarm":-2}},{"id":"cq-1c","label":"Build on Movement-controlled infrastructure","detail":"The regional consortium’s open stack. Costlier, slower, fully yours.","consequence":"Launch takes four extra months and eats a third of the digitisation budget. But every record sits under your keys, in open formats, with a tested backup in a second country. When vendors and ministries come calling later, the answer is already built.","reflection":"Control of infrastructure is the foundation every other safeguard stands on. It costs money and time up front — the ICT Resolution’s ethical procurement commitment includes being willing to pay that price.","impacts":{"independence":2,"doNoHarm":1,"humanity":-1}}]},{"id":"cq-2","title":"The vendor’s other customers","narrative":"Your AI damage-assessment tool runs on a single commercial vendor’s models. A regional newspaper reveals that the same vendor supplies analytics to a party in an armed conflict two borders away. A journalist calls: does your National Society’s partnership with this vendor compromise its neutrality?","options":[{"id":"cq-2a","label":"Say nothing; the contract is clean","detail":"Your data is separate, your use is humanitarian. Ride out the news cycle.","consequence":"The story fades in a week — but not everywhere. Community leaders in one district stop sharing damage photos, and a partner organisation quietly pauses data sharing with you, citing “reputational exposure.” Perception did the damage the facts never did.","reflection":"Neutrality is judged by perception as much as by fact. Vendor neutrality — whose technology you are seen to rely on — is now part of how parties and communities read your impartiality.","impacts":{"neutrality":-2,"independence":-1}},{"id":"cq-2b","label":"Diversify vendors and publish your due diligence","detail":"Add a second provider for critical workloads, adopt a public vendor-screening policy, and say so openly.","consequence":"The migration is real work and the dual setup costs more. But the public policy answers the journalist’s question better than any press release: you can show exactly how vendors are screened, and no single company’s reputation can take yours down with it.","reflection":"Vendor neutrality is engineered, not asserted: avoid single-vendor dependency for critical systems, screen suppliers against humanitarian principles, and be able to show your working.","impacts":{"neutrality":1,"independence":1,"doNoHarm":1}},{"id":"cq-2c","label":"Terminate the vendor immediately","detail":"A clean break, announced publicly. Services go offline while you rebuild.","consequence":"The announcement is praised by commentators. But the damage-assessment tool is offline for nine weeks — spanning the start of hurricane season — and a post-storm response goes out with slower, poorer targeting as a result.","reflection":"Principled exits still have victims. Abruptly cutting a dependency you never planned to escape shifts the cost onto affected people — an exit strategy is a do-no-harm measure, not a luxury.","impacts":{"neutrality":2,"humanity":-2,"doNoHarm":-1}}]},{"id":"cq-3","title":"A harm assessment before hurricane season","narrative":"The AI damage-assessment tool is ready six weeks before the season peak. Community focal points warn you: the model was trained mostly on formal housing, and informal settlements — where the most vulnerable live — may be systematically under-scored. A full participatory harm assessment takes six weeks. The season will not wait.","options":[{"id":"cq-3a","label":"Launch now, assess later","detail":"The season won’t wait. Run the harm assessment after the first storms.","consequence":"The tool works well in formal districts and badly in informal ones — exactly as warned. Post-storm aid flows toward the damage the model could see. The retrospective harm assessment documents, in detail, who was missed.","reflection":"A harm assessment written after the harm is a post-mortem. Do no harm means assessing foreseeable risks to affected communities before deployment — especially the risks to those the data represents least.","impacts":{"humanity":1,"doNoHarm":-2,"impartiality":-1}},{"id":"cq-3b","label":
