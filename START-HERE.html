e people visible to a system can expose them to new risks. Sometimes the safer answer is to work around the data, not to fill it.","impacts":{"impartiality":1,"doNoHarm":-2}}]},{"id":"hw-3","title":"Cooling the servers","narrative":"The consortium proposes to install a local computing cluster in Palermo to make predictions faster. In a heatwave, the servers themselves would need constant air-conditioning — drawing power from the same strained grid that keeps older people's fans running. During last year's heatwave, parts of the city lost power.","options":[{"id":"hw-3a","label":"Install the local cluster","detail":"Faster predictions, local control.","consequence":"On the hottest day the grid operator asks for voluntary cuts. Your servers keep running — and keep cooling — while two neighbourhoods have rolling blackouts.","reflection":"AI infrastructure competes with people for energy and water, sometimes exactly when both are scarcest. That competition is a humanitarian question.","impacts":{"doNoHarm":-2,"humanity":-1}},{"id":"hw-3b","label":"Keep it light and solar-powered","detail":"Run the simple index on laptops at the operations centre, powered by rooftop solar with battery backup.","consequence":"The system runs even during the blackout. The batteries also keep the operations centre's phones and fridges for medicines working.","reflection":"Resilient, low-energy design protects operations when infrastructure fails — which is when crisis tools matter most.","impacts":{"doNoHarm":2,"independence":1}},{"id":"hw-3c","label":"Compute in Northern Europe, on renewables","detail":"Leave the heavy computing in a hydro-powered data centre in Norway or Sweden.","consequence":"The local grid is spared, and the electricity is renewable. But connectivity during the heatwave is unreliable, and you depend on a link you don't control when it matters most.","reflection":"Moving computing to clean energy reduces emissions but not dependency. Weigh both the footprint and who keeps control in a crisis.","impacts":{"doNoHarm":1,"independence":-1}}]},{"id":"hw-4","title":"Knocking on the door","narrative":"On alert days, the system gives each volunteer a list of addresses ranked by predicted risk. A volunteer asks: 'What do I say when an old man asks why we chose him?' Another reports that some residents feel labelled as 'about to die'.","options":[{"id":"hw-4a","label":"Don't explain — just help","detail":"The model is too complex to explain at the doorstep.","consequence":"Most people accept the visit. Some don't open the door. A rumour spreads that the Red Cross has secret lists from the hospital.","reflection":"When people don't know why they've been selected, suspicion fills the gap. Opacity erodes the trust that humanitarian work depends on.","impacts":{"doNoHarm":-1,"humanity":-1}},{"id":"hw-4b","label":"Explain plainly and offer a way out","detail":"A simple script: 'This street is hot and has many older residents. Would you like us to check in during the heatwave?' People can say no and be removed.","consequence":"Almost everyone says yes. A few opt out, and their choice is respected. Neighbours start telling volunteers about other people living alone.","reflection":"Being clear about why help is offered — and accepting a 'no' — respects dignity and turns a prediction into a relationship.","impacts":{"humanity":2,"doNoHarm":1}},{"id":"hw-4c","label":"Let neighbourhoods own the list","detail":"Share the area-level heat map with parish groups and neighbourhood associations, who decide whom to check on.","consequence":"Coverage becomes uneven — strong in organised neighbourhoods, weak elsewhere. But where it works, the checking continues all summer, with no model needed.","reflection":"Putting communities in charge builds lasting capacity, but you still need to watch for those without a strong community around them.","impacts":{"humanity":1,"independence":1,"impartiality":-1}}]}]}],"es":[{"id":"flood-line","title":"La línea de la inundación","tagline":"Un chatbot de IA para comunidades afectadas por inundaciones en Asia Meridional","role":"Jefe(a) de Operaciones de Emergencia, Sociedad Nacional de un país del delta de Asia Meridional","context":"Semanas de lluvias monzónicas han desplazado a más de 200.000 personas en el delta. Tu línea telefónica está desbordada: quienes llaman esperan horas para obtener información sobre refugios, distribuciones y familiares desaparecidos. Un socio de telecomunicaciones ofrece un chatbot de IA gratuito que responde en tres idiomas locales. Tu equipo de cuarenta personas está agotado y el agua sigue subiendo.","topics":["Chatbots de IA","Participación comunitaria","Protección de datos"],"roles":["Operaciones de emergencia","Gestión de información","Participación comunitaria"],"steps":[{"id":"fl-1","title":"Cuarenta y ocho horas","narrative":"El proveedor dice que el chatbot puede estar en línea en 48 horas, entrenado con preguntas frecuentes de inundaciones pasadas. Tu oficial de gestión de información advierte que las respuestas no se han verificado contra esta emergencia. Un piloto completo con revisión humana tomaría dos semanas: tiempo en el que la gente duerme a la intemperie.","options":[{"id":"fl-1a","label":"Lanzar en 48 horas","detail":"Velocidad sobre verificación. Las respuestas salen sin revisar y corriges los problemas a medida que surgen.","consequence":"En tres días el chatbot responde 40.000 preguntas. Pero los equipos de campo reportan que aproximadamente una respuesta de cada doce es errónea, incluidas indicaciones hacia un refugio de un distrito donde el sitio cerró anoche. El personal pasa la semana persiguiendo correcciones por grupos de WhatsApp.","reflection":"La velocidad puede salvar vidas, pero la información automatizada sin verificar puede causar daño por sí misma. La Resolución sobre TIC compromete al Movimiento a evitar y mitigar el daño a las personas afectadas, incluido el daño causado por las herramientas que desplegamos.","impacts":{"humanity":1,"doNoHarm":-2}},{"id":"fl-1b","label":"Hacer un piloto de dos semanas primero","detail":"Revisores humanos verifican cada plantilla de respuesta antes del lanzamiento. Más lento, pero verificado.","consequence":"El chatbot se lanza el día 14 con un 98% de precisión en respuestas verificadas. Mientras tanto, la línea sigue saturada y algunas comunidades reciben información tarde, pero lo que reciben es fiable, y la confianza en el servicio se mantiene.","reflection":"La verificación cuesta tiempo, y el tiempo cuesta alcance. Pero la información fiable es parte de una asistencia humana e imparcial: una respuesta que envía a alguien por el camino equivocado no es ayuda.","impacts":{"humanity":-1,"doNoHarm":2,"impartiality":1}},{"id":"fl-1c","label":"Olvidar el chatbot y ampliar la línea telefónica","detail":"Reclutar y capacitar operadores temporales. Sin riesgo tecnológico nuevo, pero mucho menos alcance.","consequence":"Capacitas a 25 operadores temporales en diez días. La calidad de las respuestas es alta y cada llamada llega a una persona, pero la línea solo cubre una fracción de la demanda, y muchas familias desplazadas simplemente nunca logran comunicarse.","reflection":"Elegir no usar IA también es una decisión con consecuencias. Se preserva la independencia de los proveedores, pero la humanidad pregunta si una herramienta accesible, bien gobernada, podría haber aliviado más sufrimiento.","impacts":{"humanity":-1,"doNoHarm":1,"independence":1}}]},{"id":"fl-2","title":"Lo que el chatbot recuerda","narrative":"La configuración predeterminada del proveedor lo registra todo: números de teléfono, ubicaciones aproximadas y cada pregunta formulada, «para mejorar el servicio». Tu punto focal de protección de datos señala que una lista de personas desplazadas, sus ubicaciones y sus necesidades es exactamente el tipo de conjunto de datos que las normas de protección de datos del Movimiento existen para proteger.","options":[{"id":"fl-2a","label":"Registrarlo todo para un mejor servicio","detail":"Los registros completos alimentan la analítica del proveedor. La personalización mejora.","consequence":"Las respuestas se vuelven notablemente más relevantes. Meses después te enteras de que los registros se usaron para entrenar un producto comercial, y no hay forma práctica de retirar los datos de 40.000 personas desplazadas que nunca aceptaron eso.","reflection":"Las personas afectadas rara vez pueden negociar su consentimiento en una crisis. El compromiso de protección de datos de la Resolución sobre TIC trata sus datos como suyos: recopilados para un fin declarado, protegidos y nunca reutilizados en silencio.","impacts":{"humanity":1,"doNoHarm":-2,"independence":-1}},{"id":"fl-2b","label":"Recopilar lo mínimo","detail":"Sesiones anónimas, sin identificadores, límites de retención en el contrato. Menos personalización.","consequence":"El chatbot no puede recordar a quienes vuelven, lo que frustra a algunos. Pero cuando un ministerio solicita datos de usuarios dos meses después, no hay nada identificable que entregar, y tus equipos pueden decirlo con honestidad en la radio.","reflection":"La minimización de datos es la heroína silenciosa de la práctica responsable de datos: no puedes filtrar, perder ni verse obligado a entregar datos que nunca recopilaste. También protege la neutralidad si las partes en conflicto se interesan después.","impacts":{"doNoHarm":2,"neutrality":1}},{"id":"fl-2c","label":"Compartir los registros con el socio de telecomunicaciones","detail":"Ofrecen analítica de red a cambio. No se pregunta a los usuarios afectados.","consequence":"La analítica te ayuda a mapear la demanda. Entonces un periodista pregunta por qué las preguntas y ubicaciones de personas desplazadas fluyen hacia una empresa privada. La historia sale en medios nacionales; la confianza comunitaria en la línea cae bruscamente.","reflection":"La rendición de cuentas ante las personas afectadas incluye poder explicar —antes de que lo lean en las noticias— quién custodia sus datos y por qué. Las condiciones éticas de las alianzas pertenecen a la adquisición, no a la comunicación de crisis posterior.","impacts":{"doNoHarm":-2,"independence":-1}}]},{"id":"fl-3","title":"Caminos equivocados","narrative":"Llama un delegado de campo: el chatbot ha estado enviando familias a un punto de distribución que cerró hace dos días. Unas 300 personas caminaron hasta allí bajo el calor, algunas con niños pequeños. El proveedor puede corregir la respuesta en horas, pero ahora sabes que otras respuestas también pueden estar desactualizadas.","options":[{"id":"fl-3a","label":"Mantenerlo en línea mientras corriges","detail":"El servicio sigue activo. Las correcciones se aplican respuesta por respuesta durante la semana.","consequence":"La mayoría de los usuarios sigue recibiendo ayuda, y un número desconocido sigue recibiendo información obsoleta. Se reportan dos sitios cerrados más antes de que termine la auditoría de contenido. Los equipos de campo pierden confianza en la herramienta.","reflection":"Continuar un servicio que sabes que daña a algunos usuarios traslada el riesgo a las personas menos capaces de absorberlo. No causar daño significa estar dispuesto a apagar tu propia innovación.","impacts":{"humanity":-1,"doNoHarm":-2}},{"id":"fl-3b","label":"Desconectarlo y explicar por qué","detail":"Suspender el chatbot, anunciar la corrección por radio y SMS, y relanzar tras una auditoría completa de contenido.","consequence":"Tres días sin chatbot y la línea telefónica vuelve a resentirse. Pero la corrección transparente cae bien: los líderes comunitarios repiten tu mensaje, y el día del relanzamiento bate récords de uso. La gente confía en un servicio que admite errores.","reflection":"La participación comunitaria y la rendición de cuentas no son una encuesta al final: son comunicación honesta cuando las cosas salen mal. Admitir el error fortaleció, en lugar de debilitar, el servicio.","impacts":{"humanity":-1,"doNoHarm":2}},{"id":"fl-3c","label":"Añadir un aviso legal y continuar","detail":"«Las respuestas pueden ser inexactas: verifíquelas localmente.» El servicio nunca se interrumpe.","consequence":"El uso baja ligeramente. Pero para una madre que decide si caminar cinco kilómetros con un bebé, «puede ser inexacto» no es útil. Aumentan las quejas entre los usuarios más vulnerables, que no tienen forma de «verificar localmente».","reflection":"Un aviso legal transfiere tu responsabilidad al usuario. La rendición de cuentas significa que la organización —no la persona afectada— carga con el peso de hacerlo bien.","impacts":{"doNoHarm":-1,"impartiality":-1}}]},{"id":"fl-4","title":"¿Quién escucha?","narrative":"Seis semanas después, la emergencia se estabiliza. Debes decidir cómo el chatbot —que probablemente se convertirá en un servicio permanente— sigue rindiendo cuentas ante las personas que lo usan.","options":[{"id":"fl-4a","label":"Convocar un panel comunitario de retroalimentación","detail":"Las personas afectadas revisan respuestas semanalmente, señalan daños y definen qué cubre el chatbot.","consequence":"El panel detecta problemas que tus paneles de métricas nunca mostraron: respuestas con sentido en la capital pero no en los dialectos ribereños, y temas sobre los que la gente temía preguntar. El servicio mejora y gana confianza.","reflection":"La participación comunitaria y la rendición de cuentas —un compromiso central de la Resolución sobre TIC— trata a las personas afectadas como quienes deciden sobre las herramientas que les sirven, no solo como datos de uso.","impacts":{"doNoHarm":2,"impartiality":1}},{"id":"fl-4b","label":"Confiar en las métricas de uso","detail":"Los paneles muestran un uso fuerte. Si la gente lo usa, funciona.","consequence":"Los números lucen muy bien en el informe al donante. Meses después, una evaluación encuentra que los usuarios con peores resultados —personas mayores, con discapacidad, hablantes de lenguas no dominantes— simplemente dejaron de usar el chatbot, de forma invisible.","reflection":"Las métricas miden a quienes se quedaron. La imparcialidad pregunta por las personas que los datos no pueden ver, y a menudo son las más necesitadas.","impacts":{"impartiality":-2,"doNoHarm":-1}},{"id":"fl-4c","label":"Dejar la moderación a voluntarios sin capacitación","detail":"La buena voluntad local mantiene vivo el servicio casi sin costo.","consequence":"Los voluntarios trabajan duro, pero sin capacitación ni vías de escalamiento, algunas respuestas dañinas permanecen semanas y las preguntas sensibles reciben trato inconsistente. Dos voluntarios se agotan y renuncian.","reflection":"La rendición de cuentas no puede subcontratarse a la buena voluntad. El despliegue ético incluye financiar a las personas que mantienen seguros los sistemas automatizados; de lo contrario, la automatización no está realmente gobernada.","impacts":{"humanity":1,"doNoHarm":-1}}]}],"debrief":"La línea de la inundación muestra con qué rapidez un chatbot bien intencionado toca cada compromiso de la Resolución sobre TIC: información verificada (no causar daño), minimización y finalidad de datos (protección de datos), comunicación honesta cuando algo falla (rendición de cuentas ante las comunidades) y gobernanza que mantiene a las personas afectadas al mando de las herramientas destinadas a servirlas."},{"id":"targeting-unseen","title":"Apuntar a los invisibles","tagline":"Analítica predictiva para la selección de beneficiarios en el Sahel","role":"Director(a) del Programa de Transferencias Monetarias, Respuesta a la Sequía en el Sahel","context":"Una sequía de dieciocho meses en el Sahel ha empujado a 60.000 hogares hacia la crisis. Tu programa de transferencias puede llegar a 15.000. La selección es la decisión más difícil y disputada de la operación, y una firma de analítica ofrece un modelo predictivo que clasifica los hogares según su necesidad probable en días en lugar de meses.","topics":["Selección de beneficiarios","Sesgo algorítmico","Intercambio de datos con socios tecnológicos"],"roles":["Gestión de programas","Datos y analítica","Protección"],"steps":[{"id":"tu-1","title":"Los datos que tienes","narrative":"El modelo solo es tan bueno como sus datos de entrenamiento. Tienes tres opciones realistas, ninguna perfecta, y la próxima ventana de inseguridad alimentaria se cierra en ocho semanas.","options":[{"id":"tu-1a","label":"Usar el registro de hace cuatro años","detail":"Rápido y listo. Pero es anterior a la sequía, al desplazamiento y al cierre de la frontera.","consequence":"Las clasificaciones están listas en cinco días. Los equipos de campo descubren pronto que el modelo puntúa hogares que desde entonces se recuperaron, y es ciego ante miles de familias recién desplazadas que nunca fueron registradas. Las quejas por exclusión llegan en avalancha.","reflection":"Un modelo entrenado con la realidad de ayer reproduce la imagen de necesidad de ayer. La imparcialidad —ayudar solo según la necesidad— falla en silencio cuando los datos no pueden ver quién sufre ahora.","impacts":{"impartiality":-2,"humanity":-1}},{"id":"tu-1b","label":"Recopilar datos nuevos puerta a puerta","detail":"Enumeradores con tabletas y guiones de consentimiento. Seis semanas, cobertura real de los no registrados.","consequence":"La demora es dolorosa: pasa un mes de escasez antes de que fluya el dinero. Pero el modelo se entrena con la realidad actual, incluidos hogares que ninguna lista había captado jamás. Los líderes comunitarios lo llaman la selección más justa que han visto.","reflection":"A veces el uso responsable de la IA es frenar para darle insumos honestos. La recopilación basada en consentimiento también modela el estándar de protección de datos que pide la Resolución sobre TIC.","impacts":{"impartiality":2,"doNoHarm":1,"humanity":-1}},{"id":"tu-1c","label":"Combinar el registro con datos satelitales indirectos","detail":"Materiales de techo, vegetación, acceso vial como indicadores de necesidad. Barato, rápido, sin nuevas encuestas.","consequence":"La cobertura es rápida y amplia. Pero los indicadores malinterpretan a grupos enteros: los pastores cuya riqueza camina en cuatro patas puntúan como indigentes, mientras familias empobrecidas bajo techos sólidos puntúan como acomodadas. Corregir los errores toma más que la encuesta.","reflection":"Las variables indirectas codifican supuestos sobre cómo luce la pobreza. Cuando los supuestos son erróneos, el sesgo es sistemático: golpea al mismo tipo de hogares cada vez, lo opuesto de la imparcialidad.","impacts":{"impartiality":-1,"doNoHarm":-1,"humanity":1}}]},{"id":"tu-2","title":"Los puntos ciegos del modelo","narrative":"Llegan los resultados de validación: la precisión general parece sólida, pero los hogares encabezados por mujeres y un grupo étnico minoritario son sistemáticamente clasificados por debajo de lo que las evaluaciones de terreno indican. La firma dice que la brecha está «dentro de la tolerancia aceptable». La fecha límite de desembolso es en diez días.","options":[{"id":"tu-2a","label":"Desplegar para cumplir el plazo","detail":"El dinero se mueve a tiempo. El sesgo conocido va a un documento de «lecciones aprendidas».","consequence":"15.000 hogares reciben dinero según lo previsto, pero entre los excluidos hay una proporción desproporcionada de hogares encabezados por mujeres. La mesa de apelaciones se desborda, y un locutor de radio local pregunta por qué la computadora «olvidó a las viudas».","reflection":"Un sesgo conocido y no mitigado no es una nota técnica al pie; es una decisión de discriminar a escala. No causar daño se aplica tanto a los daños previsibles como a los imprevisibles.","impacts":{"humanity":1,"impartiality":-2,"doNoHarm":-1}},{"id":"tu-2b","label":"Recalibrar con validación comunitaria","detail":"Comités locales revisan los casos de exclusión. Dos semanas más antes del desembolso.","consequence":"La demora es difícil de defender ante los donantes, hasta que llega la lista revisada. Los comités detectan cientos de exclusiones injustas y, como ayudaron a dar forma a la lista, las disputas caen drásticamente. El plazo se incumple; la legitimidad se mantiene.","reflection":"La participación comunitaria es una de las herramientas más potentes de corrección de sesgos. Quienes viven la realidad ven patrones que ninguna métrica de validación capta, y su participación construye la rendición de cuentas que pide la Resolución sobre TIC.","impacts":{"impartiality":2,"doNoHarm":1,"humanity":-1}},{"id":"tu-2c","label":"El modelo asesora, las personas deciden","detail":"El personal y los comités toman las selecciones finales, usando la clasificación como un insumo entre varios.","consequence":"La selección toma más que la automatización pura, pero se mantiene en plazo. El modelo sigue acelerando la clasificación inicial, mientras las personas absorben sus puntos ciegos. Las anulaciones humanas documentadas crean un registro auditable y explicable.","reflection":"La supervisión humana significativa es la diferencia entre usar un modelo y ser usado por él. Mantener humana la decisión final preserva la rendición de cuentas: alguien puede responder por cada nombre de la lista.","impacts":{"impartiality":1,"doNoHarm":1,"independence":1}}]},{"id":"tu-3","title":"El precio del socio","narrative":"El contrato estándar de la firma de analítica le otorga acceso al conjunto de datos de los hogares «para mejorar el modelo y productos relacionados», y el derecho de citar el proyecto en su mercadotecnia. El equipo legal señala ambas cláusulas. La firma insinúa que eliminarlas podría terminar con la licencia gratuita.","options":[{"id":"tu-3a","label":"Compartir datos seudonimizados bajo contrato","detail":"Sin nombres, contrato firmado. El programa conserva sus herramientas gratuitas.","consequence":"El programa ahorra dinero. Un año después, un investigador demuestra que los registros «seudonimizados» de los hogares pueden reidentificarse combinando ubicación y tamaño familiar, y la cláusula de cumplimiento del contrato resulta casi inútil entre jurisdicciones.","reflection":"La seudonimización es más débil de lo que parece en poblaciones pequeñas, y un contrato que no puedes hacer cumplir es una esperanza, no una salvaguarda. La protección de datos debe sobrevivir al final de la alianza.","impacts":{"doNoHarm":-2,"independence":-1}},{"id":"tu-3b","label":"Compartir solo resultados agregados","detail":"La firma recibe métricas de rendimiento del modelo, nunca datos a nivel de registro. Protestan.","consequence":"Las negociaciones se tensan y la firma amenaza brevemente con retirarse. Mantienes la posición y aceptan: las métricas agregadas aún les permiten mejorar el modelo. Ningún registro de hogar sale jamás de tu control.","reflection":"La adquisición ética significa que el Movimiento fija las condiciones bajo las cuales se mueven los datos de las personas afectadas, no el proveedor. Las herramientas «gratuitas» se pagan con algo: asegúrate de que no sea la privacidad de los beneficiarios.","impacts":{"doNoHarm":1,"independence":1}},{"id":"tu-3c","label":"Retirarse y construir internamente","detail":"Más lento, más caro, y enteramente tuyo.","consequence":"Tu pequeño equipo de datos construye un modelo más simple en tres meses. Es menos sofisticado y la demora es real, pero cada línea es auditable, cada registro permanece interno, y la capacidad ahora vive en el Movimiento.","reflection":"La independencia a veces cuesta velocidad y dinero. Poseer tu capacidad —en lugar de alquilar una caja negra— es una inversión a largo plazo en acción humanitaria autónoma y responsable.","impacts":{"independence":2,"doNoHarm":1,"humanity":-1}}]},{"id":"tu-4","title":"¿Quién firma la lista?","narrative":"Decisión final de diseño: ¿qué tan automatizada es la inscripción? El modelo produce una lista clasificada de 15.000 hogares. Alguien —o algo— debe convertir esa clasificación en una lista final y vinculante.","options":[{"id":"tu-4a","label":"Inscribir automáticamente a los 15.000 primeros","detail":"Sin revisión humana. El dinero más rápido posible, totalmente «objetivo».","consequence":"El dinero se mueve en tiempo récord. Entonces afloran los errores: hogares duplicados, una aldea mal mapeada por el modelo, familias excluidas por un error de digitación que ningún humano vio. Sin paso de revisión, cada error es final hasta que las apelaciones avancen.","reflection":"La automatización total no elimina el juicio humano: lo esconde dentro del modelo y los datos. Las decisiones automatizadas sobre la supervivencia de las personas necesitan un humano que pueda atrapar lo que el sistema no puede.","impacts":{"doNoHarm":-2,"impartiality":-1,"humanity":1}},{"id":"tu-4b","label":"El personal verifica cada caso","detail":"Minucioso y responsable, y el cuello de botella que todos temían.","consequence":"La verificación añade cuatro semanas. Errores detectados: cientos. Pero la temporada de escasez aprieta antes de que termine el desembolso, y pasas noches difíciles defendiendo la demora ante líderes comunitarios a quienes se prometió rapidez.","reflection":"La rendición de cuentas tiene un precio en tiempo, y en una crisis de hambre el tiempo se mide en comidas. La lección honesta: construir capacidad de verificación antes de la emergencia, para que la diligencia y la rapidez no sean enemigas.","impacts":{"doNoHarm":1,"impartiality":1,"humanity":-1}},{"id":"tu-4c","label":"Supervisión humana más apelaciones comunitarias","detail":"El personal hace verificaciones por muestreo, los criterios se publican y cualquier hogar puede impugnar su exclusión.","consequence":"Los criterios publicados desactivan la mayoría de las sospechas antes de que surjan. La ventana de apelaciones detecta 600 exclusiones injustas en dos semanas. La lista no es perfecta, pero es explicable, corregible y confiable.","reflection":"Transparencia más un mecanismo de apelación funcional: así luce en la práctica la rendición de cuentas ante las personas afectadas. No un algoritmo impecable, sino un sistema que la gente puede cuestionar y corregir.","impacts":{"doNoHarm":2,"impartiality":1}}]}],"debrief":"Apuntar a los invisibles trata sobre quiénes no pueden ver los datos. La focalización predictiva toca la imparcialidad (¿ve el modelo la necesidad de hoy?), la protección de datos (¿quién es dueño de los datos de los hogares y pueden reidentificarse las personas «seudonimizadas»?), la adquisición ética (¿quién fija las condiciones con los proveedores?) y la rendición de cuentas (¿puede una familia excluida impugnar la respuesta de la máquina?)."},{"id":"front-line","title":"Ojos en la línea del frente","tagline":"Evaluación de necesidades con IA en un conflicto activo en Oriente Medio","role":"Director(a) de Operaciones, Respuesta al Conflicto en Oriente Medio","context":"En un conflicto prolongado, las líneas del frente se mueven cada semana. Dos distritos están incomunicados y tu última evaluación de necesidades verificada tiene tres meses. Una empresa tecnológica global ofrece su plataforma de imágenes satelitales —con detección de daños por aprendizaje automático— gratis para uso humanitario. En este contexto, la información sobre dónde está la gente y qué necesita no es solo un dato operativo. También es militarmente sensible.","topics":["Analítica predictiva","Sensibilidad al conflicto","Dependencia de la nube","Decisiones automatizadas"],"roles":["Operaciones","Seguridad","Gestión de información"],"steps":[{"id":"fo-1","title":"Ver sin entrar","narrative":"Las negociaciones de acceso están estancadas. La plataforma puede mapear edificios dañados en ambos distritos aislados en cuestión de días. Tu coordinador de campo advierte que el techo de un edificio no dice nada sobre las personas dentro.","options":[{"id":"fo-1a","label":"Ejecutar la evaluación satelital ahora","detail":"Rápida, remota y segura para el personal. Aceptar los puntos ciegos por ahora.","consequence":"Obtienes la primera imagen de los distritos en meses y la planificación de convoyes se acelera. Pero el modelo lee techos intactos como vidas intactas: un pueblo bombardeado con un techo de mercado nuevo puntúa como «en recuperación», mientras su sistema de agua está destruido. Las necesidades en lugares invisibles quedan sin contar.","reflection":"La teledetección ve estructuras, no sufrimiento. Usada sola, sesga la asistencia hacia lo visible desde la órbita: un problema de imparcialidad escondido dentro de un mapa impresionante.","impacts":{"humanity":1,"impartiality":-1,"doNoHarm":-1}},{"id":"fo-1b","label":"Esperar un acceso seguro","detail":"Sin evaluación hasta que los delegados puedan verificar sobre el terreno. Datos verificados, a semanas de distancia.","consequence":"El acceso se abre siete semanas después y la evaluación es excelente. Mientras tanto, dos distribuciones van a los pueblos equivocados y un distrito no recibe nada en absoluto. La espera fue segura para la calidad de los datos y peligrosa para las personas.","reflection":"La humanidad pesa el costo de esperar contra el costo del error. La información perfecta es un lujo; la disciplina es saber qué decisiones no pueden esperarla.","impacts":{"humanity":-2,"impartiality":1}},{"id":"fo-1c","label":"Combinar imágenes con reportes comunitarios","detail":"Redes locales de confianza reportan por canales seguros; el modelo y la verdad de terreno se verifican mutuamente.","consequence":"Los reportes comunitarios corrigen los peores errores del modelo en días: el sistema de agua destruido, la clínica que opera desde un sótano. La imagen combinada es la mejor que has tenido en una zona sin acceso, y las redes locales sienten que es suya.","reflection":"Los despliegues de IA más sólidos en el trabajo humanitario combinan la escala de las máquinas con el conocimiento comunitario. Eso es participación comunitaria haciendo trabajo analítico, y mantiene a las personas afectadas como autoras, no solo sujetos, de los datos.","impacts":{"humanity":1,"impartiality":1,"doNoHarm":1}}]},{"id":"fo-2","title":"Plataforma gratuita, costos ocultos","narrative":"La plataforma de la empresa es genuinamente buena, y gratuita. La trampa: todo el análisis de imágenes y los datos de población derivados viven en la nube de la empresa, bajo una jurisdicción extranjera, regidos por sus condiciones estándar. Tu asesor de seguridad señala que esas condiciones permiten acceso para «mejora del servicio».","options":[{"id":"fo-2a","label":"Aceptar con cláusulas contractuales","detail":"Firmar rápido con protecciones negociadas. La operación no puede esperar condiciones perfectas.","consequence":"La plataforma transforma tu conocimiento de la situación. Ocho meses después la empresa es adquirida, las condiciones cambian y tu margen para renegociar es limitado: los datos, y la dependencia, ya están ahí.","reflection":"La adquisición ética mira más allá del precio: jurisdicción, condiciones y opciones de salida. La independencia se erosiona en silencio cuando una capacidad humanitaria crítica depende de la buena voluntad de un proveedor.","impacts":{"independence":-2,"doNoHarm":-1}},{"id":"fo-2b","label":"Insistir en alojamiento controlado por el Movimiento","detail":"Los datos y modelos corren en infraestructura que el Movimiento controla. Las negociaciones toman semanas.","consequence":"La empresa se resiste y luego acepta un despliegue dedicado: más lento de montar, pero bajo tus llaves. Cuando un gobierno exige después acceso a los datos de movimiento, la respuesta es estructuralmente simple: no son de la empresa para darlos, ni tuyos para compartirlos.","reflection":"Dónde viven los datos decide quién puede ser forzado a entregarlos. En contextos de conflicto, el control de la infraestructura no es un detalle de informática: es una decisión de protección.","impacts":{"independence":2,"doNoHarm":1,"humanity":-1}},{"id":"fo-2c","label":"Rechazar; usar herramientas abiertas internamente","detail":"Análisis de imágenes de código abierto en tus propios servidores. Más lento, más austero, totalmente tuyo.","consequence":"Tus analistas construyen un flujo de trabajo funcional en un mes. Carece del pulido de la plataforma y el equipo está al límite, pero no hay dependencia de proveedores, ni nube extranjera, y la capacidad sobrevive al final de cualquier alianza.","reflection":"A veces la opción independiente cuesta capacidad. El equilibrio es real y debe decidirse deliberadamente, con los ojos abiertos sobre lo que las plataformas «gratuitas» realmente cobran.","impacts":{"independence":1,"doNoHarm":1,"humanity":-1}}]},{"id":"fo-3","title":"¿Quién más está mirando?","narrative":"Tu análisis ahora rastrea movimientos de población a través de la línea del frente: exactamente el tipo de información que los actores armados de ambos lados valorarían. Un donante propone publicar un panel abierto «para transparencia y coordinación».","options":[{"id":"fo-3a","label":"Publicar el panel abierto","detail":"Máxima transparencia. Cualquiera —incluidos los combatientes— puede leerlo.","consequence":"La coordinación entre agencias mejora. Tres semanas después, un corredor de desplazamiento visible en tu panel es bombardeado. No puedes probar que el panel lo permitió. No puedes probar que no. El personal del corredor es evacuado.","reflection":"En un conflicto, la transparencia sobre los movimientos de las personas puede convertirse en información de selección de objetivos. La neutralidad y el no causar daño pueden exigir publicar menos de lo que sabes: una verdad dura para un sector comprometido con la rendición de cuentas.","impacts":{"neutrality":-2,"doNoHarm":-2}},{"id":"fo-3b","label":"Restringir a socios humanitarios verificados","detail":"Acceso según necesidad de conocer, protocolo de intercambio, agregación antes de cualquier difusión más amplia.","consequence":"La coordinación es más lenta y algunos socios protestan por los niveles de acceso. Pero los datos de movimiento de población nunca circulan más allá de organizaciones vinculadas por principios humanitarios, y tus equipos pueden dar cuenta de cada copia.","reflection":"El intercambio responsable de datos se diseña, no es el valor por defecto: limitado por finalidad, escalonado por acceso y agregado siempre que sea posible. El compromiso de protección de datos de la Resolución sobre TIC se aplica más donde las apuestas son mayores.","impacts":{"neutrality":1,"doNoHarm":2}},{"id":"fo-3c","label":"Compartir por igual con todas las partes","detail":"Dar a cada parte del conflicto los mismos datos, con equidad. La neutralidad como simetría.","consequence":"Ambas partes aceptan los datos cortésmente. Las operaciones de una de ellas luego siguen de forma llamativa los patrones de movimiento que proporcionaste. Tu equidad suministró inteligencia militar a quien quisiera tomarla.","reflection":"La neutralidad consiste en no contribuir a la conducción de las hostilidades, no en distribuir equitativamente datos sensibles. El intercambio simétrico de información asimétrica no es neutral en sus efectos.","impacts":{"neutrality":-1,"doNoHarm":-2,"humanity":-1}}]},{"id":"fo-4","title":"El algoritmo recomienda","narrative":"La plataforma ahora clasifica los puntos de distribución propuestos según necesidad y acceso previstos. Su lista principal excluye por completo un pueblo sitiado: el modelo casi no tiene datos de allí, así que puntúa su necesidad como «incierta/baja». Diez mil personas viven allí.","options":[{"id":"fo-4a","label":"Seguir al algoritmo","detail":"Confiar en la eficiencia del modelo. Sin datos, no hay distribución.","consequence":"Las distribuciones funcionan con eficiencia impresionante, en todas partes excepto en el pueblo que más lo necesitaba. Cuando una carta de contrabando llega a tu oficina, la exclusión ha durado seis semanas. El modelo no se equivocó sobre sus datos. Se equivocó sobre el mundo.","reflection":"«Sin datos» no es «sin necesidad»: en un conflicto a menudo significa lo contrario. La toma de decisiones automatizada falla con más fuerza exactamente donde las personas están más aisladas, que es donde más importa la imparcialidad.","impacts":{"impartiality":-2,"humanity":-1,"doNoHarm":-1}},{"id":"fo-4b","label":"Anulación humana, documentada","detail":"Los planificadores ajustan la lista y escriben por qué. El registro es auditable.","consequence":"El pueblo se reincorpora con base en datos anteriores al conflicto y reportes comunitarios. Documentar la anulación parece burocrático, hasta la revisión posterior a la acción, cuando ese registro es cómo defiendes la decisión y mejoras el manejo de las lagunas de datos del modelo.","reflection":"El control humano significativo significa que una persona puede anular a la máquina, dejando constancia, con razones. La rendición de cuentas vive en esa frase escrita: quién decidió, y por qué.","impacts":{"impartiality":1,"doNoHarm":1}},{"id":"fo-4c","label":"Doble firma: analista más delegado de campo","detail":"Ninguna recomendación automatizada se convierte en decisión sin dos firmas humanas. Más lento por diseño.","consequence":"Cada plan de distribución toma un día extra. A cambio, las trampas de lagunas de datos como el pueblo sitiado se detectan estructuralmente, no por suerte: el trabajo del delegado de campo es precisamente preguntar qué no puede ver el modelo.","reflection":"En contextos de alto riesgo, la redundancia en el juicio humano es una salvaguarda, no una ineficiencia. El llamado de la Resolución sobre TIC a evitar y mitigar el daño aboga exactamente por este tipo de fricción deliberada.","impacts":{"doNoHarm":2,"impartiality":1,"humanity":-1}}]}],"debrief":"Ojos en la línea del frente muestra la IA en sus apuestas más altas. El mismo modelo que acelera la evaluación de necesidades puede cegarte ante el sufrimiento invisible; el mismo panel que coordina la ayuda puede convertirla en objetivo; el mismo algoritmo que optimiza distribuciones puede borrar un pueblo sitiado por falta de datos. La neutralidad, la independencia y el no causar daño no son restricciones sobre la tecnología: son los requisitos de diseño."},{"id":"cloud-question","title":"La cuestión de la nube","tagline":"Neutralidad de proveedores y soberanía de datos en el Caribe","role":"Responsable de Transformación Digital, Sociedad Nacional del Caribe","context":"Tu Sociedad Nacional sirve a estados insulares donde los huracanes son cuestión de cuándo, no de si. Estás digitalizando todo a la vez: un registro de beneficiarios, una herramienta de evaluación de daños asistida por IA y una plataforma de donaciones. Tres puertas muy distintas están abiertas: un gigante global de la nube que ofrece créditos gratuitos, un gobierno que ofrece su nube nacional y un consorcio regional que opera infraestructura abierta. Tras cada puerta hay una respuesta distinta a la pregunta: ¿sobre la tecnología de quién corren las vidas de tu gente?","topics":["Elección de proveedor de nube","Neutralidad de proveedores","Soberanía de datos","Evaluación de daños"],"roles":["TIC y digital","Adquisiciones","Liderazgo"],"steps":[{"id":"cq-1","title":"Dónde viven los datos","narrative":"El registro de beneficiarios contendrá nombres, ubicaciones y detalles de vulnerabilidad de 80.000 hogares. La oferta del hiperescalador es generosa: cinco años de créditos, seguridad de primer nivel, centros de datos en el extranjero. La nube nacional del gobierno mantiene los datos en el país, y bajo la ley nacional. Los servidores del consorcio, controlados por el Movimiento, cuestan más y llegan más tarde.","options":[{"id":"cq-1a","label":"Aceptar los créditos gratuitos del hiperescalador","detail":"Rápido, seguro y gratis por cinco años. Los datos quedan en una jurisdicción extranjera bajo las condiciones del proveedor.","consequence":"Lanzas en tiempo récord y la plataforma funciona de maravilla. En el tercer año los créditos terminan, los precios se recalculan, y migrar 80.000 registros de hogares fuera de formatos propietarios resulta ser un proyecto que nadie presupuestó.","reflection":"La soberanía de los datos se decide el primer día, no en la renovación. Los créditos gratuitos son una decisión de adquisición cuyo costo llega después, y los costos de salida son parte del precio de cualquier nube.","impacts":{"humanity":1,"independence":-2}},{"id":"cq-1b","label":"Usar la nube nacional del gobierno","detail":"Los datos permanecen en el país y el ministerio está encantado. El acceso estatal viene con el territorio.","consequence":"El alojamiento es barato y políticamente fluido. Entonces el registro es requerido judicialmente en un caso de control migratorio, y descubres que «en el país» también significa «al alcance». La confianza comunitaria en el registro —construida durante años— se tambalea de la noche a la mañana.","reflection":"La soberanía en el papel no es independencia en la práctica. Un registro humanitario debe estar protegido de cualquier autoridad que pueda usarlo con fines no humanitarios: eso es lo que protege la independencia.","impacts":{"independence":-2,"doNoHarm":-2}},{"id":"cq-1c","label":"Construir sobre infraestructura controlada por el Movimiento","detail":"La pila abierta del consorcio regional. Más cara, más lenta, totalmente tuya.","consequence":"El lanzamiento toma cuatro meses extra y consume un tercio del presupuesto de digitalización. Pero cada registro queda bajo tus llaves, en formatos abiertos, con una copia de seguridad probada en un segundo país. Cuando proveedores y ministerios llamen después, la respuesta ya está construida.","reflection":"El control de la infraestructura es el cimiento sobre el que se sostiene cualquier otra salvaguarda. Cuesta dinero y tiempo por adelantado: el compromiso de adquisición ética de la Resolución sobre TIC incluye estar dispuesto a pagar ese precio.","impacts":{"independence":2,"doNoHarm":1,"humanity":-1}}]},{"id":"cq-2","title":"Los otros clientes del proveedor","narrative":"Tu herramienta de evaluación de daños con IA funciona sobre los modelos de un único proveedor comercial. Un periódico regional revela que el mismo proveedor suministra analítica a una parte de un conflicto armado a dos fronteras de distancia. Llama un periodista: ¿compromete la alianza de tu Sociedad Nacional con este proveedor su neutralidad?","options":[{"id":"cq-2a","label":"No decir nada; el contrato está limpio","detail":"Tus datos están separados, tu uso es humanitario. Aguantar el ciclo de noticias.","consequence":"La historia se desvanece en una semana, pero no en todas partes. Los líderes comunitarios de un distrito dejan de compartir fotos de daños, y una organización socia pausa en silencio el intercambio de datos contigo, citando «exposición reputacional». La percepción hizo el daño que los hechos nunca hicieron.","reflection":"La neutralidad se juzga tanto por la percepción como por los hechos. La neutralidad de proveedores —de la tecnología de quién se te ve depender— es ahora parte de cómo las partes y las comunidades leen tu imparcialidad.","impacts":{"neutrality":-2,"independence":-1}},{"id":"cq-2b","label":"Diversificar proveedores y publicar tu diligencia debida","detail":"Añadir un segundo proveedor para las cargas críticas, adoptar una política pública de evaluación de proveedores y decirlo abiertamente.","consequence":"La migración es trabajo real y la configuración dual cuesta más. Pero la política pública responde a la pregunta del periodista mejor que cualquier comunicado: puedes mostrar exactamente cómo se evalúan los proveedores, y la reputación de ninguna empresa puede arrastrar la tuya.","reflection":"La neutralidad de proveedores se construye, no se declara: evita la dependencia de un único proveedor para sistemas críticos, evalúa a los suministradores contra los principios humanitarios y poder mostrar tu trabajo.","impacts":{"neutrality":1,"independence":1,"doNoHarm":1}},{"id":"cq-2c","label":"Terminar con el proveedor de inmediato","detail":"Una ruptura limpia, anunciada públicamente. Los servicios se caen mientras reconstruyes.","consequence":"El anuncio es elogiado por los comentaristas. Pero la herramienta de evaluación de daños está fuera de línea nueve semanas —que abarcan el inicio de la temporada de huracanes— y una respuesta posterior a una tormenta sale con una focalización más lenta y pobre como resultado.","reflection":"Las salidas por principios también tienen víctimas. Cortar abruptamente una dependencia de la que nunca planeaste escapar traslada el costo a las personas afectadas: una estrategia de salida es una medida de no causar daño, no un lujo.","impacts":{"neutrality":2,"humanity":-2,"doNoHarm":-1}}]},{"id":"cq-3","title":"Una evaluación de daños antes de la temporada","narrative":"La herramienta de evaluación de daños con IA está lista seis semanas antes del pico de la temporada. Los puntos focales comunitarios te advierten: el modelo se entrenó mayormente con vivienda formal, y los asentamientos informales —donde viven los más vulnerables— podrían quedar sistemáticamente subestimados. Una evaluación de daños participativa completa toma seis semanas. La temporada no esperará.","options":[{"id":"cq-3a","label":"Lanzar ahora, evaluar después","detail":"La temporada no espera. Ejecutar la evaluación de daños después de las primeras tormentas.","consequence":"La herramienta funciona bien en los distritos formales y mal en los informales, exactamente como se advirtió. La ayuda posterior a la tormenta fluye hacia el daño que el modelo pudo ver. La evaluación retrospectiva documenta, en detalle, a quiénes se dejó fuera.","reflection":"Una evaluación de daños escrita después del daño es una autopsia. No causar daño significa evaluar los riesgos previsibles para las comunidades afectadas antes del despliegue, especialmente los riesgos para quienes los datos menos representan.","impacts":{"humanity":1,"doNoHarm":-2,"impartiality":-1}},{"id":"cq-3b","label":"Ejecutar primero la evaluación participativa completa","detail":"Representantes comunitarios ayudan a probar la herramienta, identificar daños y definir mitigaciones. Se pierde el inicio de la temporada.","consequence":"La primera tormenta se maneja con métodos antiguos: más lento, pero no peor que el año pasado. La evaluación encuentra la brecha de los asentamientos informales más dos daños que nadie predijo, y las mitigaciones diseñadas por la comunidad pasan a formar parte del manual operativo de la herramienta.","reflection":"El compromiso de participación comunitaria de la Resolución sobre TIC se aplica al riesgo, no solo a la retroalimentación: las personas expuestas a los fallos de una herramienta son las expertas en lo que esos fallos significarían.","impacts":{"doNoHarm":2,"impartiality":1,"humanity":-1}},{"id":"cq-3c","label":"Lanzar de forma limitada, con un interruptor de apagado","detail":"Desplegar solo en dos distritos piloto, con canales de retroalimentación comunitaria, verificación humana de puntuaciones de baja confianza y un disparador de cierre acordado de antemano.","consequence":"Los pilotos revelan la brecha de los asentamientos en días, los verificadores humanos atrapan la mayoría de las puntuaciones erróneas, y cuando las tasas de error cruzan tu disparador en un distrito, la herramienta se pausa allí sin drama. La herramienta mejora tormenta a tormenta.","reflection":"Cuando la demora misma conlleva riesgo, un lanzamiento acotado con monitoreo, respaldo humano y un interruptor de apagado ensayado es una estrategia legítima de mitigación de daños, siempre que los límites sean reales y alguien esté facultado para accionar el interruptor.","impacts":{"doNoHarm":1,"humanity":1}}]},{"id":"cq-4","title":"La renovación","narrative":"Tres años después, tu pila tecnológica funciona, y está profundamente entretejida con los servicios propietarios de un proveedor. La oferta de renovación incluye un descuento por una integración más profunda. Tu junta directiva pide una recomendación.","options":[{"id":"cq-4a","label":"Profundizar la integración por el descuento","detail":"Mejor precio, mejores funciones, un solo responsable. La dependencia se vuelve total.","consequence":"Los presupuestos lucen muy bien este año. Dos años después el proveedor es adquirido, las prioridades cambian, y tu «simple» estimación de migración regresa con dieciocho meses y una cifra que la junta se niega a leer en voz alta.","reflection":"La dependencia se acumula en silencio. Cada gancho propietario es una factura futura: financiera, operativa o de principios. La independencia se preserva en decisiones de adquisición tomadas años antes de la crisis que la pone a prueba.","impacts":{"independence":-2,"doNoHarm":-1}},{"id":"cq-4b","label":"Renovar con cláusulas de portabilidad y un plan de salida probado","detail":"Formatos de datos abiertos, simulacros regulares de exportación, configuraciones en custodia y un ensayo de salida cada año.","consequence":"El proveedor protesta y luego firma: tu plan de salida es la razón por la que mantiene honestos los precios. El primer simulacro de exportación fracasa vergonzosamente; para el tercero, tu equipo puede levantar el registro en otro lugar en nueve días.","reflection":"Un plan de salida que nunca has probado es una hipótesis. La portabilidad ensayada convierte la dependencia en una relación que eliges continuar, que es como luce la independencia en la práctica.","impacts":{"independence":2,"doNoHarm":1}},{"id":"cq-4c","label":"Repatriar el núcleo, alquilar solo capacidad de ráfaga","detail":"El registro y los modelos pasan a infraestructura propia; el proveedor conserva solo cómputo elástico para los picos posteriores a desastres.","consequence":"La transición cuesta un año duro y algunas funciones se degradan. Después, tus sistemas críticos no responden a la hoja de ruta de ningún proveedor, y los picos posteriores a huracanes siguen escalando, sobre infraestructura de la que puedes alejarte.","reflection":"Las arquitecturas híbridas pueden equilibrar soberanía y escala. La pregunta de diseño es siempre: ¿qué funciones podríamos perder mañana con un proveedor, y cuánto costaría esa pérdida a las personas afectadas?","impacts":{"independence":1,"doNoHarm":1,"humanity":-1}}]}],"debrief":"La cuestión de la nube trata sobre la infraestructura que subyace a cualquier otra decisión de IA. Dónde viven los datos decide quién puede alcanzarlos (soberanía de datos); de los modelos de quién dependes moldea cómo las partes y las comunidades leen tu neutralidad (neutralidad de proveedores); y si puedes salir decide si tus opciones son realmente tuyas (independencia). La evaluación de daños pertenece a antes del despliegue, y las comunidades más expuestas a los fallos de una herramienta pertenecen al interior de esa evaluación."},{"id":"edge-network","title":"El borde de la red","tagline":"Herramientas de IA donde la conectividad y la energía escasean en África Oriental","role":"Oficial de TIC e Innovación, Respuesta Regional de África Oriental","context":"La sequía y el desplazamiento cruzan una remota región fronteriza. Los equipos de campo y los voluntarios comunitarios necesitan traducción, resúmenes de casos y orientación sobre derivaciones, pero la conectividad es irregular, la electricidad viene de generadores y unos pocos paneles solares, y el gran centro de datos más cercano está en otro continente. Debes decidir qué tipo de IA, si alguna, tiene cabida aquí.","topics":["IA de baja conectividad","Huella ambiental","Modelos de lenguaje pequeños"],"roles":["TIC e innovación","Operaciones de campo","Participación comunitaria"],"steps":[{"id":"en-1","title":"¿Modelo grande, modelo pequeño, o ninguno?","narrative":"Una demostración del proveedor muestra un asistente de IA en la nube que responde preguntas de campo de forma brillante, a través de una conexión que tus sitios de campo no tienen. La alternativa es un modelo de lenguaje pequeño que funciona sin conexión en tabletas con carga solar: menos fluido, pero siempre disponible. Una tercera voz en la sala dice que la respuesta honesta podría ser no usar IA en absoluto.","options":[{"id":"en-1a","label":"Desplegar el asistente de IA en la nube","detail":"Las mejores respuestas y el mayor soporte de idiomas, donde haya señal. Cada consulta viaja sobre centros de datos distantes y hambrientos de energía.","consequence":"En el centro regional, al personal le encanta. En los sitios de campo —donde están las preguntas— casi siempre muestra una rueda de carga. Más tarde te enteras de que cada mil consultas también traían una factura invisible: electricidad de centros de datos y agua de refrigeración, en una región que cuenta ambas en bidones.","reflection":"La capacidad que solo funciona donde ya existe infraestructura amplía la brecha entre los conectados y los aislados. Cada consulta de IA tiene un costo de energía y agua; en contextos de escasez, ese costo es parte del cálculo humanitario, no una nota al pie.","impacts":{"humanity":1,"doNoHarm":-1,"impartiality":-1}},{"id":"en-1b","label":"Ejecutar un modelo pequeño en tabletas solares","detail":"Un modelo compacto, descargado una vez, funciona totalmente sin conexión. Las respuestas son más simples y acotadas, y están disponibles en todas partes.","consequence":"La puesta en marcha toma dos semanas de ajuste fino con tus guías de campo reales. El modelo pequeño tropieza con preguntas raras, pero resuelve las cotidianas —traducción, pasos de derivación, formularios— en cada sitio, en la oscuridad, durante los apagones. Todo su consumo semanal de energía cabe en un panel solar.","reflection":"Los modelos de lenguaje pequeños cambian pulido por soberanía: funcionan donde la gente realmente está, con una fracción de la energía y el agua de un modelo grande, y sin que los datos salgan del dispositivo. Lo adecuado al propósito vence a lo último en tecnología.","impacts":{"doNoHarm":1,"independence":1,"impartiality":1}},{"id":"en-1c","label":"Sin IA: fortalecer la radio y el papel","detail":"Invertir en las guías de campo, el calendario de radio y la red humana de derivaciones.","consequence":"Fiable, confiable y con cero huella nueva, pero los retrasos de traducción crecen, las notas de casos se acumulan sin procesar, y los voluntarios de turno nocturno siguen improvisando respuestas que un modelo pequeño entrenado podría haber manejado.","reflection":"Rechazar la IA es una opción legítima con costos reales. La pregunta no es «IA o principios», sino qué herramienta, dimensionada al lugar, sirve mejor a las personas, y quién lo decidió, con qué evidencia.","impacts":{"humanity":-1,"doNoHarm":1}}]},{"id":"en-2","title":"Mantenerlo vivo","narrative":"Lo que funcione aquí debe sobrevivir a la infraestructura. El proveedor ofrece un servicio gestionado: sincronización satelital nocturna, actualizaciones automáticas, monitoreo remoto, por una tarifa y un flujo de datos hacia ellos. Tu coordinador de campo propone una alternativa gestionada por la comunidad: centros solares de carga, una malla local entre sitios y datos que se sincronizan cuando los equipos alcanzan conectividad.","options":[{"id":"en-2a","label":"Contratar el servicio satelital gestionado","detail":"Actualizaciones y monitoreo sin esfuerzo. Un goteo constante de datos de uso fluye al proveedor, y la cuota mensual nunca termina.","consequence":"Todo se mantiene al día sin esfuerzo del personal. Seis meses después, una revisión presupuestaria corta la suscripción, y las tabletas se degradan con elegancia en pisapapeles caros: nadie local aprendió jamás a mantenerlas.","reflection":"La comodidad que no puede sobrevivir a una línea presupuestaria es fragilidad disfrazada. La dependencia no es solo de datos; es de quién tiene las habilidades cuando el contrato termina.","impacts":{"independence":-2,"doNoHarm":-1}},{"id":"en-2b","label":"Centros solares comunitarios y sincronización local","detail":"Centros de carga en locales comunitarios, una malla entre sitios, actualizaciones que los equipos llevan al viajar. Más lento, local y con dueño.","consequence":"Las actualizaciones llegan días, no segundos, después de su publicación. Pero los centros se vuelven infraestructura comunitaria —los teléfonos también se cargan allí— y los técnicos que mantienen vivo el sistema son vecinos de las personas a las que sirve.","reflection":"La infraestructura que las comunidades poseen tiende a sobrevivir a los proyectos. Incorporar energía local, conectividad y mantenimiento al diseño es pensar en no causar daño aplicado al largo plazo.","impacts":{"independence":1,"doNoHarm":2,"humanity":-1}},{"id":"en-2c","label":"Híbrido: nube del proveedor en el centro, sin conexión en el borde","detail":"El procesamiento pesado y las actualizaciones ocurren en el centro conectado; los sitios de campo permanecen sin conexión primero.","consequence":"Un compromiso viable: el centro obtiene la canalización del proveedor, el campo conserva su autonomía. Pero exige arquitectura disciplinada: dos veces detectas funciones nuevas que asumen conectividad en silencio, y las rechazas.","reflection":"Los diseños híbridos pueden equilibrar alcance y resiliencia, pero solo si «sin conexión primero» es una regla que los proveedores deben obedecer, no una preferencia que puedan erosionar versión a versión.","impacts":{"independence":1,"doNoHarm":1}}]},{"id":"en-3","title":"La pregunta de la huella","narrative":"En una reunión comunitaria, una joven voluntaria levanta un teléfono con una noticia: los centros de datos que entrenan grandes modelos de IA consumen enorme electricidad y millones de litros de agua de refrigeración, a veces en regiones de sequía como la tuya. Pregunta: «¿Cuánta agua bebió hoy su IA?»","options":[{"id":"en-3a","label":"Tratarla como una pregunta de relaciones públicas","detail":"Tranquilizar a la sala: el proveedor está «comprometido con la sostenibilidad». Seguir adelante.","consequence":"La reunión sigue; la pregunta no. El video de la voluntaria sobre «la IA sedienta de la ONG» supera tus últimas diez publicaciones, y el equipo no tiene cifras reales con qué responder.","reflection":"Las comunidades preguntan cada vez más por el costo ambiental de las herramientas usadas sobre ellas. «El proveedor dice que está bien» no es rendición de cuentas: es una pregunta sin respuesta con un logotipo encima.","impacts":{"doNoHarm":-2,"independence":-1}},{"id":"en-3b","label":"Medir, publicar y fijar un presupuesto","detail":"Registrar consultas, tamaños de modelo y estimaciones de energía y agua; publicar las cifras; fijar un presupuesto de eficiencia por respuesta.","consequence":"La primera estimación honesta es incómoda: las consultas a la nube empequeñecen todo lo demás. La publicas igualmente, fijas un tope, y la joven voluntaria se une al grupo de revisión que verifica las cifras trimestralmente.","reflection":"No puedes gestionar una huella que te niegas a medir. Publicar el costo real —energía, agua, extracción detrás del hardware— convierte una pregunta incómoda en una práctica de rendición de cuentas que las comunidades pueden verificar.","impacts":{"doNoHarm":2}},{"id":"en-3c","label":"Hacer del modelo pequeño la opción predeterminada","detail":"El modelo pequeño sin conexión como opción por defecto en todas partes; el modelo grande en la nube reservado para casos raros y complejos con revisión humana.","consequence":"Las consultas a la nube caen un 90%. Algunas respuestas matizadas se vuelven más lentas, porque un humano ahora las revisa primero, lo que resulta mejorarlas. La pregunta de la huella en la próxima reunión tiene una respuesta concreta.","reflection":"La frugalidad es un principio de diseño: la herramienta más ligera que hace el trabajo suele ser la más humana de operar. Dimensionar bien los modelos es mitigación de daños para las personas y el planeta a la vez.","impacts":{"doNoHarm":2,"independence":1}}]},{"id":"en-4","title":"¿Quién lo mantiene en marcha?","narrative":"Dieciocho meses después, el sistema funciona. La subvención que lo pagó termina el próximo trimestre. Lo que ocurra ahora decide si esto fue un proyecto o una capacidad.","options":[{"id":"en-4a","label":"Renovar el contrato de mantenimiento del proveedor","detail":"Lo más simple sobre el papel: el proveedor sigue parcheando, alojando la canalización de actualizaciones y guardando el conocimiento.","consequence":"La renovación se firma en una semana. El conocimiento se queda donde siempre estuvo: afuera. Cuando el proveedor descontinúa la línea de producto dos años después, el documento de traspaso es un folleto de ventas de su sucesor.","reflection":"Un sistema que solo su proveedor entiende es alquilado, no propio. Los contratos de mantenimiento están bien; depender de ellos para todo el conocimiento, no.","impacts":{"independence":-2,"doNoHarm":-1}},{"id":"en-4b","label":"Capacitar a técnicos locales para que lo posean","detail":"Financiar un año de formación para que el personal regional y técnicos comunitarios mantengan, actualicen y adapten los modelos ellos mismos.","consequence":"Más lento al principio, y dos personas formadas son contratadas por una empresa de telecomunicaciones: una pérdida que también es una historia de éxito. Quienes se quedan mantienen vivo el sistema durante la siguiente brecha de financiación sin fallar una semana.","reflection":"La capacidad técnica local es la infraestructura más duradera que puedes construir. Las habilidades que permanecen en la región la siguen sirviendo mucho después de que tu código de proyecto sea olvidado.","impacts":{"independence":2,"doNoHarm":1,"humanity":1}},{"id":"en-4c","label":"Entregarlo al fondo regional del Movimiento","detail":"La Sociedad Nacional se une a un servicio regional compartido que mantiene modelos y herramientas comunes para muchas sociedades.","consequence":"Pierdes algo de adaptación local, ganas costo y experiencia compartidos. El modelo pequeño que tu equipo ajustó para las lenguas locales se convierte en el recurso más usado del fondo: tu inversión escala más allá de tus fronteras.","reflection":"La infraestructura compartida del Movimiento reparte tanto el costo como la soberanía. Lo que una sociedad construye puede, con formatos abiertos y mantenimiento común, proteger a muchas.","impacts":{"independence":1,"doNoHarm":1}}]}],"debrief":"El borde de la red trata de dimensionar la tecnología al lugar al que sirve. Los modelos pequeños, el diseño sin conexión primero, la energía local y las habilidades locales no son concesiones: en contextos de baja conectividad son la opción resiliente. Y cada consulta de IA conlleva un costo ambiental en energía, agua y extracción; medirlo, publicarlo y minimizarlo es parte de no causar daño, no una agenda aparte."},{"id":"signals-noise","title":"Señales en el ruido","tagline":"Escucha social con IA durante una respuesta a un tifón en el Sudeste Asiático","role":"Asesor(a) de Participación Comunitaria y Rendición de Cuentas, Respuesta al Tifón","context":"Un tifón de categoría 4 ha tocado tierra en un archipiélago. Los rumores viajan más rápido que las inundaciones: sobre la ayuda, sobre las evacuaciones, sobre quién tiene la culpa. Una plataforma de escucha social ofrece IA que analiza publicaciones públicas en cuatro idiomas locales y señala desinformación casi en tiempo real. Tus equipos se ahogan en reportes sin verificar, pero escuchar a escala significa observar a las comunidades a escala.","topics":["Escucha social","Desinformación","Privacidad y confianza"],"roles":["Participación comunitaria","Comunicación","Protección"],"steps":[{"id":"sn-1","title":"Escuchar, y cómo","narrative":"La plataforma puede incorporar publicaciones públicas de las principales redes sociales, clasificarlas y enviar alertas. Tu asesor de protección hace primero la pregunta incómoda: ¿qué pasa con las publicaciones —y con las personas que las escribieron— después de la crisis?","options":[{"id":"sn-1a","label":"Análisis completo con alertas","detail":"Incorporar publicaciones públicas, clasificar, alertar. Máxima conciencia situacional, máxima recopilación.","consequence":"El mapa de rumores es genuinamente útil: detectas una orden de evacuación falsa en una hora. Pero la plataforma retiene datos a nivel de publicación «para mejorar el modelo», y te das cuenta de que has construido un puesto de escucha sin interruptor de apagado ni cláusula de cierre.","reflection":"Público no significa libre de consecuencias: la gente publica en crisis sin imaginar vigilancia humanitaria, ni de ningún tipo. La recopilación que sobrevive a su propósito es un fallo de protección de datos con un panel útil encima.","impacts":{"humanity":1,"doNoHarm":-2}},{"id":"sn-1b","label":"Solo tendencias agregadas","detail":"Sin almacenamiento a nivel de publicación: el sistema cuenta temas y picos, y borra el flujo bruto a diario.","consequence":"Pierdes algo de detalle forense —no siempre puedes rastrear un rumor hasta su origen— pero conservas la alerta temprana. Cuando un ministerio solicita después «los datos brutos», la respuesta honesta es que ya no existen.","reflection":"La agregación es la versión de minimización de datos para la escucha social: conservas la señal, descartas a las personas. Diseñar para borrar es diseñar para la confianza.","impacts":{"doNoHarm":2,"humanity":-1}},{"id":"sn-1c","label":"Solo canales comunitarios","detail":"Olvidar la escucha social; confiar en líneas de retroalimentación, voluntarios comunitarios y redes de socios.","consequence":"Confiable, humano y más lento. Un rumor venenoso sobre agua contaminada circula dos días antes de que tu red lo detecte: dos días en que algunas familias bebieron agua insegura antes que arriesgar los puntos de distribución «envenenados».","reflection":"Negarse a escuchar también es una elección con consecuencias. La cuestión no es si oír a las comunidades, sino cómo oírlas sin convertir la escucha en vigilancia.","impacts":{"humanity":-2,"doNoHarm":1}}]},{"id":"sn-2","title":"Actuar sobre un rumor","narrative":"El sistema señala una afirmación que se propaga rápido: tu Sociedad Nacional desvía ayuda hacia un grupo político. Es falsa. Pero un desmentido público nombraría la afirmación, el grupo y la acusación, en una región polarizada donde tu neutralidad ya es cuestionada cada semana.","options":[{"id":"sn-2a","label":"Publicar una refutación pública directa","detail":"Nombrar el rumor, exponer los hechos, publicarlo en todas partes. Rápido y transparente.","consequence":"Los hechos llegan, y también el marco. Durante dos ciclos de noticias, tu nombre queda soldado a una acusación política que tú no hiciste. Una sucursal local reporta amenazas; otra, donaciones récord. La verdad fue servida; la factura de neutralidad llega después.","reflection":"Amplificar una falsedad para negarla puede difundir el marco más que la mentira. La neutralidad se pone a prueba no solo por lo que dices, sino por lo que eliges repetir.","impacts":{"neutrality":-2,"humanity":1}},{"id":"sn-2b","label":"Corregir a través de voces comunitarias de confianza","detail":"Informar a líderes comunitarios, locutores de radio y redes de voluntarios con los hechos; dejar que voces locales de confianza lleven la corrección.","consequence":"La corrección se mueve más lento que el rumor durante un día, y luego lo alcanza. Como el desmentido viene de voces en las que la gente ya confía, se afianza sin soldar tu nombre a la acusación.","reflection":"La participación comunitaria también es una estrategia de neutralidad. Las correcciones viajan sobre la confianza, y la confianza es local: el mensajero suele ser el mensaje.","impacts":{"neutrality":1,"doNoHarm":1}},{"id":"sn-2c","label":"Monitorear pero no responder","detail":"Alimentar el rumor con atención puede ser peor; observar y esperar.","consequence":"El rumor crece y se desvanece en algunas zonas, y se endurece en un distrito, donde las distribuciones son boicoteadas durante una semana. Esperar te ahorró el marco; les costó a las familias del boicot sus raciones.","reflection":"El silencio también es una decisión. Juzgar cuándo un rumor necesita respuesta es un oficio: observa el daño, no solo el volumen, y acuerda de antemano los umbrales para actuar.","impacts":{"humanity":-1,"doNoHarm":-1}}]},{"id":"sn-3","title":"El deepfake","narrative":"Una nota de voz en dialecto local perfecto, aparentemente de tu director, anuncia una distribución en un lugar que no existe. Cientos de personas se congregan; algunas se enfurecen; un anciano es hospitalizado tras la estampida. Tu IA, entrenada en texto e imágenes, nunca escuchó audio en absoluto.","options":[{"id":"sn-3a","label":"Añadir un proveedor de detección de deepfakes","detail":"Un proveedor especializado puede analizar audio y video, si envías el contenido comunitario a su nube.","consequence":"La detección mejora, y otro flujo de datos sale de tu control. Tres meses después, la notificación de brecha de seguridad del proveedor llega a tu bandeja: el audio que les enviaste incluía huellas de voz de personas que nunca consintieron nada.","reflection":"Perseguir cada nueva amenaza con un nuevo proveedor multiplica la exposición más rápido que la seguridad. La voz es un dato biométrico; tratarla como un flujo más es un fallo de protección de datos.","impacts":{"doNoHarm":-2,"independence":-1}},{"id":"sn-3b","label":"Construir canales verificados que la gente pueda comprobar","detail":"Todos los anuncios oficiales llevan una verificación simple: una palabra clave en la radio, un SMS firmado, una línea para confirmar. Enseñar el patrón antes de necesitarlo.","consequence":"La siguiente nota de voz falsa se propaga unas horas y luego se frena: la gente pide la palabra clave. La verificación se vuelve un hábito comunitario, no un producto de proveedor, y funciona incluso cuando tus sistemas están caídos.","reflection":"La resiliencia contra los medios sintéticos es mayormente social: los hábitos de verificación acordados de antemano vencen a las carreras armamentísticas de detección, y fortalecen, en lugar de consumir, la confianza comunitaria.","impacts":{"doNoHarm":2,"neutrality":1}},{"id":"sn-3c","label":"Apagar toda la escucha de IA","detail":"Si el sistema no puede atrapar la falsificación más peligrosa, todo el aparato es sospechoso.","consequence":"Pierdes la alerta temprana de rumores que había evitado dos pánicos en silencio. La desinformación no se jubila cuando tus herramientas lo hacen; la siguiente orden de evacuación falsa circula invisible un día entero.","reflection":"Las herramientas fallan; la pregunta es si el fallo fue previsto en el diseño. Abandonar un sistema útil por ser imperfecto deja el campo a los rumores: una capacidad honesta y graduada supera a la ausencia.","impacts":{"humanity":-2,"doNoHarm":-1}}]},{"id":"sn-4","title":"Cuando pasa la tormenta","narrative":"Comienza la recuperación. La licencia de prueba de la plataforma de escucha se renueva automáticamente el mes próximo. A la dirección le gusta el panel. Nadie ha respondido la pregunta original de la asesora de protección: ¿qué pasa con todo esto en tiempos de paz?","options":[{"id":"sn-4a","label":"Mantenerla activa como alerta temprana","detail":"El monitoreo de nivel de crisis se vuelve «preparación» permanente. El panel nunca duerme.","consequence":"La preparación mejora sobre el papel. Pero un sistema construido para semanas de tifón ahora observa temporadas políticas ordinarias, y su existencia se vuelve noticia de año electoral: la organización humanitaria que nunca dejó de escuchar.","reflection":"Los poderes de emergencia tienden a volverse mobiliario. Una capacidad de escucha que nunca se apaga terminará usándose para fines que sus primeros usuarios nunca imaginaron, neutralidad incluida.","impacts":{"neutrality":-2,"doNoHarm":-2}},{"id":"sn-4b","label":"Apagarla con una rendición pública de cuentas","detail":"Terminar la recopilación, borrar los archivos y publicar qué se recopiló, por qué y qué se aprendió.","consequence":"La rendición pública es brevemente incómoda —la gente conoce la escala de la escucha— y luego se vuelve un activo de confianza: tu Sociedad Nacional es la que dijo lo que hizo y paró. El manual queda archivado para la próxima activación.","reflection":"La rendición de cuentas incluye un final. Publicar qué recopilaste y por qué, y luego parar de forma verificable, es lo que significa la práctica responsable de datos cuando las cámaras se han ido.","impacts":{"doNoHarm":2,"neutrality":1}},{"id":"sn-4c","label":"Transferirla a la Sociedad Nacional bajo supervisión comunitaria","detail":"La herramienta continúa bajo la Sociedad Nacional, gobernada por una carta con representantes comunitarios y una revisión pública anual.","consequence":"El traspaso es burocrático y real: la carta nombra qué puede monitorearse, qué nunca debe serlo y quién puede apagarlo. La primera revisión anual es pública, poco concurrida, y exactamente el punto.","reflection":"La propiedad local con supervisión comunitaria puede hacer legítima una herramienta de doble uso: la diferencia entre vigilancia y escucha es quién la gobierna, en nombre de quién, con qué poder de detenerla.","impacts":{"doNoHarm":1,"independence":1,"neutrality":1}}]}],"debrief":"Señales en el ruido trata de escuchar sin vigilar. Agregación antes que recopilación, mensajeros de confianza antes que refutaciones ruidosas, hábitos de verificación antes que carreras de detección, y un cierre antes que un panel que nunca duerme: así es como una organización humanitaria oye una crisis sin convertirse en algo que las comunidades deban temer."},{"id":"outbreak-signal","title":"La señal del brote","tagline":"Inteligencia epidémica y triaje con IA durante un brote de fiebre en un paso fronterizo","role":"Coordinador(a) de Emergencias de Salud, Respuesta Regional al Brote","context":"Aparece un grupo de casos de fiebre grave cerca de un paso fronterizo muy transitado. Una plataforma de inteligencia epidémica —que analiza informes de clínicas, ventas de farmacias y publicaciones públicas— señala «posible fiebre hemorrágica, 72% de confianza». Los laboratorios están a dos días, por el paso cruzan miles de viajeros al día, y tu Sociedad Nacional opera las dos clínicas más cercanas. Cada hora de duda tiene un precio, y también cada falsa alarma.","topics":["Inteligencia epidémica","Datos de salud","Comunicación de riesgos"],"roles":["Salud","Epidemiología","Salud comunitaria"],"steps":[{"id":"os-1","title":"La señal del 72 por ciento","narrative":"La plataforma quiere que escales ya. Tu epidemióloga señala que el modelo se entrenó sobre todo con datos urbanos y nunca ha visto la temporada de malaria de esta región, que imita la señal. La autoridad sanitaria regional pregunta qué sabes para el viernes.","options":[{"id":"os-1a","label":"Declarar la alerta de inmediato","detail":"Tratar el 72% como accionable. Activar el plan de contingencia, alertar a los socios, informar a los medios antes que los rumores.","consequence":"Durante 48 horas la región se moviliza; luego llegan los laboratorios: malaria grave, no fiebre hemorrágica. La cancelación es técnicamente correcta y socialmente costosa: el trimestre siguiente, cuando la plataforma señala un brote real de cólera, dos oficinas de distrito dudan un día entero antes de actuar.","reflection":"En la respuesta a brotes, las falsas alarmas gastan la confianza de la que dependen las alarmas reales. Una puntuación de confianza de la IA es un insumo para una decisión, no la decisión: los umbrales de escalamiento pertenecen a humanos responsables, calibrados con la epidemiología local.","impacts":{"humanity":1,"doNoHarm":-2,"neutrality":-1}},{"id":"os-1b","label":"Esperar la confirmación de laboratorio","detail":"Sin movimientos públicos hasta que los laboratorios confirmen. Preparar suministros en silencio mientras tanto.","consequence":"Los laboratorios confirman malaria grave: no hay brote. Tu preposicionamiento discreto resulta útil de todos modos. Pero tu equipo modela el contrafactual: de haber sido fiebre hemorrágica, 48 horas de silencio en un paso fronterizo habrían sido catastróficas.","reflection":"Esperar la certeza solo es seguro cuando la enfermedad es lenta. La disciplina es ajustar el umbral a lo que está en juego: ¿cuánto cuesta una falsa alarma, cuánto cuestan dos días perdidos, y quién paga cada uno?","impacts":{"humanity":-1,"doNoHarm":1}},{"id":"os-1c","label":"Enviar un equipo de verificación en horas","detail":"Equipo de evaluación rápida al sitio del grupo de casos; los clínicos revisan la evidencia cruda de la señal; se preposicionan suministros sin alarma pública.","consequence":"El equipo encuentra la verdad en nueve horas: malaria grave amplificada por un desabastecimiento de medicinas, y la señal de la plataforma, leída por ojos humanos, identifica correctamente un segundo grupo de casos, sin relación, que vale la pena vigilar. No escalas ninguno; te preparas para ambos.","reflection":"La inteligencia epidémica más fuerte combina la vigilancia de la máquina con la verificación humana rápida. La IA lo observa todo para que las personas revisen lo que importa: esa división del trabajo es el diseño, no un parche.","impacts":{"humanity":1,"doNoHarm":2,"impartiality":1}}]},{"id":"os-2","title":"Triaje bajo presión","narrative":"Los casos confirmados aumentan y tus dos clínicas están desbordadas. Una empresa de tecnología sanitaria ofrece una herramienta de triaje con IA: los pacientes responden preguntas en una tableta, el modelo puntúa la urgencia y el personal atiende en el orden del modelo. Tus enfermeras jefes son escépticas; la cola no.","options":[{"id":"os-2a","label":"Dejar que el modelo ordene la cola","detail":"Automatización total: la puntuación fija el orden. Mayor rapidez, menor fricción con el personal.","consequence":"El rendimiento salta un 40%. Luego emerge el patrón: los pacientes mayores que describen síntomas indirectamente puntúan bajo; también los hablantes de un dialecto fronterizo que el cuestionario traduce mal. Nadie es rechazado: algunos simplemente esperan hasta colapsar, fuera de la vista de las métricas.","reflection":"Una cola es una declaración de valores. El triaje automatizado optimiza lo que su cuestionario puede oír; los pacientes que peor oye suelen ser los más graves. La imparcialidad en una clínica significa auditar el orden, no solo la velocidad.","impacts":{"humanity":1,"impartiality":-2,"doNoHarm":-1}},{"id":"os-2b","label":"El modelo como segunda opinión; deciden las enfermeras","detail":"La puntuación se muestra a la enfermera de triaje, que puede anularla; cada anulación se registra y se revisa semanalmente.","consequence":"El rendimiento mejora un 25%, no un 40%, pero el registro de anulaciones se vuelve oro: muestra exactamente dónde el modelo malinterpreta el lenguaje local de síntomas, y las correcciones de las enfermeras lo reentrenan. El personal confía en la herramienta porque la ve aprender de ellas.","reflection":"Mantener a la enfermera al mando preserva la rendición de cuentas y crea un ciclo de aprendizaje que el proveedor nunca ofreció. En salud, «el humano en el ciclo» no es un freno del sistema: es su sensor más preciso.","impacts":{"doNoHarm":2,"impartiality":1}},{"id":"os-2c","label":"Seguir con el protocolo de triaje estándar","detail":"Sin herramientas nuevas en medio del brote. Protocolo experimentado, clasificadores voluntarios extra, esperas más largas.","consequence":"La atención se mantiene equitativa y explicable, y lenta. Dos casos críticos se deterioran en una cola que una herramienta de puntuación podría haber adelantado. El protocolo era seguro; la espera no.","reflection":"Rechazar una herramienta no congela las compensaciones; solo las vuelve menos visibles. La comparación honesta nunca es «IA contra atención perfecta»: es IA contra la cola real, con su propio triaje silencioso por agotamiento.","impacts":{"impartiality":1,"humanity":-2}}]},{"id":"os-3","titl
